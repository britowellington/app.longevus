const pixAscii = (s, max) => { const l = String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9 ]/g, "").trim(); return max ? l.slice(0, max) : l; };
const pixCRC = (p) => { let c = 0xFFFF; for (let i = 0; i < p.length; i++) { c ^= (p.charCodeAt(i) << 8); for (let j = 0; j < 8; j++) { c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } } return c.toString(16).toUpperCase().padStart(4, "0"); };
const tlv = (id, v) => id + String(v).length.toString().padStart(2, "0") + v;
const pixPayload = ({ pixKey, merchantName, merchantCity, amount, txid }) => {
  if (!pixKey) return null;
  const conta = tlv("26", tlv("00", "br.gov.bcb.pix") + tlv("01", pixKey));
  const sem = tlv("00", "01") + conta + tlv("52", "0000") + tlv("53", "986") + (amount ? tlv("54", Number(amount).toFixed(2)) : "") + tlv("58", "BR") + tlv("59", pixAscii(merchantName, 25) || "LONGEVUS") + tlv("60", pixAscii(merchantCity, 15) || "BRASIL") + tlv("62", tlv("05", pixAscii(txid, 25).replace(/\s/g, "") || "***")) + "6304";
  return sem + pixCRC(sem);
};

const CORES = [["#FF5603", "#FFB37A"], ["#0284C7", "#7DD3FC"], ["#059669", "#6EE7B7"], ["#7C3AED", "#C4B5FD"]];
function DemoGenio({ onComprar }) {
  const [fase, setFase] = useState("inicio"); // inicio | mostrando | vez | acertou | errou | fim
  const [seq, setSeq] = useState([]);
  const [pos, setPos] = useState(0);
  const [aceso, setAceso] = useState(-1);
  const timers = useRef([]);
  const limpar = () => { timers.current.forEach(clearTimeout); timers.current = []; };
  useEffect(() => () => limpar(), []);
  const mostrar = (s) => {
    setFase("mostrando"); setPos(0);
    s.forEach((c, i) => {
      timers.current.push(setTimeout(() => setAceso(c), 700 + i * 750));
      timers.current.push(setTimeout(() => setAceso(-1), 700 + i * 750 + 480));

    timers.current.push(setTimeout(() => setFase("vez"), 700 + s.length * 750));
  };
  const comecar = () => { limpar(); const s = [Math.floor(Math.random() * 4), Math.floor(Math.random() * 4)]; setSeq(s); mostrar(s); };

    if (fase !== "vez") return;

    if (seq[pos] !== i) { setFase("errou"); return; }

    setFase("acertou");
