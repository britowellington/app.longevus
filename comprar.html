const pixAscii = (str, max) => {
  const semAcento = String(str||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const limpo = semAcento.replace(/[^A-Za-z0-9 ]/g,"").trim();
  return max ? limpo.slice(0,max) : limpo;
};
const pixCRC16 = (payload) => {
  let crc = 0xFFFF;
  for(let i=0;i<payload.length;i++){
    crc ^= (payload.charCodeAt(i) << 8);
    for(let j=0;j<8;j++){
      crc = (crc & 0x8000) ? ((crc<<1) ^ 0x1021) & 0xFFFF : (crc<<1) & 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,"0");
};
const pixTLV = (id, value) => id + String(value).length.toString().padStart(2,"0") + value;
const buildPixPayload = ({pixKey, merchantName, merchantCity, amount, txid}) => {
  if(!pixKey) return null;
  const gui = pixTLV("00","br.gov.bcb.pix");
  const key = pixTLV("01", pixKey);
  const merchantAccountInfo = pixTLV("26", gui+key);
  const mcc = pixTLV("52","0000");
  const currency = pixTLV("53","986");
  const amountField = amount ? pixTLV("54", Number(amount).toFixed(2)) : "";
  const country = pixTLV("58","BR");
  const name = pixTLV("59", pixAscii(merchantName,25) || "LONGEVUS");
  const city = pixTLV("60", pixAscii(merchantCity,15) || "BRASIL");
  const txidClean = pixAscii(txid,25).replace(/\s/g,"") || "***";
  const addData = pixTLV("62", pixTLV("05", txidClean));
  const semCRC = pixTLV("00","01") + merchantAccountInfo + mcc + currency + amountField + country + name + city + addData + "6304";
  return semCRC + pixCRC16(semCRC);
};

const { useState, useEffect, useRef } = React;
const h = React.createElement;
const C = { escuro: "#0F172A", laranja: "#FF5603", laranjaTxt: "#C2410C", cinza: "#64748B", borda: "#E2E8F0", verde: "#16A34A", verdeEsc: "#0F6E56", fundo: "#F4F5F7" };
const rpc = async (nome, corpo) => {
  const r = await fetch(SUPA_URL + "/rest/v1/rpc/" + nome, { method: "POST", headers: { apikey: SUPA_KEY, Authorization: "Bearer " + SUPA_KEY, "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
};
const valorNum = (v) => { if (typeof v === "number") return v; const t = String(v || "").replace(/[^\d,.-]/g, ""); if (!t) return 0; const n = t.includes(",") ? Number(t.replace(/\./g, "").replace(",", ".")) : Number(t); return isNaN(n) ? 0 : n; };
const brl = (v) => "R$ " + Number(v || 0).toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const soDig = (t) => String(t || "").replace(/\D/g, "");
const fmtTel = (t) => { const d = soDig(t).slice(0, 11); if (d.length <= 2) return d; if (d.length <= 7) return "(" + d.slice(0, 2) + ") " + d.slice(2); return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7); };
const primeiro = (n) => String(n || "").trim().split(" ")[0];

const Campo = ({ rotulo, valor, onChange, tipo, placeholder, area }) => h("label", { style: { display: "block", marginBottom: 12 } },
  h("span", { style: { display: "block", fontSize: 12.5, fontWeight: 700, color: "#475569", marginBottom: 5 } }, rotulo),
  h(area ? "textarea" : "input", { value: valor, onChange: (e) => onChange(e.target.value), type: tipo || "text", inputMode: tipo === "tel" ? "tel" : undefined, placeholder, rows: area ? 3 : undefined, style: { width: "100%", boxSizing: "border-box", padding: "13px 14px", borderRadius: 12, border: "1.5px solid " + C.borda, fontSize: 15, fontFamily: "inherit", background: "#fff", resize: area ? "vertical" : undefined } }));

const Check = () => h("svg", { width: 17, height: 17, viewBox: "0 0 24 24", fill: "none", stroke: C.verde, strokeWidth: 2.6, strokeLinecap: "round", strokeLinejoin: "round", style: { flexShrink: 0, marginTop: 2 } }, h("path", { d: "M20 6 9 17l-5-5" }));

const App = () => {
  const id = new URLSearchParams(location.search).get("i") || "";
  const [st, setSt] = useState({ fase: "carregando" });
  const [para, setPara] = useState("mim");
  const [nome, setNome] = useState("");
  const [whats, setWhats] = useState("");
  const [pr, setPr] = useState({ nome: "", whatsapp: "", mensagem: "" });
  const [erro, setErro] = useState("");
  const [etapa, setEtapa] = useState("dados");
  const [enviando, setEnviando] = useState(false);
  const [copiado, setCopiado] = useState(false);
  const qr = useRef(null);

  useEffect(() => {
    if (!id) { setSt({ fase: "erro" }); return; }
    rpc("rpc_vitrine_publico", { p_item_id: id }).then((r) => {
      if (r && r.data && r.data.cobranca === "plano" && r.data.planoSlug) { location.replace(location.pathname.replace(/[^/]*$/, "") + "aluno.html?cadastro=1&plano=" + encodeURIComponent(r.data.planoSlug)); return; }
      setSt(r && r.data ? { fase: "ok", d: r.data, pix: r.pix || {} } : { fase: "erro" });
    }).catch(() => setSt({ fase: "erro" }));
  }, []);

  const d = st.d || {};
  const pix = st.pix || {};
  const valor = valorNum(d.valor || d.preco);
  const nomeProf = d.profissional || pix.nome || "Wellington Brito";
  const aceita = d.aceitaPresente !== false;
  const presente = aceita && para === "presente";
  const payload = etapa !== "dados" && pix.pix_key ? buildPixPayload({ pixKey: pix.pix_key, merchantName: pix.pix_merchant_name || pix.nome, merchantCity: pix.pix_merchant_city, amount: valor, txid: ("SV" + String(d.titulo || "").replace(/[^A-Za-z0-9]/g, "")).slice(0, 20) }) : null;

  useEffect(() => {
    if (payload && qr.current && window.QRCode) { qr.current.innerHTML = ""; new window.QRCode(qr.current, { text: payload, width: 180, height: 180, colorDark: "#0f172a", colorLight: "#ffffff" }); }
  }, [payload, etapa]);

  useEffect(() => { if (d.titulo) document.title = d.titulo + " · " + nomeProf; }, [d.titulo]);

  const irPagar = () => {
    setErro("");
    if (!nome.trim()) return setErro("Digite o seu nome.");
    if (soDig(whats).length < 10) return setErro("Digite o seu WhatsApp com DDD.");
    if (presente && !pr.nome.trim()) return setErro("Digite o nome de quem vai ganhar o presente.");
    setEtapa("pix");
    setTimeout(() => window.scrollTo({ top: 0, behavior: "smooth" }), 50);
  };
  const jaPaguei = async () => {
    if (enviando) return;
    setEnviando(true); setErro("");
    try {
      await rpc("rpc_registrar_compra_publica", { p_item_id: id, p_nome: nome.trim(), p_whatsapp: soDig(whats), p_presente: presente ? { nome: pr.nome.trim(), whatsapp: soDig(pr.whatsapp), mensagem: pr.mensagem.trim() } : null });
      setEtapa("feito");
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) { setErro("Não conseguimos enviar o aviso. Tente de novo ou fale no WhatsApp."); }
    setEnviando(false);
  };
  const copiar = () => { try { navigator.clipboard.writeText(payload).then(() => { setCopiado(true); setTimeout(() => setCopiado(false), 2500); }); } catch (e) {} };
  const waProf = pix.whatsapp ? "https://wa.me/55" + soDig(pix.whatsapp).replace(/^55(?=\d{10,11}$)/, "") + "?text=" + encodeURIComponent("Oi, " + primeiro(nomeProf) + "! Sou " + nome.trim() + " e acabei de pagar: " + (d.titulo || "serviço") + (presente ? " (presente para " + pr.nome.trim() + ")" : "") + ". Segue o comprovante.") : null;

  const wrap = (...filhos) => h("div", { style: { minHeight: "100vh", background: C.fundo } },
    h("div", { style: { background: C.escuro, padding: "18px 18px 54px", borderRadius: "0 0 28px 28px", textAlign: "center" } },
      h("img", { src: __LOGO_ALUNO__, alt: nomeProf, style: { width: 120, height: "auto", filter: "invert(1) hue-rotate(180deg)", opacity: 0.95 } })),
    h("div", { style: { maxWidth: 440, margin: "-38px auto 0", padding: "0 16px 40px" } }, ...filhos));
  const card = (estilo, ...filhos) => h("div", { style: { background: "#fff", borderRadius: 20, padding: "18px 18px", boxShadow: "0 1px 2px rgba(15,23,42,0.05), 0 10px 26px rgba(15,23,42,0.07)", marginBottom: 14, ...estilo } }, ...filhos);

  if (st.fase === "carregando") return wrap(card({ textAlign: "center", color: C.cinza, fontSize: 14 }, "Carregando..."));
  if (st.fase === "erro") return wrap(card({ textAlign: "center" },
    h("div", { style: { fontSize: 17, fontWeight: 800, color: C.escuro } }, "Esse serviço não está disponível"),
    h("div", { style: { fontSize: 13.5, color: C.cinza, marginTop: 6, lineHeight: 1.5 } }, "O link pode ter mudado. Peça um novo link a quem te enviou.")));

  const inclui = String(d.inclui || "").split("\n").map((t) => t.trim()).filter(Boolean);
  const resumo = card({},
    d.foto ? h("img", { src: d.foto, alt: "", style: { width: "100%", height: 170, objectFit: "cover", borderRadius: 14, marginBottom: 14, display: "block" } }) : null,
    h("div", { style: { fontSize: 10.5, fontWeight: 800, letterSpacing: "0.07em", color: C.laranjaTxt, textTransform: "uppercase" } }, "Com " + nomeProf),
    h("div", { style: { fontSize: 22, fontWeight: 800, color: C.escuro, lineHeight: 1.2, marginTop: 3 } }, d.titulo || "Serviço"),
    d.texto ? h("div", { style: { fontSize: 14, color: C.cinza, marginTop: 4, lineHeight: 1.45 } }, d.texto) : null,
    h("div", { style: { display: "flex", alignItems: "baseline", gap: 10, marginTop: 12, flexWrap: "wrap" } },
      valor > 0 ? h("div", { style: { fontSize: 26, fontWeight: 800, color: C.escuro } }, brl(valor)) : null,
      d.beneficio && typeof d.beneficio === "string" ? h("span", { style: { fontSize: 12, fontWeight: 800, color: C.verdeEsc, background: "#E9F5F2", borderRadius: 99, padding: "4px 10px" } }, d.beneficio) : null),
    etapa === "dados" && inclui.length ? h("div", { style: { marginTop: 14, paddingTop: 14, borderTop: "1px solid #F1F5F9" } },
      h("div", { style: { fontSize: 12, fontWeight: 800, color: "#475569", marginBottom: 8 } }, "O que está incluso"),
      inclui.map((t, i) => h("div", { key: i, style: { display: "flex", gap: 9, fontSize: 14, color: "#334155", lineHeight: 1.45, marginTop: i ? 6 : 0 } }, h(Check), h("span", null, t)))) : null,
    etapa === "dados" && d.sobre ? h("div", { style: { fontSize: 13.5, color: "#475569", lineHeight: 1.55, marginTop: 14 } }, d.sobre) : null,
    etapa === "dados" && (d.atendimento || d.local) ? h("div", { style: { fontSize: 12.5, color: C.cinza, marginTop: 12 } }, [d.atendimento, d.local].filter(Boolean).join(" · ")) : null);

  if (etapa === "feito") return wrap(card({ textAlign: "center", padding: "26px 20px" },
    h("div", { style: { width: 56, height: 56, borderRadius: 18, background: "#E9F5F2", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 12px" } }, h("svg", { width: 28, height: 28, viewBox: "0 0 24 24", fill: "none", stroke: C.verdeEsc, strokeWidth: 2.6, strokeLinecap: "round", strokeLinejoin: "round" }, h("path", { d: "M20 6 9 17l-5-5" }))),
    h("div", { style: { fontSize: 20, fontWeight: 800, color: C.escuro } }, "Obrigado, " + primeiro(nome) + "!"),
    h("div", { style: { fontSize: 14, color: "#475569", marginTop: 6, lineHeight: 1.55 } }, "Seu aviso chegou para o " + primeiro(nomeProf) + ". " + (d.posPagamento ? "\u201C" + d.posPagamento + "\u201D" : "Assim que ele confirmar o pagamento, te chama no WhatsApp para combinar tudo.")),
    presente ? h("div", { style: { fontSize: 13, color: C.cinza, marginTop: 10, lineHeight: 1.5 } }, "Presente para " + pr.nome.trim() + ". Ele também vai falar com " + (pr.nome.trim().split(" ")[0]) + " para agendar.") : null,
    waProf ? h("a", { href: waProf, target: "_blank", rel: "noopener noreferrer", style: { display: "block", marginTop: 18, padding: "14px", borderRadius: 12, background: "#25D366", color: "#fff", fontWeight: 800, fontSize: 15, textDecoration: "none" } }, "Mandar o comprovante no WhatsApp") : null), resumo);

  if (etapa === "pix") return wrap(resumo, card({ textAlign: "center" },
    h("div", { style: { fontSize: 16, fontWeight: 800, color: C.escuro } }, "Pague com Pix"),
    h("div", { style: { fontSize: 13, color: C.cinza, marginTop: 3 } }, "Escaneie o QR Code no app do seu banco ou copie o código."),
    payload ? h("div", { ref: qr, style: { display: "flex", justifyContent: "center", margin: "16px 0 12px" } }) : h("div", { style: { fontSize: 13, color: "#b45309", margin: "14px 0" } }, "Pix indisponível no momento. Fale no WhatsApp para pagar."),
    payload ? h("button", { onClick: copiar, style: { width: "100%", padding: "13px", borderRadius: 12, border: "1.5px solid " + C.borda, background: "#F8FAFC", fontWeight: 800, fontSize: 14, color: C.escuro, cursor: "pointer", fontFamily: "inherit" } }, copiado ? "Código copiado" : "Copiar código Pix") : null,
    h("button", { onClick: jaPaguei, disabled: enviando, style: { width: "100%", marginTop: 10, padding: "15px", borderRadius: 12, border: "none", background: C.verde, color: "#fff", fontWeight: 800, fontSize: 16, cursor: "pointer", fontFamily: "inherit", boxShadow: "0 8px 18px rgba(22,163,74,0.25)" } }, enviando ? "Enviando..." : "Já paguei"),
    erro ? h("div", { style: { fontSize: 13, color: "#b91c1c", marginTop: 10 } }, erro) : null,
    h("button", { onClick: () => setEtapa("dados"), style: { marginTop: 12, border: "none", background: "none", color: C.cinza, fontSize: 13, textDecoration: "underline", cursor: "pointer", fontFamily: "inherit" } }, "Voltar e corrigir meus dados")));

  const aba = (k, t) => h("button", { onClick: () => setPara(k), style: { flex: 1, padding: "11px", borderRadius: 11, border: "none", fontWeight: 800, fontSize: 14, cursor: "pointer", fontFamily: "inherit", background: para === k ? C.escuro : "transparent", color: para === k ? "#fff" : "#475569" } }, t);
  return wrap(resumo, card({},
    aceita ? h("div", { style: { display: "flex", gap: 4, background: "#F1F5F9", borderRadius: 13, padding: 4, marginBottom: 16 } }, aba("mim", "Para mim"), aba("presente", "Dar de presente")) : null,
    h(Campo, { rotulo: "Seu nome", valor: nome, onChange: setNome, placeholder: "Nome e sobrenome" }),
    h(Campo, { rotulo: "Seu WhatsApp", valor: whats, onChange: (v) => setWhats(fmtTel(v)), tipo: "tel", placeholder: "(11) 90000-0000" }),
    presente ? h("div", { style: { background: "#FFF4EE", borderRadius: 14, padding: "14px 14px 2px", marginBottom: 12 } },
      h("div", { style: { fontSize: 12.5, fontWeight: 800, color: C.laranjaTxt, marginBottom: 10 } }, "Quem vai ganhar"),
      h(Campo, { rotulo: "Nome", valor: pr.nome, onChange: (v) => setPr({ ...pr, nome: v }) }),
      h(Campo, { rotulo: "WhatsApp (opcional)", valor: pr.whatsapp, onChange: (v) => setPr({ ...pr, whatsapp: fmtTel(v) }), tipo: "tel" }),
      h(Campo, { rotulo: "Mensagem (opcional)", valor: pr.mensagem, onChange: (v) => setPr({ ...pr, mensagem: v }), area: true })) : null,
    erro ? h("div", { style: { fontSize: 13, color: "#b91c1c", marginBottom: 10 } }, erro) : null,
    h("button", { onClick: irPagar, style: { width: "100%", padding: "15px", borderRadius: 13, border: "none", background: C.laranja, color: "#fff", fontWeight: 800, fontSize: 16, cursor: "pointer", fontFamily: "inherit", boxShadow: "0 8px 18px rgba(255,86,3,0.25)" } }, d.botao || (valor > 0 ? "Ir para o pagamento" : "Continuar")),
    h("div", { style: { fontSize: 12, color: "#94A3B8", textAlign: "center", marginTop: 10, lineHeight: 1.5 } }, "Pagamento por Pix direto para " + nomeProf + ". Seus dados são usados só para combinar o atendimento.")));
};
ReactDOM.createRoot(document.getElementById("root")).render(h(App));

</script>
</body>
</html>
