<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const SUPA_URL = "https://jpduxfbigcdxmtcozqpp.supabase.co";
const SUPA_KEY = "sb_publishable_VZSgcxu5ps3eR9UAjuRr4Q_B65WTx_h";
const supa = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { storageKey: "lv-mente-auth", persistSession: true, autoRefreshToken: true } });
const MODELO = "mente-ativa-30";

const C = { escuro:"#0F172A", escuro2:"#18233A", laranja:"#FF5603", laranjaTxt:"#C2410C", laranjaClaro:"#FFF4EE", cinza:"#64748B", cinzaClaro:"#94A3B8", borda:"#E2E8F0", fundo:"#F4F5F7", verde:"#16A34A", verdeClaro:"#F0FDF4", vermelho:"#B91C1C", vermelhoClaro:"#FEF2F2" };

async function hdrs(extra){
  const { data } = await supa.auth.getSession();
  const token = (data && data.session && data.session.access_token) || SUPA_KEY;
  return Object.assign({ "apikey": SUPA_KEY, "Authorization": "Bearer "+token, "Content-Type": "application/json" }, extra||{});
}
const api = {
  async rpc(nome, body){ try{ const r = await fetch(SUPA_URL+"/rest/v1/rpc/"+nome, { method:"POST", headers: await hdrs(), body: JSON.stringify(body||{}) }); if(!r.ok) return null; const t = await r.text(); return t ? JSON.parse(t) : null; } catch(e){ return null; } },
  async get(path){ try{ const r = await fetch(SUPA_URL+"/rest/v1/"+path, { headers: await hdrs() }); if(!r.ok) return []; return await r.json(); } catch(e){ return []; } },
  async post(path, body, prefer){ try{ const r = await fetch(SUPA_URL+"/rest/v1/"+path, { method:"POST", headers: await hdrs({ "Prefer": prefer||"return=minimal" }), body: JSON.stringify(body) }); return r.ok; } catch(e){ return false; } }
};

const hojeISO = (d) => { const x = d ? new Date(d) : new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const maisDias = (iso, n) => { const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return hojeISO(d); };
const fmtData = (iso) => iso ? String(iso).slice(8,10)+"/"+String(iso).slice(5,7) : "";
const primeiro = (n) => String(n||"").trim().split(/\s+/)[0] || "";
const real = (v) => "R$ "+Number(v||0).toFixed(2).replace(".",",");
const waLink = (numero, texto) => { let d = String(numero||"").replace(/\D/g,""); if(!d) return null; if(!(d.length>=12 && d.indexOf("55")===0)) d = "55"+d; return "https://wa.me/"+d+(texto ? "?text="+encodeURIComponent(texto) : ""); };
const lsGet = (k) => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
const ssGet = (k) => { try { return JSON.parse(sessionStorage.getItem(k)||"null"); } catch(e){ return null; } };
const ssSet = (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

const pixAscii = (str, max) => { const l = String(str||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9 ]/g,"").trim(); return max ? l.slice(0,max) : l; };
const pixCRC = (p) => { let c = 0xFFFF; for(let i=0;i<p.length;i++){ c ^= (p.charCodeAt(i) << 8); for(let j=0;j<8;j++){ c = (c & 0x8000) ? ((c<<1) ^ 0x1021) & 0xFFFF : (c<<1) & 0xFFFF; } } return c.toString(16).toUpperCase().padStart(4,"0"); };
const tlv = (id, v) => id + String(v).length.toString().padStart(2,"0") + v;
const pixPayload = ({ pixKey, merchantName, merchantCity, amount, txid }) => {
  if(!pixKey) return null;
  const conta = tlv("26", tlv("00","br.gov.bcb.pix")+tlv("01",pixKey));
  const sem = tlv("00","01")+conta+tlv("52","0000")+tlv("53","986")+(amount ? tlv("54",Number(amount).toFixed(2)) : "")+tlv("58","BR")+tlv("59",pixAscii(merchantName,25)||"LONGEVUS")+tlv("60",pixAscii(merchantCity,15)||"BRASIL")+tlv("62",tlv("05",pixAscii(txid,25).replace(/\s/g,"")||"***"))+"6304";
  return sem + pixCRC(sem);
};

const ytId = (url) => { if(!url) return null; const m = String(url).match(/(?:youtu\.be\/|v\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/); return m ? m[1] : null; };

let audioCtx = null;
const somLiberar = () => { try { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === "suspended") audioCtx.resume(); } catch(e){} };
const bipe = (freq, dur) => {
  try {
    somLiberar(); if(!audioCtx) return;
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq || 880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.18));
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + (dur || 0.18) + 0.05);
  } catch(e){}
};
let wakeLockRef = null;
const telaAcesa = async (ligar) => {
  try {
    if(ligar && navigator.wakeLock){ wakeLockRef = await navigator.wakeLock.request("screen"); }
    if(!ligar && wakeLockRef){ await wakeLockRef.release(); wakeLockRef = null; }
  } catch(e){}
};

const IcoSeta = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>;
const IcoCheck = ({ cor, tam }) => <svg width={tam||18} height={tam||18} viewBox="0 0 24 24" fill="none" stroke={cor||"currentColor"} strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>;
const IcoPlay = ({ cor }) => <svg width="18" height="18" viewBox="0 0 24 24" fill={cor||"currentColor"} aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>;
const IcoCadeado = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>;

const Voltar = ({ onClick, rotulo, claro }) => (
  <button type="button" onClick={onClick} style={{display:"inline-flex",alignItems:"center",gap:6,height:42,padding:"0 16px 0 10px",borderRadius:21,border:claro?"1.5px solid "+C.borda:"1.5px solid rgba(255,255,255,0.28)",background:claro?"#fff":"rgba(255,255,255,0.10)",color:claro?C.escuro:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}><IcoSeta/>{rotulo||"Voltar"}</button>
);
const Topo = ({ onVoltar, voltar, titulo, sub, children }) => (
  <div style={{background:C.escuro,color:"#F8FAFC",padding:"14px 16px 18px",borderRadius:"0 0 24px 24px"}}>
    {onVoltar && <Voltar onClick={onVoltar} rotulo={voltar}/>}
    {titulo && <div style={{fontSize:23,fontWeight:800,marginTop:onVoltar?12:4,lineHeight:1.2}}>{titulo}</div>}
    {sub && <div style={{fontSize:13.5,color:C.cinzaClaro,marginTop:4,lineHeight:1.45}}>{sub}</div>}
    {children}
  </div>
);
const Secao = ({ children }) => <div style={{margin:"18px 16px 8px",fontSize:11.5,fontWeight:700,letterSpacing:"0.08em",color:C.cinza,textTransform:"uppercase"}}>{children}</div>;
const Cartao = ({ children, style }) => <div style={Object.assign({margin:"0 16px",background:"#fff",borderRadius:18,padding:16,boxShadow:"0 1px 3px rgba(15,23,42,0.07)"}, style||{})}>{children}</div>;
const Botao = ({ onClick, children, tipo, disabled, style }) => {
  const base = {width:"100%",minHeight:54,borderRadius:16,border:"none",fontSize:16.5,fontWeight:800,cursor:disabled?"default":"pointer",opacity:disabled?0.55:1,padding:"0 16px"};
  const t = tipo==="sec" ? {background:"#fff",color:C.escuro,border:"1.5px solid "+C.borda} : tipo==="verde" ? {background:C.verde,color:"#fff"} : tipo==="escuro" ? {background:C.escuro,color:"#fff"} : {background:C.laranja,color:"#fff"};
  return <button type="button" onClick={disabled?undefined:onClick} style={Object.assign({}, base, t, style||{})}>{children}</button>;
};
const BotaoLink = ({ href, children, tipo }) => {
  const t = tipo==="sec" ? {background:"#fff",color:C.escuro,border:"1.5px solid "+C.borda} : tipo==="verde" ? {background:C.verde,color:"#fff"} : {background:C.laranja,color:"#fff"};
  return <a href={href} target={href && href.indexOf("http")===0 ? "_blank" : undefined} rel="noopener noreferrer" style={Object.assign({display:"flex",alignItems:"center",justifyContent:"center",minHeight:54,borderRadius:16,fontSize:16.5,fontWeight:800,textDecoration:"none",padding:"0 16px",textAlign:"center"}, t)}>{children}</a>;
};
const Carregando = ({ texto }) => <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.cinzaClaro,fontSize:15}}>{texto||"Carregando..."}</div>;
const Campo = ({ rotulo, children }) => <label style={{display:"block",marginBottom:14}}><span style={{display:"block",fontSize:14,fontWeight:700,color:"#334155",marginBottom:6}}>{rotulo}</span>{children}</label>;
const estInput = {width:"100%",height:52,padding:"0 14px",borderRadius:14,border:"1.5px solid "+C.borda,fontSize:17,background:"#fff",color:C.escuro};

function Midia({ ex, nome, altura }){
  const h = altura || 220;
  const id = ex && ytId(ex.video);
  if(id) return <div style={{position:"relative",width:"100%",height:h,borderRadius:18,overflow:"hidden",background:"#000"}}><iframe title={nome||"Vídeo do exercício"} src={"https://www.youtube.com/embed/"+id+"?autoplay=1&mute=1&loop=1&playlist="+id+"&controls=0&modestbranding=1&playsinline=1&rel=0"} allow="autoplay; encrypted-media" style={{position:"absolute",inset:0,width:"100%",height:"100%",border:"none"}}/></div>;
  if(ex && ex.foto) return <img src={ex.foto} alt={nome||ex.nome||"Exercício"} style={{width:"100%",height:h,objectFit:"contain",background:C.escuro2,borderRadius:18,display:"block"}}/>;
  return <div style={{width:"100%",height:h,borderRadius:18,background:C.escuro2,display:"flex",alignItems:"center",justifyContent:"center",color:C.cinzaClaro,fontSize:14,textAlign:"center",padding:20}}>Vídeo em breve. Siga a explicação abaixo.</div>;
}

// ═══════════════ ENTRADA ═══════════════
function Entrada(){
  const [modo,setModo] = useState(new URLSearchParams(window.location.search).get("entrar")==="1" ? "entrar" : "criar");
  const [nome,setNome] = useState(""); const [whats,setWhats] = useState("");
  const [email,setEmail] = useState(""); const [senha,setSenha] = useState("");
  const [termos,setTermos] = useState(false);
  const [erro,setErro] = useState(""); const [info,setInfo] = useState(""); const [env,setEnv] = useState(false);
  const traduz = (m) => { const s = String(m||""); if(s.indexOf("Invalid login")>=0) return "E-mail ou senha incorretos."; if(s.indexOf("already registered")>=0) return "Este e-mail já tem conta. Toque em Entrar."; if(s.indexOf("Password should")>=0) return "A senha precisa ter pelo menos 6 caracteres."; if(s.indexOf("Email not confirmed")>=0) return "Confirme seu e-mail pelo link que enviamos e tente de novo."; return s || "Não foi possível continuar. Tente de novo."; };
  const enviar = async () => {
    setErro(""); setInfo("");
    if(modo==="criar"){
      if(!nome.trim() || whats.replace(/\D/g,"").length<10 || !email.trim() || senha.length<6){ setErro("Preencha nome, WhatsApp com DDD, e-mail e uma senha de pelo menos 6 caracteres."); return; }
      if(!termos){ setErro("Para continuar, aceite os termos de uso."); return; }
    } else if(modo==="esqueci"){
      if(!email.trim()){ setErro("Digite o seu e-mail."); return; }
    } else if(!email.trim() || !senha){ setErro("Digite e-mail e senha."); return; }
    setEnv(true);
    try {
      if(modo==="criar"){
        lsSet("ma-cadastro", JSON.stringify({ nome:nome.trim(), whatsapp:whats.trim() }));
        const { data, error } = await supa.auth.signUp({ email:email.trim(), password:senha, options:{ data:{ nome:nome.trim(), whatsapp:whats.trim() }, emailRedirectTo: window.location.href.split("?")[0].split("#")[0] } });
        if(error) throw error;
        if(!data.session){ setInfo("Enviamos um e-mail de confirmação para "+email.trim()+". Toque no link do e-mail e depois entre aqui com a sua senha."); setModo("entrar"); }
      } else if(modo==="esqueci"){
        const { error } = await supa.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href.split("?")[0].split("#")[0] });
        if(error) throw error;
        setInfo("Enviamos um link para criar uma nova senha em "+email.trim()+".");
      } else {
        const { error } = await supa.auth.signInWithPassword({ email:email.trim(), password:senha });
        if(error) throw error;
      }
    } catch(e){ setErro(traduz(e.message)); }
    setEnv(false);
  };
  const titulo = modo==="criar" ? "Crie sua conta" : modo==="esqueci" ? "Nova senha" : "Entrar";
  return (
    <div style={{minHeight:"100vh",background:C.fundo,paddingBottom:30}}>
      <Topo titulo={titulo} sub={modo==="criar" ? "Mente Ativa · 30 dias de corpo e mente, 15 minutos por dia, em casa." : modo==="esqueci" ? "Digite o e-mail da sua conta e enviaremos um link." : "Use o e-mail e a senha que você cadastrou."}/>
      <div style={{padding:"18px 16px 0"}}>
        {modo==="criar" && <Campo rotulo="Seu nome"><input style={estInput} value={nome} onChange={e=>setNome(e.target.value)} placeholder="Como quer ser chamado" autoComplete="name"/></Campo>}
        {modo==="criar" && <Campo rotulo="WhatsApp com DDD"><input style={estInput} type="tel" value={whats} onChange={e=>setWhats(e.target.value)} placeholder="(11) 90000-0000" autoComplete="tel"/></Campo>}
        <Campo rotulo="E-mail"><input style={estInput} type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com" autoComplete="email" autoCapitalize="none"/></Campo>
        {modo!=="esqueci" && <Campo rotulo={modo==="criar" ? "Crie uma senha" : "Senha"}><input style={estInput} type="password" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="Mínimo 6 caracteres" autoComplete={modo==="criar"?"new-password":"current-password"}/></Campo>}
        {modo==="criar" && <label style={{display:"flex",gap:10,alignItems:"center",fontSize:15,color:"#334155",marginBottom:16}}><input type="checkbox" checked={termos} onChange={e=>setTermos(e.target.checked)} style={{width:24,height:24,accentColor:C.laranja}}/>Li e aceito os termos de uso</label>}
        {erro && <div role="alert" style={{background:C.vermelhoClaro,color:C.vermelho,borderRadius:12,padding:"10px 12px",fontSize:14,marginBottom:12,lineHeight:1.45}}>{erro}</div>}
        {info && <div style={{background:C.verdeClaro,color:"#15803D",borderRadius:12,padding:"10px 12px",fontSize:14,marginBottom:12,lineHeight:1.45}}>{info}</div>}
        <Botao onClick={enviar} disabled={env}>{env ? "Aguarde..." : modo==="criar" ? "Criar conta e começar" : modo==="esqueci" ? "Enviar link" : "Entrar"}</Botao>
        <div style={{textAlign:"center",marginTop:16,fontSize:15,lineHeight:2}}>
          {modo!=="criar" && <div><button type="button" onClick={()=>{setModo("criar");setErro("");setInfo("");}} style={{border:"none",background:"none",color:C.laranjaTxt,fontWeight:700,fontSize:15,cursor:"pointer"}}>Ainda não tenho conta</button></div>}
          {modo!=="entrar" && <div><button type="button" onClick={()=>{setModo("entrar");setErro("");setInfo("");}} style={{border:"none",background:"none",color:C.laranjaTxt,fontWeight:700,fontSize:15,cursor:"pointer"}}>Já tenho conta, quero entrar</button></div>}
          {modo==="entrar" && <div><button type="button" onClick={()=>{setModo("esqueci");setErro("");setInfo("");}} style={{border:"none",background:"none",color:C.cinza,fontSize:14,cursor:"pointer",textDecoration:"underline"}}>Esqueci minha senha</button></div>}
        </div>
      </div>
    </div>
  );
}

function NovaSenha({ onFeito }){
  const [s1,setS1] = useState(""); const [erro,setErro] = useState(""); const [env,setEnv] = useState(false);
  const salvar = async () => { if(s1.length<6){ setErro("A senha precisa ter pelo menos 6 caracteres."); return; } setEnv(true); const { error } = await supa.auth.updateUser({ password:s1 }); setEnv(false); if(error){ setErro("Não foi possível salvar. Tente de novo."); return; } onFeito(); };
  return (
    <div style={{minHeight:"100vh",background:C.fundo}}>
      <Topo titulo="Crie sua nova senha"/>
      <div style={{padding:"18px 16px"}}>
        <Campo rotulo="Nova senha"><input style={estInput} type="password" value={s1} onChange={e=>{setS1(e.target.value);setErro("");}} placeholder="Mínimo 6 caracteres"/></Campo>
        {erro && <div role="alert" style={{color:C.vermelho,fontSize:14,marginBottom:12}}>{erro}</div>}
        <Botao onClick={salvar} disabled={env}>{env?"Salvando...":"Salvar e entrar"}</Botao>
      </div>
    </div>
  );
}

// ═══════════════ QUESTIONÁRIO ═══════════════
const PARQ = [
  "Algum médico já disse que você tem algum problema no coração e que só deveria fazer atividade física com orientação médica?",
  "Você sente dor no peito quando faz atividade física?",
  "No último mês, você sentiu dor no peito mesmo sem estar fazendo atividade física?",
  "Você perde o equilíbrio por causa de tontura ou já desmaiou alguma vez?",
  "Você tem algum problema nos ossos ou nas articulações que pode piorar com atividade física?",
  "Você toma algum remédio para pressão arterial ou para o coração?",
  "Existe alguma outra razão para você não fazer atividade física?"
];
function ParQ({ onFeito }){
  const [resp,setResp] = useState(PARQ.map(()=>null));
  const [liberado,setLiberado] = useState(false);
  const [erro,setErro] = useState(""); const [env,setEnv] = useState(false);
  const algumSim = resp.some(r=>r===true);
  const completo = resp.every(r=>r!==null);
  const marcar = (i, v) => { const n = resp.slice(); n[i] = v; setResp(n); setErro(""); };
  const salvar = async () => {
    if(!completo){ setErro("Responda todas as perguntas para continuar."); return; }
    if(algumSim && !liberado){ setErro("Marque a confirmação de liberação médica para continuar."); return; }
    setEnv(true);
    const ok = await api.rpc("ma_salvar_parq", { p_respostas:{ respostas:resp, algum_sim:algumSim, liberado_medico:liberado } });
    setEnv(false);
    if(!ok){ setErro("Não foi possível salvar. Verifique sua internet e tente de novo."); return; }
    onFeito();
  };
  return (
    <div style={{minHeight:"100vh",background:C.fundo,paddingBottom:30}}>
      <Topo titulo="Antes de começar" sub="Responda com sinceridade. São 7 perguntas rápidas para a sua segurança."/>
      <div style={{padding:"6px 0 0"}}>
        {PARQ.map((p,i)=>(
          <Cartao key={i} style={{marginTop:12}}>
            <div style={{fontSize:16,lineHeight:1.45,fontWeight:600}}>{(i+1)+". "+p}</div>
            <div style={{display:"flex",gap:10,marginTop:12}}>
              {[[true,"Sim"],[false,"Não"]].map(([v,l])=>{ const on = resp[i]===v; return <button key={l} type="button" onClick={()=>marcar(i,v)} style={{flex:1,height:50,borderRadius:14,fontSize:16,fontWeight:800,cursor:"pointer",border:on?"2px solid "+C.laranja:"1.5px solid "+C.borda,background:on?C.laranjaClaro:"#fff",color:on?C.laranjaTxt:C.escuro}}>{l}</button>; })}
            </div>
          </Cartao>
        ))}
        {algumSim && <Cartao style={{marginTop:12,background:C.laranjaClaro,boxShadow:"none"}}>
          <div style={{fontSize:15.5,lineHeight:1.5,color:C.laranjaTxt,fontWeight:600}}>Você respondeu "sim" em alguma pergunta. Antes de começar os exercícios, converse com o seu médico e conte que vai fazer uma rotina leve de exercícios em casa.</div>
          <label style={{display:"flex",gap:10,alignItems:"flex-start",marginTop:12,fontSize:15,lineHeight:1.45}}><input type="checkbox" checked={liberado} onChange={e=>{setLiberado(e.target.checked);setErro("");}} style={{width:24,height:24,flexShrink:0,accentColor:C.laranja}}/>Já conversei com meu médico e estou liberado para fazer exercícios.</label>
        </Cartao>}
        <div style={{padding:"16px 16px 0"}}>
          {erro && <div role="alert" style={{background:C.vermelhoClaro,color:C.vermelho,borderRadius:12,padding:"10px 12px",fontSize:14,marginBottom:12}}>{erro}</div>}

// ═══════════════ PLAYER DA AULA ═══════════════
function montarFases(aula){
  const fases = [];
  const est = aula.estacoes || [];
  const seq = (aula.sequencia && aula.sequencia.length) ? aula.sequencia : [{ s:40, t:"exec" }];
  const voltas = Number(aula.voltas) || 1;
  if(Number(aula.preparacao)>0) fases.push({ tipo:"prep", s:Number(aula.preparacao), est:est[0], i:0, v:1 });
  for(let v=1; v<=voltas; v++){
    est.forEach((e,i)=>{
      seq.forEach(q=>{ fases.push({ tipo: q.t==="exec" ? "exec" : "pausa", s:Number(q.s)||30, est:e, i:i, v:v }); });
      const ultimaEst = i===est.length-1;
      if(!ultimaEst && Number(aula.troca)>0) fases.push({ tipo:"troca", s:Number(aula.troca), est:est[i+1], i:i+1, v:v });
    });
    if(v<voltas){
      const d = Number(aula.descansoVolta) || Number(aula.troca) || 0;
      if(d>0) fases.push({ tipo:"descanso", s:d, est:est[0], i:0, v:v+1 });
    }
  }
  (aula.extras || []).filter(x=>x.tipo==="dupla").forEach(x=>{
    const e = { nome:x.nome, obs:x.obs, exercicioId:x.exercicioId };
    const app = String(x.exercicioId||"").indexOf("app:")===0;
    fases.push({ tipo:"troca", s:Number(aula.troca)||15, est:e, i:-1, v:voltas, dupla:true });
    fases.push({ tipo: app ? "app" : "dupla", s: app ? 120 : (Number(x.segundos)||60), est:e, i:-1, v:voltas, dupla:true, extra:x });
  });
  return fases;
}
const minutosAula = (aula) => Math.max(1, Math.round(montarFases(aula).reduce((a,f)=>a+f.s,0)/60));

function Player({ aula, exs, onFim, onSair, salvarJogo }){
  const fases = useRef(montarFases(aula)).current;
  const [idx,setIdx] = useState(0);
  const [resta,setResta] = useState(fases.length ? fases[0].s : 0);
  const [rodando,setRodando] = useState(false);
  const [iniciou,setIniciou] = useState(false);
  const [comoFazer,setComoFazer] = useState(false);
  const [fim,setFim] = useState(false);
  const idxRef = useRef(0);
  const restaRef = useRef(fases.length ? fases[0].s : 0);
  useEffect(()=>()=>{ telaAcesa(false); },[]);
  useEffect(()=>{
    if(!rodando || fim || (fases[idx] && fases[idx].tipo==="app")) return;
    const t = setInterval(()=>{
      let n = restaRef.current - 1;
      if(n>0 && n<=3) bipe(660, 0.12);
      if(n<=0){
        const prox = idxRef.current + 1;
        if(prox>=fases.length){ bipe(990, 0.6); restaRef.current = 0; setResta(0); setFim(true); setRodando(false); telaAcesa(false); return; }
        bipe(fases[prox].tipo==="exec" || fases[prox].tipo==="dupla" ? 990 : 520, 0.35);
        idxRef.current = prox; setIdx(prox); setComoFazer(false);
        n = fases[prox].s;
      }
      restaRef.current = n; setResta(n);
    }, 1000);
    return ()=>clearInterval(t);
  },[rodando, fim, idx]);
  const comecar = () => { somLiberar(); bipe(990,0.3); setIniciou(true); setRodando(true); telaAcesa(true); };
  const pular = () => { const prox = idxRef.current + 1; if(prox>=fases.length){ setFim(true); setRodando(false); telaAcesa(false); return; } idxRef.current = prox; restaRef.current = fases[prox].s; setIdx(prox); setResta(fases[prox].s); setComoFazer(false); };
  if(!fases.length) return <Carregando texto="Aula sem estações."/>;
  if(fim) return (
    <div style={{minHeight:"100vh",background:C.escuro,color:"#fff",padding:"20px 16px",display:"flex",flexDirection:"column"}}>
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",gap:12}}>
        <div style={{width:84,height:84,borderRadius:"50%",background:C.verde,display:"flex",alignItems:"center",justifyContent:"center"}}><IcoCheck cor="#fff" tam={44}/></div>
        <div style={{fontSize:28,fontWeight:800}}>Aula concluída!</div>
        <div style={{fontSize:16,color:C.cinzaClaro,lineHeight:1.5}}>{aula.nome}. Agora siga para a próxima etapa do dia.</div>
      </div>
      <Botao onClick={onFim}>Continuar</Botao>
    </div>
  );
  const f = fases[idx];
  if(f.tipo==="app") return <Extra item={f.extra} exs={exs} salvarJogo={salvarJogo} onVoltar={()=>{ telaAcesa(false); onSair(); }} onFeito={pular}/>;
  const totalEst = (aula.estacoes||[]).length;
  const ex = f.est && exs[f.est.exercicioId];
  const ativo = f.tipo==="exec" || f.tipo==="dupla";
  const rotulo = f.tipo==="prep" ? "Prepare-se" : f.tipo==="exec" ? "Agora" : f.tipo==="dupla" ? "Dupla tarefa · agora" : f.tipo==="troca" ? (f.dupla ? "Última etapa" : "Troque de estação") : f.tipo==="descanso" ? "Descanse e beba água" : "Pausa";
  const corTempo = ativo ? "#FDBA74" : "#93C5FD";
  return (
    <div style={{minHeight:"100vh",background:C.escuro,color:"#fff",padding:"14px 16px 20px",display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <Voltar onClick={()=>{ telaAcesa(false); onSair(); }}/>
        <span style={{fontSize:14,color:C.cinzaClaro,textAlign:"right"}}>{f.dupla ? "Dupla tarefa" : "Volta "+f.v+" de "+(aula.voltas||1)}<br/>{f.dupla ? "corpo e mente juntos" : "Estação "+(f.i+1)+" de "+totalEst}</span>
      </div>
      <Midia ex={ex} nome={f.est && f.est.nome} altura={210}/>
      <div>
        <div style={{fontSize:13,fontWeight:800,letterSpacing:"0.08em",color:corTempo,textTransform:"uppercase"}}>{ativo ? rotulo : rotulo+" · a seguir"}</div>
        <div style={{fontSize:24,fontWeight:800,lineHeight:1.2,marginTop:4}}>{f.est ? f.est.nome : ""}</div>
        <div style={{fontSize:15.5,color:"#CBD5E1",lineHeight:1.5,marginTop:6}}>{f.est ? f.est.obs : ""}</div>
        {ex && ex.execucao && <button type="button" onClick={()=>setComoFazer(v=>!v)} style={{marginTop:8,border:"none",background:"none",color:"#FDBA74",fontSize:15,fontWeight:700,cursor:"pointer",padding:0}}>{comoFazer?"Esconder explicação":"Ver como fazer"}</button>}
        {comoFazer && ex && <div style={{fontSize:14.5,color:"#CBD5E1",lineHeight:1.55,marginTop:6,whiteSpace:"pre-line"}}>{ex.execucao}</div>}
      </div>
      <div style={{marginTop:"auto",textAlign:"center"}}>
        <div aria-live="polite" style={{fontSize:76,fontWeight:800,lineHeight:1,color:corTempo,fontVariantNumeric:"tabular-nums"}}>{Math.floor(resta/60)+":"+String(resta%60).padStart(2,"0")}</div>
        <div style={{height:8,borderRadius:4,background:"#26344F",margin:"14px 0"}}><div style={{height:8,borderRadius:4,background:C.laranja,width:Math.round((idx/fases.length)*100)+"%"}}/></div>
        {!iniciou ? <Botao onClick={comecar}>Começar a aula</Botao> :
          <div style={{display:"flex",gap:10}}>
            <Botao tipo="sec" onClick={()=>setRodando(r=>!r)} style={{flex:1}}>{rodando?"Pausar":"Continuar"}</Botao>
            <Botao onClick={pular} style={{flex:1}}>Pular</Botao>
          </div>}
      </div>
    </div>
  );
}

const PALAVRAS = ["Casa","Laranja","Sapato","Mesa","Chapéu","Banana","Janela","Livro","Cadeira","Flor","Relógio","Copo","Bolsa","Panela","Escova","Chave"];
const embaralhar = (a) => { const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t = b[i]; b[i] = b[j]; b[j] = t; } return b; };
function Circuito({ onVoltar, onFeito, salvarJogo }){

  const acertos = sel.filter(w=>dados.certas.indexOf(w)>=0).length;
  const alternar = (w) => { const s = sel.slice(); const k = s.indexOf(w); if(k>=0) s.splice(k,1); else if(s.length<3) s.push(w); setSel(s); };
  const pontos = ["Corpo e memória juntos", "Guarde as palavras", "Agora o corpo trabalha", "Quais eram as palavras?", "Resultado"];
  return (
    <TelaEscura onVoltar={onVoltar} titulo="Circuito mente e corpo" sub={pontos[passo+1]}>

        <div style={{marginTop:"auto"}}><Botao onClick={()=>setPasso(1)}>Guardei, começar</Botao></div>
      </div>}
      {passo===1 && <div style={{display:"flex",flexDirection:"column",gap:10,flex:1}}>
        <div style={{fontSize:16,color:"#CBD5E1",lineHeight:1.5}}>Faça os 3 exercícios e toque em cada um ao terminar. Continue lembrando das palavras.</div>

        <div style={{marginTop:"auto"}}><Botao onClick={()=>setPasso(2)} disabled={!feitos.every(Boolean)}>Terminei os exercícios</Botao></div>
      </div>}
      {passo===2 && <div style={{display:"flex",flexDirection:"column",gap:12,flex:1}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {dados.opcoes.map(w=>{ const on = sel.indexOf(w)>=0; return <button key={w} type="button" onClick={()=>alternar(w)} style={{height:64,borderRadius:16,fontSize:19,fontWeight:800,cursor:"pointer",border:on?"2px solid "+C.laranja:"1.5px solid #2A3854",background:on?"#3A2216":C.escuro2,color:"#fff"}}>{w}</button>; })}

const FIGURAS = [["🏠","Casa"],["☀️","Sol"],["🔑","Chave"],["❤️","Coração"],["⭐","Estrela"],["🌙","Lua"],["☁️","Nuvem"],["🔔","Sino"]];
function Memoria({ onVoltar, onFeito, salvarJogo }){
  const dados = useRef((()=>{ const e = embaralhar(FIGURAS); return { certas:e.slice(0,4).map(f=>f[1]), opcoes:embaralhar(FIGURAS) }; })()).current;
  const [passo,setPasso] = useState(0); const [resta,setResta] = useState(10); const [sel,setSel] = useState([]);
  useEffect(()=>{
    if(passo!==0 && passo!==1) return;
    const t = setInterval(()=>{ setResta(r=>{ if(r<=1){ bipe(990,0.4); if(passo===0){ setPasso(1); return 30; } setPasso(2); return 0; } return r-1; }); },1000);
    return ()=>clearInterval(t);
  },[passo]);
  const acertos = sel.filter(n=>dados.certas.indexOf(n)>=0).length;
  const alternar = (n) => { const s = sel.slice(); const k = s.indexOf(n); if(k>=0) s.splice(k,1); else if(s.length<4) s.push(n); setSel(s); };
  const subs = ["Guarde as 4 figuras.","Agora marche no lugar, sem olhar a tela.","Quais figuras apareceram? Toque em 4.","Resultado do desafio de hoje."];
  return (
    <TelaEscura onVoltar={onVoltar} titulo="Memória imediata" sub={subs[passo]}>
      {passo===0 && <div style={{display:"flex",flexDirection:"column",gap:12,flex:1}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {dados.certas.map(n=>{ const f = FIGURAS.find(x=>x[1]===n); return <div key={n} style={{height:140,borderRadius:18,background:C.escuro2,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6}}><span style={{fontSize:56}} aria-hidden="true">{f[0]}</span><span style={{fontSize:16}}>{n}</span></div>; })}
        </div>
        <div style={{textAlign:"center",fontSize:44,fontWeight:800,color:"#FDBA74"}}>{resta+" s"}</div>
        <div style={{marginTop:"auto"}}><Botao onClick={()=>{ setPasso(1); setResta(30); }}>Já guardei</Botao></div>
      </div>}
      {passo===1 && <div style={{display:"flex",flexDirection:"column",gap:12,flex:1}}>
        <div style={{flex:1,borderRadius:24,background:C.escuro2,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,padding:24,textAlign:"center"}}>
          <span style={{fontSize:64,fontWeight:800,color:"#FDBA74"}}>{"0:"+String(resta).padStart(2,"0")}</span>
          <span style={{fontSize:17,color:"#CBD5E1",lineHeight:1.5}}>Marche no lugar e tente lembrar das 4 figuras.</span>
        </div>
        <Botao onClick={()=>{ setPasso(2); setResta(0); }}>Terminei a marcha</Botao>
      </div>}
      {passo===2 && <div style={{display:"flex",flexDirection:"column",gap:12,flex:1}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
          {dados.opcoes.map(f=>{ const on = sel.indexOf(f[1])>=0; return <button key={f[1]} type="button" aria-label={f[1]} onClick={()=>alternar(f[1])} style={{height:96,borderRadius:16,cursor:"pointer",border:on?"2px solid "+C.laranja:"1.5px solid #2A3854",background:on?"#3A2216":C.escuro2,color:"#fff",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4}}><span style={{fontSize:34}} aria-hidden="true">{f[0]}</span><span style={{fontSize:12.5}}>{f[1]}</span></button>; })}
        </div>
        <div style={{fontSize:14.5,color:C.cinzaClaro}}>{sel.length+" de 4 escolhidas"}</div>
        <div style={{marginTop:"auto"}}><Botao onClick={()=>{ setPasso(3); if(salvarJogo) salvarJogo("jornada-memoria", acertos, { rotulo: acertos+" de 4" }); }} disabled={sel.length<4}>Conferir</Botao></div>
      </div>}
      {passo===3 && <div style={{display:"flex",flexDirection:"column",gap:12,flex:1}}>
        <div style={{flex:1,borderRadius:24,background:C.escuro2,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,padding:24,textAlign:"center"}}>
          <span style={{fontSize:16,color:C.cinzaClaro}}>Você acertou</span>
          <span style={{fontSize:58,fontWeight:800,color:"#6FD3A8"}}>{acertos+" de 4"}</span>
          <span style={{fontSize:16,color:"#CBD5E1"}}>{"As figuras eram: "+dados.certas.join(", ")+"."}</span>
        </div>
        <Botao tipo="verde" onClick={onFeito}>Feito</Botao>
      </div>}
    </TelaEscura>
  );
}

function Extra({ item, exs, onVoltar, onFeito, salvarJogo }){
  if(item.exercicioId==="app:cor-movimento") return <CorMovimento onVoltar={onVoltar} onFeito={onFeito}/>;
  if(item.exercicioId==="app:circuito") return <Circuito onVoltar={onVoltar} onFeito={onFeito} salvarJogo={salvarJogo}/>;
  if(item.exercicioId==="app:memoria") return <Memoria onVoltar={onVoltar} onFeito={onFeito} salvarJogo={salvarJogo}/>;
  const ex = exs[item.exercicioId];
  return (
    <TelaEscura onVoltar={onVoltar} titulo={item.nome} sub="Dupla tarefa: corpo e mente ao mesmo tempo">
      <Midia ex={ex} nome={item.nome} altura={200}/>
      <div style={{background:C.escuro2,borderRadius:16,padding:14,fontSize:17,lineHeight:1.55}}>{item.obs}</div>
      <div style={{marginTop:"auto"}}><TimerSimples segundos={item.segundos||60} onFeito={onFeito}/></div>
    </TelaEscura>
  );
}

function Contador({ valor, setValor, rotulo }){
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:16,margin:"8px 0"}}>
      <button type="button" aria-label="Diminuir" onClick={()=>setValor(Math.max(0,valor-1))} style={{width:56,height:56,borderRadius:28,border:"1.5px solid "+C.borda,background:"#fff",fontSize:28,fontWeight:800,cursor:"pointer"}}>−</button>
      <div style={{textAlign:"center",minWidth:90}}><div style={{fontSize:44,fontWeight:800}}>{valor}</div><div style={{fontSize:13,color:C.cinza}}>{rotulo}</div></div>
      <button type="button" aria-label="Aumentar" onClick={()=>setValor(valor+1)} style={{width:56,height:56,borderRadius:28,border:"1.5px solid "+C.borda,background:"#fff",fontSize:28,fontWeight:800,cursor:"pointer"}}>+</button>
    </div>
  );
}
function Cronometro30({ onFim }){
  const [resta,setResta] = useState(30); const [rodando,setRodando] = useState(false); const [acabou,setAcabou] = useState(false);
  useEffect(()=>{ if(!rodando) return; const t = setInterval(()=>{ setResta(r=>{ if(r<=1){ bipe(990,0.7); setRodando(false); setAcabou(true); if(onFim) onFim(); return 0; } if(r<=4) bipe(660,0.12); return r-1; }); },1000); return ()=>clearInterval(t); },[rodando]);
  return <div style={{textAlign:"center"}}><div aria-live="polite" style={{fontSize:64,fontWeight:800,color:acabou?C.verde:C.laranjaTxt}}>{"0:"+String(resta).padStart(2,"0")}</div>{!acabou && <Botao onClick={()=>{ somLiberar(); bipe(990,0.3); setRodando(true); }} disabled={rodando}>{rodando?"Contando...":"Começar 30 segundos"}</Botao>}</div>;
}
function CronometroEquilibrio({ onTempo }){
  const [seg,setSeg] = useState(0); const [rodando,setRodando] = useState(false);
  const ini = useRef(0);
  useEffect(()=>{ if(!rodando) return; const t = setInterval(()=>{ const s = Math.min(30, Math.floor((Date.now()-ini.current)/100)/10); setSeg(s); if(s>=30){ bipe(990,0.6); setRodando(false); onTempo(30); } },100); return ()=>clearInterval(t); },[rodando]);
  return <div style={{textAlign:"center"}}><div aria-live="polite" style={{fontSize:56,fontWeight:800,color:C.laranjaTxt}}>{seg.toFixed(1)+" s"}</div>{rodando ? <Botao tipo="escuro" onClick={()=>{ setRodando(false); bipe(520,0.3); onTempo(seg); }}>Parar (apoiou o pé)</Botao> : <Botao onClick={()=>{ somLiberar(); bipe(990,0.3); ini.current = Date.now(); setSeg(0); setRodando(true); }}>Começar</Botao>}</div>;
}
function MemoriaNumeros({ onNivel }){
  const [tam,setTam] = useState(3); const [seq,setSeq] = useState(""); const [mostrando,setMostrando] = useState(-1);
  const [resposta,setResposta] = useState(""); const [erros,setErros] = useState(0); const [melhor,setMelhor] = useState(0); const [fim,setFim] = useState(false);
  const iniciar = (t) => { let s = ""; for(let i=0;i<t;i++) s += String(Math.floor(Math.random()*10)); setSeq(s); setResposta(""); setMostrando(0); };
  useEffect(()=>{ if(mostrando<0) return; if(mostrando>=seq.length){ const t = setTimeout(()=>setMostrando(-2),700); return ()=>clearTimeout(t); } const t = setTimeout(()=>setMostrando(m=>m+1),1100); return ()=>clearTimeout(t); },[mostrando, seq]);
  const conferir = () => {
    if(resposta.replace(/\D/g,"")===seq){ const m = tam; setMelhor(m); if(tam>=9){ setFim(true); onNivel(m); return; } setErros(0); setTam(tam+1); setMostrando(-1); setSeq(""); }
    else { const e = erros+1; setErros(e); if(e>=2){ setFim(true); onNivel(melhor); return; } setMostrando(-1); setSeq(""); }
  };
  if(fim) return <div style={{textAlign:"center",fontSize:18,fontWeight:700,padding:"10px 0"}}>{"Seu nível: "+melhor+" números"}</div>;
  if(mostrando===-1) return <div style={{textAlign:"center"}}><div style={{fontSize:16,color:C.cinza,marginBottom:10,lineHeight:1.5}}>{"Vão aparecer "+tam+" números, um de cada vez. Depois digite na mesma ordem."+(erros>0?" Vamos tentar de novo com o mesmo tamanho.":"")}</div><Botao onClick={()=>iniciar(tam)}>Mostrar números</Botao></div>;
  if(mostrando>=0) return <div style={{height:150,borderRadius:18,background:C.escuro,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:80,fontWeight:800}}>{mostrando<seq.length ? seq[mostrando] : ""}</div>;
  return <div><Campo rotulo="Digite os números na ordem"><input style={Object.assign({}, estInput, { fontSize:26, letterSpacing:6, textAlign:"center" })} inputMode="numeric" value={resposta} onChange={e=>setResposta(e.target.value)} autoFocus/></Campo><Botao onClick={conferir} disabled={!resposta}>Conferir</Botao></div>;
}

          {[["Força · levantar 30 s","forca_reps",""],["Equilíbrio · um pé","equilibrio_seg"," s"],["Memória · números","memoria_nivel",""],["Como se sente","percepcao",""]].map(([n,k,u])=>(

          {erro && <div role="alert" style={{color:C.vermelho,fontSize:14,marginBottom:10}}>{erro}</div>}

function TelaDia({ j, info, aula, exs, testes, onVoltar, onAbrir, feitos, marcarFeito, onConcluir, concluindo }){
  if(!aula) return <Carregando texto="Carregando a aula do dia..."/>;
  const testeFeito = testes.some(t=>t.dia===info.dia);
  const precisaTeste = info.teste && !testeFeito;
  const extras = (aula.extras || []).filter(x=>x.tipo!=="dupla");
  const temDupla = (aula.extras || []).some(x=>x.tipo==="dupla");
  const passos = [];
  if(info.teste) passos.push({ id:"teste", titulo:"Teste do dia "+info.dia, sub:"Força, equilíbrio e memória · cerca de 5 min", feito:testeFeito });
  passos.push({ id:"aula", titulo:aula.nome, sub:(aula.estacoes||[]).length+" exercícios · "+(aula.voltas||1)+(Number(aula.voltas)===1?" volta":" voltas")+(temDupla?" + dupla tarefa":"")+" · cerca de "+minutosAula(aula)+" min", feito:!!feitos.aula });
  extras.forEach((x,k)=>{ passos.push({ id:"extra"+k, titulo:x.tipo==="desafio" ? "Desafio do dia" : x.nome, sub:x.tipo==="desafio" ? "Jogo da Mente Ativa escolhido para você" : "Dupla tarefa · corpo e mente juntos", feito:!!feitos["extra"+k], extra:x }); });
  const tudo = passos.every(p=>p.feito);
  const semana = info.semana;
  return (
    <div style={{minHeight:"100vh",background:C.fundo,paddingBottom:30}}>
      <Topo onVoltar={onVoltar} voltar="Início" titulo={"Dia "+info.dia} sub={"Semana "+semana+(info.treino==="L" ? " · dia leve" : "")+" · "+aula.nome}/>
      <div style={{height:8}}/>
      {passos.map((p,k)=>{
        const bloqueado = precisaTeste && p.id!=="teste";
        return (
          <button key={p.id} type="button" onClick={()=>{ if(!bloqueado) onAbrir(p); }} style={{display:"flex",gap:14,alignItems:"center",width:"calc(100% - 32px)",margin:"10px 16px 0",textAlign:"left",background:"#fff",border:!p.feito && !bloqueado && passos.findIndex(x=>!x.feito)===k ? "2px solid "+C.laranja : "1.5px solid transparent",borderRadius:18,padding:14,boxShadow:"0 1px 3px rgba(15,23,42,0.07)",cursor:bloqueado?"default":"pointer",opacity:bloqueado?0.55:1,color:C.escuro}}>
            <span style={{width:40,height:40,borderRadius:"50%",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:17,background:p.feito?C.verdeClaro:bloqueado?"#F1F5F9":C.laranjaClaro,color:p.feito?C.verde:bloqueado?C.cinza:C.laranjaTxt}}>{p.feito ? <IcoCheck/> : bloqueado ? <IcoCadeado/> : (k+1)}</span>
            <span style={{flex:1}}><span style={{display:"block",fontSize:17,fontWeight:800,lineHeight:1.3}}>{p.titulo}</span><span style={{display:"block",fontSize:13.5,color:C.cinza,marginTop:2,lineHeight:1.4}}>{bloqueado ? "Faça o teste primeiro" : p.sub}</span></span>
          </button>
        );
      })}
      <Cartao style={{marginTop:14,background:C.laranjaClaro,boxShadow:"none"}}><div style={{fontSize:14.5,lineHeight:1.5,color:C.laranjaTxt}}>Sentiu dor, falta de ar ou tontura? Pare, sente e descanse. Respeite o seu limite em todos os exercícios.</div></Cartao>
      <div style={{padding:"14px 16px 0"}}>
        <Botao tipo={tudo?"verde":"sec"} onClick={onConcluir} disabled={concluindo}>{concluindo ? "Salvando..." : tudo ? "Concluir o dia "+info.dia : "Concluir o dia mesmo assim"}</Botao>
      </div>
    </div>
  );
}

const OFERTAS = {
  7:{ titulo:"Avaliação funcional", texto:"Descubra seu ponto de partida real com uma avaliação completa, com preço especial para quem está na jornada.", msg:"Oi, Wellington! Estou na jornada Mente Ativa e quero saber da avaliação funcional com preço especial." },
  20:{ titulo:"Longevus 360", texto:"Integre o que você come com o que você treina e acompanhe tudo pelo app.", msg:"Oi, Wellington! Estou na jornada Mente Ativa e quero saber do Longevus 360." },
  30:{ titulo:"Continue evoluindo", texto:"Siga na Mente Ativa no próximo mês ou treine com o Wellington no presencial ou na consultoria.", msg:"Oi, Wellington! Terminei os 30 dias da Mente Ativa e quero continuar." }
};
function calcSequencia(prog){
  const dias = {}; prog.forEach(p=>{ dias[hojeISO(p.concluido_em)] = true; });
  const hoje = hojeISO(); let cur = dias[hoje] ? hoje : maisDias(hoje,-1); let n = 0;
  while(dias[cur]){ n++; cur = maisDias(cur,-1); }
  return n;
}
function Inicio({ j, prof, calendario, prog, onComecar, onPix, aulaNomes }){
  const [dica,setDica] = useState(!lsGet("ma-dica-instalar"));
  const ultimo = prog.reduce((m,p)=>Math.max(m,p.dia),0);
  const total = j.total_dias || 30;
  const terminou = ultimo>=total;
  const proximo = Math.min(total, ultimo+1);
  const feitoHoje = prog.some(p=>hojeISO(p.concluido_em)===hojeISO());
  const info = calendario.find(d=>d.dia===proximo);
  const seq = calcSequencia(prog);
  const pendente = j.pagamento_status==="aguardando" || j.pagamento_status==="vencido";
  const vencido = pendente && j.pagamento_prazo && hojeISO() > j.pagamento_prazo;
  const marcoOferta = [30,20,7].find(d=>ultimo>=d);
  const oferta = marcoOferta ? OFERTAS[marcoOferta] : null;
  const pers = primeiro(prof && prof.nome) || "Wellington";
  const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const instalado = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
  return (
    <div style={{minHeight:"100vh",background:C.fundo,paddingBottom:34}}>
      <div style={{background:C.escuro,color:"#F8FAFC",padding:"18px 16px 20px",borderRadius:"0 0 26px 26px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
          <div><div style={{fontSize:14,color:C.cinzaClaro}}>Olá,</div><div style={{fontSize:25,fontWeight:800}}>{primeiro(j.nome) || "aluno"}</div></div>
          <span style={{fontSize:12,padding:"7px 11px",borderRadius:999,background:C.escuro2,color:"#CBD5E1",textAlign:"right"}}>Meu plano<br/><b style={{color:"#FDBA74"}}>Mente Ativa 30 dias</b></span>
        </div>
        <div style={{background:C.escuro2,borderRadius:20,padding:16,marginTop:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
            <span style={{fontSize:30,fontWeight:800}}>{terminou ? "Jornada concluída" : "Dia "+proximo}<span style={{fontSize:16,color:C.cinzaClaro,fontWeight:400}}>{terminou ? "" : " de "+total}</span></span>
            <span style={{fontSize:13.5,color:"#FDBA74"}}>{seq>0 ? "Sequência: "+seq+(seq===1?" dia":" dias") : ""}</span>
          </div>
          <div style={{height:10,borderRadius:5,background:"#2A3854",margin:"12px 0"}}><div style={{height:10,borderRadius:5,background:C.laranja,width:Math.round((ultimo/total)*100)+"%"}}/></div>
          {!terminou && info && <div style={{fontSize:15,color:"#CBD5E1",marginBottom:14}}>{"Semana "+info.semana+(info.treino==="L"?" · dia leve":"")+(aulaNomes[info.aula_id] ? " · "+aulaNomes[info.aula_id] : "")+(info.teste?" · dia de teste":"")}</div>}
          {terminou ? <div style={{fontSize:15,color:"#CBD5E1",lineHeight:1.5}}>Parabéns! Você completou os 30 dias. Veja abaixo como continuar.</div> :
            feitoHoje ? <div style={{background:"#13332A",borderRadius:14,padding:12,fontSize:15,color:"#BBF7D0",lineHeight:1.45}}>{"Dia "+ultimo+" concluído hoje. Volte amanhã para o dia "+proximo+"."}</div> :
            <Botao onClick={()=>onComecar(proximo)}>{"Começar o dia "+proximo}</Botao>}
        </div>
      </div>
      {pendente && <Cartao style={{marginTop:14,background:vencido?C.vermelhoClaro:"#fff"}}>
        <div style={{fontSize:15.5,lineHeight:1.5,fontWeight:700,color:vencido?C.vermelho:C.escuro}}>{j.aluno_marcou_pago ? "Você avisou que pagou. O "+pers+" vai confirmar em breve." : vencido ? "O prazo do pagamento venceu. Pague agora para não perder o acesso." : "Seu acesso está liberado. Pague até "+fmtData(j.pagamento_prazo)+" para manter."}</div>
        {!j.aluno_marcou_pago && <div style={{marginTop:12}}><Botao onClick={onPix} tipo={vencido?undefined:"escuro"}>Pagar com Pix</Botao></div>}
      </Cartao>}
      <Secao>Mente Ativa</Secao>
      <a href={JOGOS_URL} style={{display:"flex",gap:14,alignItems:"center",margin:"0 16px",background:"#fff",borderRadius:18,padding:14,boxShadow:"0 1px 3px rgba(15,23,42,0.07)",textDecoration:"none",color:C.escuro}}>
        <span aria-hidden="true" style={{width:52,height:52,borderRadius:16,background:"linear-gradient(145deg,#FFB37A,#FF5603)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,flexShrink:0,boxShadow:"0 6px 14px rgba(255,86,3,0.3), inset 0 2px 0 rgba(255,255,255,0.5)"}}>🧠</span>
        <span style={{flex:1}}><span style={{display:"block",fontSize:17,fontWeight:800}}>Todos os jogos</span><span style={{display:"block",fontSize:13.5,color:C.cinza}}>Memória, atenção e linguagem</span></span>
        <span style={{width:40,height:40,borderRadius:"50%",background:C.laranjaClaro,display:"flex",alignItems:"center",justifyContent:"center"}}><IcoPlay cor={C.laranja}/></span>
      </a>
      {oferta && <div>
        <Secao>Para você</Secao>
        <Cartao>
          <div style={{fontSize:18,fontWeight:800}}>{oferta.titulo}</div>
          <div style={{fontSize:14.5,color:C.cinza,lineHeight:1.5,margin:"6px 0 12px"}}>{oferta.texto}</div>
          {waLink(prof && prof.whatsapp, oferta.msg) && <BotaoLink href={waLink(prof && prof.whatsapp, oferta.msg)}>{"Falar com o "+pers}</BotaoLink>}
        </Cartao>
      </div>}
      {dica && !instalado && <div>
        <Secao>Dica</Secao>
        <Cartao>
          <div style={{fontSize:17,fontWeight:800}}>Coloque o app na tela do celular</div>
          <div style={{fontSize:15,color:"#334155",lineHeight:1.55,marginTop:6}}>{ehIOS ? "No Safari, toque no botão Compartilhar (o quadrado com a seta para cima) e depois em Adicionar à Tela de Início." : "No Chrome, toque nos três pontinhos no canto de cima e depois em Adicionar à tela inicial ou Instalar app."}</div>
          <button type="button" onClick={()=>{ lsSet("ma-dica-instalar","1"); setDica(false); }} style={{marginTop:10,border:"none",background:"none",color:C.laranjaTxt,fontWeight:700,fontSize:15,cursor:"pointer",padding:0}}>Entendi</button>
        </Cartao>
      </div>}
      <div style={{textAlign:"center",marginTop:22}}><button type="button" onClick={()=>supa.auth.signOut()} style={{border:"none",background:"none",color:C.cinza,fontSize:14,textDecoration:"underline",cursor:"pointer"}}>Sair da conta</button></div>
    </div>
  );
}

// ═══════════════ JORNADA (estado principal) ═══════════════
function Jornada({ j, recarregar }){
  const [base,setBase] = useState(null);
  const [tela,setTela] = useState(null);
  const [diaAberto,setDiaAberto] = useState(null);
  const [aula,setAula] = useState(null);
  const [exs,setExs] = useState({});
  const [feitos,setFeitos] = useState({});
  const [extraAberto,setExtraAberto] = useState(null);
  const [concluindo,setConcluindo] = useState(false);
  const [aviso,setAviso] = useState("");
  const carregar = async () => {
    const [cal, prog, tes, p, aulas] = await Promise.all([
      api.get("ma_jornada_dias?select=dia,semana,treino,teste,oferta,aula_id&modelo_id=eq."+MODELO+"&order=dia"),
      api.get("ma_jornada_progresso?select=dia,concluido_em&matricula_id=eq."+j.matricula_id+"&order=dia"),
      api.get("ma_jornada_testes?select=*&matricula_id=eq."+j.matricula_id),
      api.rpc("get_professional_pix_config", { prof_id:j.owner_id }),
      api.get("ma_jornada_aulas?select=id,data->>nome&modelo_id=eq."+MODELO)
    ]);
    const nomes = {}; (aulas||[]).forEach(a=>{ nomes[a.id] = a.nome; });
    setBase({ cal:cal||[], prog:prog||[], tes:tes||[], prof:Array.isArray(p) ? (p[0]||null) : p, nomes });
  };
  useEffect(()=>{ carregar(); },[]);
  useEffect(()=>{ if(tela===null && j.pagamento_status==="aguardando" && !j.aluno_marcou_pago && !lsGet("ma-pix-visto-"+j.matricula_id)) setTela("pix"); else if(tela===null) setTela("inicio"); },[]);
  useEffect(()=>{ window.scrollTo(0,0); },[tela]);
  const reabriu = useRef(false);
  useEffect(()=>{ if(!base || reabriu.current) return; reabriu.current = true; const d = ssGet("ma-dia-aberto-"+j.matricula_id); if(d && j.status!=="bloqueado" && !base.prog.some(p=>p.dia===d)) abrirDia(d); },[base]);
  if(!base || !tela) return <Carregando/>;
  if(j.status==="bloqueado") return <Bloqueado j={j} prof={base.prof}/>;

  const abrirDia = async (dia) => {
    const info = base.cal.find(d=>d.dia===dia);
    if(!info || !info.aula_id){ setAviso("Não encontramos a aula deste dia."); return; }
    ssSet("ma-dia-aberto-"+j.matricula_id, dia);
    setDiaAberto(info); setAula(null); setFeitos(ssGet("ma-dia-"+j.matricula_id+"-"+dia) || {}); setTela("dia");
    const r = await api.get("ma_jornada_aulas?select=data&id=eq."+encodeURIComponent(info.aula_id));
    const a = r && r[0] ? r[0].data : null;
    if(!a){ setAviso("Não foi possível carregar a aula. Verifique sua internet."); setTela("inicio"); return; }
    const ids = []; (a.estacoes||[]).concat(a.extras||[]).forEach(e=>{ if(e.exercicioId && String(e.exercicioId).indexOf("app:")!==0 && ids.indexOf(e.exercicioId)<0) ids.push(e.exercicioId); });
    if(ids.length){ const lista = await api.get("exercises?select=id,nome,foto,video,execucao&id=in.("+ids.map(encodeURIComponent).join(",")+")"); const m = {}; (lista||[]).forEach(x=>{ m[x.id] = x; }); setExs(m); }
    setAula(a);
  };
  const marcarFeito = (id) => { const n = Object.assign({}, feitos); n[id] = true; setFeitos(n); ssSet("ma-dia-"+j.matricula_id+"-"+diaAberto.dia, n); };
  const salvarJogo = (jogo, pontos, data) => { api.post("ma_jornada_jogos", { matricula_id:j.matricula_id, jogo:jogo, pontos:pontos, data:data }); };
  const concluir = async () => {
    setConcluindo(true);
    const ok = await api.post("ma_jornada_progresso?on_conflict=matricula_id,dia", { matricula_id:j.matricula_id, dia:diaAberto.dia }, "resolution=ignore-duplicates,return=minimal");
    setConcluindo(false);
    if(!ok){ setAviso("Não foi possível salvar. Verifique sua internet e tente de novo."); return; }
    ssSet("ma-dia-aberto-"+j.matricula_id, null);
    setAviso("Dia "+diaAberto.dia+" concluído. Parabéns!");
    setTela("inicio"); await carregar(); recarregar(true);
  };
  const abrirPasso = (p) => {
    if(p.id==="teste"){ setTela("teste"); return; }
    if(p.id==="aula"){ setTela("player"); return; }
    if(p.extra && p.extra.tipo==="desafio"){ marcarFeito(p.id); window.location.href = JOGOS_URL; return; }
    setExtraAberto(p); setTela("extra");
  };

  let conteudo = null;
  if(tela==="pix") conteudo = <TelaPix j={j} prof={base.prof} onVoltar={()=>{ lsSet("ma-pix-visto-"+j.matricula_id,"1"); setTela("inicio"); }} onMarcado={()=>recarregar(true)}/>;
  else if(tela==="dia") conteudo = <TelaDia j={j} info={diaAberto} aula={aula} exs={exs} testes={base.tes} feitos={feitos} marcarFeito={marcarFeito} onVoltar={()=>{ ssSet("ma-dia-aberto-"+j.matricula_id, null); setTela("inicio"); }} onAbrir={abrirPasso} onConcluir={concluir} concluindo={concluindo}/>;
  else if(tela==="player" && aula) conteudo = <Player aula={aula} exs={exs} salvarJogo={salvarJogo} onSair={()=>setTela("dia")} onFim={()=>{ marcarFeito("aula"); setTela("dia"); }}/>;
  else if(tela==="extra" && extraAberto) conteudo = <Extra item={extraAberto.extra} exs={exs} salvarJogo={salvarJogo} onVoltar={()=>setTela("dia")} onFeito={()=>{ marcarFeito(extraAberto.id); setTela("dia"); }}/>;
  else if(tela==="teste") conteudo = <TelaTeste dia={diaAberto.dia} j={j} testes={base.tes} onVoltar={()=>setTela("dia")} onSalvo={()=>carregar()}/>;
  else conteudo = <Inicio j={j} prof={base.prof} calendario={base.cal} prog={base.prog} aulaNomes={base.nomes} onComecar={abrirDia} onPix={()=>setTela("pix")}/>;
  return (
    <div>
      {conteudo}
      {aviso && <div role="status" onClick={()=>setAviso("")} style={{position:"fixed",left:16,right:16,bottom:22,zIndex:50,maxWidth:448,margin:"0 auto",background:C.escuro,color:"#fff",borderRadius:16,padding:"14px 16px",fontSize:15,textAlign:"center",boxShadow:"0 10px 24px rgba(15,23,42,0.35)"}}>{aviso}</div>}
      <AvisoTimer aviso={aviso} limpar={()=>setAviso("")}/>
    </div>
  );
}
function AvisoTimer({ aviso, limpar }){ useEffect(()=>{ if(!aviso) return; const t = setTimeout(limpar, 3200); return ()=>clearTimeout(t); },[aviso]); return null; }

// ═══════════════ APP ═══════════════
function App(){
  const [sessao,setSessao] = useState(null);
  const [carregandoAuth,setCarregandoAuth] = useState(true);
  const [recuperar,setRecuperar] = useState(false);
  const [j,setJ] = useState(undefined);
  useEffect(()=>{
    supa.auth.getSession().then(({ data })=>{ setSessao((data && data.session) || null); setCarregandoAuth(false); });
    const { data: l } = supa.auth.onAuthStateChange((ev, s)=>{ setSessao(s); if(ev==="PASSWORD_RECOVERY") setRecuperar(true); });
    return ()=>{ if(l && l.subscription) l.subscription.unsubscribe(); };
  },[]);
  const carregar = async (silencioso) => {
    if(!silencioso) setJ(undefined);
    let r = await api.rpc("ma_minha_jornada", {});
    if(!r || !r.matricula_id){
      const meta = (sessao && sessao.user && sessao.user.user_metadata) || {};
      let salvo = {}; try { salvo = JSON.parse(lsGet("ma-cadastro")||"{}"); } catch(e){}
      await api.rpc("ma_entrar_jornada", { p_nome: meta.nome || salvo.nome || "", p_whatsapp: meta.whatsapp || salvo.whatsapp || "" });
      r = await api.rpc("ma_minha_jornada", {});
    }
    setJ(r && r.matricula_id ? r : false);
  };
  const uid = sessao && sessao.user ? sessao.user.id : null;
  useEffect(()=>{ if(uid) carregar(); else setJ(undefined); },[uid]);
  if(carregandoAuth) return <Carregando/>;
  if(recuperar) return <NovaSenha onFeito={()=>setRecuperar(false)}/>;
  if(!sessao) return <Entrada/>;
  if(j===undefined) return <Carregando/>;
  if(j===false) return (
    <div style={{minHeight:"100vh",background:C.fundo}}>
      <Topo titulo="Não foi possível abrir a jornada" sub="Verifique sua internet e tente de novo. Se continuar, fale com o Wellington."/>
      <div style={{padding:16}}><Botao onClick={()=>carregar()}>Tentar de novo</Botao><div style={{height:10}}/><Botao tipo="sec" onClick={()=>supa.auth.signOut()}>Sair</Botao></div>
    </div>
  );
  if(!j.parq) return <ParQ onFeito={()=>carregar(true)}/>;
  return <Jornada key={j.matricula_id} j={j} recarregar={carregar}/>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
