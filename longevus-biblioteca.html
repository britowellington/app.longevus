{"id":"ca01","nome":"Caminhada Rápida","grupo":"Cardio","nivel":"Básico","momento":"Parte Principal","foco":"Resistência Cardiovascular e Marcha Acelerada","descricao":"Caminhada em ritmo acelerado. Aumenta a frequência cardíaca de forma progressiva e segura.","execucao":"1. Iniciar com caminhada normal por 2–3 min (aquecimento).\n2. Aumentar progressivamente o ritmo.\n3. Manter a velocidade elevada por 5–10 min.\n4. Reduzir progressivamente para desaquecimento.","beneficios":"Melhora condicionamento cardiovascular. Aumenta metabolismo. Transferência direta para atividade diária.","cuidados":"Monitorar FC. PA monitorada antes e depois para hipertensos. Superfície segura.","material":"Corredor livre ou ao ar livre.","obs":"Meta: 3–5 sessões por semana de 20–30 min para condicionamento cardiovascular.","defaultSeries":"1","defaultReps":"10–20 min","defaultDescanso":"—","tags":"cardio,marcha,resistência,aeróbico","foto":""},
{"id":"ca02","nome":"Marcha Estacionária","grupo":"Cardio","nivel":"Básico","momento":"Parte Principal","foco":"Cardio e Padrão de Marcha","descricao":"Caminhada no lugar com variações de ritmo e elevação. Seguro para ambientes pequenos.","execucao":"1. Em pé com apoio leve disponível.\n2. Marche no lugar elevando os joelhos alternadamente.\n3. Variações: ritmo lento, moderado, rápido.\n4. Coordene o movimento dos braços.\n5. 3–5 minutos contínuos.","beneficios":"Cardio seguro em espaço reduzido. Ativa todos os grupos musculares da marcha.","cuidados":"Apoio disponível. Ritmo confortável.","material":"Cadeira ou parede para apoio.","obs":"","defaultSeries":"1","defaultReps":"3–5 min","defaultDescanso":"60s","tags":"cardio,marcha,aeróbico,espaço reduzido","foto":""},
{"id":"ca03","nome":"Step Contínuo","grupo":"Cardio","nivel":"Básico","momento":"Parte Principal","foco":"Cardio e MMII","descricao":"Subir e descer um step de forma contínua e rítmica. Combina cardio com fortalecimento de MMII.","execucao":"1. Step firme de 10–15cm com apoio lateral disponível.\n2. Suba com o pé direito, depois o esquerdo (no step).\n3. Desça com o pé direito, depois o esquerdo (no chão).\n4. Ritmo constante por 2–3 minutos.\n5. Trocar o pé líder a cada 20–30 repetições.","beneficios":"Combina cardio com fortalecimento de MMII. Simula subir escadas.","cuidados":"Apoio lateral sempre disponível. Controlar a descida. Superfície antiderrapante.","material":"Step ou degrau firme. Apoio lateral.","obs":"","defaultSeries":"3","defaultReps":"2–3 min","defaultDescanso":"60s","tags":"cardio,step,mmii,aeróbico","foto":""},
{"id":"ca04","nome":"Step Alternado","grupo":"Cardio","nivel":"Básico","momento":"Parte Principal","foco":"Cardio, Coordenação e MMII","descricao":"Step com alternância de pés e variações de padrão. Adiciona coordenação ao componente cardio.","execucao":"1. Step firme com apoio disponível.\n2. Suba e desça alternando o pé líder (direita, esquerda, direita...).\n3. Variação: toque o step com o pé em vez de subir completamente.\n4. 2–3 minutos.","beneficios":"Combina cardio, coordenação e fortalecimento. Maior demanda cognitiva que o step contínuo.","cuidados":"Apoio disponível. Padrão de movimento claro antes de aumentar o ritmo.","material":"Step ou degrau firme. Apoio lateral.","obs":"","defaultSeries":"3","defaultReps":"2–3 min","defaultDescanso":"60s","tags":"cardio,step,coordenação,mmii,aeróbico","foto":""},
{"id":"ca05","nome":"Bicicleta Ergométrica","grupo":"Cardio","nivel":"Básico","momento":"Parte Principal","foco":"Cardio Sem Impacto","descricao":"Exercício aeróbico sem impacto nas articulações. Ideal para alunos com dor no joelho, quadril ou tornozelo.","execucao":"1. Ajustar o banco (joelho levemente dobrado na extensão máxima).\n2. Iniciar em ritmo leve por 2–3 min (aquecimento).\n3. Manter ritmo moderado por 10–20 min.\n4. Reduzir progressivamente.","beneficios":"Cardio sem impacto. Ideal para artrose de joelho e quadril. Fácil controle de intensidade.","cuidados":"Ajuste adequado do banco para evitar hiperextensão do joelho. Monitorar FC.","material":"Bicicleta ergométrica.","obs":"Excelente para alunos com comprometimento articular nos MMII.","defaultSeries":"1","defaultReps":"10–20 min","defaultDescanso":"—","tags":"cardio,bicicleta,sem impacto,aeróbico,joelho","foto":""},
{"id":"ca06","nome":"Boxe Sem Impacto","grupo":"Cardio","nivel":"Básico","momento":"Parte Principal","foco":"Cardio, Coordenação e MMSS","descricao":"Movimentos de boxe no ar sem impacto. Combina cardio com coordenação e fortalecimento leve de membros superiores.","execucao":"1. Em pé com base estável (pés afastados).\n2. Socos para frente alternados (jab): 20 repetições.\n3. Socos laterais (cross): 20 repetições.\n4. Ganchos (hook): 20 repetições.\n5. Combinações ao ritmo. 2–3 rounds de 1 minuto.","beneficios":"Cardio divertido e motivador. Melhora coordenação e ritmo. Fortalece MMSS levemente.","cuidados":"Apoio disponível se necessário. Não travar os cotovelos. Amplitude de movimento confortável.","material":"Espaço livre.","obs":"Pode ser sentado para alunos com restrição de equilíbrio.","defaultSeries":"3","defaultReps":"1 min","defaultDescanso":"30s","tags":"cardio,boxe,coordenação,mmss,funcional","foto":""},
{"id":"ca07","nome":"Polichinelo Adaptado","grupo":"Cardio","nivel":"Básico","momento":"Parte Principal","foco":"Cardio e Coordenação","descricao":"Versão adaptada do polichinelo sem impacto ou com impacto reduzido. Combina cardio com coordenação braço-perna.","execucao":"1. Versão sem impacto: abrir e fechar as pernas alternadamente (uma de cada vez), braços coordenados acima.\n2. Versão sentado: abrir e fechar os joelhos coordenando com os braços.\n3. Versão em pé: passo lateral com os braços.\n4. 2–3 minutos.","beneficios":"Cardio acessível. Melhora coordenação braço-perna. Pode ser adaptado para todos os níveis.","cuidados":"Escolher a variação adequada ao nível. Apoio disponível.","material":"Cadeira (versão sentada) ou espaço livre.","obs":"","defaultSeries":"3","defaultReps":"1 min","defaultDescanso":"30s","tags":"cardio,polichinelo,coordenação,adaptado","foto":""},
{"id":"ca08","nome":"Circuito Cardiovascular Funcional","grupo":"Cardio","nivel":"Intermediário","momento":"Parte Principal","foco":"Cardio Integrado com Padrões Funcionais","descricao":"Circuito combinando exercícios funcionais em sequência para manter a FC elevada.","execucao":"1. Estação 1: Marcha estacionária (30s).\n2. Estação 2: Sentar e levantar rápido (30s).\n3. Estação 3: Step contínuo (30s).\n4. Estação 4: Boxe no ar (30s).\n5. Descanso 30s. Repetir 2–3 vezes.","beneficios":"Combina cardio com força funcional. Mantém a motivação elevada. Alta transferência para a vida diária.","cuidados":"Monitorar FC e PA. Pausas entre estações se necessário. Adaptar intensidade.","material":"Step, cadeira, espaço livre.","obs":"Adaptar as estações ao nível e condição de cada aluno.","defaultSeries":"3","defaultReps":"circuito 4 estações","defaultDescanso":"30s entre estações","tags":"cardio,circuito,funcional,intermediário","foto":""},
{"id":"ca09","nome":"Escalador Adaptado","grupo":"Cardio","nivel":"Intermediário","momento":"Parte Principal","foco":"Cardio e Core","descricao":"Versão adaptada do mountain climber, em pé e com apoio, sem impacto no chão. Eleva a frequência cardíaca com segurança para o público 50+.","execucao":"1. Em pé, apoio nas costas da cadeira ou na parede.\n2. Leve um joelho em direção ao peito, alternando as pernas em ritmo de marcha acelerada.\n3. Mantenha o tronco estável e o core ativado.\n4. Ajuste o ritmo conforme a condição física do aluno.","beneficios":"Eleva a frequência cardíaca sem impacto articular. Ativa core e coordenação. Boa opção de cardio de baixo impacto.","cuidados":"Apoio sempre disponível. Ritmo adaptado, sem pressa. Contraindicado em instabilidade de equilíbrio sem apoio.","material":"Cadeira ou parede para apoio.","obs":"Versão sem impacto do escalador tradicional, adaptada para prevenção de quedas.","defaultSeries":"3","defaultReps":"20–30s","defaultDescanso":"30–45s","tags":"cardio,funcional,baixo impacto,core","foto":"","video":"https://youtu.be/5cKex71oSuA"},
{"id":"ca10","nome":"Burpee Adaptado","grupo":"Cardio","nivel":"Intermediário","momento":"Parte Principal","foco":"Cardio e Corpo Todo","descricao":"Versão adaptada do burpee sem salto e sem apoio no chão, usando a cadeira como referência. Trabalho cardiovascular de corpo inteiro com segurança.","execucao":"1. Em pé, cadeira firme à frente.\n2. Incline o tronco e apoie as mãos na cadeira, dando um passo para trás com uma perna e depois a outra, como uma prancha inclinada.\n3. Retorne os pés um de cada vez.\n4. Levante-se e finalize com os braços para cima, sem saltar.","beneficios":"Trabalho cardiovascular de corpo inteiro sem impacto no solo e sem risco de queda. Melhora resistência funcional.","cuidados":"Cadeira sempre firme e estável. Sem salto. Adaptar ritmo à capacidade cardiovascular do aluno.","material":"Cadeira firme.","obs":"Adaptação sem apoio no chão e sem salto, indicada para o público 50+.","defaultSeries":"3","defaultReps":"6–8","defaultDescanso":"45–60s","tags":"cardio,funcional,corpo todo,adaptado","foto":"","video":"https://youtu.be/bLiwWx1UVsY"},
{"id":"ca11","nome":"Marcha Estacionária com Bastão","grupo":"Cardio","nivel":"Básico","momento":"Parte Principal","foco":"Cardio e Padrão de Marcha com Apoio","descricao":"Variação da marcha estacionária usando um bastão como apoio e referência de ritmo. Indicada para alunos com maior insegurança no equilíbrio.","execucao":"1. Em pé, segurando o bastão verticalmente à frente com uma ou duas mãos.\n2. Marche no lugar elevando os joelhos alternadamente.\n3. Use o bastão como apoio de segurança e para marcar o ritmo.\n4. 3–5 minutos contínuos, ajustando a velocidade.","beneficios":"Cardio seguro com apoio extra de equilíbrio. Boa opção para alunos com maior insegurança postural ou histórico de quedas.","cuidados":"Bastão com ponta de borracha antiderrapante. Ritmo confortável, priorizando segurança sobre velocidade.","material":"Bastão ou cabo de vassoura.","obs":"Indicada como regressão da Marcha Estacionária (ca02) para alunos com equilíbrio mais comprometido.","defaultSeries":"1","defaultReps":"3–5 min","defaultDescanso":"60s","tags":"cardio,marcha,bastão,equilíbrio,quedas","foto":"","video":"https://youtu.be/sJEi8mWnM3Y"},
{"id":"pr76","nome":"Passada para Trás","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Quadríceps, Glúteos e Equilíbrio Dinâmico","descricao":"Afundo com passo posterior. Trabalha força unilateral e equilíbrio dinâmico, essencial para prevenir quedas ao caminhar para trás.","execucao":"1. Em pé, pés na largura do quadril.\n2. Dê um passo para trás com uma perna, flexionando ambos os joelhos.\n3. Toque levemente o joelho de trás próximo ao chão, sem apoiar.\n4. Empurre o chão com a perna da frente para retornar à posição inicial.\n5. Alterne os lados.","beneficios":"Fortalece quadríceps e glúteos de forma unilateral. Melhora equilíbrio dinâmico e controle do movimento para trás, comum em situações de queda.","cuidados":"Apoio disponível se necessário. Joelho da frente alinhado com o pé. Movimento controlado, sem impacto.","material":"Nenhum ou cadeira para apoio.","obs":"Pode ser progressão do Afundo Tradicional (pr09).","defaultSeries":"3","defaultReps":"8–10 cada lado","defaultDescanso":"45s","tags":"mmii,unilateral,equilíbrio,quedas,funcional","foto":"","video":"https://youtu.be/nB7Tm3ghNSk"},
{"id":"pr77","nome":"Extensão de Quadril","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Glúteos e Estabilidade de Quadril","descricao":"Extensão de quadril em pé, apoiado na cadeira. Fortalece glúteos e a musculatura posterior, importante para a marcha e para subir escadas.","execucao":"1. Em pé, apoio nas costas da cadeira.\n2. Mantenha o tronco estável e a perna de apoio levemente flexionada.\n3. Estenda a outra perna para trás, contraindo o glúteo, sem inclinar o tronco.\n4. Retorne com controle.\n5. Complete as repetições e alterne o lado.","beneficios":"Fortalece glúteos, essenciais para propulsão na marcha e subida de escadas. Melhora estabilidade de quadril.","cuidados":"Evitar compensar com a lombar. Movimento pequeno e controlado, sem balançar o tronco.","material":"Cadeira para apoio.","obs":"Pode usar caneleira como progressão.","defaultSeries":"3","defaultReps":"10–12 cada lado","defaultDescanso":"45s","tags":"mmii,glúteos,quadril,marcha,estabilidade","foto":"","video":"https://youtu.be/bAC4Gg_8_Ds"},
{"id":"pr78","nome":"Flexão de Joelhos em Pé","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Isquiotibiais","descricao":"Flexão de joelho em pé, levando o calcanhar em direção ao glúteo. Fortalece isquiotibiais, equilibrando o trabalho do quadríceps.","execucao":"1. Em pé, apoio nas costas da cadeira.\n2. Flexione o joelho levando o calcanhar em direção ao glúteo.\n3. Mantenha a coxa alinhada ao corpo, sem levar o joelho para frente.\n4. Retorne com controle e alterne o lado.","beneficios":"Fortalece isquiotibiais, protegendo o joelho e equilibrando a musculatura da coxa.","cuidados":"Manter o quadril estável, sem inclinar o tronco. Movimento controlado.","material":"Cadeira para apoio.","obs":"Pode usar caneleira como progressão. Complementa exercícios de quadríceps.","defaultSeries":"3","defaultReps":"10–12 cada lado","defaultDescanso":"45s","tags":"mmii,isquiotibiais,equilíbrio muscular","foto":"","video":"https://youtu.be/pGYLYeLWVDE"},

{"id":"co01","nome":"Escada de Agilidade","grupo":"Coordenação","nivel":"Intermediário","momento":"Parte Principal","foco":"Coordenação de Pés, Agilidade e Padrão Motor","descricao":"Padrões de passadas em escada de agilidade no chão. Melhora a coordenação de pés e a velocidade de movimento.","execucao":"1. Escada de agilidade no chão (ou faixas simulando).\n2. Padrão básico: dois pés em cada quadrado, avançando.\n3. Padrão lateral: entrar e sair lateralmente.\n4. Padrão cruzado: cruzar os pés alternadamente.\n5. Iniciar lento, progredir em velocidade.","beneficios":"Melhora coordenação de pés. Aumenta velocidade de reação. Treina padrões de marcha seguros.","cuidados":"Superfície antiderrapante. Iniciar lento. Apoio disponível. Não usar se instabilidade severa.","material":"Escada de agilidade ou faixas no chão.","obs":"Adaptar o padrão ao nível. Versão básica: apenas entrar e sair com um pé de cada vez.","defaultSeries":"3","defaultReps":"percurso completo","defaultDescanso":"45s","tags":"coordenação,agilidade,pés,marcha,padrão motor","foto":""},
{"id":"co02","nome":"Toque Alternado em Cones","grupo":"Coordenação","nivel":"Básico","momento":"Parte Principal","foco":"Coordenação, Reação e Deslocamento","descricao":"Tocar alternadamente cones posicionados em diferentes posições. Treina reação e deslocamento direcional.","execucao":"1. Posicione 3–5 cones a diferentes distâncias e direções.\n2. O professor aponta um cone, o aluno se desloca e toca.\n3. Retorna ao centro e aguarda o próximo comando.\n4. Progressão: aumentar distância, velocidade e número de cones.","beneficios":"Treina reação, deslocamento e coordenação direcional. Combina cognitivo e motor.","cuidados":"Superfície segura. Começar com distâncias curtas. Apoio disponível.","material":"Cones ou objetos no chão.","obs":"","defaultSeries":"3","defaultReps":"1–2 min","defaultDescanso":"30s","tags":"coordenação,reação,deslocamento,cones,cognitivo","foto":""},
{"id":"co03","nome":"Sequência de Cores","grupo":"Coordenação","nivel":"Básico","momento":"Parte Inicial","foco":"Coordenação Cognitivo-Motora e Associação","descricao":"Associar cores a movimentos específicos. Treina a velocidade de processamento e a coordenação cognitivo-motora.","execucao":"1. Definir 3–4 cores, cada uma com um movimento (ex: vermelho = bater palmas, azul = elevar joelho).\n2. O professor mostra a cor, o aluno executa o movimento.\n3. Progressão: aumentar o número de cores e a velocidade de apresentação.","beneficios":"Treina velocidade de processamento. Melhora associação cognitivo-motora. Excelente para cognição.","cuidados":"Começar com 2 cores apenas. Progressão gradual.","material":"Cartões coloridos ou objetos.","obs":"Ótimo para parte inicial da sessão — ativa o sistema cognitivo.","defaultSeries":"2","defaultReps":"2 min","defaultDescanso":"30s","tags":"coordenação,cognitivo,cores,associação,processamento","foto":""},
{"id":"co04","nome":"Coordenação Braço-Perna","grupo":"Coordenação","nivel":"Básico","momento":"Parte Principal","foco":"Coordenação Cruzada e Integração Hemisférica","descricao":"Movimentos de braços e pernas opostos e coordenados. Treina a integração hemisférica e a coordenação interlimbar.","execucao":"1. Em pé ou sentado.\n2. Eleve o joelho direito enquanto leva o braço esquerdo para cima (padrão cruzado).\n3. Alterne para joelho esquerdo e braço direito.\n4. Progressão: adicionar rotação de tronco.\n5. 3 séries de 10–15 repetições.","beneficios":"Treina coordenação cruzada. Melhora integração hemisférica. Pode ser feito sentado.","cuidados":"Iniciar lento para estabelecer o padrão antes de aumentar a velocidade.","material":"Cadeira ou espaço livre.","obs":"","defaultSeries":"3","defaultReps":"10–15 cada","defaultDescanso":"30s","tags":"coordenação,braço-perna,cruzado,integração hemisférica","foto":""},
{"id":"co05","nome":"Ritmo com Palmas","grupo":"Coordenação","nivel":"Básico","momento":"Parte Inicial","foco":"Ritmo, Coordenação e Atenção","descricao":"Reproduzir e criar sequências rítmicas com palmas. Treina atenção e coordenação auditivo-motora.","execucao":"1. O professor bate uma sequência rítmica (ex: 1-2, 1-2-3).\n2. O aluno repete.\n3. Progressão: sequências mais longas e complexas.\n4. Progressão 2: o aluno cria e o professor repete.\n5. 5–10 minutos.","beneficios":"Treina ritmo, atenção e memória de curto prazo. Divertido e motivador. Estimula coordenação auditivo-motora.","cuidados":"Progressão gradual. Adaptar a complexidade ao nível cognitivo.","material":"Sem equipamento.","obs":"Excelente para início de sessão ou como exercício cognitivo.","defaultSeries":"1","defaultReps":"5–10 min","defaultDescanso":"—","tags":"coordenação,ritmo,palmas,atenção,cognitivo","foto":""},
{"id":"co06","nome":"Transferência de Objetos","grupo":"Coordenação","nivel":"Básico","momento":"Parte Principal","foco":"Coordenação Fina, Preensão e Equilíbrio","descricao":"Transferir objetos de uma mão para outra, de um recipiente para outro, ou de forma coordenada durante o movimento.","execucao":"1. Versão básica: transferir bola de uma mão para outra em frente ao corpo.\n2. Versão em movimento: transferir durante a marcha.\n3. Versão desafio: transferir com os olhos fechados.\n4. Objetos de diferentes tamanhos e pesos.","beneficios":"Treina coordenação fina e preensão. Melhora atenção e concentração. Simula tarefas do cotidiano.","cuidados":"Objetos adequados — nem muito pequenos (risco de queda) nem muito pesados.","material":"Bolas, xícaras, recipientes de diferentes tamanhos.","obs":"","defaultSeries":"3","defaultReps":"1 min","defaultDescanso":"20s","tags":"coordenação,preensão,fina,cotidiano","foto":""},
{"id":"co07","nome":"Circuito Coordenativo","grupo":"Coordenação","nivel":"Intermediário","momento":"Parte Principal","foco":"Coordenação Integrada e Padrões Múltiplos","descricao":"Circuito com múltiplas estações de coordenação. Desafio motor e cognitivo integrado.","execucao":"1. Estação 1: Escada de agilidade (30s).\n2. Estação 2: Toque em cones (30s).\n3. Estação 3: Lançar e pegar bola (30s).\n4. Estação 4: Coordenação braço-perna (30s).\n5. Descanso 30s. 2–3 rounds.","beneficios":"Integra múltiplos padrões de coordenação. Alta transferência para atividade funcional.","cuidados":"Adaptar cada estação ao nível. Apoio disponível em todas as estações.","material":"Escada de agilidade, cones, bola.","obs":"","defaultSeries":"2","defaultReps":"4 estações × 30s","defaultDescanso":"30s entre estações","tags":"coordenação,circuito,integrado,cognitivo,motor","foto":""},

{"id":"cg01","nome":"Caminhar Contando Regressivamente","grupo":"Cognitivo","nivel":"Básico","momento":"Parte Inicial","foco":"Atenção Dividida e Marcha Segura","descricao":"Caminhar enquanto conta regressivamente a partir de um número. Tarefa dual clássica para prevenção de quedas.","execucao":"1. O aluno caminha normalmente.\n2. Simultaneamente conta regressivamente a partir de 20 (ou 50 para maior desafio).\n3. Progressão: contar de 3 em 3 regressivamente.\n4. Progressão 2: contar de 7 em 7.\n5. 3–5 minutos.","beneficios":"Treina atenção dividida. Melhora automação da marcha. Reduz risco de quedas em situações de atenção dividida.","cuidados":"Iniciar com contagem simples. Apoio disponível. Monitorar a qualidade da marcha.","material":"Corredor livre.","obs":"Correlaciona-se diretamente com risco de quedas — quanto mais difícil, maior o risco.","defaultSeries":"2","defaultReps":"3–5 min","defaultDescanso":"30s","tags":"cognitivo,tarefa dual,marcha,atenção,quedas","foto":""},
{"id":"cg02","nome":"Caminhar Nomeando Animais","grupo":"Cognitivo","nivel":"Básico","momento":"Parte Inicial","foco":"Fluência Verbal, Atenção e Marcha","descricao":"Caminhar enquanto nomeia animais (ou outros categorias). Treina fluência verbal e atenção dividida.","execucao":"1. O aluno caminha.\n2. Ao mesmo tempo, nomeia um animal diferente a cada passo ou a cada 2 passos.\n3. Variação: nomear frutas, países, palavras com determinada letra.\n4. 3–5 minutos.","beneficios":"Treina fluência verbal. Melhora atenção dividida. Estimula memória semântica.","cuidados":"Apoio disponível. Monitorar qualidade da marcha.","material":"Corredor livre.","obs":"","defaultSeries":"2","defaultReps":"3–5 min","defaultDescanso":"30s","tags":"cognitivo,tarefa dual,marcha,fluência verbal,memória","foto":""},
{"id":"cg03","nome":"Caminhar Nomeando Cidades","grupo":"Cognitivo","nivel":"Básico","momento":"Parte Inicial","foco":"Memória Semântica e Atenção Dividida","descricao":"Caminhar nomeando cidades ou outros itens de categorias diversas. Variação da tarefa dual de marcha.","execucao":"1. Caminhar normalmente.\n2. Nomear cidades em sequência alfabética (São Paulo, Salvador, Sorocaba...).\n3. Variação: nomear cidades começando com cada letra do alfabeto.\n4. 3–5 minutos.","beneficios":"Estimula memória semântica. Treina atenção dividida. Engajamento cognitivo durante a marcha.","cuidados":"Apoio disponível. Adaptar a categoria ao interesse do aluno.","material":"Corredor livre.","obs":"Personalizar as categorias pelo perfil do aluno aumenta o engajamento.","defaultSeries":"2","defaultReps":"3–5 min","defaultDescanso":"30s","tags":"cognitivo,tarefa dual,marcha,memória semântica","foto":""},
{"id":"cg04","nome":"Dupla Tarefa Motora","grupo":"Cognitivo","nivel":"Intermediário","momento":"Parte Principal","foco":"Coordenação Bimanual e Atenção Dividida","descricao":"Realizar duas tarefas motoras simultaneamente. Treina a atenção dividida e a automação de movimentos.","execucao":"1. Caminhar enquanto passa uma bola de uma mão para outra.\n2. Sentar e levantar enquanto conta em voz alta.\n3. Equilíbrio em uma perna enquanto realiza tarefa cognitiva.\n4. Progressão: aumentar complexidade de uma ou ambas as tarefas.","beneficios":"Treina atenção dividida. Promove automação de movimentos. Alta transferência para situações reais.","cuidados":"Supervisão. Apoio disponível. Começar com tarefas simples.","material":"Bola, cadeira.","obs":"","defaultSeries":"3","defaultReps":"1 min","defaultDescanso":"30s","tags":"cognitivo,tarefa dual,motor,atenção dividida","foto":""},
{"id":"cg05","nome":"Associação Cor-Movimento","grupo":"Cognitivo","nivel":"Básico","momento":"Parte Inicial","foco":"Velocidade de Processamento e Associação","descricao":"Cada cor é associada a um movimento específico. Treina velocidade de processamento e memória de trabalho.","execucao":"1. Definir 3–4 cores com movimentos (ex: vermelho = levantar braços, azul = agachar, amarelo = girar).\n2. Mostrar as cores aleatoriamente.\n3. O aluno executa o movimento correspondente.\n4. Progressão: aumentar velocidade de apresentação das cores.","beneficios":"Treina velocidade de processamento. Estimula memória de trabalho. Melhora tempo de reação.","cuidados":"Iniciar com 2 cores. Progressão gradual.","material":"Cartões coloridos ou bolas coloridas.","obs":"","defaultSeries":"2","defaultReps":"2–3 min","defaultDescanso":"30s","tags":"cognitivo,cores,processamento,memória de trabalho,reação","foto":""},
{"id":"cg06","nome":"Associação Número-Movimento","grupo":"Cognitivo","nivel":"Básico","momento":"Parte Inicial","foco":"Velocidade de Processamento e Memória de Trabalho","descricao":"Cada número é associado a um movimento. Variação da associação cor-movimento com maior demanda numérica.","execucao":"1. Definir 4–5 números com movimentos específicos.\n2. O professor fala um número, o aluno executa o movimento.\n3. Progressão: sequências de números (ex: 1-3-2-4).\n4. O aluno deve executar a sequência de movimentos.","beneficios":"Treina memória de trabalho e velocidade de processamento numérico.","cuidados":"Iniciar com 3 números apenas.","material":"Sem equipamento ou cartões.","obs":"","defaultSeries":"2","defaultReps":"2–3 min","defaultDescanso":"30s","tags":"cognitivo,números,processamento,memória de trabalho","foto":""},
{"id":"cg07","nome":"Exercício de Atenção Seletiva","grupo":"Cognitivo","nivel":"Básico","momento":"Parte Inicial","foco":"Atenção Seletiva e Inibição","descricao":"Reagir apenas a estímulos específicos e inibir resposta a outros. Treina atenção seletiva e controle inibitório.","execucao":"1. O professor fala palavras aleatoriamente.\n2. O aluno eleva os braços apenas quando ouvir uma palavra de uma categoria específica (ex: animais).\n3. Progressão: duas categorias com movimentos diferentes.","beneficios":"Treina atenção seletiva. Melhora controle inibitório. Exercita o filtro cognitivo.","cuidados":"Progressão gradual. Pausas se necessário.","material":"Sem equipamento.","obs":"","defaultSeries":"2","defaultReps":"2–3 min","defaultDescanso":"30s","tags":"cognitivo,atenção seletiva,inibição,processamento","foto":""},
{"id":"cg08","nome":"Exercício de Memória Imediata","grupo":"Cognitivo","nivel":"Básico","momento":"Parte Inicial","foco":"Memória de Curto Prazo e Evocação","descricao":"Memorizar uma sequência de itens e reproduzir. Treina a memória de curto prazo.","execucao":"1. O professor mostra ou fala 3–5 objetos/palavras/imagens.\n2. O aluno memoriza.\n3. Após 30s, o aluno reproduz a sequência.\n4. Progressão: aumentar o número de itens ou o intervalo de tempo.\n5. Variação motora: associar cada item a um movimento.","beneficios":"Treina memória de curto prazo. Estimula estratégias de memorização. Pode ser combinado com exercício físico.","cuidados":"Adaptar o número de itens ao nível cognitivo.","material":"Cartões, objetos ou verbal.","obs":"","defaultSeries":"2","defaultReps":"5–10 minutos","defaultDescanso":"30s","tags":"cognitivo,memória,curto prazo,evocação","foto":""},
{"id":"cg09","nome":"Exercício de Memória Operacional","grupo":"Cognitivo","nivel":"Intermediário","momento":"Parte Principal","foco":"Memória Operacional e Função Executiva","descricao":"Manipular informações na memória enquanto realiza outra tarefa. Alta demanda de função executiva.","execucao":"1. O professor fala uma série de números.\n2. O aluno deve repeti-los em ordem inversa.\n3. Progressão: repeti-los em ordem crescente independente da apresentação.\n4. Combinar com exercício físico (ex: enquanto caminha).","beneficios":"Treina memória operacional. Estimula função executiva. Alta demanda cognitiva.","cuidados":"Iniciar com 3 itens. Progressão muito gradual.","material":"Sem equipamento.","obs":"","defaultSeries":"2","defaultReps":"5 min","defaultDescanso":"30s","tags":"cognitivo,memória operacional,função executiva,avançado","foto":""},
{"id":"cg10","nome":"Resolução de Comandos","grupo":"Cognitivo","nivel":"Básico","momento":"Parte Inicial","foco":"Sequenciamento e Função Executiva","descricao":"Executar sequências de comandos em ordem. Treina o planejamento e o sequenciamento motor.","execucao":"1. O professor dá uma sequência de instruções (ex: 'toque o joelho direito, depois o ombro esquerdo, depois bata palmas').\n2. O aluno executa a sequência sem que o professor repita.\n3. Progressão: sequências mais longas.","beneficios":"Treina sequenciamento e planejamento motor. Estimula memória de trabalho e função executiva.","cuidados":"Adaptar o número de comandos ao nível.","material":"Sem equipamento.","obs":"","defaultSeries":"2","defaultReps":"5 min","defaultDescanso":"30s","tags":"cognitivo,sequenciamento,função executiva,motor","foto":""},
{"id":"cg11","nome":"Reação a Estímulos Visuais","grupo":"Cognitivo","nivel":"Básico","momento":"Parte Inicial","foco":"Tempo de Reação Visual e Coordenação","descricao":"Reagir rapidamente a estímulos visuais com movimento específico. Treina o tempo de reação visuomotor.","execucao":"1. O professor levanta um objeto (ou mostra um sinal).\n2. O aluno reage imediatamente com um movimento pré-definido.\n3. Progressão: diferentes objetos com diferentes movimentos.\n4. Medir o tempo de reação.","beneficios":"Melhora o tempo de reação visual. Alta transferência para situações de risco de queda.","cuidados":"Começar com um único estímulo.","material":"Objetos coloridos ou cartões.","obs":"","defaultSeries":"2","defaultReps":"2–3 min","defaultDescanso":"30s","tags":"cognitivo,reação,visual,visuomotor,tempo de reação","foto":""},
{"id":"cg12","nome":"Reação a Estímulos Auditivos","grupo":"Cognitivo","nivel":"Básico","momento":"Parte Inicial","foco":"Tempo de Reação Auditivo e Coordenação","descricao":"Reagir rapidamente a estímulos sonoros com movimento específico. Treina o tempo de reação audiomotor.","execucao":"1. Definir sons com movimentos (ex: palma = levantar, assobio = sentar).\n2. O professor emite o som aleatoriamente.\n3. O aluno reage com o movimento correspondente.\n4. Progressão: múltiplos sons com múltiplos movimentos.","beneficios":"Melhora tempo de reação auditivo. Treina atenção e vigilância. Combina bem com marcha.","cuidados":"Começar com um único estímulo e movimento.","material":"Instrumento musical simples, apito ou palmas.","obs":"","defaultSeries":"2","defaultReps":"2–3 min","defaultDescanso":"30s","tags":"cognitivo,reação,auditivo,audiomotor,atenção","foto":""},
{"id":"cg13","nome":"Circuito Cognitivo-Motor","grupo":"Cognitivo","nivel":"Intermediário","momento":"Parte Principal","foco":"Integração Cognitivo-Motora e Tarefa Dual","descricao":"Circuito integrando exercícios físicos com tarefas cognitivas em cada estação. Alta transferência funcional.","execucao":"1. Estação 1: Marcha + contar regressivamente (30s).\n2. Estação 2: Step + nomear animais (30s).\n3. Estação 3: Equilíbrio + resolver cálculo simples (30s).\n4. Estação 4: Lançar bola + responder perguntas (30s).\n5. 2–3 rounds.","beneficios":"Máxima integração cognitivo-motora. Alta demanda e alta transferência para vida real.","cuidados":"Supervisão. Adaptar as tarefas ao nível. Apoio disponível.","material":"Step, cadeira, bola.","obs":"","defaultSeries":"2","defaultReps":"4 estações × 30s","defaultDescanso":"30s entre estações","tags":"cognitivo,motor,circuito,tarefa dual,integrado","foto":""},
{"id":"cg14","nome":"Tomada de Decisão Motora","grupo":"Cognitivo","nivel":"Intermediário","momento":"Parte Principal","foco":"Tomada de Decisão e Velocidade de Processamento","descricao":"Situações em que o aluno deve decidir rapidamente qual movimento executar. Treina a tomada de decisão motora.","execucao":"1. O professor apresenta dois estímulos possíveis (cores, direções, palavras).\n2. Para cada estímulo, um movimento diferente.\n3. O aluno deve decidir e executar rapidamente.\n4. Progressão: mais opções, mais velocidade.","beneficios":"Treina tomada de decisão rápida. Melhora velocidade de processamento. Alta transferência para situações de risco.","cuidados":"Começar com 2 opções apenas.","material":"Cartões ou objetos.","obs":"","defaultSeries":"2","defaultReps":"3 min","defaultDescanso":"30s","tags":"cognitivo,tomada de decisão,processamento,velocidade","foto":""},
{"id":"cg15","nome":"Velocidade de Processamento","grupo":"Cognitivo","nivel":"Intermediário","momento":"Parte Inicial","foco":"Velocidade de Processamento e Agilidade Cognitiva","descricao":"Exercícios específicos para melhorar a velocidade de processamento de informações, fundamental para segurança e autonomia.","execucao":"1. Sequência de números ou letras mostrada rapidamente.\n2. O aluno identifica o que foi mostrado o mais rápido possível.\n3. Variação: encontrar a letra ou número diferente em uma sequência.\n4. Progressão: aumentar a velocidade de apresentação.","beneficios":"Melhora velocidade de processamento. Essencial para reações rápidas e tomada de decisão.","cuidados":"Progressão gradual. Não gerar frustração. Comparar com performance anterior do próprio aluno.","material":"Cartões com números ou letras. Tablet ou papel.","obs":"","defaultSeries":"2","defaultReps":"3–5 min","defaultDescanso":"30s","tags":"cognitivo,velocidade de processamento,agilidade cognitiva","foto":""},

{"id":"re01","nome":"Respiração Costal","grupo":"Respiração","nivel":"Básico","momento":"Parte Final","foco":"Expansão Costal e Mobilidade Torácica","descricao":"Respiração com ênfase na expansão das costelas para os lados. Melhora a capacidade respiratória e a mobilidade torácica.","execucao":"1. Sentado ou deitado.\n2. Coloque as mãos nas laterais do tórax.\n3. Inspire expandindo as costelas para os lados (sinta as mãos afastarem).\n4. Expire deixando as costelas se aproximarem.\n5. 10 respirações lentas e profundas.","beneficios":"Melhora expansão costal. Aumenta capacidade pulmonar. Melhora mobilidade torácica.","cuidados":"Respiração suave. Sem forçar.","material":"Cadeira ou tapete.","obs":"","defaultSeries":"2","defaultReps":"10 respirações","defaultDescanso":"15s","tags":"respiração,costal,expansão,torácica","foto":""},
{"id":"re02","nome":"Respiração Abdominal","grupo":"Respiração","nivel":"Básico","momento":"Parte Final","foco":"Respiração Profunda e Relaxamento","descricao":"Respiração com ênfase no movimento do abdome. Ativa o sistema parassimpático e promove relaxamento profundo.","execucao":"1. Sentado ou deitado.\n2. Uma mão no abdome, outra no peito.\n3. Inspire lentamente expandindo o abdome (mão do abdome sobe, mão do peito quieta).\n4. Expire deixando o abdome afundar.\n5. 10–15 respirações.","beneficios":"Ativa o sistema parassimpático. Promove relaxamento. Melhora a eficiência respiratória.","cuidados":"Não forçar. Respiração natural e suave.","material":"Cadeira ou tapete.","obs":"Similar à respiração diafragmática. Foco no abdome.","defaultSeries":"2","defaultReps":"10–15 respirações","defaultDescanso":"15s","tags":"respiração,abdominal,parassimpático,relaxamento","foto":""},
{"id":"re03","nome":"Respiração Quadrada","grupo":"Respiração","nivel":"Básico","momento":"Parte Final","foco":"Regulação do Sistema Nervoso","descricao":"Técnica de respiração com quatro fases iguais. Regula o sistema nervoso e reduz o estresse.","execucao":"1. Inspire pelo nariz contando até 4.\n2. Retenha o ar contando até 4.\n3. Expire pela boca contando até 4.\n4. Retenha sem ar contando até 4.\n5. Repita 5–8 ciclos.","beneficios":"Equilibra o sistema nervoso autônomo. Reduz estresse e ansiedade. Melhora concentração.","cuidados":"Não forçar a retenção. Se sentir desconforto, reduzir a contagem para 3.","material":"Cadeira confortável ou tapete.","obs":"Excelente para alunos com ansiedade ou hipertensão.","defaultSeries":"1","defaultReps":"5–8 ciclos","defaultDescanso":"—","tags":"respiração,quadrada,sistema nervoso,estresse,relaxamento","foto":""},
{"id":"re04","nome":"Inspiração Nasal Lenta","grupo":"Respiração","nivel":"Básico","momento":"Parte Final","foco":"Ativação Parassimpática e Qualidade do Ar","descricao":"Inspiração lenta e consciente pelo nariz. A respiração nasal filtra, aquece e umidifica o ar — superior à respiração bucal.","execucao":"1. Inspire lentamente pelo nariz contando até 5–8.\n2. Sinta o ar filtrado e aquecido.\n3. Expire naturalmente.\n4. Atenção à qualidade do fluxo nasal.\n5. 10 respirações.","beneficios":"Melhora qualidade do ar inspirado. Ativa o nervo vago. Reduz a frequência respiratória.","cuidados":"Se tiver obstrução nasal, usar bucal e investigar a causa.","material":"Ambiente tranquilo.","obs":"","defaultSeries":"2","defaultReps":"10 respirações","defaultDescanso":"15s","tags":"respiração,nasal,parassimpático,qualidade","foto":""},
{"id":"re05","nome":"Expiração Prolongada","grupo":"Respiração","nivel":"Básico","momento":"Parte Final","foco":"Ativação Parassimpática e Relaxamento","descricao":"Expiração mais longa que a inspiração. Ativa o sistema parassimpático e promove relaxamento imediato.","execucao":"1. Inspire pelo nariz contando até 4.\n2. Expire pela boca contando até 8 (o dobro da inspiração).\n3. Lábios levemente franzidos como se soprasse uma vela.\n4. 8–10 ciclos.","beneficios":"A expiração prolongada ativa o nervo vago e o sistema parassimpático. Reduz FC e PA.","cuidados":"Não forçar a expiração. Deve ser confortável.","material":"Cadeira confortável.","obs":"Uma das técnicas mais eficazes para redução de FC após treino.","defaultSeries":"1","defaultReps":"8–10 ciclos","defaultDescanso":"—","tags":"respiração,expiração prolongada,parassimpático,FC,relaxamento","foto":""},
{"id":"re06","nome":"Expiração com Resistência","grupo":"Respiração","nivel":"Básico","momento":"Parte Final","foco":"Fortalecimento dos Músculos Expiratórios","descricao":"Expirar contra resistência (lábios franzidos, canudo, bola de sopro). Fortalece os músculos expiratórios.","execucao":"1. Inspire profundamente.\n2. Expire lentamente através de um canudo, soprando através de lábios franzidos ou inflando uma bola.\n3. Controlar a velocidade da expiração.\n4. 10 repetições.","beneficios":"Fortalece músculos expiratórios. Melhora a capacidade de tossir (importante para idosos). Exercita a musculatura respiratória.","cuidados":"Não expirar com muita força. Movimento suave e controlado.","material":"Canudo, bola de borracha ou bexiga.","obs":"Importante para alunos com DPOC ou fraqueza respiratória.","defaultSeries":"2","defaultReps":"10","defaultDescanso":"15s","tags":"respiração,expiração,resistência,musculatura respiratória","foto":""},
{"id":"re07","nome":"Expansão Torácica","grupo":"Respiração","nivel":"Básico","momento":"Parte Final","foco":"Expansão do Tórax e Capacidade Pulmonar","descricao":"Exercício combinando postura e respiração para maximizar a expansão torácica.","execucao":"1. Sentado com coluna ereta e ombros abertos.\n2. Inspire profundamente abrindo o peito, ombros para trás.\n3. Levante levemente os braços para os lados ao inspirar.\n4. Expire baixando os braços.\n5. 10 respirações.","beneficios":"Maximiza a expansão torácica. Combate a postura cifótica. Aumenta capacidade pulmonar.","cuidados":"Movimentos suaves. Não forçar a amplitude do ombro.","material":"Cadeira.","obs":"","defaultSeries":"2","defaultReps":"10","defaultDescanso":"15s","tags":"respiração,expansão torácica,capacidade pulmonar,postura","foto":""},
{"id":"re08","nome":"Respiração Associada ao Movimento","grupo":"Respiração","nivel":"Básico","momento":"Parte Inicial","foco":"Sincronização Respiração-Movimento","descricao":"Sincronizar a respiração com os movimentos dos exercícios. Melhora a eficiência e a segurança do treino.","execucao":"1. Em qualquer exercício: inspire na fase de menor esforço, expire na fase de maior esforço.\n2. Ex Agachamento: inspire descendo, expire subindo.\n3. Ex Remada: inspire abrindo, expire puxando.\n4. Praticar conscientemente durante 10 repetições de qualquer exercício.","beneficios":"Sincroniza respiração e esforço. Reduz pressão intratorácica. Melhora eficiência do movimento.","cuidados":"Nunca prender a respiração em exercícios de força (manobra de Valsalva).","material":"Sem equipamento adicional.","obs":"Ensinar no início do programa e reforçar continuamente.","defaultSeries":"1","defaultReps":"durante os exercícios","defaultDescanso":"—","tags":"respiração,movimento,sincronização,valsalva","foto":""},
{"id":"re09","nome":"Relaxamento Respiratório Guiado","grupo":"Respiração","nivel":"Básico","momento":"Parte Final","foco":"Relaxamento Profundo e Encerramento da Sessão","descricao":"Técnica guiada de relaxamento respiratório progressivo. Encerra a sessão promovendo recuperação e bem-estar.","execucao":"1. Deitado ou sentado confortavelmente.\n2. O professor guia verbalmente: 'Inspire... 2... 3... 4... Expire... 2... 3... 4... 5... 6...'.\n3. Com cada expiração, relaxar progressivamente cada parte do corpo.\n4. 5–10 minutos de relaxamento guiado.","beneficios":"Promove recuperação após o treino. Ativa o parassimpático. Melhora bem-estar subjetivo e adesão ao programa.","cuidados":"Ambiente tranquilo. Não conduzir em deitado se aluno tiver refluxo ou DPOC severo.","material":"Tapete ou cadeira confortável. Música suave opcional.","obs":"Encerramento ideal de toda sessão de treino do público 50+.","defaultSeries":"1","defaultReps":"5–10 min","defaultDescanso":"—","tags":"respiração,relaxamento,guiado,encerramento,recuperação","foto":""},

{"id":"fu01","nome":"Tríceps com Elástico","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Tríceps","descricao":"Extensão de cotovelo com elástico. Fortalece o tríceps para empurrar e se levantar do chão.","execucao":"1. Elástico preso acima (porta, barra).\n2. Segure o elástico com as mãos acima da cabeça, cotovelos dobrados.\n3. Estenda os cotovelos empurrando as mãos para baixo ou para frente.\n4. Retorne lentamente.\n5. 3 séries de 12–15.","beneficios":"Fortalece tríceps. Melhora capacidade de empurrar e se apoiar.","cuidados":"Cotovelos próximos à cabeça. Não travar os cotovelos.","material":"Faixa elástica.","obs":"Nível 1 — Tríceps. Progressão: sentado, em pé, unilateral.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"mmss,tríceps,empurrar,elástico,nível1","foto":""},
{"id":"fu02","nome":"Desenvolvimento em Pé","grupo":"MMSS","nivel":"Intermediário","momento":"Parte Principal","foco":"Deltoides, Tríceps e Core","descricao":"Press de ombros em pé com halteres. Maior demanda de core e equilíbrio que a versão sentada.","execucao":"1. Em pé, halteres na altura dos ombros.\n2. Core contraído, quadris neutros.\n3. Empurre para cima até quase estender os braços.\n4. Desça controladamente.\n5. 3 séries de 10.","beneficios":"Fortalece deltoides e tríceps. Demanda de core maior que sentado. Mais funcional.","cuidados":"Não arquear a lombar. Core ativo durante todo o movimento.","material":"Halteres.","obs":"Nível 2 — Desenvolvimento.","defaultSeries":"3","defaultReps":"10","defaultDescanso":"60s","tags":"mmss,empurrar,ombros,tríceps,core,nível2","foto":""},
{"id":"fu03","nome":"Rosca Alternada","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Bíceps e Controle Unilateral","descricao":"Rosca direta alternando os braços. Maior controle e atenção por repetição.","execucao":"1. Em pé ou sentado, halteres nas mãos.\n2. Flexione um cotovelo levando o peso ao ombro.\n3. Desça lentamente antes de iniciar o outro lado.\n4. Alterne continuamente.\n5. 3 séries de 10–12 por lado.","beneficios":"Fortalece bíceps bilateralmente. Maior atenção a cada repetição. Pode identificar assimetrias.","cuidados":"Cotovelos fixos ao lado do corpo. Não balançar o tronco.","material":"Halteres leves.","obs":"Nível 3–4 — Rosca Bíceps.","defaultSeries":"3","defaultReps":"10–12 cada","defaultDescanso":"60s","tags":"mmss,bíceps,alternado,unilateral,nível3","foto":""},

{"id":"hd01","nome":"Extensão Lombar (Press-Up / McKenzie)","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Extensão Lombar / Método McKenzie","descricao":"Extensão lombar em decúbito ventral (McKenzie), indicada em disfunções discais com padrão de centralização. Promove migração anterior do núcleo pulposo e reduz dor irradiada.","execucao":"1. Decúbito ventral, pernas estendidas e relaxadas.\n2. Mãos apoiadas abaixo dos ombros, cotovelos fletidos.\n3. Estenda progressivamente os cotovelos elevando o tronco.\n4. Pelve permanece em contato com a maca.\n5. Sustente na amplitude tolerada (isometria) ou execute repetições lentas.","beneficios":"Favorece centralização da dor, restaura mobilidade em extensão e reduz pressão intradiscal anterior.","cuidados":"Critério de indicação é a centralização da dor. Contraindicado em espondilolistese, estenose de canal ou quando a extensão piora/periferiza a dor. Glúteos relaxados, respiração contínua.","material":"Maca ou colchonete","obs":"Fase inicial da reabilitação. Progredir amplitude gradualmente.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,mckenzie,mobilidade,centralização","foto":""},
{"id":"hd02","nome":"90/90 — Mobilidade de Quadril","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Rotação Interna e Externa de Quadril","descricao":"Trabalha simultaneamente rotação externa e interna dos quadris, reduzindo padrões compensatórios lombares e pélvicos.","execucao":"1. Sentado no solo, perna da frente com quadril/joelho a 90° em rotação externa.\n2. Perna de trás com quadril/joelho a 90° em rotação interna.\n3. Tronco ereto, ísquios apoiados.\n4. Versão estática: sustente a posição. Versão dinâmica: gire de um lado para o outro sem apoio das mãos.","beneficios":"Melhora mobilidade rotacional do quadril e controle lombo-pélvico, preparando para exercícios em cadeia fechada.","cuidados":"Os dois ísquios devem permanecer no solo. Evitar compensação com inclinação do tronco. Iniciantes podem apoiar as mãos no chão.","material":"Colchonete","obs":"Excelente preparatório para agachamentos, afundos e caminhada/corrida.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,mobilidade,quadril","foto":""},
{"id":"hd03","nome":"Elevação da Perna Estendida (SLR)","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Quadríceps e Flexores de Quadril","descricao":"Cadeia cinética aberta que ativa quadríceps e flexores de quadril sem carga axial, com o core como estabilizador.","execucao":"1. Decúbito dorsal, uma perna estendida no solo.\n2. Contraia levemente o abdômen.\n3. Eleve a perna estendida (joelho em extensão) até o limite confortável.\n4. Retorne lentamente ao solo.\n5. Repita com a perna contralateral.","beneficios":"Fortalece quadríceps e flexores de quadril sem sobrecarga articular; melhora controle lombo-pélvico.","cuidados":"Evitar arqueamento lombar durante a elevação. Manter joelho estendido. Se necessário, apoiar a perna contralateral com joelho fletido. Descida controlada.","material":"Colchonete. Progressão: caneleira ou elástico.","obs":"Indicado também em pós-operatórios de joelho/quadril com restrição de carga axial.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,mmii,slr,quadríceps","foto":""},
{"id":"hd04","nome":"Suástica Deitado (Rotação Lombar em Decúbito)","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Rotação Lombo-Pélvica","descricao":"Mobilização rotacional da lombar e pelve, reduzindo rigidez lombossacra e tensão miofascial de paravertebrais e glúteos.","execucao":"1. Decúbito dorsal, pernas estendidas, braços abertos lateralmente.\n2. Flexione um joelho em direção ao tórax.\n3. Cruze essa perna sobre o corpo, joelho em direção ao chão do lado oposto.\n4. Braço oposto ajuda suavemente a aumentar a amplitude.\n5. Mantenha alguns segundos e retorne. Repita do outro lado.","beneficios":"Recupera mobilidade rotacional lombar e pélvica, estimula dissociação pelve-tronco.","cuidados":"Ombro oposto deve permanecer apoiado no solo. Movimento lento e progressivo. Em dor unilateral, iniciar pelo lado sem dor. Contraindicado em fase aguda com dor intensa ou irradiação.","material":"Colchonete","obs":"Pode ser usado como aquecimento ou mobilidade final da sessão.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,mobilidade,rotação","foto":""},
{"id":"hd05","nome":"Flexão de Quadril em Decúbito Dorsal","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Flexores de Quadril e Controle Lombo-Pélvico","descricao":"Exercício de controle motor inicial que ativa os flexores de quadril exigindo o core como estabilizador da pelve.","execucao":"1. Decúbito dorsal, joelhos estendidos, pernas relaxadas.\n2. Contraia levemente o abdômen.\n3. Eleve uma perna estendida aproximando-a do tórax, sem arquear a lombar.\n4. Retorne lentamente. Repita com a perna contralateral.","beneficios":"Ativa flexores de quadril com segurança, restabelece a dissociação entre quadril e coluna lombar.","cuidados":"Monitorar elevação da pelve e arqueamento lombar. Descida lenta e controlada. Leve flexão de joelho é aceitável em encurtamentos de isquiotibiais.","material":"Colchonete","obs":"Preparatório para o SLR com carga.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,mmii,controle motor","foto":""},
{"id":"hd06","nome":"Cócoras em Isometria (Deep Squat Isométrico)","grupo":"Mobilidade","nivel":"Intermediário","momento":"Parte Principal","foco":"Mobilidade Global e Padrão de Agachamento","descricao":"Isometria em agachamento profundo, marcador de mobilidade de tornozelos, joelhos, quadris e coluna e do padrão de agachamento.","execucao":"1. Agachamento profundo, pés paralelos e apoiados no solo.\n2. Joelhos alinhados com os pés, sem valgo.\n3. Tronco ereto ou com leve inclinação anterior, lombar preservada.\n4. Mãos unidas à frente do tórax.\n5. Sustente a posição com respiração contínua.","beneficios":"Desenvolve mobilidade de tornozelo/quadril, alonga a cadeia posterior e melhora a distribuição de carga entre os segmentos do MMII.","cuidados":"Calcanhares apoiados o tempo todo (senão, elevar calcanhar com apoio). Não colapsar a lombar em flexão. Evitar valgo de joelho.","material":"Nenhum ou apoio de mãos em superfície estável","obs":"Útil também como exercício de avaliação postural ao longo do tratamento.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"hernia_disco_lombar,lombalgia,mobilidade,agachamento","foto":""},
{"id":"hd07","nome":"Dead Bug","grupo":"Core","nivel":"Intermediário","momento":"Parte Principal","foco":"Estabilização Lombo-Pélvica Dinâmica","descricao":"Treina a estabilização lombo-pélvica ativa durante movimentos alternados dos membros, recrutando transverso abdominal e multífidos.","execucao":"1. Decúbito dorsal, joelhos a 90°, braços estendidos ao teto.\n2. Contraia o abdômen, lombar em contato com o solo.\n3. Desça um braço acima da cabeça e a perna contralateral simultaneamente.\n4. Retorne controlado. Alterne os lados.","beneficios":"Fortalece a musculatura profunda do core e treina o padrão cruzado, base para marcha e corrida.","cuidados":"Lombar deve permanecer no solo o tempo todo. Expirar durante a descida dos membros. Se necessário, iniciar com apenas um segmento por vez.","material":"Colchonete. Progressão: elástico entre as mãos.","obs":"Boa transição para retorno às atividades funcionais e corrida.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"hernia_disco_lombar,lombalgia,core,estabilização","foto":""},
{"id":"hd08","nome":"Arqueiro com Elástico no Quadril (Mobilidade)","grupo":"Mobilidade","nivel":"Intermediário","momento":"Parte Inicial","foco":"Extensão de Quadril e Flexores","descricao":"Mobilização ativa do quadril em extensão com tração elástica lateral, restaurando amplitude que, quando restrita, é compensada pela lombar.","execucao":"1. Posição ajoelhada, uma perna à frente com joelho a 90°.\n2. Elástico fixado na lateral do quadril da perna de trás.\n3. Projete o quadril para frente de forma controlada e rítmica.\n4. Tronco ereto, pelve neutra, sem inclinação ou rotação.\n5. Retorne e repita.","beneficios":"Melhora mobilidade ativa em extensão de quadril e reduz compensação lombar associada.","cuidados":"Contrair o glúteo da perna de trás durante a progressão. Pelve neutra é prioridade — reduzir amplitude se houver compensação.","material":"Faixa elástica","obs":"Bom aquecimento pré-treino ou preparatório para agachamentos, afundos e corrida.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,mobilidade,quadril,elástico","foto":""},
{"id":"hd09","nome":"Core Anti Rotação Dinâmica","grupo":"Core","nivel":"Intermediário","momento":"Parte Principal","foco":"Resistência Rotacional Dinâmica do Tronco","descricao":"Progressão do anti rotação isométrico: mantém o tronco estável enquanto os braços se movem contra a tração do elástico.","execucao":"1. Em pé, de lado para o ponto de fixação do elástico.\n2. Segure o elástico com as duas mãos, braços estendidos à frente do tórax.\n3. Dobre os braços trazendo as mãos ao tórax e estenda novamente em linha reta.\n4. Mantenha o tronco firme, resistindo à rotação.","beneficios":"Desenvolve resistência rotacional em situação dinâmica, com transferência para corrida e esportes de raquete.","cuidados":"Não deixar o tronco rodar na extensão dos braços — reduzir resistência se ocorrer. Base estável, joelhos levemente flexionados.","material":"Faixa elástica com ponto de fixação","obs":"Progressão direta do anti rotação isométrico.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"hernia_disco_lombar,lombalgia,core,anti rotação","foto":""},
{"id":"hd10","nome":"Ativação de Core com Resistência Externa","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Ativação Reflexa do Core","descricao":"Estabilização em cadeia fechada de tronco contra perturbação manual, recrutando transverso abdominal e multífidos de forma reflexa.","execucao":"1. Decúbito dorsal, quadris e joelhos a 90°, pernas suspensas, braços ao teto.\n2. O profissional aplica resistência manual variável nos braços e/ou pernas.\n3. Mantenha o tronco estável e a lombar neutra frente à perturbação.\n4. Respiração contínua.","beneficios":"Ativa a musculatura profunda do core de forma reflexa, sem carga axial nem amplitude de movimento.","cuidados":"Lombar deve permanecer neutra — nem arqueada nem pressionada. Progredir a resistência gradualmente. Iniciantes: pés apoiados no solo.","material":"Nenhum (resistência manual do profissional)","obs":"Excelente exercício para as primeiras sessões da reabilitação.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,core,ativação","foto":""},
{"id":"hd11","nome":"Core Rotacional com Elástico","grupo":"Core","nivel":"Intermediário","momento":"Parte Principal","foco":"Rotação de Tronco sob Resistência","descricao":"Treina rotação ativa de tronco contra resistência elástica com demanda concêntrica e excêntrica, além de estabilidade pélvica.","execucao":"1. Em pé, de lado para o ponto de fixação, joelhos semiflexionados.\n2. Braços estendidos à frente, segurando o elástico na altura do tórax.\n3. Gire o tronco para o lado oposto ao elástico, de forma controlada.\n4. Retorne lentamente resistindo à tração na fase excêntrica.","beneficios":"Fortalece a musculatura rotacional do core com transferência para corrida e esportes de arremesso/raquete.","cuidados":"Fase excêntrica (retorno) é tão importante quanto a concêntrica. Pelve não deve girar junto com o tronco. Base firme, velocidade controlada.","material":"Faixa elástica com ponto de fixação","obs":"Progredir a resistência conforme o controle rotacional sem compensações.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"hernia_disco_lombar,lombalgia,core,rotação","foto":""},
{"id":"hd12","nome":"Core Anti Rotação com Mini Band","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Resistência Rotacional Isométrica + Glúteo Médio","descricao":"Resistência isométrica à rotação do tronco com mini band nos joelhos, integrando ativação de glúteo médio.","execucao":"1. Em pé, mini band acima dos joelhos, joelhos semiflexionados em leve abdução.\n2. De lado para o elástico, segure-o com as duas mãos, braços à frente do tórax.\n3. Mantenha a posição isométrica resistindo ao torque do elástico, sem rotacionar o tronco.","beneficios":"Recruta oblíquos e transverso abdominal como estabilizadores e ativa o glúteo médio para o alinhamento lombo-pélvico.","cuidados":"Não deixar o tronco rodar em direção ao elástico. Monitorar valgo dinâmico dos joelhos. Lombar neutra, respiração normal.","material":"Faixa elástica + mini band","obs":"Progride naturalmente para o anti rotação dinâmico.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,core,anti rotação,glúteo médio","foto":""},
{"id":"hd13","nome":"Core Anti Rotação — Sobe e Desce","grupo":"Core","nivel":"Intermediário","momento":"Parte Principal","foco":"Controle Multiplanar do Tronco","descricao":"Evolução do anti rotação com componente vertical, exigindo controle simultâneo em rotação e flexão/extensão de tronco.","execucao":"1. Em pé, de lado para o elástico, mini band acima dos joelhos.\n2. Parta da posição baixa (elástico na altura do quadril) e eleve os braços até a altura dos ombros ou acima da cabeça.\n3. Desça lentamente resistindo à tração na fase excêntrica.","beneficios":"Treina o controle do core em múltiplos planos, com transferência para movimentos acima da cabeça em esportes.","cuidados":"Reduzir a amplitude se houver perda de controle rotacional. Evitar inclinação lateral do tronco. Descida lenta e controlada.","material":"Faixa elástica + mini band","obs":"Progredir apenas após bom controle no anti rotação isométrico e dinâmico.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"hernia_disco_lombar,lombalgia,core,anti rotação","foto":""},
{"id":"hd14","nome":"Core Anti Rotacional Isométrico em Base Alternada","grupo":"Core","nivel":"Avançado","momento":"Parte Principal","foco":"Estabilidade sob Perturbação de Base","descricao":"Resistência à rotação do tronco enquanto a base de apoio é alternada, exigindo ajustes contínuos de controle neuromuscular.","execucao":"1. Posição de prancha ou apoio definido, tronco neutro.\n2. Alterne ou eleve levemente um dos apoios (mão, pé ou joelho).\n3. Mantenha o core estável, resistindo à rotação do tronco durante a troca.","beneficios":"Melhora a estabilidade lombo-pélvica sob instabilidade de base e a resistência à rotação (anti-rotação).","cuidados":"Manter a coluna neutra durante a troca de apoio. Evitar queda de quadril ou hiperextensão lombar. Respiração controlada.","material":"Colchonete","obs":"Transição entre exercícios estáticos e gestos mais dinâmicos.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"hernia_disco_lombar,lombalgia,core,anti rotação,prancha","foto":""},
{"id":"hd15","nome":"Core Anti Rotação Dinâmico em Base de Afundo de Braços","grupo":"Core","nivel":"Avançado","momento":"Parte Principal","foco":"Estabilidade de Tronco em Base Assimétrica","descricao":"Combina estabilidade lombo-pélvica em base de afundo com movimento dinâmico de braços que gera torque a ser neutralizado pelo tronco.","execucao":"1. Base de afundo (um pé à frente, outro atrás, joelhos semiflexionados).\n2. Segure resistência à altura do tronco.\n3. Estenda os braços à frente mantendo o tronco estável, sem rotação.\n4. Retorne controlado, mantendo a base de afundo.","beneficios":"Desenvolve resistência à rotação do tronco durante movimento dinâmico de MMSS, com transferência funcional e esportiva.","cuidados":"Quadril alinhado e nivelado. Evitar valgo do joelho da frente. Controlar a velocidade do movimento dos braços.","material":"Faixa elástica ou anilha","obs":"Fase avançada da reabilitação.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"hernia_disco_lombar,lombalgia,core,afundo,anti rotação","foto":""},
{"id":"hd16","nome":"Core Anti Rotação Sobe e Desce em Base de Afundo","grupo":"Core","nivel":"Avançado","momento":"Parte Principal","foco":"Integração de Core e MMII em Afundo","descricao":"Une estabilidade rotacional do tronco ao movimento de subida e descida em afundo, com controle excêntrico e concêntrico.","execucao":"1. Base de afundo (um pé à frente, outro atrás).\n2. Segure resistência à frente do tronco, braços estendidos.\n3. Desça controlando a fase excêntrica (flexão de joelhos e quadris).\n4. Suba de forma controlada, mantendo o tronco estável.","beneficios":"Melhora o controle excêntrico/concêntrico dos MMII associado à estabilidade de tronco, com transferência para agachamento unilateral.","cuidados":"Tronco ereto e alinhado, sem rotação ou inclinação lateral. Evitar valgo do joelho da frente. Descida lenta, subida controlada.","material":"Faixa elástica ou anilha","obs":"Fase avançada da reabilitação.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"hernia_disco_lombar,lombalgia,core,afundo","foto":""},
{"id":"hd17","nome":"Core Rotacional em Base de Afundo","grupo":"Core","nivel":"Avançado","momento":"Parte Principal","foco":"Rotação Controlada em Base Assimétrica","descricao":"Treina a rotação controlada de tronco associada à estabilidade de base de afundo, com transferência para gestos esportivos rotacionais.","execucao":"1. Base de afundo, joelhos semiflexionados.\n2. Segure resistência à altura do tronco, braços semiestendidos à frente.\n3. Gire o tronco controladamente para um dos lados, acompanhando com os braços.\n4. Retorne controlado, mantendo a base estável.","beneficios":"Desenvolve rotação de tronco segura e geração de torque integrada à base de afundo.","cuidados":"Movimento inicia no core, não nos braços/ombros. Quadril relativamente estável. Evitar valgo do joelho da frente.","material":"Faixa elástica ou anilha","obs":"Indicado para retorno a gestos esportivos com rotação (arremesso, saque, chute).","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"hernia_disco_lombar,lombalgia,core,rotação,afundo","foto":""},
{"id":"hd18","nome":"Ativação de Glúteo Máximo","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Glúteo Máximo","descricao":"Ativação isolada do glúteo máximo em decúbito lateral, reduzindo a compensação de tensor da fáscia lata e quadrado lombar.","execucao":"1. Decúbito lateral, mini band acima dos joelhos ou tornozelos.\n2. Quadris e joelhos levemente flexionados, tronco estável.\n3. Estenda o quadril levando a perna de cima para trás, joelho semiflexionado.\n4. Retorne controlado.","beneficios":"Ativa e fortalece o glúteo máximo, base para progressões funcionais posteriores.","cuidados":"Evitar rotação de tronco/quadril. Não compensar com hiperextensão lombar. Contração abdominal leve durante o movimento.","material":"Mini band","obs":"Indicado para reeducação motora inicial em fraqueza/inibição glútea.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,mmii,glúteo máximo","foto":""},
{"id":"hd19","nome":"Ostra com Resistência Elástica","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Glúteo Médio","descricao":"Ativação isolada do glúteo médio, principal estabilizador lateral do quadril, com o quadril a 45° de flexão.","execucao":"1. Decúbito lateral, quadris e joelhos semifletidos a 45°.\n2. Elástico acima dos joelhos, pés juntos.\n3. Abra o joelho de cima (abdução + rotação externa) contra o elástico.\n4. Retorne lentamente resistindo ao elástico.","beneficios":"Fortalece o glúteo médio e desenvolve controle excêntrico do quadril, com estabilidade lombo-pélvica.","cuidados":"Manter o ângulo de 45° de flexão do quadril. Evitar rotação da pelve para trás. Ativar o abdômen antes de iniciar.","material":"Faixa elástica","obs":"Progredir para exercícios em cadeia fechada (agachamento com elástico, step lateral).","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,mmii,glúteo médio,ostra","foto":""},
{"id":"hd20","nome":"Toque Lateral com Mini Band","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Estabilidade Unilateral e Glúteo Médio","descricao":"Exercício unilateral em cadeia fechada: toque lateral do pé livre enquanto a perna de apoio controla o alinhamento do quadril e joelho.","execucao":"1. Mini band nos tornozelos ou abaixo dos joelhos.\n2. Leve agachamento, quadris para trás, tronco levemente inclinado à frente.\n3. Toque lateralmente com um pé, sem transferir peso.\n4. Retorne ao centro e repita para o outro lado.","beneficios":"Fortalece glúteo médio e máximo em cadeia fechada, treina o controle do valgo dinâmico de joelho.","cuidados":"Não permitir colapso em valgo do joelho de apoio. Tronco estável, sem oscilação. Contato leve, sem transferir peso.","material":"Mini band","obs":"Em tendinopatia patelar: monitorar EVA (até 3/10 aceitável; dor após 24h indica excesso).","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,mmii,glúteo médio,unilateral","foto":""},
{"id":"hd21","nome":"Toque em 3 Direções com Mini Band","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Estabilidade Multiplanar","descricao":"Evolução do toque lateral, com toques em três direções (frente, lateral, trás) desafiando a perna de apoio em múltiplos planos.","execucao":"1. Mini band nos tornozelos ou abaixo dos joelhos.\n2. Leve agachamento, base estável.\n3. Toque à frente e retorne ao centro.\n4. Toque lateral e retorne ao centro.\n5. Toque atrás e retorne ao centro. Complete a sequência e troque a perna.","beneficios":"Fortalece glúteo médio/máximo com desafio multiplanar, boa transferência para esporte e mudança de direção.","cuidados":"Não permitir valgo do joelho em nenhuma direção, especialmente no toque lateral. Pé de apoio fixo, sem rotação. O toque para trás costuma ser o mais desafiador.","material":"Mini band","obs":"Em tendinopatia patelar: monitorar ângulo de flexão do joelho de apoio e resistência da band.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,mmii,glúteo médio,multiplanar","foto":""},
{"id":"hd22","nome":"Ostra em Pé com Mini Band","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Glúteo Médio em Cadeia Fechada","descricao":"Progressão em pé da ostra tradicional, exigindo estabilidade da perna de apoio enquanto o quadril oposto trabalha em abdução e rotação externa.","execucao":"1. Em pé, mini band acima dos joelhos.\n2. Leve flexão do joelho de apoio, mãos na cintura, tronco ereto.\n3. Estenda o quadril com rotação externa do pé (abdução + rotação externa).\n4. Retorne controlado. Complete a série e troque o lado.","beneficios":"Fortalece glúteo médio e máximo em cadeia fechada, treina a dissociação entre quadril e tronco.","cuidados":"Não permitir rotação/inclinação da pelve. Joelho de apoio não deve colapsar em valgo. Ativar o abdômen durante a execução.","material":"Mini band","obs":"Em tendinopatia patelar: controlar carga pela resistência da band e grau de flexão do joelho de apoio.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,mmii,glúteo médio,ostra","foto":""},
{"id":"hd23","nome":"Elevação de Quadril Isométrica Bilateral","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Glúteo Máximo e Médio","descricao":"Ponte isométrica com apoio pelos calcanhares e mini band, otimizando o recrutamento do glúteo máximo e médio com carga controlada.","execucao":"1. Decúbito dorsal, mini band acima dos joelhos.\n2. Pés apoiados apenas pelos calcanhares.\n3. Eleve o quadril até linha reta joelhos-quadril-ombros.\n4. Sustente a posição, joelhos pressionando levemente contra a band.","beneficios":"Ativa glúteo máximo e médio com controle de carga preciso pelo tempo de contração, segura em fases iniciais.","cuidados":"Apoio apenas pelos calcanhares. Não deixar os joelhos colapsarem em valgo. Evitar hiperextensão lombar.","material":"Mini band","obs":"Bem tolerado em tendinopatia patelar (EVA até 3/10 aceitável).","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,mmii,glúteo,ponte","foto":""},
{"id":"hd24","nome":"Elevação de Quadril Bilateral com Mini Band (Dinâmica)","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Glúteo Máximo e Médio (Dinâmico)","descricao":"Progressão dinâmica da ponte isométrica, trabalhando o glúteo máximo nas fases concêntrica e excêntrica.","execucao":"1. Decúbito dorsal, mini band acima dos joelhos, apoio pelos calcanhares.\n2. Eleve o quadril até linha reta joelhos-quadril-ombros.\n3. Retorne lentamente sem apoiar totalmente o quadril no chão.\n4. Repita mantendo tensão contínua.","beneficios":"Fortalece glúteo máximo/médio com controle concêntrico e excêntrico ao longo de toda a amplitude.","cuidados":"Descida tão controlada quanto a subida. Joelhos não podem fechar em nenhum momento. Evitar hiperextensão lombar no topo.","material":"Mini band","obs":"Progressão natural a partir da versão isométrica.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"hernia_disco_lombar,lombalgia,mmii,glúteo,ponte","foto":""},
{"id":"hd25","nome":"Ativação de Glúteo Médio — Aviãozinho com Resistência Elástica","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Estabilidade Pélvica + Padrão de Corrida","descricao":"Exercício unilateral que integra controle de tronco, estabilidade pélvica e glúteo médio, com segunda fase simulando o padrão de corrida.","execucao":"1. Em pé, elástico fixado lateralmente em diagonal (abaixo do quadril).\n2. Incline o tronco à frente elevando a perna e o braço opostos, formando linha reta tronco-quadril-perna.\n3. Retorne à posição neutra.\n4. Traga o joelho da perna elevada ao peito com o braço contralateral avançando (padrão de passada).\n5. Repita a sequência e troque o lado.","beneficios":"Ativa e fortalece o glúteo médio da perna de apoio e integra o padrão motor de corrida ao exercício.","cuidados":"Quadril deve permanecer paralelo ao solo, sem abertura ou rotação. Descida do tronco lenta e controlada. Evitar compensação com inclinação lateral.","material":"Faixa elástica com ponto de fixação","obs":"Boa transferência para corrida — reforçar padrão coordenado de joelho/braço opostos.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"hernia_disco_lombar,lombalgia,mmii,glúteo médio,corrida,funcional","foto":""},
{"id":"hd26","nome":"Agachamento Unilateral no Plano Transverso","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Controle Excêntrico e Corrida","descricao":"Combina força unilateral, controle excêntrico de glúteo médio e padrão motor de corrida, com desafio no plano transverso.","execucao":"1. Em pé, elástico fixado lateralmente em diagonal.\n2. Agache na perna de apoio, levando a perna livre para trás e para o lado.\n3. Mantenha o joelho de apoio alinhado, sem valgo.\n4. Ao retornar, traga o joelho da perna livre ao peito com o braço oposto avançando.\n5. Retorne e repita.","beneficios":"Fortalece glúteo médio/máximo com alta demanda excêntrica e multiplanar, com transferência para desaceleração e mudança de direção.","cuidados":"Maior trabalho ocorre na descida (fase excêntrica). Não permitir valgo do joelho de apoio. Tronco e pelve estáveis, sem rotação.","material":"Faixa elástica com ponto de fixação","obs":"Em tendinopatia patelar: controlar ângulo de flexão do joelho de apoio e carga do elástico.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"hernia_disco_lombar,lombalgia,mmii,glúteo médio,corrida,funcional,avançado","foto":""},
{"id":"hd27","nome":"Core Rotacional com Resistência Elástica","grupo":"Core","nivel":"Intermediário","momento":"Parte Principal","foco":"Rotação de Tronco em Pé","descricao":"Treina a capacidade do tronco de controlar e produzir força no plano transverso, com transferência para corrida e esporte.","execucao":"1. Em pé, de lado para o elástico, pés na largura dos ombros.\n2. Segure o elástico com as duas mãos, braços semiestendidos à frente.\n3. Mantenha quadris e pelve estáveis, gire o tronco para o lado oposto ao elástico.\n4. Retorne lentamente resistindo à tração na fase excêntrica. Repita do outro lado.","beneficios":"Fortalece o core no padrão rotacional com controle concêntrico e excêntrico, protegendo a coluna lombar.","cuidados":"Quadril não gira junto com o tronco. Fase de retorno lenta e controlada. Em lombalgia: iniciar com amplitude e resistência reduzidas.","material":"Faixa elástica com ponto de fixação","obs":"Progredir aumentando resistência, velocidade ou dissociando membros inferiores.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"hernia_disco_lombar,lombalgia,core,rotação","foto":""},
{"id":"hd28","nome":"Core Rotacional","grupo":"Core","nivel":"Intermediário","momento":"Parte Principal","foco":"Rotação de Tronco sem Resistência Externa","descricao":"Versão sem elástico do core rotacional, treinando o padrão de rotação de tronco com controle concêntrico e excêntrico.","execucao":"1. Em pé, pés na largura dos ombros, joelhos levemente flexionados.\n2. Quadris e pelve estáveis, a rotação acontece no tronco.\n3. Gire o tronco para um lado de forma controlada, braços acompanhando.\n4. Retorne lentamente controlando a desaceleração. Repita para o outro lado.","beneficios":"Fortalece o core no padrão rotacional e desenvolve rigidez de tronco para transferência de força entre segmentos.","cuidados":"Quadril não gira junto. Evitar hiperextensão lombar ou inclinação lateral ao final da rotação. Em lombalgia: iniciar com amplitude reduzida.","material":"Nenhum. Progressão: adicionar elástico.","obs":"Pode ser usado como regressão do core rotacional com elástico.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"hernia_disco_lombar,lombalgia,core,rotação","foto":""},
{"id":"iq01","nome":"Toque Lateral Alternado com Mini Band","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Glúteo Médio Dinâmico","descricao":"Ativação dinâmica do glúteo médio em cadeia fechada, com toques laterais alternados contra mini band, exigindo controle contínuo do valgo e estabilidade pélvica.","execucao":"1. Mini band nos tornozelos ou acima dos joelhos.\n2. Leve agachamento, quadris para trás, tronco levemente à frente.\n3. Toque lateral alternado: uma perna toca o lado e volta ao centro, depois a outra.\n4. Toque leve, sem transferir peso.\n5. Manter ritmo constante durante toda a série.","beneficios":"Fortalece o glúteo médio de forma dinâmica, treina controle do valgo e resistência muscular, com transferência para corrida e mudança de direção.","cuidados":"Foco na perna de apoio — joelho alinhado, sem valgo dinâmico. Tronco não pode inclinar lateralmente junto com o toque. Iniciar com band acima dos joelhos, progredir para os tornozelos.","material":"Mini band","obs":"Manter ritmo sem perder qualidade — cansaço não justifica compensação.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"impacto_quadril,mmii,glúteo médio,unilateral","foto":"","video":"https://youtu.be/CFNjDCS-zoE"},
{"id":"iq02","nome":"Elevação de Quadril Unilateral Isométrica com Resistência Externa","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Glúteo Máximo/Médio Unilateral Isométrico","descricao":"Ponte unilateral isométrica com resistência manual do profissional na EIAS, desenvolvendo estabilidade pélvica sob perturbação externa antes da progressão dinâmica.","execucao":"1. Decúbito dorsal, um pé apoiado pelo calcanhar, perna contralateral suspensa e estendida.\n2. Eleva o quadril até linha reta joelho-quadril-ombro.\n3. Sustenta a posição isometricamente pelo tempo determinado.\n4. O profissional aplica resistência manual descendente sobre a EIAS durante a sustentação.\n5. Pelve nivelada e abdômen ativo o tempo todo.","beneficios":"Ativa glúteo máximo e médio em apoio unilateral com carga externa controlada, preparando para a versão dinâmica.","cuidados":"Quadril não pode cair para o lado da perna suspensa. Resistência manual progressiva, começando leve. Apoio exclusivo no calcanhar, dedos e planta fora do chão.","material":"Nenhum (resistência manual do profissional)","obs":"Progride naturalmente para a versão dinâmica com resistência externa.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"impacto_quadril,mmii,glúteo,unilateral,isométrico","foto":"","video":""},
{"id":"iq03","nome":"Elevação de Quadril Unilateral Dinâmica com Resistência Externa","grupo":"MMII","nivel":"Avançado","momento":"Parte Principal","foco":"Glúteo Máximo/Médio Unilateral Dinâmico","descricao":"Progressão dinâmica da ponte unilateral isométrica, combinando força concêntrica, controle excêntrico e resistência manual contínua na EIAS.","execucao":"1. Decúbito dorsal, um pé apoiado pelo calcanhar, perna contralateral suspensa e estendida.\n2. Eleva o quadril até linha reta joelho-quadril-ombro.\n3. Executa subida e descida de forma lenta e controlada.\n4. O profissional aplica resistência manual descendente sobre a EIAS durante todo o movimento.\n5. Pelve nivelada e abdômen ativo em todas as repetições.","beneficios":"Desenvolve força dinâmica do glúteo máximo unilateral, controle excêntrico da cadeia posterior e integração glúteo-core, com transferência para corrida e escadas.","cuidados":"Descida lenta e controlada é a fase mais importante. Quadril não pode cair para o lado da perna suspensa. Resistência progressiva conforme o controle do paciente.","material":"Nenhum (resistência manual do profissional)","obs":"Progressão direta da versão isométrica.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"impacto_quadril,mmii,glúteo,unilateral,dinâmico","foto":"","video":"https://youtu.be/ZdZW1rNPCK0"},
{"id":"iq04","nome":"Propulsão com Resistência Elástica","grupo":"MMII","nivel":"Avançado","momento":"Parte Principal","foco":"Extensão de Quadril / Propulsão Bipodal","descricao":"Trabalha a fase de propulsão da marcha/corrida em base bipodal contra resistência elástica, desenvolvendo o padrão motor de empurrar o solo.","execucao":"1. Em pé, elástico fixado atrás, na altura do quadril ou tornozelo.\n2. Base bipodal, joelhos levemente flexionados, tronco levemente à frente.\n3. Estenda quadril e joelho empurrando o corpo para frente contra a resistência.\n4. Retorne controlado à posição inicial.\n5. Repita de forma contínua, tronco estável.","beneficios":"Fortalece a extensão de quadril bilateral em padrão de propulsão, base para a exigência unilateral da corrida.","cuidados":"Tronco estável, sem inclinação excessiva à frente. Fase de empurrar forte e controlada; retorno controlado, não solto.","material":"Faixa elástica com ponto de fixação","obs":"Base para progressão à Propulsão Unipodal com Resistência Elástica.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"impacto_quadril,mmii,propulsão,corrida","foto":"","video":"https://youtu.be/pBs8ijQ0LPg"},
