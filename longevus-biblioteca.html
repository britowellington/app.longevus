{"id":"nc15","nome":"Alongamento de Tronco com o Bastão (Sentado)","grupo":"Alongamento","nivel":"Básico","momento":"Parte Inicial","foco":"Mobilidade Rotacional de Coluna Torácica com Bastão","descricao":"Desenvolve a mobilidade da coluna torácica, melhora a amplitude de rotação do tronco e aumenta a coordenação motora através de rotações controladas com bastão.","execucao":"1. Sentado, coluna ereta, segure o bastão com braços estendidos na altura dos ombros.\n2. Gire o tronco para um lado de forma lenta e controlada.\n3. Retorne ao centro e gire para o outro lado.\n4. Pelve estável durante todo o movimento.","beneficios":"Melhora a mobilidade da coluna torácica, aumenta a amplitude de rotação do tronco, fortalece estabilizadores e melhora a postura.","cuidados":"Coluna ereta durante toda a execução. Pelve estável, evitando compensações. Respeitar a amplitude sem dor.","material":"Bastão + cadeira","obs":"Facilita movimentos de rotação nas atividades da vida diária.","defaultSeries":"3","defaultReps":"8–12 por lado","defaultDescanso":"45s","tags":"cadeira,idoso,alongamento,tronco,bastão,rotação","foto":"","video":"https://youtu.be/Xx5wraMrJRU"},
{"id":"nc16","nome":"Fortalecimento das Mãos (Sentado)","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Força e Coordenação de Dedos e Mãos","descricao":"Desenvolve força, mobilidade e coordenação dos dedos e das mãos através da abertura e fechamento das mãos, contribuindo para a melhora da função manual.","execucao":"1. Sentado, coluna ereta.\n2. Estenda completamente os dedos, abrindo as mãos.\n3. Feche as mãos lentamente até formar um punho confortável.\n4. Repita de forma lenta e controlada.","beneficios":"Fortalece a musculatura das mãos e dedos, melhora a coordenação motora fina, aumenta a mobilidade articular e a força de preensão.","cuidados":"Coluna ereta durante toda a execução. Evitar compensações com ombros e tronco. Movimento lento e controlado.","material":"Cadeira","obs":"Auxilia na realização de atividades como segurar objetos, escrever e abrir recipientes.","defaultSeries":"3","defaultReps":"15–20","defaultDescanso":"45s","tags":"cadeira,idoso,mmss,mãos,coordenação fina","foto":"","video":"https://youtu.be/oUBZGXaWvto"},
{"id":"nc17","nome":"Alongamento do Punho — Flexão (Sentado)","grupo":"Alongamento","nivel":"Básico","momento":"Parte Inicial","foco":"Alongamento de Antebraço, Punho e Mãos","descricao":"Promove o alongamento da musculatura do antebraço, punho e mãos, melhorando a mobilidade articular e reduzindo a tensão muscular.","execucao":"1. Sentado, coluna ereta, cotovelo do braço a ser alongado totalmente estendido.\n2. Aplique leve pressão com a outra mão sobre a palma até sentir um alongamento confortável.\n3. Sustente pelo tempo determinado, respirando lentamente.\n4. Retorne e alterne o braço.","beneficios":"Melhora a mobilidade do punho, alonga a musculatura flexora e extensora do antebraço, reduz a rigidez das mãos e punhos.","cuidados":"Coluna ereta durante toda a execução. Cotovelo totalmente estendido. Evitar movimentos bruscos ou forçar além do limite confortável.","material":"Cadeira","obs":"Facilita atividades como escrever, segurar objetos e abrir recipientes.","defaultSeries":"3","defaultReps":"20–30s por braço","defaultDescanso":"30s","tags":"cadeira,idoso,alongamento,punho,antebraço","foto":"","video":"https://youtu.be/-tTCn8t8WRw"},
{"id":"nc18","nome":"Alongamento do Punho — Extensão (Sentado)","grupo":"Alongamento","nivel":"Básico","momento":"Parte Inicial","foco":"Alongamento de Musculatura Extensora do Antebraço","descricao":"Promove o alongamento da musculatura extensora do antebraço e do punho, melhorando a mobilidade articular e reduzindo a tensão muscular.","execucao":"1. Sentado, coluna ereta, cotovelo do braço a ser alongado totalmente estendido.\n2. Flexione o punho para baixo, auxiliando suavemente com a outra mão.\n3. Aplique apenas leve pressão, sem dor.\n4. Sustente, respire lentamente, retorne e alterne o braço.","beneficios":"Alonga a musculatura extensora do antebraço, melhora a mobilidade do punho, reduz a rigidez das mãos e punhos.","cuidados":"Coluna ereta durante toda a execução. Cotovelo totalmente estendido. Apenas leve pressão, sem provocar dor.","material":"Cadeira","obs":"Facilita atividades como escrever, segurar objetos e cozinhar.","defaultSeries":"3","defaultReps":"20–30s por braço","defaultDescanso":"30s","tags":"cadeira,idoso,alongamento,punho,antebraço,extensor","foto":"","video":"https://youtu.be/FhT8JVXovG8"},
{"id":"nc19","nome":"Relaxamento dos Punhos — Pronossupinação (Sentado)","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Mobilidade de Antebraço, Punhos e Cotovelos","descricao":"Desenvolve a mobilidade do antebraço, punhos e cotovelos, melhorando a coordenação motora e a funcionalidade dos membros superiores.","execucao":"1. Sentado, coluna ereta, cotovelos estendidos, ombros relaxados.\n2. Gire lentamente as palmas das mãos para cima (supinação).\n3. Gire para baixo (pronação).\n4. Movimento apenas nos antebraços, de forma lenta e controlada.","beneficios":"Melhora a mobilidade do antebraço e dos punhos, aumenta a coordenação motora, reduz a rigidez articular.","cuidados":"Coluna ereta durante toda a execução. Cotovelos estendidos, ombros relaxados. Evitar compensações com os ombros.","material":"Cadeira","obs":"Facilita atividades como girar maçanetas, usar talheres e manipular objetos.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"cadeira,idoso,mobilidade,punho,antebraço,pronossupinação","foto":"","video":"https://youtu.be/mMi00VOMh_o"},
{"id":"nc20","nome":"Fortalecimento da Panturrilha (Sentado)","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Flexão Plantar de Tornozelos na Posição Sentada","descricao":"Desenvolve a força da panturrilha através da flexão plantar dos tornozelos na posição sentada, contribuindo para uma marcha mais segura e melhor estabilidade dos membros inferiores.","execucao":"1. Sentado, coluna ereta, pés totalmente apoiados no chão.\n2. Eleve os calcanhares o máximo possível, ponta dos pés apoiada.\n3. Retorne lentamente à posição inicial.\n4. Repita de forma controlada.","beneficios":"Fortalece a musculatura da panturrilha, melhora a estabilidade dos tornozelos, aumenta a força para caminhar e a circulação dos membros inferiores.","cuidados":"Coluna ereta e pés totalmente apoiados no chão. Evitar compensações com o tronco ou balanço do corpo.","material":"Cadeira","obs":"Maior segurança e independência nas atividades da vida diária.","defaultSeries":"3","defaultReps":"12–20","defaultDescanso":"45s","tags":"cadeira,idoso,mmii,panturrilha,tornozelo","foto":"","video":"https://youtu.be/rDE7BL_7Ets"},
{"id":"nc21","nome":"Fortalecimento da Coxa — Extensão de Joelho (Sentado)","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Quadríceps na Posição Sentada","descricao":"Desenvolve a força do quadríceps através da extensão do joelho na posição sentada, melhorando a estabilidade dos membros inferiores e a capacidade funcional.","execucao":"1. Sentado, coluna ereta e bem apoiada.\n2. Estenda o joelho de uma perna até uma amplitude confortável, sem hiperestender.\n3. Retorne lentamente à posição inicial.\n4. Repita, depois alterne a perna.","beneficios":"Fortalece o quadríceps, melhora a estabilidade do joelho, aumenta a força para levantar da cadeira, caminhar e subir escadas.","cuidados":"Coluna ereta e bem apoiada na cadeira. Evitar hiperestender o joelho. Evitar movimentos bruscos ou balanço do tronco.","material":"Cadeira","obs":"Contribui para a manutenção da funcionalidade e da mobilidade.","defaultSeries":"3","defaultReps":"10–15 por perna","defaultDescanso":"45s","tags":"cadeira,idoso,mmii,quadríceps,sentado","foto":"","video":"https://youtu.be/8ZXFEnHFIf8"},
{"id":"nc22","nome":"Relaxamento dos Ombros — Circundução (Sentado)","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Mobilidade de Ombros e Redução de Tensão","descricao":"Desenvolve a mobilidade dos ombros, reduz a tensão muscular e melhora a amplitude de movimento através da circundução controlada dos ombros.","execucao":"1. Sentado, coluna ereta.\n2. Realize rotações amplas e lentas dos ombros para frente.\n3. Realize o mesmo número de rotações para trás.\n4. Pescoço relaxado durante toda a execução.","beneficios":"Melhora a mobilidade dos ombros, reduz a tensão cervical e dos trapézios, melhora a postura e a circulação local.","cuidados":"Coluna ereta durante toda a execução. Evitar elevar excessivamente os ombros ou movimentos bruscos. Sem dor.","material":"Cadeira","obs":"Facilita movimentos de alcance e elevação dos braços.","defaultSeries":"3","defaultReps":"10–15 para cada direção","defaultDescanso":"45s","tags":"cadeira,idoso,mobilidade,ombros,circundução","foto":"","video":"https://youtu.be/lKzDwlSs_Sw"},
{"id":"nc23","nome":"Alongamento de Glúteo e Coxa — Figura 4 (Sentado)","grupo":"Alongamento","nivel":"Básico","momento":"Parte Inicial","foco":"Alongamento de Glúteos e Rotadores Externos","descricao":"Promove o alongamento da musculatura do glúteo, dos rotadores externos e da região posterior do quadril, melhorando a mobilidade e reduzindo a rigidez articular.","execucao":"1. Sentado, coluna ereta.\n2. Cruze uma perna sobre a outra.\n3. Abrace o joelho em direção ao peito até sentir um alongamento confortável.\n4. Sustente, respire de forma lenta, retorne e alterne o lado.","beneficios":"Alonga glúteos e quadril, melhora a mobilidade do quadril, alivia a tensão lombar e melhora a postura.","cuidados":"Coluna ereta na posição inicial. Evitar inclinar excessivamente o tronco ou forçar o movimento. Respirar lentamente.","material":"Cadeira","obs":"Facilita atividades como sentar, levantar e caminhar.","defaultSeries":"3","defaultReps":"20–30s por lado","defaultDescanso":"30s","tags":"cadeira,idoso,alongamento,glúteo,quadril","foto":"","video":"https://youtu.be/Kop9nDdQ8vQ"},
{"id":"nc24","nome":"Alongamento da Coxa — Quadríceps (com Apoio na Cadeira)","grupo":"Alongamento","nivel":"Básico","momento":"Parte Inicial","foco":"Alongamento de Quadríceps e Flexores de Quadril","descricao":"Promove o alongamento da musculatura anterior da coxa (quadríceps) e dos flexores do quadril, melhorando a mobilidade dos membros inferiores e a amplitude de movimento.","execucao":"1. Em pé, usando a cadeira como apoio.\n2. Segure o tornozelo de uma perna e aproxime o calcanhar dos glúteos.\n3. Sustente até sentir um alongamento confortável, joelhos alinhados.\n4. Retorne e alterne a perna.","beneficios":"Alonga o quadríceps, melhora a mobilidade do quadril, aumenta a amplitude de movimento dos membros inferiores e reduz risco de quedas.","cuidados":"Tronco ereto durante toda a execução. Joelhos alinhados, sem afastar a perna para o lado. Evitar compensações com a coluna lombar.","material":"Cadeira (apoio)","obs":"Facilita a caminhada, subida de escadas e o ato de levantar-se.","defaultSeries":"3","defaultReps":"20–30s por perna","defaultDescanso":"30s","tags":"cadeira,idoso,alongamento,quadríceps,quadril","foto":"","video":"https://youtu.be/SX7ciI-1muE"},
{"id":"nc25","nome":"Alongamento de Coluna — Flexão com Apoio na Cadeira","grupo":"Alongamento","nivel":"Básico","momento":"Parte Inicial","foco":"Alongamento de Cadeia Posterior Completa","descricao":"Promove o alongamento da cadeia posterior, incluindo coluna, ombros, dorsais, quadris e isquiotibiais, melhorando a mobilidade global e a flexibilidade.","execucao":"1. Em pé, mãos apoiadas na cadeira.\n2. Afaste o quadril para trás, joelhos levemente flexionados se necessário.\n3. Mantenha a coluna alinhada, sustente a posição.\n4. Respire de forma lenta e contínua.","beneficios":"Alonga a cadeia muscular posterior, melhora a mobilidade da coluna e dos ombros, aumenta a flexibilidade dos isquiotibiais.","cuidados":"Coluna alinhada durante toda a execução. Evitar compensações ou movimentos bruscos. Sem dor.","material":"Cadeira (apoio)","obs":"Facilita movimentos de alcance e flexão do tronco nas atividades da vida diária.","defaultSeries":"3","defaultReps":"20–30s","defaultDescanso":"30s","tags":"cadeira,idoso,alongamento,coluna,cadeia posterior","foto":"","video":"https://youtu.be/gSH8V2YVYBU"},
{"id":"nc26","nome":"Alongamento da Coluna e Glúteo (com Apoio na Cadeira)","grupo":"Alongamento","nivel":"Básico","momento":"Parte Inicial","foco":"Alongamento de Glúteos e Cadeia Posterior","descricao":"Promove o alongamento dos glúteos, da região posterior do quadril e da cadeia posterior, melhorando a mobilidade, o equilíbrio e a flexibilidade dos membros inferiores.","execucao":"1. Mãos apoiadas na cadeira, uma perna cruzada sobre a outra.\n2. Flexione lentamente o tronco até sentir um alongamento confortável na região do glúteo.\n3. Mantenha a coluna alinhada.\n4. Retorne e alterne a perna.","beneficios":"Alonga a musculatura dos glúteos e a cadeia posterior, melhora a mobilidade do quadril, o equilíbrio e a postura.","cuidados":"Coluna alinhada durante toda a execução. Evitar movimentos bruscos. Respeitar a amplitude individual.","material":"Cadeira (apoio)","obs":"Facilita movimentos como caminhar, agachar e levantar-se.","defaultSeries":"3","defaultReps":"20–30s por perna","defaultDescanso":"30s","tags":"cadeira,idoso,alongamento,glúteo,coluna","foto":"","video":"https://youtu.be/u1IqezLAQrU"},
{"id":"nc27","nome":"Fortalecimento de Panturrilha (com Apoio na Cadeira)","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Panturrilha e Estabilidade de Tornozelo em Pé","descricao":"Desenvolve a força da musculatura da panturrilha e melhora a estabilidade dos tornozelos através da elevação dos calcanhares com apoio na cadeira.","execucao":"1. Em pé, mãos apoiadas na cadeira apenas para o equilíbrio.\n2. Eleve os calcanhares o máximo possível, permanecendo na ponta dos pés.\n3. Retorne lentamente à posição inicial.\n4. Repita de forma controlada, sem balançar o corpo.","beneficios":"Fortalece a panturrilha, melhora a estabilidade dos tornozelos, aumenta a força para caminhar e subir escadas, estimula a circulação.","cuidados":"Tronco ereto durante toda a execução. Cadeira usada apenas para auxiliar o equilíbrio. Evitar balanços do corpo.","material":"Cadeira (apoio)","obs":"Maior independência para realizar as atividades da vida diária.","defaultSeries":"3","defaultReps":"12–20","defaultDescanso":"45s","tags":"cadeira,idoso,mmii,panturrilha,tornozelo","foto":"","video":"https://youtu.be/Hu-1667XC3A"},
{"id":"nc28","nome":"Fortalecimento de Coxa — Extensão de Quadril (com Apoio na Cadeira)","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Glúteos e Isquiotibiais via Extensão de Quadril","descricao":"Desenvolve a força dos glúteos e da musculatura posterior da coxa através da extensão controlada do quadril, melhorando a estabilidade pélvica e a funcionalidade dos membros inferiores.","execucao":"1. Em pé, mãos apoiadas na cadeira apenas para o equilíbrio.\n2. Estenda uma perna para trás, sem inclinar excessivamente o tronco.\n3. Joelho da perna em movimento levemente estendido.\n4. Retorne lentamente, depois alterne a perna.","beneficios":"Fortalece glúteos e isquiotibiais, melhora a estabilidade do quadril e da pelve, aumenta a força para caminhar e subir escadas.","cuidados":"Tronco ereto durante toda a execução. Cadeira usada apenas para auxiliar o equilíbrio. Movimento lento e controlado.","material":"Cadeira (apoio)","obs":"Maior estabilidade durante a marcha, promovendo independência nas atividades da vida diária.","defaultSeries":"3","defaultReps":"10–15 por perna","defaultDescanso":"45s","tags":"cadeira,idoso,mmii,glúteo,isquiotibiais","foto":"","video":"https://youtu.be/SPDU-mfeNaw"},
{"id":"nc29","nome":"Fortalecimento do Quadril — Elevação Lateral (com Apoio na Cadeira)","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Abdutores de Quadril (Glúteo Médio/Mínimo)","descricao":"Desenvolve a força dos músculos abdutores do quadril, melhora a estabilidade pélvica e o equilíbrio através da elevação lateral controlada da perna.","execucao":"1. Em pé, mãos apoiadas na cadeira apenas para o equilíbrio.\n2. Eleve a perna lateralmente até uma amplitude confortável.\n3. Retorne lentamente à posição inicial.\n4. Repita, depois alterne a perna.","beneficios":"Fortalece os abdutores do quadril, melhora a estabilidade pélvica, aumenta o equilíbrio durante a marcha.","cuidados":"Tronco ereto durante toda a execução. Evitar inclinar o tronco ou girar o quadril. Movimento lento e controlado.","material":"Cadeira (apoio)","obs":"Maior estabilidade para caminhar e subir escadas.","defaultSeries":"3","defaultReps":"10–15 por perna","defaultDescanso":"45s","tags":"cadeira,idoso,mmii,quadril,abdutores","foto":"","video":"https://youtu.be/vJlTvVo66KI"},
{"id":"nc30","nome":"Fortalecimento de Flexores de Quadril — Elevação Frontal (com Apoio na Cadeira)","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Flexores de Quadril e Quadríceps em Pé","descricao":"Desenvolve a força dos flexores do quadril e do quadríceps, melhorando o equilíbrio, a estabilidade e o controle dos membros inferiores durante movimentos funcionais.","execucao":"1. Em pé, mãos apoiadas na cadeira apenas para o equilíbrio.\n2. Eleve a perna à frente mantendo o joelho estendido.\n3. Retorne lentamente à posição inicial.\n4. Repita, depois alterne a perna.","beneficios":"Fortalece flexores de quadril e quadríceps, melhora o equilíbrio e a coordenação motora, aumenta a estabilidade durante a marcha.","cuidados":"Tronco ereto durante toda a execução. Evitar inclinar o tronco ou compensar com a pelve. Movimento lento e controlado.","material":"Cadeira (apoio)","obs":"NOTA: o vídeo original está nomeado 'Alongamento de Panturrilha', mas o conteúdo descreve um fortalecimento (elevação de perna). Nome ajustado ao conteúdo real — confirmar com a fonte se necessário.","defaultSeries":"3","defaultReps":"10–15 por perna","defaultDescanso":"45s","tags":"cadeira,idoso,mmii,quadril,quadríceps","foto":"","video":"https://youtu.be/3_fdx7sxOtk"},
{"id":"fc01","nome":"Senta e Levanta","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Transição Sentado-Em Pé Funcional","descricao":"Desenvolve força dos membros inferiores, melhora a capacidade funcional e aumenta a independência para a transição entre sentado e em pé.","execucao":"1. Sentado, pés afastados na largura dos ombros.\n2. Incline levemente o tronco à frente e levante-se, sem impulsionar excessivamente.\n3. Fique em pé, coluna alinhada.\n4. Sente-se de forma lenta e controlada.","beneficios":"Fortalece quadríceps, glúteos e posteriores da coxa, melhora a força funcional, o equilíbrio e a coordenação motora.","cuidados":"Coluna alinhada durante toda a execução. Levantar sem impulso excessivo. Usar os braços apenas quando necessário.","material":"Cadeira","obs":"Promove maior independência e qualidade de vida para idosos.","defaultSeries":"3","defaultReps":"8–15","defaultDescanso":"75s","tags":"força em casa,idoso,mmii,senta e levanta,funcional","foto":"","video":"https://youtu.be/UV49j7t7eTg"},
{"id":"fc02","nome":"Senta e Levanta Apoiado","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Transição Sentado-Em Pé com Apoio","descricao":"Desenvolve força dos membros inferiores e aumenta a independência funcional através da transição sentado/em pé utilizando apoio para maior segurança.","execucao":"1. Sentado, pés na largura dos ombros, próximo a um apoio firme.\n2. Incline levemente o tronco à frente e levante-se, usando o apoio apenas como auxílio.\n3. Fique em pé, coluna alinhada.\n4. Sente-se de forma lenta e controlada.","beneficios":"Fortalece quadríceps, glúteos e posteriores da coxa, melhora a força funcional e a segurança na transição.","cuidados":"Apoio usado apenas como auxílio, evitando sustentar todo o peso nos braços. Coluna alinhada durante toda a execução.","material":"Apoio firme (barra ou parede)","obs":"Promove maior independência e segurança para idosos.","defaultSeries":"3","defaultReps":"8–15","defaultDescanso":"75s","tags":"força em casa,idoso,mmii,senta e levanta,apoio","foto":"","video":"https://youtu.be/UtoqVEyDub4"},
{"id":"fc03","nome":"Sentar e Levantar com Elevação dos Calcanhares","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Transição Funcional + Panturrilha","descricao":"Desenvolve força dos membros inferiores e da panturrilha, melhora o equilíbrio e a coordenação motora durante a transição sentado/em pé com elevação de calcanhares.","execucao":"1. Sentado, pés na largura dos ombros.\n2. Levante-se de forma controlada.\n3. Ao final da subida, eleve os calcanhares, ponta dos pés apoiada, por 1-2 segundos.\n4. Retorne os calcanhares ao solo antes de sentar novamente.","beneficios":"Fortalece quadríceps, glúteos e panturrilhas, melhora o equilíbrio, a coordenação motora e a estabilidade dos tornozelos.","cuidados":"Pés na largura dos ombros. Sentar lentamente, mantendo o controle. Usar apoio se necessário.","material":"Cadeira","obs":"Aprimora a capacidade funcional e a autonomia.","defaultSeries":"3","defaultReps":"8–12","defaultDescanso":"75s","tags":"força em casa,idoso,mmii,senta e levanta,panturrilha","foto":"","video":"https://youtu.be/evx-BE7Rqik"},
{"id":"fc04","nome":"Sentar e Levantar com Ativação dos Pés","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Velocidade de Reação + Transição Funcional","descricao":"Desenvolve força dos membros inferiores, melhora a velocidade de reação dos pés e aumenta a capacidade funcional através da ativação dos pés antes da transição sentado/em pé.","execucao":"1. Sentado, pés totalmente apoiados no solo.\n2. Realize pequenas batidas alternadas dos pés no chão.\n3. Levante-se de forma rápida, porém controlada.\n4. Sente-se lentamente, mantendo o controle.","beneficios":"Fortalece quadríceps, glúteos e panturrilhas, melhora a velocidade de reação, a coordenação motora e a agilidade funcional.","cuidados":"Coluna alinhada durante toda a execução. Usar apoio apenas quando necessário.","material":"Cadeira","obs":"Maior facilidade para levantar-se e iniciar a marcha no dia a dia.","defaultSeries":"3","defaultReps":"8–12","defaultDescanso":"75s","tags":"força em casa,idoso,mmii,senta e levanta,reação","foto":"","video":"https://youtu.be/nGRVVyRRFho"},
{"id":"fc05","nome":"Agachamento Senta e Levanta com Carga","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Força Funcional de MMII, Core e MMSS com Carga","descricao":"Desenvolve força dos membros inferiores, do core e dos membros superiores através da transição sentado/em pé com carga, melhorando a capacidade funcional e a autonomia.","execucao":"1. Sentado, segure a carga próxima ao peito, pés na largura dos ombros.\n2. Incline levemente o tronco à frente e levante-se de forma controlada.\n3. Fique em pé, coluna alinhada, joelhos sem projetar excessivamente à frente.\n4. Sente-se lentamente.","beneficios":"Fortalece quadríceps, glúteos, core e membros superiores, aumenta a estabilidade e o equilíbrio.","cuidados":"Carga próxima ao peito durante toda a execução. Coluna alinhada. Carga compatível com a capacidade do praticante.","material":"Carga leve (halter ou similar) + cadeira","obs":"Facilita atividades como sentar, levantar, caminhar e carregar objetos.","defaultSeries":"3","defaultReps":"8–12","defaultDescanso":"75s","tags":"força em casa,idoso,mmii,senta e levanta,carga","foto":"","video":"https://youtu.be/JLnQDx5XNpI"},
{"id":"fc06","nome":"Sentar e Levantar com Apoio e Elevação dos Calcanhares","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Transição Funcional + Panturrilha com Apoio","descricao":"Desenvolve força dos membros inferiores e da panturrilha, melhora o equilíbrio e a independência funcional através da transição sentado/em pé com apoio e elevação dos calcanhares.","execucao":"1. Sentado, próximo a uma parede ou apoio firme.\n2. Levante-se de forma controlada, usando o apoio apenas para o equilíbrio.\n3. Ao final da subida, eleve os calcanhares por 1-2 segundos.\n4. Retorne os calcanhares ao solo antes de sentar novamente.","beneficios":"Fortalece quadríceps, glúteos, posteriores da coxa e panturrilhas, melhora o equilíbrio e a estabilidade dos tornozelos.","cuidados":"Apoio usado apenas para o equilíbrio. Coluna alinhada durante toda a execução. Sentar lentamente.","material":"Cadeira + parede (apoio)","obs":"Promove a independência funcional e a qualidade de vida.","defaultSeries":"3","defaultReps":"8–12","defaultDescanso":"75s","tags":"força em casa,idoso,mmii,senta e levanta,panturrilha,apoio","foto":"","video":"https://youtu.be/e3RIawVa1-g"},
{"id":"fc07","nome":"Agachamento na Parede com Bola","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Agachamento Guiado com Suporte Lombar","descricao":"Desenvolve força dos membros inferiores utilizando a bola como apoio na parede, melhorando a estabilidade, o controle do movimento e a capacidade funcional.","execucao":"1. Posicione a bola entre a região lombar e a parede.\n2. Pés afastados na largura dos ombros, ligeiramente à frente do corpo.\n3. Agache até uma amplitude confortável, joelhos alinhados com a ponta dos pés.\n4. Retorne lentamente à posição inicial.","beneficios":"Fortalece quadríceps, glúteos e posteriores da coxa, melhora a estabilidade dos joelhos e quadris e desenvolve equilíbrio.","cuidados":"Amplitude confortável, sem dor. Joelhos alinhados com a ponta dos pés. Movimento lento e controlado.","material":"Bola suíça + parede","obs":"Melhora a confiança durante os movimentos funcionais.","defaultSeries":"3","defaultReps":"8–12","defaultDescanso":"75s","tags":"força em casa,idoso,mmii,agachamento,bola","foto":"","video":"https://youtu.be/1GFULiJ0Jlo"},
{"id":"fc08","nome":"Prancha Adaptada na Cadeira","grupo":"Core","nivel":"Intermediário","momento":"Parte Principal","foco":"Estabilidade de Core em Prancha Alta Adaptada","descricao":"Fortalece a musculatura do core, ombros e membros superiores, melhorando a estabilidade do tronco, a postura e o controle corporal.","execucao":"1. Apoie as mãos sobre uma cadeira, sofá ou apoio firme e estável.\n2. Corpo alinhado da cabeça aos pés.\n3. Contraia o abdômen, mantendo braços estendidos e ombros alinhados.\n4. Sustente a posição pelo tempo determinado.","beneficios":"Fortalece o core, melhora a estabilidade da coluna, fortalece ombros e membros superiores, melhora a postura.","cuidados":"Corpo alinhado da cabeça aos pés. Evitar elevar ou abaixar excessivamente o quadril. Interromper se houver dor ou perda do alinhamento.","material":"Cadeira ou sofá (apoio)","obs":"Reduz o risco de dores lombares.","defaultSeries":"3","defaultReps":"20–40s","defaultDescanso":"60s","tags":"força em casa,idoso,core,prancha,adaptada","foto":"","video":"https://youtu.be/sg4h1peCaHQ"},
{"id":"fc09","nome":"Prancha Adaptada nos Antebraços na Cadeira","grupo":"Core","nivel":"Intermediário","momento":"Parte Principal","foco":"Estabilidade de Core em Prancha Baixa Adaptada","descricao":"Fortalece a musculatura do core, ombros e músculos estabilizadores, melhorando a estabilidade da coluna, a postura e o controle corporal.","execucao":"1. Apoie os antebraços sobre uma cadeira, sofá ou apoio firme e estável.\n2. Corpo alinhado da cabeça aos pés.\n3. Contraia o abdômen, pescoço alinhado com a coluna.\n4. Sustente a posição pelo tempo determinado.","beneficios":"Fortalece o core, melhora a estabilidade da coluna e dos ombros, aumenta o equilíbrio e o controle corporal.","cuidados":"Corpo alinhado da cabeça aos pés. Evitar elevar ou abaixar excessivamente o quadril. Interromper se houver dor ou perda do alinhamento.","material":"Cadeira ou sofá (apoio)","obs":"Maior estabilidade para as atividades da vida diária.","defaultSeries":"3","defaultReps":"20–40s","defaultDescanso":"60s","tags":"força em casa,idoso,core,prancha,antebraços","foto":"","video":"https://youtu.be/_7pFyjyx_eA"},
{"id":"fc10","nome":"Senta e Levanta com Peso e Movimento Rápido","grupo":"MMII","nivel":"Avançado","momento":"Parte Principal","foco":"Potência Funcional + Velocidade de Reação","descricao":"Desenvolve força dos membros inferiores, potência funcional e velocidade de reação através da transição sentado/em pé com carga após um estímulo de reatividade.","execucao":"1. Sentado, segure a carga próxima ao peito.\n2. Realize o estímulo de reatividade antes de iniciar a subida.\n3. Levante-se de forma rápida, mantendo o controle.\n4. Sente-se lentamente, evitando impacto no banco.","beneficios":"Fortalece quadríceps, glúteos e posteriores da coxa, desenvolve potência funcional e melhora a velocidade de reação e a agilidade.","cuidados":"Carga próxima ao peito durante toda a execução. Coluna alinhada, joelhos direcionados para a ponta dos pés. Carga compatível com a capacidade do praticante.","material":"Carga leve + cadeira","obs":"Maior independência e segurança nas atividades da vida diária.","defaultSeries":"3","defaultReps":"6–10","defaultDescanso":"75s","tags":"força em casa,idoso,mmii,senta e levanta,potência,avançado","foto":"","video":"https://youtu.be/eJm8U9sCmLI"},
{"id":"fc11","nome":"Prancha Adaptada com Elevação Alternada das Pernas","grupo":"Core","nivel":"Avançado","momento":"Parte Principal","foco":"Estabilidade de Core + Ativação de Glúteos","descricao":"Fortalece a musculatura do core, glúteos e membros inferiores, melhorando a estabilidade do tronco, o equilíbrio e o controle postural.","execucao":"1. Apoie os antebraços sobre uma cadeira, sofá ou apoio firme e estável.\n2. Corpo alinhado da cabeça aos pés, abdômen contraído.\n3. Eleve uma perna por vez, sem movimentar excessivamente o quadril.\n4. Retorne lentamente e alterne a perna.","beneficios":"Fortalece o core, glúteos e musculatura estabilizadora, melhora o equilíbrio, a estabilidade corporal e a coordenação motora.","cuidados":"Corpo alinhado da cabeça aos pés. Evitar movimentar excessivamente o quadril. Interromper se houver dor lombar ou perda do alinhamento.","material":"Cadeira ou sofá (apoio)","obs":"Facilita as atividades da vida diária que exigem estabilidade do tronco.","defaultSeries":"3","defaultReps":"8–12 por perna","defaultDescanso":"60s","tags":"força em casa,idoso,core,prancha,glúteo,avançado","foto":"","video":"https://youtu.be/opdGmaDuzAU"},
{"id":"fc12","nome":"Prancha Adaptada com Toque no Ombro","grupo":"Core","nivel":"Avançado","momento":"Parte Principal","foco":"Estabilidade de Core em Movimento com Anti-Rotação","descricao":"Fortalece a musculatura do core, dos ombros e dos membros superiores, melhorando a estabilidade do tronco, o equilíbrio e a coordenação motora através do toque alternado nos ombros.","execucao":"1. Apoie uma das mãos sobre uma cadeira, sofá ou apoio firme e estável.\n2. Corpo alinhado da cabeça aos pés, abdômen contraído.\n3. Toque o ombro oposto sem movimentar excessivamente o quadril.\n4. Alterne os lados de forma lenta e controlada.","beneficios":"Fortalece o core, melhora a estabilidade do tronco e dos ombros, desenvolve coordenação motora e aumenta o equilíbrio corporal.","cuidados":"Corpo alinhado da cabeça aos pés. Movimento lento e controlado. Interromper se houver dor ou perda do alinhamento.","material":"Cadeira ou sofá (apoio)","obs":"Facilita atividades da vida diária que exigem estabilidade e sustentação corporal.","defaultSeries":"3","defaultReps":"8–12 por lado","defaultDescanso":"60s","tags":"força em casa,idoso,core,prancha,anti-rotação,avançado","foto":"","video":"https://youtu.be/pYTlNUBkAlM"},
{"id":"el01","nome":"Fortalecimento dos Braços — Rosca com Elástico (Palmas para Frente)","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Bíceps com Elástico sob os Pés","descricao":"Fortalece a musculatura dos braços, especialmente o bíceps, melhorando a força funcional dos membros superiores para atividades do dia a dia.","execucao":"1. Pés sobre o elástico, palmas das mãos voltadas para frente.\n2. Cotovelos próximos ao corpo.\n3. Flexione os cotovelos, elevando as mãos em direção aos ombros.\n4. Retorne lentamente à posição inicial.","beneficios":"Fortalece os bíceps, melhora a força dos membros superiores e a estabilidade dos cotovelos.","cuidados":"Pés posicionados sobre o elástico de forma segura. Cotovelos próximos ao corpo durante toda a execução. Resistência compatível com a capacidade do praticante.","material":"Faixa elástica","obs":"Facilita atividades como carregar sacolas, levantar objetos e puxar materiais.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,bíceps,rosca","foto":"","video":"https://youtu.be/efmj9Mw46to"},
{"id":"el02","nome":"Fortalecimento dos Braços — Rosca com Elástico (Variação 2)","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Bíceps com Elástico sob os Pés","descricao":"Fortalece a musculatura dos braços, principalmente o bíceps, melhorando a força funcional dos membros superiores para as atividades da vida diária.","execucao":"1. Pés sobre o elástico, palmas das mãos voltadas para frente.\n2. Cotovelos próximos ao corpo.\n3. Flexione os cotovelos, levando as mãos em direção aos ombros.\n4. Retorne lentamente, sem movimentar o tronco.","beneficios":"Fortalece os bíceps, melhora a força dos membros superiores e a estabilidade dos cotovelos.","cuidados":"Pés posicionados sobre o elástico de forma segura. Evitar movimentar o tronco durante o exercício.","material":"Faixa elástica","obs":"Facilita atividades como carregar sacolas, levantar objetos e puxar materiais.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,bíceps,rosca","foto":"","video":"https://youtu.be/L0lTILl-hws"},
{"id":"el03","nome":"Fortalecimento dos Braços — Rosca Martelo com Elástico","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Bíceps e Braquial com Elástico sob os Pés","descricao":"Fortalece a musculatura dos braços, especialmente o bíceps e o braquial, melhorando a força funcional dos membros superiores para as atividades da vida diária.","execucao":"1. Pés sobre o elástico, palmas das mãos voltadas uma para a outra.\n2. Cotovelos próximos ao corpo.\n3. Flexione os cotovelos, elevando as mãos em direção aos ombros.\n4. Retorne lentamente, sem movimentar o tronco.","beneficios":"Fortalece bíceps e braquial, melhora a força dos membros superiores e a estabilidade dos cotovelos.","cuidados":"Pés posicionados sobre o elástico de forma segura. Evitar movimentar o tronco durante o exercício.","material":"Faixa elástica","obs":"Facilita atividades como carregar sacolas, segurar objetos e levantar materiais.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,bíceps,rosca martelo","foto":"","video":"https://youtu.be/WQ20-CYpUlk"},
{"id":"el04","nome":"Fortalecimento dos Ombros e Costas — Sustentação Isométrica com Elástico","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Ombros e Musculatura Interescapular (Isométrico)","descricao":"Fortalece a musculatura dos ombros, das costas e da região das escápulas através da sustentação isométrica com elástico, melhorando a postura e a estabilidade dos membros superiores.","execucao":"1. Segure o elástico com as duas mãos.\n2. Abra os braços até a altura dos ombros, elástico tensionado.\n3. Cotovelos levemente flexionados, tronco ereto, abdômen contraído.\n4. Sustente a posição pelo tempo determinado.","beneficios":"Fortalece ombros e musculatura entre as escápulas, melhora a postura e a estabilidade dos ombros.","cuidados":"Sustentar sem elevar os ombros. Tronco ereto, abdômen contraído. Resistência compatível com a capacidade do praticante.","material":"Faixa elástica","obs":"Facilita atividades que exigem sustentação dos braços.","defaultSeries":"3","defaultReps":"20–30s","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,ombros,escápula,isométrico","foto":"","video":"https://youtu.be/HO_6fGCLlk0"},
{"id":"el05","nome":"Fortalecimento dos Ombros e Costas — Abertura com Elástico","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Ombros e Musculatura Interescapular (Dinâmico)","descricao":"Fortalece a musculatura dos ombros, costas e região das escápulas, melhorando a postura, a estabilidade dos membros superiores e o controle dos movimentos.","execucao":"1. Segure o elástico com as duas mãos, braços elevados na altura dos ombros.\n2. Abra o elástico de forma controlada, aproximando as escápulas.\n3. Retorne lentamente à posição inicial.\n4. Tronco ereto, abdômen contraído.","beneficios":"Fortalece ombros e musculatura entre as escápulas, melhora a postura, a coordenação motora e o controle dos movimentos.","cuidados":"Evitar elevar os ombros durante o movimento. Tronco ereto, abdômen contraído. Resistência compatível com a capacidade do praticante.","material":"Faixa elástica","obs":"Facilita atividades como alcançar, empurrar e puxar objetos.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,ombros,escápula","foto":"","video":"https://youtu.be/NrNn15kXrfQ"},
{"id":"el06","nome":"Fortalecimento do Quadril — Caminhada Lateral com Miniband","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Glúteos e Abdutores em Deslocamento Lateral","descricao":"Fortalece a musculatura dos quadris e membros inferiores, melhorando a estabilidade, o equilíbrio e a coordenação motora através de deslocamentos laterais com resistência da miniband.","execucao":"1. Miniband acima dos tornozelos ou dos joelhos.\n2. Joelhos levemente flexionados.\n3. Dê passos laterais curtos e controlados, mantendo a tensão da miniband.\n4. Evite aproximar totalmente os pés entre os passos.","beneficios":"Fortalece glúteos e abdutores do quadril, melhora a estabilidade dos joelhos e quadris, aumenta o equilíbrio dinâmico.","cuidados":"Joelhos levemente flexionados durante toda a execução. Manter a tensão da miniband. Tronco ereto e abdômen contraído.","material":"Miniband","obs":"Redução do risco de lesões e quedas.","defaultSeries":"3","defaultReps":"10–15 passos por lado","defaultDescanso":"45s","tags":"elásticos,idoso,mmii,quadril,miniband,lateral","foto":"","video":"https://youtu.be/h9P15pJ2TIE"},
{"id":"el07","nome":"Fortalecimento do Quadril — Elevação de Joelho com Miniband","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Flexores de Quadril com Resistência","descricao":"Fortalece os músculos do quadril, abdômen e membros inferiores, melhorando a estabilidade, o equilíbrio e a coordenação motora durante a elevação do joelho.","execucao":"1. Miniband acima dos tornozelos ou dos pés.\n2. Tronco ereto, abdômen contraído.\n3. Eleve um joelho à frente até aproximadamente a altura do quadril.\n4. Retorne lentamente, mantendo a tensão da miniband.","beneficios":"Fortalece os flexores do quadril, melhora a estabilidade da pelve, desenvolve equilíbrio e coordenação motora.","cuidados":"Evitar inclinar o tronco durante a execução. Resistência compatível com a capacidade do praticante.","material":"Miniband","obs":"Aumento da força funcional para caminhar e subir escadas.","defaultSeries":"3","defaultReps":"10–15 por perna","defaultDescanso":"45s","tags":"elásticos,idoso,mmii,quadril,miniband,flexores","foto":"","video":"https://youtu.be/fwBeicf-njc"},
{"id":"el08","nome":"Fortalecimento do Peitoral com Elástico","grupo":"MMSS","nivel":"Intermediário","momento":"Parte Principal","foco":"Peitoral, Ombros e Costas Superiores","descricao":"Fortalece a musculatura dos ombros, peitoral e parte superior das costas, melhorando a estabilidade dos membros superiores, a postura e a coordenação motora através da abertura controlada do braço com elástico.","execucao":"1. Fixe o elástico em um ponto seguro.\n2. Tronco ereto, abdômen contraído.\n3. Segure o elástico com uma das mãos e realize a abertura do braço de forma controlada.\n4. Retorne lentamente, depois alterne o braço.","beneficios":"Fortalece ombros, peitoral e musculatura das costas, melhora a estabilidade dos ombros e a postura.","cuidados":"Evitar compensações com o tronco ou ombros. Resistência compatível com a capacidade do praticante.","material":"Faixa elástica","obs":"Facilita atividades da vida diária como empurrar, puxar e alcançar objetos.","defaultSeries":"3","defaultReps":"10–15 por braço","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,peitoral,ombros","foto":"","video":"https://youtu.be/U45HhjbcGP8"},
{"id":"el09","nome":"Remada Alta com Elástico","grupo":"MMSS","nivel":"Intermediário","momento":"Parte Principal","foco":"Ombros, Trapézio e Braços","descricao":"Fortalece a musculatura dos ombros, trapézio e braços, melhorando a postura, a força dos membros superiores e a estabilidade dos ombros através da remada alta com elástico.","execucao":"1. Pés sobre o elástico, segure com as duas mãos.\n2. Puxe o elástico em direção ao peito, mantendo os cotovelos elevados.\n3. Coluna ereta, abdômen contraído.\n4. Retorne lentamente à posição inicial.","beneficios":"Fortalece ombros, trapézio e braços, melhora a estabilidade dos ombros, a postura e a força funcional.","cuidados":"Pés posicionados sobre o elástico de forma segura. Resistência compatível com a capacidade do praticante.","material":"Faixa elástica","obs":"Facilita atividades como levantar, puxar e carregar objetos.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,remada,ombros,trapézio","foto":"","video":"https://youtu.be/up3cdNRXcYw"},
{"id":"el10","nome":"Fortalecimento das Pernas — Levantamento Terra com Elástico","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Glúteos, Posteriores de Coxa e Lombar (Padrão de Levantar Objetos)","descricao":"Fortalece a musculatura dos membros inferiores, glúteos, posteriores da coxa e lombar, melhorando a força funcional, a postura e a capacidade para levantar objetos do chão.","execucao":"1. Pés sobre o elástico, segure com as duas mãos.\n2. Coluna alinhada, flexione o quadril levando-o para trás, leve flexão dos joelhos.\n3. Retorne à posição inicial contraindo os glúteos.\n4. Evitar arredondar a coluna durante a execução.","beneficios":"Fortalece glúteos e posteriores da coxa, desenvolve a força da lombar e do core, melhora a postura e a força funcional.","cuidados":"Coluna alinhada durante todo o movimento. Evitar arredondar a coluna. Resistência compatível com a capacidade do praticante.","material":"Faixa elástica","obs":"Redução do risco de lesões durante atividades do dia a dia que exigem levantar objetos.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"elásticos,idoso,mmii,glúteo,lombar,levantamento terra","foto":"","video":"https://youtu.be/121DFWvZ-vo"},
{"id":"el11","nome":"Fortalecimento dos Ombros — Elevação Lateral com Elástico","grupo":"MMSS","nivel":"Intermediário","momento":"Parte Principal","foco":"Deltoide Lateral","descricao":"Fortalece a musculatura dos ombros, melhorando a estabilidade, a força dos membros superiores e a capacidade funcional para elevação dos braços.","execucao":"1. Pés sobre o elástico, segure com uma das mãos.\n2. Eleve o braço lateralmente até a altura dos ombros, ou conforme a capacidade individual.\n3. Cotovelo levemente flexionado durante o movimento.\n4. Retorne lentamente, depois alterne o braço.","beneficios":"Fortalece a musculatura dos ombros, melhora a estabilidade da articulação e a força funcional dos membros superiores.","cuidados":"Pés posicionados sobre o elástico de forma segura. Evitar elevar os ombros ou compensar com o tronco.","material":"Faixa elástica","obs":"Facilita atividades como vestir-se, alcançar objetos e levantar os braços.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,ombros,deltoide","foto":"","video":"https://youtu.be/2wIn_8BCH_Q"},
{"id":"el12","nome":"Fortalecimento dos Ombros — Elevação Frontal com Elástico","grupo":"MMSS","nivel":"Intermediário","momento":"Parte Principal","foco":"Deltoide Anterior","descricao":"Fortalece a musculatura dos ombros e dos membros superiores, melhorando a estabilidade, a força funcional e a capacidade para elevar os braços nas atividades do dia a dia.","execucao":"1. Pés sobre o elástico, mãos voltadas para o corpo.\n2. Eleve os braços à frente até a altura dos ombros, ou conforme a capacidade individual.\n3. Cotovelos levemente flexionados durante o movimento.\n4. Retorne lentamente à posição inicial.","beneficios":"Fortalece a musculatura dos ombros, melhora a estabilidade da articulação e desenvolve a força funcional dos membros superiores.","cuidados":"Evitar compensações com o tronco ou elevar excessivamente os ombros. Resistência compatível com a capacidade do praticante.","material":"Faixa elástica","obs":"Facilita atividades como alcançar objetos, vestir-se e levantar materiais leves.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,ombros,deltoide anterior","foto":"","video":"https://youtu.be/ss7XQhTe6jc"},
{"id":"el13","nome":"Fortalecimento dos Braços — Tríceps com Elástico","grupo":"MMSS","nivel":"Intermediário","momento":"Parte Principal","foco":"Tríceps Braquial","descricao":"Fortalece a musculatura do tríceps, melhorando a força dos membros superiores e a capacidade funcional para movimentos de empurrar e estender os braços.","execucao":"1. Fixe o elástico em um ponto seguro.\n2. Cotovelos próximos à cabeça durante toda a execução.\n3. Estenda os cotovelos de forma controlada até a posição final.\n4. Retorne lentamente à posição inicial.","beneficios":"Fortalece o tríceps, melhora a força dos membros superiores e a estabilidade dos ombros e cotovelos.","cuidados":"Abdômen contraído e coluna alinhada. Resistência compatível com a capacidade do praticante.","material":"Faixa elástica","obs":"Facilita atividades como empurrar portas, levantar-se de uma cadeira e alcançar objetos.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,tríceps","foto":"","video":"https://youtu.be/2V89-AZ4edg"},
{"id":"el14","nome":"Fortalecimento dos Braços — Rosca Bíceps com Elástico Fixo","grupo":"MMSS","nivel":"Intermediário","momento":"Parte Principal","foco":"Bíceps com Ponto de Fixação Externo","descricao":"Fortalece a musculatura dos braços, principalmente o bíceps, melhorando a força funcional dos membros superiores e facilitando as atividades da vida diária.","execucao":"1. Fixe o elástico em um ponto seguro.\n2. Tronco ereto, abdômen contraído, cotovelos próximos ao corpo.\n3. Flexione os cotovelos, puxando o elástico em direção ao corpo.\n4. Retorne lentamente à posição inicial.","beneficios":"Fortalece os bíceps, melhora a força dos membros superiores e a estabilidade dos cotovelos.","cuidados":"Cotovelos próximos ao corpo durante toda a execução. Resistência compatível com a capacidade do praticante.","material":"Faixa elástica","obs":"Facilita atividades como puxar objetos, carregar sacolas e levantar materiais leves.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,bíceps,rosca","foto":"","video":"https://youtu.be/SmMYwaT4w2A"},
{"id":"el15","nome":"Fortalecimento das Costas — Remada com Elástico","grupo":"MMSS","nivel":"Intermediário","momento":"Parte Principal","foco":"Costas e Retração Escapular","descricao":"Fortalece a musculatura das costas, melhora a estabilidade dos ombros e a postura através da remada com elástico.","execucao":"1. Fixe o elástico em um ponto seguro.\n2. Tronco levemente inclinado, coluna alinhada, segure o elástico com as duas mãos.\n3. Puxe o elástico em direção ao abdômen, aproximando as escápulas.\n4. Retorne lentamente à posição inicial.","beneficios":"Fortalece a musculatura das costas e braços, melhora a estabilidade dos ombros, a postura e a coordenação motora.","cuidados":"Evitar compensações com o tronco durante o movimento. Resistência compatível com a capacidade do praticante.","material":"Faixa elástica","obs":"Facilita atividades como puxar portas, carregar objetos e levantar materiais.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,costas,remada","foto":"","video":"https://youtu.be/fxZnVvL2K8o"},
{"id":"el16","nome":"Fortalecimento dos Ombros — Elevação Lateral Unilateral com Elástico","grupo":"MMSS","nivel":"Intermediário","momento":"Parte Principal","foco":"Deltoide Lateral Unilateral","descricao":"Fortalece a musculatura dos ombros, melhorando a estabilidade, a força dos membros superiores e a capacidade funcional para os movimentos de elevação dos braços.","execucao":"1. Um dos pés sobre o elástico, segure com a mão correspondente.\n2. Eleve o braço lateralmente até a altura dos ombros, ou conforme a capacidade individual.\n3. Cotovelo levemente flexionado.\n4. Retorne lentamente, depois alterne o braço.","beneficios":"Fortalece a musculatura dos ombros, melhora a estabilidade da articulação e a força funcional dos membros superiores.","cuidados":"Evitar compensações com o tronco ou elevar excessivamente o ombro. Resistência compatível com a capacidade do praticante.","material":"Faixa elástica","obs":"Facilita atividades como vestir-se, alcançar objetos e levantar os braços.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,ombros,unilateral","foto":"","video":"https://youtu.be/HPA9neZmxYc"},
{"id":"el17","nome":"Fortalecimento dos Ombros — Elevação Frontal Unilateral com Elástico","grupo":"MMSS","nivel":"Intermediário","momento":"Parte Principal","foco":"Deltoide Anterior Unilateral","descricao":"Fortalece a musculatura dos ombros e dos membros superiores, melhorando a estabilidade, a força funcional e a capacidade para elevar os braços nas atividades da vida diária.","execucao":"1. Um dos pés sobre o elástico, segure com a mão correspondente.\n2. Eleve o braço à frente até a altura dos ombros, ou conforme a capacidade individual.\n3. Cotovelo levemente flexionado.\n4. Retorne lentamente, depois alterne o braço.","beneficios":"Fortalece a musculatura dos ombros, melhora a estabilidade da articulação e desenvolve a força funcional dos membros superiores.","cuidados":"Evitar compensações com o tronco ou elevar excessivamente o ombro. Resistência compatível com a capacidade do praticante.","material":"Faixa elástica","obs":"Facilita atividades como alcançar objetos, vestir-se e levantar materiais leves.","defaultSeries":"3","defaultReps":"10–15 por braço","defaultDescanso":"45s","tags":"elásticos,idoso,mmss,ombros,unilateral","foto":"","video":"https://youtu.be/8BW2cj3cGCM"},
{"id":"el18","nome":"Passada sobre Obstáculo com Miniband","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Equilíbrio Dinâmico + Glúteos/Abdutores com Resistência","descricao":"Fortalece a musculatura dos quadris e membros inferiores, melhorando o equilíbrio, a coordenação motora e a estabilidade durante a marcha através da passagem sobre um obstáculo com resistência da miniband.","execucao":"1. Miniband acima dos tornozelos ou dos joelhos.\n2. Tronco ereto, abdômen contraído.\n3. Eleve os pés o suficiente para ultrapassar o obstáculo sem tocá-lo.\n4. Movimento lento e controlado, mantendo a tensão da miniband.","beneficios":"Fortalece glúteos e abdutores do quadril, melhora o equilíbrio dinâmico, a coordenação motora e a estabilidade durante a marcha.","cuidados":"Obstáculo baixo e seguro. Manter a tensão da miniband durante toda a execução. Movimento lento e controlado.","material":"Miniband + obstáculo baixo","obs":"Melhora a capacidade para transpor obstáculos no dia a dia, reduzindo risco de quedas.","defaultSeries":"3","defaultReps":"10–15 passadas por lado","defaultDescanso":"45s","tags":"elásticos,idoso,equilíbrio,miniband,obstáculo","foto":"","video":"https://youtu.be/COhW81jFr3M"},
{"id":"el19","nome":"Fortalecimento das Pernas — Extensão de Quadril com Miniband","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Glúteos e Cadeia Posterior com Resistência","descricao":"Fortalece a musculatura dos glúteos e da região posterior do quadril, melhorando a estabilidade da pelve, o equilíbrio e a força funcional durante a marcha.","execucao":"1. Miniband ao redor dos pés ou tornozelos.\n2. Tronco levemente inclinado à frente, coluna alinhada.\n3. Estenda uma perna para trás sem inclinar excessivamente o tronco.\n4. Retorne lentamente, mantendo a tensão da miniband.","beneficios":"Fortalece os glúteos, melhora a estabilidade do quadril e da pelve, aumenta o equilíbrio e a coordenação motora.","cuidados":"Perna de apoio levemente flexionada. Resistência compatível com a capacidade do praticante.","material":"Miniband","obs":"Melhora a marcha e a postura, reduzindo o risco de quedas.","defaultSeries":"3","defaultReps":"10–15 por perna","defaultDescanso":"45s","tags":"elásticos,idoso,mmii,glúteo,miniband,extensão de quadril","foto":"","video":"https://youtu.be/8R1CQvxhVXQ"},
{"id":"el20","nome":"Fortalecimento do Quadril — Extensão Posterior com Miniband","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Glúteos com Resistência ao Redor dos Tornozelos","descricao":"Fortalece a musculatura dos glúteos e melhora a estabilidade do quadril através da extensão posterior da perna com resistência da miniband.","execucao":"1. Miniband ao redor dos tornozelos.\n2. Tronco levemente inclinado à frente, coluna alinhada.\n3. Eleve uma perna para trás sem inclinar excessivamente o tronco.\n4. Retorne lentamente, mantendo a tensão da miniband.","beneficios":"Fortalece os glúteos, melhora a estabilidade do quadril, aumenta o equilíbrio e a coordenação motora.","cuidados":"Perna de apoio levemente flexionada. Resistência compatível com a capacidade do praticante.","material":"Miniband","obs":"Melhora a marcha e reduz o risco de quedas.","defaultSeries":"3","defaultReps":"10–15 por perna","defaultDescanso":"45s","tags":"elásticos,idoso,mmii,glúteo,miniband,quadril","foto":"","video":"https://youtu.be/XH8ODOYULXk"},
{"id":"el21","nome":"Fortalecimento do Quadril — Deslocamento Lateral e Posterior com Miniband","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Glúteos e Abdutores em Padrão Multidirecional","descricao":"Fortalece a musculatura dos quadris e membros inferiores, melhorando a estabilidade, o equilíbrio e a coordenação motora através de deslocamentos lateral e para trás com resistência da miniband.","execucao":"1. Miniband acima dos tornozelos ou dos joelhos.\n2. Joelhos levemente flexionados.\n3. Dê um passo para o lado e, em seguida, um passo para trás de forma controlada.\n4. Mantenha a tensão da miniband durante todo o movimento.","beneficios":"Fortalece glúteos e abdutores do quadril, melhora a estabilidade dos joelhos e quadris, aumenta o equilíbrio dinâmico.","cuidados":"Evitar aproximar totalmente os pés entre as repetições. Tronco ereto e abdômen contraído.","material":"Miniband","obs":"Facilita deslocamentos e mudanças de direção nas atividades da vida diária.","defaultSeries":"3","defaultReps":"10–15 por lado","defaultDescanso":"45s","tags":"elásticos,idoso,mmii,glúteo,miniband,multidirecional","foto":"","video":"https://youtu.be/B8XGBqa0Bek"}

const { useState, useEffect, useRef } = React;
class ErrorBoundary extends React.Component {
  constructor(props){super(props); this.state={err:null};}
  static getDerivedStateFromError(err){return {err};}
  componentDidCatch(err, info){console.error('BOUNDARY CAUGHT:', err, info);}
  render(){
    if(this.state.err){
      const e=this.state.err;
      const msg='ERRO REACT\n\n'+(e && e.message ? e.message : String(e))+'\n\n'+(e && e.stack ? e.stack : '(sem stack)');
      return React.createElement('pre',{style:{padding:16,fontFamily:'monospace',color:'#b91c1c',whiteSpace:'pre-wrap',fontSize:12,background:'#fef2f2',margin:0,minHeight:'100vh'}},msg);
    }
    return this.props.children;
  }
}

const SUPA_KEY = "sb_publishable_VZSgcxu5ps3eR9UAjuRr4Q_B65WTx_h";
const supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);

async function authHeadersFn(){ const { data } = await supa.auth.getSession(); const token = data?.session?.access_token || SUPA_KEY; return { "apikey": SUPA_KEY, "Authorization": "Bearer "+token, "Content-Type": "application/json" }; }

const Login = ({ onLogin }) => {
const [nome,setNome]=useState("");
const [whatsapp,setWhatsapp]=useState("");
const [email,setEmail]=useState("");
const [password,setPassword]=useState("");
const [mode,setMode]=useState("signin"); // signin | signup | forgot
const [error,setError]=useState("");
const [info,setInfo]=useState("");
const [loading,setLoading]=useState(false);
const submit = async (e) => {
e.preventDefault();
setError(""); setInfo(""); setLoading(true);
try {
if (mode==="signin") {
const { error } = await supa.auth.signInWithPassword({ email, password });
if (error) throw error;
} else if (mode==="forgot") {
const { error } = await supa.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split("?")[0].split("#")[0] });
if (error) throw error;
setInfo("Enviamos um link de redefinição para "+email+". Verifique sua caixa de entrada.");
setLoading(false);
return;
} else {
const { error } = await supa.auth.signUp({ email, password, options: { data: { nome, whatsapp } } });
if (error) throw error;
setInfo("Conta criada! Faça login.");
setMode("signin");
setLoading(false);
return;
}
onLogin();
} catch(err) {
setError(err.message || "Erro ao autenticar.");
} finally {
setLoading(false);
}
};
return (
<div style={{ minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f8fafc",padding:20 }}>
<form onSubmit={submit} style={{ background:"#fff",borderRadius:16,padding:28,width:"100%",maxWidth:380,boxShadow:"0 4px 24px rgba(0,0,0,0.06)" }}>
<div style={{ textAlign:"center",marginBottom:18 }}>
<img src={__LOGO__} alt="Longevus" style={{ width:56,height:56,margin:"0 auto 8px",display:"block" }}/>
<div style={{ fontWeight:900,fontSize:20 }}>Longevus</div>
<div style={{ fontSize:12,color:"#94a3b8" }}>Treinamento Neurofuncional</div>
</div>
{mode==="signup" && (
<div style={{ marginBottom:12 }}>
<label style={{ fontSize:12,fontWeight:600,color:"#475569",display:"block",marginBottom:4 }}>Nome</label>
<input type="text" required value={nome} onChange={e=>setNome(e.target.value)} style={{ width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:14,boxSizing:"border-box" }}/>
</div>
)}
{mode==="signup" && (
<div style={{ marginBottom:12 }}>
<label style={{ fontSize:12,fontWeight:600,color:"#475569",display:"block",marginBottom:4 }}>WhatsApp</label>
<input type="tel" required placeholder="(11) 91234-5678" value={whatsapp} onChange={e=>setWhatsapp(e.target.value)} style={{ width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:14,boxSizing:"border-box" }}/>
</div>
)}
<div style={{ marginBottom:12 }}>
<label style={{ fontSize:12,fontWeight:600,color:"#475569",display:"block",marginBottom:4 }}>E-mail</label>
<input type="email" required value={email} onChange={e=>setEmail(e.target.value)} style={{ width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:14,boxSizing:"border-box" }}/>
</div>
{mode!=="forgot" && (
<div style={{ marginBottom:16 }}>
<label style={{ fontSize:12,fontWeight:600,color:"#475569",display:"block",marginBottom:4 }}>Senha</label>
<input type="password" required value={password} onChange={e=>setPassword(e.target.value)} style={{ width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:14,boxSizing:"border-box" }}/>
</div>
)}
{mode==="signin" && (
<div style={{ textAlign:"right",marginTop:-8,marginBottom:16 }}>
<a href="#" onClick={e=>{e.preventDefault();setMode("forgot");setError("");setInfo("");}} style={{ fontSize:12,color:"#94a3b8" }}>Esqueci minha senha</a>
</div>
)}
{error && <div style={{ fontSize:12,color:"#dc2626",marginBottom:12,textAlign:"center" }}>{error}</div>}
{info && <div style={{ fontSize:12,color:"#16a34a",marginBottom:12,textAlign:"center" }}>{info}</div>}
<button type="submit" disabled={loading} style={{ width:"100%",padding:"11px",borderRadius:8,border:"none",background:"#FF5603",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer",opacity:loading?0.7:1 }}>
{loading ? "Aguarde..." : (mode==="signin" ? "Entrar" : mode==="forgot" ? "Enviar link de redefinição" : "Criar conta")}
</button>
<div style={{ textAlign:"center",marginTop:14,fontSize:13 }}>
{mode==="signin" ? (
<span>Não tem conta? <a href="#" onClick={e=>{e.preventDefault();setMode("signup");setError("");setInfo("");}} style={{ color:"#FF5603",fontWeight:600 }}>Criar conta</a></span>
) : (
<span>{mode==="forgot"?"Lembrou a senha?":"Já tem conta?"} <a href="#" onClick={e=>{e.preventDefault();setMode("signin");setError("");setInfo("");}} style={{ color:"#FF5603",fontWeight:600 }}>Entrar</a></span>
)}
</div>
</form>
</div>
);
};

const FotoUpload=({foto,onChange})=>{
  const ref=useRef();
  const handle=e=>{const f=e.target.files[0];if(!f)return;if(f.size>2097152){alert("Máx 2MB");return;}const r=new FileReader();r.onload=ev=>onChange(ev.target.result);r.readAsDataURL(f);};
  return(<div style={{marginBottom:11}}>
    <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:4,textTransform:"uppercase"}}>Foto</div>
    {foto?(<div style={{position:"relative",display:"inline-block"}}><img src={foto} alt="" style={{width:"100%",maxWidth:280,borderRadius:9,border:"1.5px solid #e2e8f0",display:"block",maxHeight:160,objectFit:"cover"}}/><button onClick={()=>onChange("")} style={{position:"absolute",top:5,right:5,border:"none",background:"rgba(0,0,0,0.55)",borderRadius:99,width:24,height:24,color:"#fff",cursor:"pointer",fontSize:12}}>✕</button></div>):(<div onClick={()=>ref.current.click()} style={{border:"2px dashed #cbd5e1",borderRadius:9,padding:"20px 14px",textAlign:"center",cursor:"pointer",background:"#f8fafc"}}><div style={{fontSize:26,marginBottom:5}}>📷</div><div style={{fontSize:12,color:"#64748b"}}>Toque para adicionar foto</div><div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>JPG, PNG — máx. 2MB</div></div>)}
    <input ref={ref} type="file" accept="image/*" onChange={handle} style={{display:"none"}}/>
  </div>);
};

const ResetPassword = ({ onDone }) => {
const [password,setPassword]=useState("");
const [confirm,setConfirm]=useState("");
const [error,setError]=useState("");
const [loading,setLoading]=useState(false);
const submit = async (e) => {
e.preventDefault();
setError("");
if (password.length<6) { setError("A senha deve ter pelo menos 6 caracteres."); return; }
if (password!==confirm) { setError("As senhas não coincidem."); return; }
setLoading(true);
try {
const { error } = await supa.auth.updateUser({ password });
if (error) throw error;
onDone();
} catch(err) {
setError(err.message || "Erro ao redefinir senha.");
} finally {
setLoading(false);
}
};
return (
<div style={{ minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f8fafc",padding:20 }}>
<form onSubmit={submit} style={{ background:"#fff",borderRadius:16,padding:28,width:"100%",maxWidth:380,boxShadow:"0 4px 24px rgba(0,0,0,0.06)" }}>
<div style={{ textAlign:"center",marginBottom:18 }}>
<div style={{ fontWeight:900,fontSize:20 }}>Definir nova senha</div>
</div>
<div style={{ marginBottom:12 }}>
<label style={{ fontSize:12,fontWeight:600,color:"#475569",display:"block",marginBottom:4 }}>Nova senha</label>
<input type="password" required value={password} onChange={e=>setPassword(e.target.value)} style={{ width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:14,boxSizing:"border-box" }}/>
</div>
<div style={{ marginBottom:16 }}>
<label style={{ fontSize:12,fontWeight:600,color:"#475569",display:"block",marginBottom:4 }}>Confirmar senha</label>
<input type="password" required value={confirm} onChange={e=>setConfirm(e.target.value)} style={{ width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:14,boxSizing:"border-box" }}/>
</div>
{error && <div style={{ fontSize:12,color:"#dc2626",marginBottom:12,textAlign:"center" }}>{error}</div>}
<button type="submit" disabled={loading} style={{ width:"100%",padding:"11px",borderRadius:8,border:"none",background:"#FF5603",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer",opacity:loading?0.7:1 }}>
{loading ? "Salvando..." : "Salvar nova senha"}
</button>
</form>
</div>
);
};

    <style>{`*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#0f172a;}input,select,textarea{font-family:inherit;}input:focus,select:focus,textarea:focus{outline:none;border-color:#FF5603!important;box-shadow:0 0 0 3px #FF560318;}`}</style>

      <div style={{background:"#fff",borderBottom:"1.5px solid #e2e8f0",padding:"10px 15px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <a href="longevus-programa.html" style={{display:"flex",alignItems:"center",justifyContent:"center",width:32,height:32,borderRadius:8,background:"#f8fafc",border:"1px solid #e2e8f0",textDecoration:"none",color:"#0f172a",fontSize:18,fontWeight:700}}>&#8592;</a><img src={__LOGO__} alt="Longevus" style={{height:34,width:"auto",objectFit:"contain"}}/>
          <div><div style={{fontWeight:800,fontSize:14}}>Longevus</div><div style={{fontSize:10,color:"#94a3b8"}}>Biblioteca · {biblioteca.length} exercícios</div></div>
        </div>
        <div style={{display:"flex",gap:6}}><Btn sm variant="ghost" onClick={()=>{if(window.confirm("Resetar biblioteca? Isso carregará todos os 175 exercícios. Exercícios personalizados serão perdidos.")){localStorage.removeItem("longevus_biblioteca");window.location.reload();}}}>🔄</Btn>{billing?.is_admin&&<Btn sm onClick={()=>{setEditEx(null);setModal("form");}}>+ Novo</Btn>}</div>
      </div>
      <div style={{padding:"14px 13px",maxWidth:640,margin:"0 auto",paddingBottom:90}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:12}}>
          {[["Total",biblioteca.length],["Grupos",[...new Set(biblioteca.map(e=>e.grupo))].length],["Com foto",biblioteca.filter(e=>e.foto).length]].map(([l,v])=>(<div key={l} style={{background:"#fff",border:"1.5px solid #e2e8f0",borderRadius:8,padding:"8px 4px",textAlign:"center"}}><div style={{fontSize:18,fontWeight:800,color:O}}>{v}</div><div style={{fontSize:9,color:"#94a3b8",marginTop:1}}>{l}</div></div>))}
        </div>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar nome, foco ou tag..." style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"#fff",fontSize:13,fontFamily:"inherit",marginBottom:8}}/>
        <div style={{display:"flex",gap:4,marginBottom:7}}>
          {nOpts.map(n=>(<button key={n.v} onClick={()=>setFn(n.v)} style={{flex:1,border:`1.5px solid ${fn===n.v?O:"#e2e8f0"}`,background:fn===n.v?"#fff4ee":"#fff",borderRadius:7,padding:"5px 2px",fontSize:10,fontWeight:700,color:fn===n.v?O:"#64748b",cursor:"pointer"}}>{n.l}</button>))}
        </div>
        <div style={{marginBottom:6,overflowX:"auto",paddingBottom:3}}>
          <div style={{display:"flex",gap:4,minWidth:"max-content"}}>
            {grupos.map(g=>(<button key={g} onClick={()=>setFg(g)} style={{border:`1.5px solid ${fg===g?O:"#e2e8f0"}`,background:fg===g?O:"#fff",borderRadius:99,padding:"4px 9px",fontSize:10,fontWeight:700,color:fg===g?"#fff":"#64748b",cursor:"pointer",whiteSpace:"nowrap"}}>{g}</button>))}
          </div>
        </div>
        <div style={{marginBottom:12,overflowX:"auto",paddingBottom:3}}>
          <div style={{display:"flex",gap:4,minWidth:"max-content"}}>
            {momentos.map(m=>(<button key={m} onClick={()=>setFm(m)} style={{border:`1.5px solid ${fm===m?"#6366f1":"#e2e8f0"}`,background:fm===m?"#6366f1":"#fff",borderRadius:99,padding:"4px 9px",fontSize:10,fontWeight:700,color:fm===m?"#fff":"#64748b",cursor:"pointer",whiteSpace:"nowrap"}}>{m}</button>))}
          </div>
        </div>
        <div style={{fontSize:10,color:"#94a3b8",marginBottom:9}}>{filtered.length} exercício{filtered.length!==1?"s":""} encontrado{filtered.length!==1?"s":""}</div>
        {filtered.length===0?(<Card style={{textAlign:"center",padding:36}}><div style={{fontSize:32,marginBottom:8}}>📚</div><div style={{fontWeight:700,fontSize:14,marginBottom:4}}>{biblioteca.length===0?"Biblioteca vazia":"Nenhum encontrado"}</div><div style={{color:"#94a3b8",fontSize:11,marginBottom:14}}>{biblioteca.length===0?"Cadastre exercícios.":"Tente outra busca."}</div>{biblioteca.length===0&&<Btn onClick={()=>{setEditEx(null);setModal("form");}}>Cadastrar primeiro</Btn>}</Card>):filtered.map(ex=>(<ExCard key={ex.id} ex={ex} isAdmin={billing?.is_admin} onEdit={ex=>{setEditEx(ex);setModal("form");}} onDelete={delEx} onView={ex=>{setVerEx(ex);setModal("ver");}}/>))}
      </div>
    </div>
    {modal==="form"&&(<Modal title={editEx?"Editar Exercício":"Novo Exercício"} onClose={()=>{setModal(null);setEditEx(null);}}><ExForm initial={editEx} onSave={saveEx} onCancel={()=>{setModal(null);setEditEx(null);}}/></Modal>)}
    {modal==="ver"&&verEx&&(<ExDetalhe ex={verEx} onClose={()=>{setModal(null);setVerEx(null);}} isAdmin={billing?.is_admin} onEdit={ex=>{setModal(null);setVerEx(null);setEditEx(ex);setModal("form");}}/>)}
    <NavBar active="biblioteca"/>
  </>);
}


const TrialExpired = () => {
const waMsg = encodeURIComponent("Olá! Meu período de teste do Longevus expirou e gostaria de assinar o plano.");
return (
<div style={{ minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f8fafc",padding:20 }}>
<div style={{ background:"#fff",borderRadius:16,padding:28,width:"100%",maxWidth:380,boxShadow:"0 4px 24px rgba(0,0,0,0.06)",textAlign:"center" }}>
<img src={__LOGO__} alt="Longevus" style={{ width:56,height:56,margin:"0 auto 12px",display:"block" }}/>
<div style={{ fontWeight:900,fontSize:18,marginBottom:8 }}>Seu período de teste terminou</div>
<div style={{ fontSize:13,color:"#64748b",marginBottom:20,lineHeight:1.5 }}>
Para continuar usando o Longevus e acessar os dados dos seus alunos, fale com a gente para ativar seu plano.
</div>
<a href={"https://wa.me/"+SUPPORT_WHATSAPP+"?text="+waMsg} target="_blank" style={{ display:"block",padding:"12px",borderRadius:8,background:"#16a34a",color:"#fff",fontWeight:700,fontSize:14,textDecoration:"none",marginBottom:10 }}>
Falar no WhatsApp
</a>
<button onClick={()=>supa.auth.signOut()} style={{ border:"none",background:"transparent",color:"#94a3b8",fontSize:13,cursor:"pointer",textDecoration:"underline" }}>Sair</button>
</div>
</div>
);
};
function App(){
const [session,setSession]=useState(null);
const [authLoading,setAuthLoading]=useState(true);
const [recoveryMode,setRecoveryMode]=useState(false);
const [billing,setBilling]=useState(null);
useEffect(()=>{
supa.auth.getSession().then(({data})=>{ setSession(data?.session||null); setAuthLoading(false); });
const { data: listener } = supa.auth.onAuthStateChange((event, sess)=>{
setSession(sess);
if (event==="PASSWORD_RECOVERY") setRecoveryMode(true);
});
return ()=>{ listener?.subscription?.unsubscribe(); };
},[]);
useEffect(()=>{
if (!session) { setBilling(null); return; }
(async()=>{
try {
const headers = await authHeadersFn();
const r = await fetch(SUPA_URL+"/rest/v1/professionals?select=plano,status_assinatura,trial_ends_at,is_admin&id=eq."+session.user.id, { headers });
const rows = await r.json();
const p = rows?.[0]||{};
setBilling({ plano:p.plano||"trial", status_assinatura:p.status_assinatura||"ativo", trial_ends_at:p.trial_ends_at, is_admin:!!p.is_admin });
} catch(e) { setBilling({ plano:"trial", status_assinatura:"ativo", trial_ends_at:null, is_admin:false }); }
})();
},[session]);
if (authLoading) {
return <div style={{ minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#94a3b8",fontSize:14 }}>Carregando...</div>;
}
if (recoveryMode) {
return <ResetPassword onDone={()=>{setRecoveryMode(false);}}/>;
}
if (!session) {
return <Login onLogin={()=>{}}/>;
}
if (!billing) {
return <div style={{ minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#94a3b8",fontSize:14 }}>Carregando...</div>;
}
const trialEnd = billing.trial_ends_at ? new Date(billing.trial_ends_at) : null;
const trialExpired = billing.plano==="trial" && trialEnd && trialEnd.getTime() < Date.now();
const accountBlocked = billing.status_assinatura==="cancelado" || trialExpired;
if (accountBlocked) {
return <TrialExpired/>;
}
return <AppInner billing={billing}/>;
}

try{
  const root=ReactDOM.createRoot(document.getElementById('root'));
  root.render(<ErrorBoundary><App/></ErrorBoundary>);
}catch(e){
  document.getElementById('root').innerHTML='<pre style="padding:16px;font-family:monospace;color:#b91c1c;white-space:pre-wrap;font-size:12px;background:#fef2f2;margin:0;min-height:100vh;">ERRO SINCRONO\n\n'+String(e && e.message ? e.message : e).replace(/</g,'&lt;')+'\n\n'+String(e && e.stack ? e.stack : '(sem stack)').replace(/</g,'&lt;')+'</pre>';
  console.error('SYNC ERROR:', e);
}
</script>
</body>
</html>
