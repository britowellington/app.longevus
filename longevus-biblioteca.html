{"id":"bi01","nome":"Sentar e Levantar da Cadeira","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Quadríceps e Glúteos","descricao":"Simula e fortalece o movimento de levantar do sofá e vaso sanitário. Fundamental para autonomia diária.","execucao":"1. Cadeira firme, pés na largura dos ombros.\n2. Incline o tronco levemente para a frente.\n3. Levante sem usar as mãos.\n4. Retorne lentamente, controlando a descida.","beneficios":"Fortalece quadríceps e glúteos. Essencial para prevenção de quedas.","cuidados":"Se precisar de apoio, use os braços da cadeira. Contraindicado em dor aguda no joelho sem liberação.","material":"Cadeira firme sem rodinhas","obs":"Progressão: caneleira. Regressão: apoio nas mãos.","defaultSeries":"3","defaultReps":"10–12","defaultDescanso":"60s","tags":"quedas,sarcopenia,mmii,funcional,sppb","foto":"","video":"https://youtu.be/zTW4JxYX21o"},
{"id":"bi02","nome":"Elevação de Calcanhares","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Panturrilha e Tornozelo","descricao":"Fortalece a panturrilha responsável pelo impulso na caminhada e estabilidade do tornozelo.","execucao":"1. Em pé com apoio leve.\n2. Pés paralelos na largura dos quadris.\n3. Eleve-se na ponta dos pés lentamente.\n4. Mantenha 1 segundo. Desça lentamente.","beneficios":"Fortalece panturrilha. Melhora equilíbrio e impulso na marcha. Previne cãibras.","cuidados":"Use apoio. Atenção em casos de dor no tendão de Aquiles.","material":"Cadeira ou parede","obs":"Progressão: sem apoio.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"sarcopenia,mmii,marcha,panturrilha","foto":""},
{"id":"bi03","nome":"Extensão de Perna para Trás","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Glúteos e Extensores do Quadril","descricao":"Fortalece glúteos e extensores do quadril, fundamentais para propulsão na caminhada.","execucao":"1. Em pé com apoio.\n2. Eleve uma perna para trás com joelho esticado.\n3. Contraia o glúteo no ponto mais alto.\n4. Retorne lentamente.","beneficios":"Fortalece glúteos. Melhora propulsão na marcha.","cuidados":"Evite arquear a lombar. Movimento parte do quadril.","material":"Cadeira ou parede","obs":"Progressão: caneleira.","defaultSeries":"3","defaultReps":"10 cada","defaultDescanso":"45s","tags":"sarcopenia,mmii,glúteos,marcha,quedas","foto":""},
{"id":"bi04","nome":"Elevação de Perna à Frente","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Quadríceps e Flexores do Quadril","descricao":"Fortalece quadríceps e flexores do quadril, essenciais para subir escadas.","execucao":"1. Em pé com apoio.\n2. Eleve a perna à frente com joelho dobrado até a altura do quadril.\n3. Mantenha 1 segundo. Retorne lentamente.","beneficios":"Melhora capacidade de subir escadas e levantar da cadeira.","cuidados":"Mantenha o tronco ereto. Não incline para compensar.","material":"Cadeira ou parede","obs":"Progressão: caneleira.","defaultSeries":"3","defaultReps":"10 cada","defaultDescanso":"45s","tags":"sarcopenia,mmii,quadríceps,escadas","foto":""},
{"id":"bi05","nome":"Extensão de Joelhos Sentado","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Quadríceps","descricao":"Fortalecimento isolado do quadríceps sentado. Indicado para quem tem dificuldade de equilíbrio em pé.","execucao":"1. Sentado com costas apoiadas.\n2. Estique uma perna lentamente até posição horizontal.\n3. Mantenha 2s. Abaixe lentamente.","beneficios":"Fortalece quadríceps de forma segura. Ideal para alunos frágeis.","cuidados":"Não travar o joelho. Movimento lento.","material":"Cadeira firme. Opcional: caneleira.","obs":"Versão mais segura para reabilitação.","defaultSeries":"3","defaultReps":"10–15 cada","defaultDescanso":"45s","tags":"sarcopenia,mmii,quadríceps,reabilitação","foto":""},
{"id":"bi06","nome":"Abdução de Quadril em Pé","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Glúteo Médio e Abdutor","descricao":"Fortalece abdutores do quadril, essenciais para estabilidade lateral do joelho na marcha.","execucao":"1. Em pé com apoio.\n2. Abra a perna para o lado com joelho esticado.\n3. Mantenha o tronco ereto.\n4. Retorne lentamente.","beneficios":"Fortalece glúteo médio. Melhora estabilidade lateral na marcha.","cuidados":"Não inclinar o tronco para o lado. Progressão: caneleira.","material":"Cadeira ou parede","obs":"","defaultSeries":"3","defaultReps":"10–12 cada","defaultDescanso":"45s","tags":"mmii,glúteos,marcha,equilíbrio","foto":""},
{"id":"bi07","nome":"Agachamento Assistido","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Quadríceps, Glúteos e Core","descricao":"Agachamento com apoio leve. Trabalha os principais grupos musculares dos MMII de forma integrada.","execucao":"1. De frente para cadeira com apoio leve.\n2. Pés na largura dos ombros.\n3. Desça como se fosse sentar.\n4. Empurre o chão para subir.","beneficios":"Fortalece quadríceps, glúteos e core de forma integrada.","cuidados":"Joelhos alinhados com os pés. Sem dor aguda.","material":"Cadeira para apoio leve","obs":"Progressão: agachamento livre, adicionar peso.","defaultSeries":"3","defaultReps":"10","defaultDescanso":"60s","tags":"sarcopenia,mmii,funcional,quedas","foto":""},
{"id":"bi08","nome":"Ponte de Quadril","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Glúteos e Cadeia Posterior","descricao":"Fortalecimento dos glúteos em posição deitada. Seguro para alunos com dificuldade de equilíbrio.","execucao":"1. Deitado de costas, joelhos dobrados, pés no chão.\n2. Contraia abdome e glúteos.\n3. Eleve o quadril até linha reta joelhos-quadril-ombros.\n4. Mantenha 2–3s. Desça lentamente.","beneficios":"Fortalece glúteos. Melhora estabilidade lombar.","cuidados":"Não arquear a lombar. Manter contração abdominal.","material":"Tapete","obs":"Progressão: apoio unipodal. Indicado pós-AVC.","defaultSeries":"3","defaultReps":"10","defaultDescanso":"45s","tags":"sarcopenia,mmii,glúteos,lombar,avc","foto":""},
{"id":"bi09","nome":"Flexão de Parede","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Peito, Tríceps e Ombros","descricao":"Alternativa segura à flexão de chão. Fortalece membros superiores para empurrar.","execucao":"1. De frente para a parede, distância de um braço.\n2. Mãos na parede na largura dos ombros.\n3. Dobre os cotovelos aproximando o peito da parede.\n4. Empurre para retornar.","beneficios":"Fortalece peito, tríceps e ombros. Progressiva e segura.","cuidados":"Manter o corpo alinhado. Amplitude confortável.","material":"Parede firme","obs":"Progressão: afastar os pés da parede.","defaultSeries":"3","defaultReps":"10–12","defaultDescanso":"60s","tags":"sarcopenia,mmss,peitoral,funcional","foto":""},
{"id":"bi10","nome":"Elevação Lateral dos Braços","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Deltoides","descricao":"Fortalece os ombros para alcançar objetos em altura e manter postura ereta.","execucao":"1. Sentado ou em pé, peso leve nas mãos.\n2. Eleve os braços lateralmente até a altura dos ombros.\n3. Abaixe lentamente e controlado.","beneficios":"Fortalece deltoides. Melhora alcance e postura.","cuidados":"Não usar impulso. Movimento lento. Pesos leves.","material":"Halteres leves ou garrafas de água","obs":"","defaultSeries":"3","defaultReps":"10–12","defaultDescanso":"60s","tags":"sarcopenia,mmss,ombros,postura","foto":""},
{"id":"bi11","nome":"Rosca Direta","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Bíceps","descricao":"Fortalece os bíceps para carregar objetos e realizar atividades funcionais.","execucao":"1. Sentado ou em pé, halteres com palmas para cima.\n2. Flexione o cotovelo levando o peso ao ombro.\n3. Desça lentamente.","beneficios":"Fortalece bíceps. Melhora capacidade de carregar objetos.","cuidados":"Cotovelos fixos ao lado do corpo. Não balançar o tronco.","material":"Halteres leves","obs":"","defaultSeries":"3","defaultReps":"12","defaultDescanso":"60s","tags":"sarcopenia,mmss,bíceps","foto":""},
{"id":"bi12","nome":"Remada com Elástico","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Costas, Romboides e Bíceps","descricao":"Fortalece as costas e bíceps, contribuindo para postura ereta e prevenção da cifose.","execucao":"1. Elástico preso à frente na altura do peito.\n2. Puxe em direção ao abdome, cotovelos para trás.\n3. Aperte as escápulas. Retorne lentamente.","beneficios":"Fortalece romboides e trapézio médio. Melhora postura.","cuidados":"Não arquear a lombar. Movimento de puxar com as costas.","material":"Faixa elástica","obs":"Progressão: elástico mais forte.","defaultSeries":"3","defaultReps":"12","defaultDescanso":"60s","tags":"sarcopenia,mmss,costas,postura","foto":""},
{"id":"bi13","nome":"Tocar Joelho Oposto Sentado","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Abdome e Oblíquos","descricao":"Fortalece core e oblíquos com coordenação cruzada entre braços e pernas.","execucao":"1. Na ponta da cadeira, coluna reta.\n2. Gire o tronco tocando cotovelo direito no joelho esquerdo.\n3. Retorne e repita para o lado oposto.","beneficios":"Fortalece abdome e oblíquos. Melhora coordenação cruzada.","cuidados":"Movimento lento. Não puxar o pescoço.","material":"Cadeira firme","obs":"","defaultSeries":"3","defaultReps":"10–12 cada","defaultDescanso":"30s","tags":"core,coordenação,abdome,oblíquos","foto":""},
{"id":"bi14","nome":"Contração Abdominal Bracing","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Core Profundo","descricao":"Ativa o core profundo, fundamental para estabilidade da coluna e prevenção de dor lombar.","execucao":"1. Sentado ereto.\n2. Expire contraindo o abdome firmemente.\n3. Mantenha 5–10s respirando normalmente.\n4. Relaxe e repita.","beneficios":"Ativa transverso do abdome. Reduz dor lombar.","cuidados":"Não prender a respiração. Contração, não sucção.","material":"Qualquer superfície","obs":"Pode ser feito diariamente.","defaultSeries":"3","defaultReps":"10 × 5–10s","defaultDescanso":"20s","tags":"core,lombar,postura,estabilidade","foto":""},
{"id":"bi15","nome":"Extensão de Tronco na Cadeira","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Extensores da Coluna","descricao":"Fortalece extensores da coluna, combatendo a cifose do envelhecimento.","execucao":"1. Na ponta da cadeira, braços cruzados.\n2. Incline o tronco levemente para frente.\n3. Retorne à posição ereta contraindo as costas.\n4. Mantenha 2s no topo.","beneficios":"Fortalece extensores. Melhora postura ereta. Combate cifose.","cuidados":"Não hiperextender. Movimento controlado.","material":"Cadeira firme","obs":"","defaultSeries":"3","defaultReps":"12","defaultDescanso":"30s","tags":"core,postura,coluna,extensores","foto":""},
{"id":"bi16","nome":"Pés Unidos Equilíbrio","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Sistema Vestibular e Propriocepção","descricao":"Base do treinamento de equilíbrio. Treina sistema vestibular e sensorimotor.","execucao":"1. Em pé com pés unidos, apoio por perto.\n2. Mantenha 30–60s com olhos abertos.\n3. Progressão: olhos fechados.\n4. Progressão 2: lançar e receber bola.","beneficios":"Treina sistema vestibular. Base para todos os exercícios de equilíbrio.","cuidados":"Apoio sempre por perto. Nunca fechar olhos sem supervisão.","material":"Espaço aberto com apoio","obs":"Progressão: olhos abertos → fechados → tarefa dual.","defaultSeries":"3","defaultReps":"30–60s","defaultDescanso":"30s","tags":"quedas,equilíbrio,vestibular,sppb","foto":""},
{"id":"bi17","nome":"Equilíbrio em Uma Perna","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Estabilidade do Tornozelo","descricao":"Um dos exercícios mais eficazes para prevenção de quedas. Fortalece estabilizadores do tornozelo.","execucao":"1. Em pé próximo a apoio.\n2. Levante uma perna dobrando o joelho.\n3. Mantenha 20–30s. Use apoio apenas se necessário.\n4. Troque de perna.","beneficios":"Melhora equilíbrio estático. Principal exercício de prevenção de quedas.","cuidados":"Olhar fixo a um ponto à frente. Progressão gradual.","material":"Cadeira ou parede","obs":"Progredir: com apoio → sem apoio → olhos fechados.","defaultSeries":"3","defaultReps":"20–30s cada","defaultDescanso":"30s","tags":"quedas,equilíbrio,tornozelo,sppb","foto":""},
{"id":"bi18","nome":"Caminhada Tandem","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Equilíbrio Dinâmico","descricao":"Caminhar calcanhar-ponta em linha reta. Melhora equilíbrio dinâmico e propriocepção.","execucao":"1. Próximo a uma parede.\n2. Coloque calcanhar de um pé à frente dos dedos do outro.\n3. Continue caminhando nesse padrão.\n4. 10–20 passos.","beneficios":"Melhora equilíbrio dinâmico na marcha.","cuidados":"Apoio disponível. Iniciar com passos curtos.","material":"Corredor livre","obs":"","defaultSeries":"3","defaultReps":"10–20 passos","defaultDescanso":"30s","tags":"quedas,equilíbrio,marcha,propriocepção","foto":""},
{"id":"bi19","nome":"Deslocamento de Tronco AP","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Equilíbrio Anteroposterior","descricao":"Treina a estratégia de tornozelo no controle anteroposterior do equilíbrio.","execucao":"1. Em pé com apoio.\n2. Desloque o tronco para frente (sem tirar calcanhares). Retorne.\n3. Desloque para trás (sem tirar os dedos). Retorne.","beneficios":"Treina estratégia de tornozelo. Componente do SPPB.","cuidados":"Oscilação controlada. Não dar passos para compensar.","material":"Cadeira ou parede","obs":"","defaultSeries":"2","defaultReps":"15 cada sentido","defaultDescanso":"30s","tags":"quedas,equilíbrio,sppb,anteroposterior","foto":""},
{"id":"bi20","nome":"Rotação de Tornozelos e Punhos","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Articulações Distais","descricao":"Lubrifica tornozelos e punhos. Reduz rigidez. Ideal para início de sessão.","execucao":"1. Sentado.\n2. Gire o tornozelo 10x em cada sentido. Repita com o outro pé.\n3. Estenda os braços e gire os punhos 10x em cada sentido.","beneficios":"Lubrifica articulações. Melhora circulação. Reduz rigidez matinal.","cuidados":"Movimento suave. Reduzir amplitude se sentir dor.","material":"Cadeira","obs":"Excelente para artrite.","defaultSeries":"2","defaultReps":"10 cada sentido","defaultDescanso":"10s","tags":"mobilidade,artrite,circulação,aquecimento","foto":""},
{"id":"bi21","nome":"Rotação de Quadril em Círculos","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Quadril e Lombar","descricao":"Melhora mobilidade do quadril e lombar. Reduz rigidez antes dos exercícios.","execucao":"1. Em pé com apoio.\n2. Mãos na cintura.\n3. Círculos lentos com o quadril.\n4. 10x em cada sentido.","beneficios":"Melhora mobilidade do quadril. Lubrifica articulação.","cuidados":"Movimento suave. Reduzir amplitude se sentir dor.","material":"Cadeira ou parede","obs":"","defaultSeries":"2","defaultReps":"10 cada sentido","defaultDescanso":"15s","tags":"mobilidade,quadril,lombar,aquecimento","foto":""},
{"id":"bi22","nome":"Marcha com Elevação de Joelhos","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Flexores do Quadril e Marcha","descricao":"Aquece flexores do quadril e ativa o padrão de marcha. Cardio leve de aquecimento.","execucao":"1. Em pé com apoio leve.\n2. Marche elevando os joelhos alternadamente.\n3. Coordene o movimento dos braços.\n4. 2–3 minutos contínuos.","beneficios":"Aquece a musculatura. Ativa flexores do quadril. Aumenta FC gradualmente.","cuidados":"Apoio disponível. Ritmo confortável.","material":"Cadeira ou parede","obs":"Principal exercício de aquecimento.","defaultSeries":"1","defaultReps":"2–3 min","defaultDescanso":"30s","tags":"aquecimento,marcha,cardio,mobilidade","foto":""},
{"id":"bi23","nome":"Rotação do Pescoço","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Coluna Cervical","descricao":"Alivia tensão no pescoço. Melhora amplitude de movimento da cabeça.","execucao":"1. Sentado, ombros relaxados.\n2. Gire lentamente para a direita (10–15s). Retorne.\n3. Gire para a esquerda.\n4. Incline a orelha ao ombro cada lado.","beneficios":"Alivia tensão cervical. Melhora amplitude de movimento.","cuidados":"Muito lento e suave. Parar se sentir tontura.","material":"Cadeira","obs":"Contraindicado em instabilidade cervical.","defaultSeries":"2","defaultReps":"10–15s cada posição","defaultDescanso":"10s","tags":"mobilidade,cervical,rigidez,aquecimento","foto":""},
{"id":"bi24","nome":"Alongamento da Panturrilha","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Panturrilha e Tornozelo","descricao":"Previne cãibras. Melhora flexibilidade do tornozelo e qualidade da marcha.","execucao":"1. De frente para a parede, um passo para trás com uma perna.\n2. Calcanhar no chão, joelho esticado.\n3. Dobre o joelho da frente e incline até sentir o alongamento.\n4. 20–30s. Troque.","beneficios":"Previne cãibras. Melhora flexibilidade do tornozelo.","cuidados":"Suave, nunca doloroso. Calcanhar no chão.","material":"Parede","obs":"","defaultSeries":"2","defaultReps":"30s cada","defaultDescanso":"10s","tags":"alongamento,panturrilha,tornozelo,marcha","foto":""},
{"id":"bi25","nome":"Alongamento Lateral do Tronco","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Tronco e Intercostais","descricao":"Aumenta flexibilidade da coluna lateral e intercostais.","execucao":"1. Na ponta da cadeira.\n2. Levante o braço direito e incline para o lado esquerdo.\n3. Mantenha o quadril fixo na cadeira.\n4. 15–20s. Repita para o outro lado.","beneficios":"Aumenta flexibilidade lateral da coluna.","cuidados":"Inclinação lateral pura, sem rotação.","material":"Cadeira firme","obs":"","defaultSeries":"2","defaultReps":"20s cada","defaultDescanso":"10s","tags":"alongamento,coluna,intercostais,postura","foto":""},
{"id":"bi26","nome":"Alongamento de Quadril e Glúteo","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Quadril e Glúteos","descricao":"Alivia tensão lombar e ciática. Melhora mobilidade do quadril.","execucao":"1. Na ponta da cadeira.\n2. Cruze a perna (tornozelo sobre o joelho oposto).\n3. Incline o tronco para frente mantendo a coluna reta.\n4. 20–30s. Repita do outro lado.","beneficios":"Alivia tensão lombar e ciática. Melhora mobilidade do quadril.","cuidados":"Não forçar se sentir dor no joelho. Contraindicado em prótese de quadril sem liberação.","material":"Cadeira firme","obs":"Excelente para queixa de ciática.","defaultSeries":"2","defaultReps":"30s cada","defaultDescanso":"10s","tags":"alongamento,quadril,glúteos,ciática,lombar","foto":""},
{"id":"bi27","nome":"Alongamento de Isquiotibiais","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Posterior da Coxa","descricao":"Melhora flexibilidade dos isquiotibiais. Reduz tensão lombar.","execucao":"1. Na ponta da cadeira.\n2. Estique uma perna à frente, calcanhar no chão.\n3. Passe toalha na sola do pé e puxe com coluna reta.\n4. 20–30s. Troque.","beneficios":"Melhora flexibilidade. Reduz tensão lombar.","cuidados":"Coluna reta. Não curvar as costas.","material":"Cadeira firme. Toalha ou elástico.","obs":"","defaultSeries":"2","defaultReps":"30s cada","defaultDescanso":"10s","tags":"alongamento,isquiotibiais,lombar,marcha","foto":""},
{"id":"bi28","nome":"Alongamento de Ombros com Toalha","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Peito e Ombros","descricao":"Abre o peito e alonga os ombros. Combate a cifose postural do envelhecimento.","execucao":"1. Sentado ou em pé.\n2. Segure toalha com as duas mãos, mais afastadas que os ombros.\n3. Levante os braços acima da cabeça.\n4. Puxe a toalha para os lados sentindo o alongamento.\n5. 20–30s.","beneficios":"Melhora postura. Aumenta amplitude dos ombros.","cuidados":"Não forçar além do conforto.","material":"Toalha ou faixa elástica","obs":"","defaultSeries":"2","defaultReps":"30s","defaultDescanso":"10s","tags":"alongamento,ombros,peito,postura,cifose","foto":""},
{"id":"bi29","nome":"Caminhada com Variações","grupo":"Cardio","nivel":"Básico","momento":"Parte Principal","foco":"Resistência Cardiovascular e Marcha","descricao":"Cardio de baixo impacto com variações de marcha.","execucao":"1. Caminhada normal 2–3min.\n2. Variações: ponta dos pés, joelhos altos, passos largos, lateral (30s cada).\n3. Total 5–10 min.","beneficios":"Melhora resistência cardiovascular. Trabalha diferentes padrões de marcha.","cuidados":"Ambiente sem obstáculos. Apoio próximo.","material":"Corredor livre","obs":"","defaultSeries":"1","defaultReps":"5–10 min","defaultDescanso":"—","tags":"cardio,marcha,funcional,aeróbico","foto":""},
{"id":"bi30","nome":"Subida e Descida de Degrau","grupo":"Funcional","nivel":"Intermediário","momento":"Parte Principal","foco":"MMII e Equilíbrio Dinâmico","descricao":"Treina a tarefa funcional de subir escadas.","execucao":"1. Com apoio lateral disponível.\n2. Coloque e retire o pé no degrau alternadamente.\n3. Progrida para subir e descer completamente.\n4. 2 séries de 20.","beneficios":"Treina funcionalidade de escadas. Melhora equilíbrio dinâmico.","cuidados":"Apoio sempre disponível. Degrau estável.","material":"Degrau ou step. Apoio lateral.","obs":"","defaultSeries":"2","defaultReps":"20","defaultDescanso":"60s","tags":"funcional,escadas,mmii,equilíbrio","foto":""},

{"id":"bi32","nome":"Passos Laterais","grupo":"Coordenação","nivel":"Intermediário","momento":"Parte Principal","foco":"Padrão Motor e Agilidade","descricao":"Treina coordenação lateral e agilidade para desviar de obstáculos.","execucao":"1. Em pé com apoio disponível.\n2. 3 passos para a direita, depois 3 para a esquerda.\n3. Progredir em velocidade.","beneficios":"Melhora agilidade lateral. Treina desvio de obstáculos.","cuidados":"Superfície antiderrapante. Iniciar lento.","material":"Espaço aberto","obs":"","defaultSeries":"3","defaultReps":"10 cada lado","defaultDescanso":"30s","tags":"coordenação,marcha,agilidade,lateral","foto":""},

{"id":"pr01","nome":"Sentar/Levantar — Banco Alto Apoio","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Quadríceps e Glúteos","descricao":"Versão mais acessível. Banco alto e apoio nas mãos. Nível 1 da progressão Sentar/Levantar.","execucao":"1. Banco alto (acima do joelho).\n2. Apoie as mãos nos braços da cadeira.\n3. Levante usando as mãos como suporte.\n4. Sente lentamente.","beneficios":"Iniciação segura ao padrão de agachar.","cuidados":"Banco estável e sem deslizar.","material":"Banco ou cadeira alta. Apoio firme.","obs":"Nível 1 — Sentar/Levantar.","defaultSeries":"3","defaultReps":"8–10","defaultDescanso":"60s","tags":"mmii,agachar,nível1","foto":""},

{"id":"pr05","nome":"Goblet Squat","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Quadríceps, Glúteos, Core e Mobilidade de Quadril","descricao":"Agachamento com peso na frente do peito. O contrapeso facilita postura ereta e profundidade.","execucao":"1. Segure halter com as duas mãos na frente do peito.\n2. Pés afastados e levemente abertos.\n3. Agache profundamente mantendo o tronco ereto.\n4. Empurre o chão para subir.","beneficios":"Melhora profundidade do agachamento e mobilidade de quadril.","cuidados":"Calcanhares no chão. Peso adequado.","material":"Halter ou garrafa pesada.","obs":"Nível 4 — Agachamento e Box Squat.","defaultSeries":"3","defaultReps":"8–10","defaultDescanso":"60s","tags":"mmii,agachar,glúteos,core,nível4","foto":""},
{"id":"pr06","nome":"Box Squat — Banco Alto","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Quadríceps e Glúteos","descricao":"Agachamento com banco alto como alvo. Ensina o padrão motor correto com segurança.","execucao":"1. Banco alto atrás de você.\n2. Agache até tocar o banco com os glúteos (sem sentar com peso).\n3. Pause 1s. Empurre o chão para subir.","beneficios":"Ensina o padrão de agachar com referência física.","cuidados":"Apenas tocar o banco. Tronco controlado.","material":"Banco ou caixa estável.","obs":"Nível 1 — Box Squat.","defaultSeries":"3","defaultReps":"10","defaultDescanso":"60s","tags":"mmii,agachar,nível1","foto":""},
{"id":"pr07","nome":"Afundo Isométrico","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Quadríceps, Glúteos e Equilíbrio","descricao":"Posição de afundo mantida estaticamente. Desenvolve força antes do movimento dinâmico.","execucao":"1. Passo largo à frente.\n2. Abaixe o joelho de trás sem tocar o chão.\n3. Ambos os joelhos a 90°.\n4. Mantenha 20–30s. Alterne.","beneficios":"Desenvolve força isométrica de quadríceps e glúteos.","cuidados":"Joelho dianteiro alinhado. Tronco ereto.","material":"Apoio opcional.","obs":"Nível 1 — Afundo.","defaultSeries":"3","defaultReps":"20–30s cada","defaultDescanso":"45s","tags":"mmii,afundo,isométrico,nível1","foto":""},

{"id":"aq02","nome":"Agachamento na Cadeira","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Quadríceps, Glúteos e Core","descricao":"Nível 2 da progressão. Agachamento com banco como referência, ensinando o padrão motor correto.","execucao":"1. Cadeira atrás de você.\n2. Pés na largura dos ombros.\n3. Desça até tocar levemente a cadeira com os glúteos.\n4. Empurre o chão para subir sem usar as mãos.","beneficios":"Ensina o padrão de agachar com referência física segura.","cuidados":"Apenas tocar a cadeira, não sentar com peso. Tronco controlado.","material":"Cadeira firme.","obs":"Nível 2 — Progressão de Agachamento.","defaultSeries":"3","defaultReps":"10","defaultDescanso":"60s","tags":"mmii,agachar,nível2,progressão","foto":"","video":"https://youtu.be/5YLBb85kd3g"},
{"id":"aq03","nome":"Agachamento Livre","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Quadríceps, Glúteos e Core","descricao":"Nível 3 da progressão. Agachamento sem apoio com amplitude completa.","execucao":"1. Pés na largura dos ombros, levemente abertos.\n2. Braços à frente para equilíbrio.\n3. Desça até a coxa ficar paralela ao chão.\n4. Empurre o chão para subir.","beneficios":"Fortalece quadríceps, glúteos e core de forma integrada. Melhora funcionalidade.","cuidados":"Calcanhares no chão. Joelhos na direção dos dedos. Sem dor articular.","material":"Nenhum.","obs":"Nível 3 — Progressão de Agachamento.","defaultSeries":"3","defaultReps":"10–12","defaultDescanso":"60s","tags":"mmii,agachar,nível3,progressão","foto":"","video":"https://youtu.be/1kuST7SGrfY"},
{"id":"aq04","nome":"Agachamento com Halteres","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Quadríceps, Glúteos, Core e Força","descricao":"Nível 4 da progressão. Agachamento com sobrecarga externa para desenvolvimento de força.","execucao":"1. Halteres nas mãos ao lado do corpo.\n2. Pés na largura dos ombros.\n3. Agache com controle até coxa paralela.\n4. Empurre o chão para subir.","beneficios":"Aumenta a força muscular dos MMII. Previne sarcopenia.","cuidados":"Peso adequado ao nível. Manter postura neutra da coluna.","material":"Par de halteres.","obs":"Nível 4 — Progressão de Agachamento.","defaultSeries":"3","defaultReps":"8–10","defaultDescanso":"60s","tags":"mmii,agachar,nível4,progressão,halteres","foto":"","video":"https://youtu.be/x5vB3-LoPHc"},
{"id":"aq05","nome":"Agachamento Goblet","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Quadríceps, Glúteos, Core e Mobilidade de Quadril","descricao":"Nível 5 da progressão. Agachamento com halter na frente do peito, facilitando postura ereta e maior profundidade.","execucao":"1. Segure halter com as duas mãos na frente do peito.\n2. Pés afastados e levemente abertos.\n3. Agache profundamente mantendo o tronco ereto.\n4. Empurre o chão para subir.","beneficios":"Melhora profundidade do agachamento e mobilidade de quadril. Excelente para prevenção de quedas.","cuidados":"Calcanhares no chão. Peso adequado. Não arredondar a lombar.","material":"Halter ou kettlebell.","obs":"Nível 5 — Progressão de Agachamento.","defaultSeries":"3","defaultReps":"8–10","defaultDescanso":"60s","tags":"mmii,agachar,nível5,progressão,goblet","foto":"","video":"https://youtu.be/inm2WYuiUf4"},
{"id":"pr08","nome":"Afundo Assistido","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Quadríceps, Glúteos e Equilíbrio","descricao":"Afundo dinâmico com apoio nas mãos. Primeiro passo para o afundo livre.","execucao":"1. Segure cadeira ou barra com as mãos.\n2. Passo à frente, desça o joelho de trás.\n3. Suba retornando à posição inicial. Alterne.","beneficios":"Desenvolve força funcional com segurança.","cuidados":"Apoio apenas para equilíbrio.","material":"Cadeira ou barra.","obs":"Nível 2 — Afundo.","defaultSeries":"3","defaultReps":"8 cada","defaultDescanso":"60s","tags":"mmii,afundo,nível2","foto":""},

{"id":"pr12","nome":"Step-Up Baixo com Apoio","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Quadríceps, Glúteos e Equilíbrio","descricao":"Subir degrau baixo com apoio lateral. Treina escadas com segurança.","execucao":"1. Step baixo com apoio lateral.\n2. Coloque um pé no degrau.\n3. Empurre para subir.\n4. Desça controladamente.","beneficios":"Treina o padrão funcional de escadas.","cuidados":"Apoio sempre disponível. Controlar a descida.","material":"Step ou degrau. Apoio lateral.","obs":"Nível 1 — Step-up.","defaultSeries":"2","defaultReps":"10 cada","defaultDescanso":"45s","tags":"mmii,step,escadas,nível1","foto":""},
{"id":"pr13","nome":"Step-Up Baixo Livre","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Quadríceps, Glúteos e Equilíbrio","descricao":"Step-up baixo sem apoio das mãos. Maior demanda de equilíbrio.","execucao":"1. Step baixo sem usar as mãos.\n2. Suba com o pé direito empurrando com a perna direita.\n3. Traga o pé esquerdo.\n4. Desça com controle.","beneficios":"Independência funcional para subir escadas.","cuidados":"Apoio disponível mas não utilizado.","material":"Step ou degrau.","obs":"Nível 2 — Step-up.","defaultSeries":"3","defaultReps":"8–10 cada","defaultDescanso":"45s","tags":"mmii,step,escadas,nível2","foto":""},
{"id":"pr14","nome":"Step-Down Controlado","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Controle Excêntrico de Quadríceps","descricao":"Descida lenta de degrau. Treina o controle excêntrico para descer escadas com segurança.","execucao":"1. Em pé no degrau, apoio disponível.\n2. Em uma perna, abaixe o outro pé lentamente (4–5s).\n3. Toque levemente o chão e retorne.","beneficios":"Fortalece controle excêntrico. Essencial para segurança em escadas.","cuidados":"Muito lento. Joelho alinhado. Apoio disponível.","material":"Degrau. Apoio lateral.","obs":"Fundamental para prevenção de quedas em escadas.","defaultSeries":"3","defaultReps":"6–8 cada","defaultDescanso":"60s","tags":"mmii,step,escadas,excêntrico,nível2","foto":""},
{"id":"pr15","nome":"Agachamento Lateral","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Adutores, Abdutores e Quadríceps","descricao":"Peso transferido para um lado enquanto a outra perna fica estendida.","execucao":"1. Pés bem afastados, dedos levemente para fora.\n2. Desça transferindo o peso para o lado direito, perna esquerda estendida.\n3. Retorne ao centro e repita para o outro lado.","beneficios":"Fortalece adutores, abdutores e quadríceps.","cuidados":"Pé do lado que agacha totalmente no chão. Joelho alinhado.","material":"Apoio leve opcional.","obs":"Nível 1–2 — Agachamento Lateral.","defaultSeries":"3","defaultReps":"8 cada","defaultDescanso":"60s","tags":"mmii,agachar,lateral,adutores,nível2","foto":""},

{"id":"pr17","nome":"Agachamento Sumô","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Adutores, Glúteos e Quadríceps","descricao":"Pés muito afastados, dedos para fora. Maior ênfase em adutores e glúteos.","execucao":"1. Pés bem afastados (45–60° para fora).\n2. Desça com os joelhos na direção dos dedos.\n3. Quadril entre as pernas.\n4. Empurre para subir.","beneficios":"Ativa mais adutores e glúteos. Boa opção para rigidez de quadril.","cuidados":"Joelhos na direção dos dedos. Não colapsar para dentro.","material":"Apoio leve opcional.","obs":"Nível 1–3 — Agachamento Sumô.","defaultSeries":"3","defaultReps":"10–12","defaultDescanso":"60s","tags":"mmii,sumô,adutores,glúteos,nível1","foto":""},
{"id":"pr18","nome":"Split Squat Apoiado","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Quadríceps, Glúteos e Equilíbrio","descricao":"Agachamento com pernas divididas e apoio bilateral. Base para o afundo.","execucao":"1. Apoio bilateral nas cadeiras dos dois lados.\n2. Uma perna à frente, outra atrás.\n3. Desça o joelho de trás e suba. Pés fixos.","beneficios":"Trabalha unilateralmente com segurança máxima.","cuidados":"Pés fixos. Apoio apenas para equilíbrio.","material":"Cadeiras laterais.","obs":"Nível 1 — Split Squat.","defaultSeries":"3","defaultReps":"8–10 cada","defaultDescanso":"60s","tags":"mmii,split,unilateral,nível1","foto":""},
{"id":"pr19","nome":"Sentar e Levantar Rápido","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Potência de MMII","descricao":"Versão em velocidade do sentar/levantar. Treina potência e mede capacidade funcional (5STS).","execucao":"1. Cadeira padrão, sem usar as mãos.\n2. Levante o mais rápido possível.\n3. Sente controladamente.\n4. Cronometrar 5 repetições.","beneficios":"Desenvolve potência de MMII. Métrica do teste 5STS.","cuidados":"Subida rápida, descida sempre controlada.","material":"Cadeira firme.","obs":"Usar cronômetro para monitorar evolução.","defaultSeries":"3","defaultReps":"5 rápidas","defaultDescanso":"90s","tags":"mmii,potência,funcional,nível3","foto":""},
{"id":"pr20","nome":"Front Squat com Bastão","grupo":"MMII","nivel":"Avançado","momento":"Parte Principal","foco":"Quadríceps, Core e Postura","descricao":"Agachamento com carga na frente. Exige postura ereta e mobilidade avançada.","execucao":"1. Bastão nos ombros, cotovelos para frente.\n2. Pés na largura dos ombros.\n3. Agache com tronco mais vertical que o convencional.","beneficios":"Máxima ativação de quadríceps. Exige core forte.","cuidados":"Requer mobilidade de tornozelo e quadril.","material":"Bastão ou halteres.","obs":"Nível 5 — Agachamento.","defaultSeries":"3","defaultReps":"6–8","defaultDescanso":"90s","tags":"mmii,front squat,avançado,nível5","foto":""},
{"id":"pr21","nome":"Ponte de Quadril com Pausa","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Glúteos e Core","descricao":"Ponte com pausa no topo para maior ativação dos glúteos.","execucao":"1. Deitado, joelhos dobrados.\n2. Eleve o quadril.\n3. Mantenha 2–3s no topo.\n4. Desça lentamente.","beneficios":"Maior ativação dos glúteos pela pausa isométrica.","cuidados":"Não hiperextender a lombar.","material":"Tapete.","obs":"Nível 2 — Ponte.","defaultSeries":"3","defaultReps":"10–12","defaultDescanso":"45s","tags":"mmii,hinge,glúteos,nível2","foto":""},
{"id":"pr22","nome":"Ponte com Elástico","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Glúteos, Abdutores e Core","descricao":"Ponte com elástico acima dos joelhos, ativando glúteo médio e abdutores.","execucao":"1. Elástico acima dos joelhos.\n2. Execute a ponte empurrando os joelhos para fora.\n3. Joelhos alinhados com os pés.","beneficios":"Ativa glúteo médio além do glúteo máximo.","cuidados":"Manter alinhamento dos joelhos.","material":"Faixa elástica. Tapete.","obs":"Nível 3 — Ponte.","defaultSeries":"3","defaultReps":"10–12","defaultDescanso":"45s","tags":"mmii,hinge,glúteos,abdutores,nível3","foto":""},
{"id":"pr23","nome":"Hinge de Parede","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Padrão Hinge e Extensores do Quadril","descricao":"Aprendizado do padrão hinge usando a parede como feedback.","execucao":"1. A 30–40cm da parede.\n2. Empurre o quadril para trás até tocar a parede.\n3. Costas retas, joelhos levemente flexionados.\n4. Contraia os glúteos para retornar.","beneficios":"Ensina o hinge com feedback da parede.","cuidados":"Não curvar as costas.","material":"Parede.","obs":"Nível 1 — Hinge.","defaultSeries":"3","defaultReps":"10","defaultDescanso":"45s","tags":"mmii,hinge,padrão motor,nível1","foto":""},
{"id":"pr24","nome":"Terra Romeno com Bastão","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Isquiotibiais, Glúteos e Postura","descricao":"Terra romeno com bastão nas costas para garantir alinhamento correto.","execucao":"1. Bastão verticalmente nas costas (3 pontos de contato).\n2. Incline o tronco em hinge mantendo os pontos de contato.\n3. Desça até sentir o alongamento nos isquiotibiais.\n4. Retorne contraindo os glúteos.","beneficios":"Ensina a manter coluna neutra no hinge.","cuidados":"Manter os 3 pontos de contato do bastão.","material":"Bastão ou cabo de vassoura.","obs":"Nível 1 — Terra Romeno.","defaultSeries":"3","defaultReps":"10","defaultDescanso":"45s","tags":"mmii,hinge,isquiotibiais,nível1","foto":""},
{"id":"pr25","nome":"Terra Romeno com Halter","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Isquiotibiais, Glúteos e Cadeia Posterior","descricao":"Terra romeno com halteres. Principal exercício de cadeia posterior.","execucao":"1. Halteres na frente das coxas.\n2. Empurre o quadril para trás inclinando o tronco.\n3. Desça até sentir o alongamento nos isquiotibiais.\n4. Contraia glúteos para retornar.","beneficios":"Fortalece isquiotibiais e glúteos. Previne dor lombar.","cuidados":"Coluna neutra durante todo o movimento.","material":"Halteres.","obs":"Nível 2–3 — Terra Romeno.","defaultSeries":"3","defaultReps":"8–10","defaultDescanso":"60s","tags":"mmii,hinge,isquiotibiais,glúteos,nível3","foto":""},
{"id":"pr26","nome":"Hip Thrust Bilateral","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Glúteo Máximo e Cadeia Posterior","descricao":"Extensão de quadril com ombros no banco. Principal exercício de glúteo máximo.","execucao":"1. Escápulas no banco, pés no chão.\n2. Eleve o quadril até o tronco ficar paralelo ao chão.\n3. Contraia os glúteos 1–2s no topo.\n4. Desça lentamente.","beneficios":"Máxima ativação do glúteo máximo. Melhora potência de marcha.","cuidados":"Não hiperextender a lombar. Banco estável.","material":"Banco firme.","obs":"Nível 1 — Hip Thrust.","defaultSeries":"3","defaultReps":"10–12","defaultDescanso":"60s","tags":"mmii,hinge,glúteos,hip thrust,nível1","foto":""},

{"id":"pr52","nome":"Prancha nos Joelhos","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Core Profundo e Lombar","descricao":"Prancha clássica com apoio nos joelhos. Progressão entre parede e tradicional.","execucao":"1. Apoio nos antebraços e nos joelhos.\n2. Corpo em linha reta dos joelhos à cabeça.\n3. Contraia abdome e glúteos.\n4. Mantenha 20–40s.","beneficios":"Fortalece core progressivamente.","cuidados":"Não elevar o quadril. Pescoço neutro.","material":"Tapete.","obs":"Nível 3 — Prancha.","defaultSeries":"3","defaultReps":"20–40s","defaultDescanso":"30s","tags":"core,prancha,estabilidade,nível2","foto":""},
{"id":"pr53","nome":"Prancha Lateral na Parede","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Oblíquos e Estabilidade Lateral","descricao":"Prancha lateral vertical contra a parede. Versão acessível para estabilidade lateral.","execucao":"1. De lado para a parede, braço estendido com a mão na parede.\n2. Afaste os pés até o corpo ficar diagonal.\n3. Corpo rígido, quadril levantado.\n4. 20–30s cada lado.","beneficios":"Ativa oblíquos de forma segura.","cuidados":"Quadril elevado. Não dobrar lateralmente.","material":"Parede.","obs":"Nível 1 — Prancha Lateral.","defaultSeries":"3","defaultReps":"20–30s cada","defaultDescanso":"30s","tags":"core,prancha lateral,oblíquos,nível1","foto":""},
{"id":"pr54","nome":"Prancha Lateral nos Joelhos","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Oblíquos e Estabilidade Lateral","descricao":"Prancha lateral com apoio no joelho. Menor demanda que a prancha lateral completa.","execucao":"1. Apoio no antebraço e no joelho.\n2. Eleve o quadril até o corpo formar linha reta joelho-ombro.\n3. Core contraído.\n4. 20–40s cada lado.","beneficios":"Fortalece oblíquos com menor demanda.","cuidados":"Quadril nivelado. Respirar normalmente.","material":"Tapete.","obs":"Nível 2 — Prancha Lateral.","defaultSeries":"3","defaultReps":"20–40s cada","defaultDescanso":"30s","tags":"core,prancha lateral,oblíquos,nível2","foto":""},
{"id":"pr55","nome":"Bird Dog","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Core, Glúteos e Estabilidade Lombar","descricao":"Extensão oposta de braço e perna nos quatro apoios. Excelente para controle motor e dor lombar.","execucao":"1. Quatro apoios, costas paralelas ao chão.\n2. Estenda o braço direito e a perna esquerda simultaneamente.\n3. Quadril nivelado, core contraído.\n4. Segure 2–3s. Alterne.","beneficios":"Ativa core profundo e glúteos. Melhora controle motor lombar.","cuidados":"Quadril não roda ou sobe. Movimento lento.","material":"Tapete.","obs":"Nível 3 — Bird Dog.","defaultSeries":"3","defaultReps":"8–10 cada","defaultDescanso":"30s","tags":"core,bird dog,glúteos,lombar,nível3","foto":""},
{"id":"pr56","nome":"Dead Bug","grupo":"Core","nivel":"Intermediário","momento":"Parte Principal","foco":"Core Profundo, Coordenação e Estabilidade","descricao":"Extensão oposta de braço e perna deitado. Treina o core profundo com dissociação.","execucao":"1. Deitado, braços para o teto, quadril e joelhos a 90°.\n2. Abaixe o braço direito para trás e a perna esquerda para o chão.\n3. Expire ao abaixar — lombar no chão.\n4. Retorne e alterne.","beneficios":"Forte ativação do transverso. Seguro para a coluna.","cuidados":"Lombar no chão durante todo o movimento. Expirar ao abaixar.","material":"Tapete.","obs":"Nível 2–3 — Dead Bug.","defaultSeries":"3","defaultReps":"6–8 cada","defaultDescanso":"30s","tags":"core,dead bug,coordenação,lombar,nível3","foto":""},
{"id":"pr57","nome":"Pallof Press com Elástico","grupo":"Core","nivel":"Intermediário","momento":"Parte Principal","foco":"Core Anti-Rotação","descricao":"Press frontal contra resistência rotacional do elástico. Treina o core anti-rotação.","execucao":"1. Elástico lateral na altura do peito.\n2. De lado ao ponto de fixação, segure com as duas mãos.\n3. Empurre os braços para frente resistindo à rotação.\n4. Segure 2s. Retorne.","beneficios":"Fortalece o core para resistir à rotação.","cuidados":"Quadris voltados para frente. Não girar o tronco.","material":"Faixa elástica lateral.","obs":"Nível 2 — Pallof Press.","defaultSeries":"3","defaultReps":"10 cada","defaultDescanso":"30s","tags":"core,anti-rotação,estabilidade,nível2","foto":""},
{"id":"pr58","nome":"Wood Chop com Elástico","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Oblíquos e Rotação Funcional","descricao":"Movimento diagonal de cima para baixo com elástico. Padrão funcional diagonal.","execucao":"1. Elástico preso alto e lateral.\n2. Puxe diagonalmente de cima para baixo, rotacionando o tronco.\n3. Retorne lentamente.","beneficios":"Treina rotação funcional em padrão diagonal.","cuidados":"Movimento controlado. Pés fixos.","material":"Faixa elástica presa em ponto alto.","obs":"Nível 1–2 — Wood Chop.","defaultSeries":"3","defaultReps":"12 cada","defaultDescanso":"30s","tags":"core,wood chop,oblíquos,rotação,nível2","foto":""},
{"id":"pr59","nome":"Farmer Hold","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Core, Preensão e Postura","descricao":"Segurar halteres em posição estática. Treina o core sob carga e a preensão.","execucao":"1. Halteres em cada mão ao lado do corpo.\n2. Postura ereta, ombros para trás.\n3. Core contraído, respiração normal.\n4. Mantenha 30–45s.","beneficios":"Fortalece core sob carga. Melhora preensão e postura.","cuidados":"Não deixar os ombros caírem.","material":"Halteres.","obs":"Nível 1–2 — Farmer Hold.","defaultSeries":"3","defaultReps":"30–45s","defaultDescanso":"60s","tags":"core,farmer hold,preensão,postura,nível2","foto":""},
{"id":"pr60","nome":"Suitcase Hold","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Core Anti-Lateral e Lombar","descricao":"Segurar carga em apenas um lado, resistindo à inclinação lateral.","execucao":"1. Halter em apenas uma mão.\n2. Postura completamente ereta — não inclinar.\n3. Ombros nivelados.\n4. 30–45s, troque de lado.","beneficios":"Treina o core anti-lateral. Fortalece quadrado lombar.","cuidados":"Resistir à inclinação lateral.","material":"Halter.","obs":"Nível 1–2 — Suitcase Hold.","defaultSeries":"3","defaultReps":"30–45s cada","defaultDescanso":"45s","tags":"core,suitcase hold,anti-lateral,lombar,nível1","foto":""},
{"id":"pr61","nome":"Hollow Hold Adaptado","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Core Profundo e Tensão Abdominal","descricao":"Posição de prancha deitada com lombar no chão. Versão acessível do hollow hold.","execucao":"1. Deitado, joelhos dobrados, pés no chão.\n2. Pressione a lombar contra o chão contraindo o abdome.\n3. Braços estendidos ao lado levantados 5–10cm.\n4. Mantenha 20–30s.","beneficios":"Ativa core profundo com lombar protegida.","cuidados":"Lombar no chão. Respire normalmente.","material":"Tapete.","obs":"Nível 1 — Hollow Hold.","defaultSeries":"3","defaultReps":"20–30s","defaultDescanso":"30s","tags":"core,hollow hold,abdome,nível1","foto":""},
{"id":"pr62","nome":"Rotação de Tronco com Elástico","grupo":"Core","nivel":"Básico","momento":"Parte Principal","foco":"Oblíquos e Mobilidade Rotacional","descricao":"Rotação de tronco contra resistência do elástico.","execucao":"1. Sentado, elástico lateral na altura dos ombros.\n2. Gire o tronco para o lado oposto ao elástico.\n3. Retorne controladamente.","beneficios":"Fortalece oblíquos. Melhora mobilidade rotacional.","cuidados":"Rotação vem do tronco, não do pescoço.","material":"Faixa elástica.","obs":"Nível 3 — Rotação de Tronco.","defaultSeries":"3","defaultReps":"10–12 cada","defaultDescanso":"30s","tags":"core,oblíquos,rotação,mobilidade,nível3","foto":""},
{"id":"pr63","nome":"Semi-Tandem","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Equilíbrio Estático — SPPB Nível 2","descricao":"Pés em posição semi-tandem. Nível 2 do teste SPPB.","execucao":"1. Calcanhar de um pé ao lado do hálux do outro.\n2. Apoio disponível.\n3. Mantenha 10–30s.\n4. Progredir para o tandem completo.","beneficios":"Progressão do equilíbrio bipodal. Avaliação e treino SPPB nível 2.","cuidados":"Apoio disponível. Progressão gradual.","material":"Cadeira ou parede.","obs":"Nível 2 — Equilíbrio. Componente do SPPB.","defaultSeries":"3","defaultReps":"10–30s","defaultDescanso":"20s","tags":"equilíbrio,semi-tandem,sppb,nível2","foto":""},
{"id":"pr64","nome":"Caminhada Tandem com Obstáculos","grupo":"Equilíbrio","nivel":"Avançado","momento":"Parte Principal","foco":"Equilíbrio Dinâmico com Obstáculos","descricao":"Caminhada tandem com pequenos obstáculos. Máximo desafio de equilíbrio dinâmico.","execucao":"1. Percurso com 3–5 obstáculos pequenos.\n2. Realize a caminhada tandem desviando ou passando sobre eles.\n3. Apoio lateral disponível.","beneficios":"Simula desafios reais com obstáculos.","cuidados":"Obstáculos pequenos e estáveis. Supervisão.","material":"Cones ou faixas. Apoio lateral.","obs":"Nível 5 — Caminhada Tandem.","defaultSeries":"3","defaultReps":"percurso completo","defaultDescanso":"30s","tags":"equilíbrio,tandem,obstáculos,avançado,nível5","foto":""},
{"id":"pr65","nome":"Marcha Resistida","grupo":"Equilíbrio","nivel":"Avançado","momento":"Parte Principal","foco":"Flexores do Quadril, Marcha e Resistência","descricao":"Marcha contra resistência de elástico. Treina força de marcha e equilíbrio sob carga.","execucao":"1. Elástico ao redor da cintura preso atrás.\n2. Marche para frente contra a resistência.\n3. Elevação exagerada dos joelhos.","beneficios":"Treina a marcha com resistência. Fortalece flexores do quadril.","cuidados":"Elástico seguro. Resistência leve para iniciar.","material":"Faixa elástica. Ponto de fixação firme.","obs":"Nível 5 — Marcha.","defaultSeries":"3","defaultReps":"10 passos","defaultDescanso":"60s","tags":"equilíbrio,marcha,resistida,avançado,nível5","foto":""},
{"id":"pr66","nome":"Farmer Walk","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Core, Equilíbrio Dinâmico e Preensão","descricao":"Caminhar carregando halteres. Treina core, equilíbrio dinâmico e preensão de forma integrada.","execucao":"1. Halteres em cada mão.\n2. Caminhe 10–20m com postura ereta.\n3. Ombros para trás, core contraído.","beneficios":"Treina core, equilíbrio e preensão de forma integrada.","cuidados":"Postura ereta. Iniciar com peso leve.","material":"Halteres. Espaço para caminhar.","obs":"Nível 1–3 — Farmer Walk.","defaultSeries":"3","defaultReps":"15–20m","defaultDescanso":"60s","tags":"equilíbrio,farmer walk,core,preensão,nível2","foto":""},
{"id":"pr67","nome":"Suitcase Carry","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Core Anti-Lateral e Equilíbrio Dinâmico","descricao":"Caminhar carregando carga em apenas um lado. Treina o core anti-lateral em movimento.","execucao":"1. Halter em apenas uma mão.\n2. Caminhe 10–15m mantendo postura ereta.\n3. Não inclinar para o lado do peso. Troque de lado.","beneficios":"Treina o core anti-lateral em movimento real.","cuidados":"Ombros nivelados. Não compensar inclinando o tronco.","material":"Halter. Espaço para caminhar.","obs":"Nível 1–3 — Suitcase Carry.","defaultSeries":"3","defaultReps":"10–15m cada","defaultDescanso":"60s","tags":"equilíbrio,suitcase carry,core,anti-lateral,nível2","foto":""},
{"id":"pr68","nome":"Transferência de Peso Lateral","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Equilíbrio Dinâmico e Controle Postural","descricao":"Transferência do peso de um pé ao outro. Base para todos os exercícios de equilíbrio dinâmico.","execucao":"1. Em pé com apoio.\n2. Transfira o peso para o pé direito, levante levemente o pé esquerdo.\n3. Retorne e transfira para o esquerdo.","beneficios":"Desenvolve controle do centro de massa.","cuidados":"Movimento lento. Apoio disponível.","material":"Cadeira ou parede.","obs":"Nível 1 — Transferência de Peso.","defaultSeries":"3","defaultReps":"15","defaultDescanso":"30s","tags":"equilíbrio,transferência,dinâmico,nível1","foto":""},
{"id":"pr69","nome":"Transferência de Peso Diagonal","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Equilíbrio Multidirecional","descricao":"Transferência do peso em padrão diagonal. Mais funcional que lateral ou frontal isolados.","execucao":"1. Em pé com apoio.\n2. Transfira o peso para o pé direito movendo o membro superior esquerdo para a diagonal oposta.\n3. Retorne e repita para o outro lado.","beneficios":"Treina o equilíbrio em padrão diagonal.","cuidados":"Apoio disponível. Movimento controlado.","material":"Cadeira ou parede.","obs":"Nível 3 — Transferência de Peso.","defaultSeries":"3","defaultReps":"10 cada","defaultDescanso":"30s","tags":"equilíbrio,transferência,diagonal,nível3","foto":""},
{"id":"pr70","nome":"Caminhada Lateral","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Abdutores, Equilíbrio Lateral e Marcha","descricao":"Caminhar lateralmente. Treina abdutores e equilíbrio no plano frontal.","execucao":"1. Em pé com apoio leve.\n2. Passos laterais para a direita (3–5 passos) depois retorne.\n3. Pés sempre afastados. Não arrastar.","beneficios":"Fortalece abdutores. Melhora equilíbrio frontal.","cuidados":"Manter o tronco ereto. Não arrastar os pés.","material":"Espaço aberto.","obs":"Nível 1–2 — Caminhada Lateral.","defaultSeries":"3","defaultReps":"5 passos cada","defaultDescanso":"30s","tags":"equilíbrio,lateral,abdutores,marcha,nível2","foto":""},
{"id":"pr71","nome":"Caminhada Lateral com Elástico","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Abdutores, Glúteo Médio e Equilíbrio","descricao":"Caminhada lateral com elástico acima dos joelhos. Maior ativação de glúteo médio.","execucao":"1. Elástico acima dos joelhos.\n2. Posição de semi-agachamento leve.\n3. Passos laterais contra a resistência.\n4. 5–8 passos para cada lado.","beneficios":"Forte ativação de glúteo médio. Melhora estabilidade lateral do joelho.","cuidados":"Joelhos alinhados (empurrar contra o elástico). Não arrastar os pés.","material":"Faixa elástica.","obs":"Nível 4 — Caminhada Lateral.","defaultSeries":"3","defaultReps":"5–8 cada","defaultDescanso":"30s","tags":"equilíbrio,lateral,elástico,abdutores,glúteos,nível4","foto":""},
{"id":"pr72","nome":"Caminhada Cruzada","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Coordenação, Equilíbrio e Padrão Motor","descricao":"Caminhar cruzando os pés. Desenvolve coordenação e equilíbrio em padrões complexos.","execucao":"1. Em pé com apoio leve.\n2. Cruze o pé direito à frente do esquerdo. Abra com o pé esquerdo.\n3. Repita cruzando o esquerdo à frente.\n4. 10 passos cada direção.","beneficios":"Desenvolve coordenação em padrões complexos.","cuidados":"Apoio disponível. Superfície antiderrapante. Iniciar lento.","material":"Espaço aberto com apoio.","obs":"Nível 2–3 — Caminhada Cruzada.","defaultSeries":"3","defaultReps":"10 passos cada","defaultDescanso":"30s","tags":"equilíbrio,coordenação,cruzado,nível3","foto":""},
{"id":"pr73","nome":"Step Balance com Apoio","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Equilíbrio Unipodal em Superfície Elevada","descricao":"Equilíbrio em uma perna sobre um step com apoio. Maior desafio proprioceptivo.","execucao":"1. Suba em step baixo com apoio.\n2. Transfira o peso para uma perna.\n3. Levante a outra perna.\n4. Mantenha 20–30s. Alterne.","beneficios":"Maior desafio proprioceptivo. Aumenta confiança em degraus.","cuidados":"Apoio disponível. Step estável e antiderrapante.","material":"Step ou degrau. Apoio lateral.","obs":"Nível 1 — Step Balance.","defaultSeries":"3","defaultReps":"20–30s cada","defaultDescanso":"30s","tags":"equilíbrio,step,unipodal,propriocepção,nível2","foto":""},
{"id":"pr74","nome":"Relógio Unipodal Assistido","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Equilíbrio Dinâmico Unipodal e Alcance","descricao":"Em uma perna, alcançar com o pé livre em diferentes direções do relógio.","execucao":"1. Em pé em uma perna, apoio disponível.\n2. Com o pé livre alcance: frente (12h), lado (3h), atrás (6h).\n3. Retorne entre cada alcance.","beneficios":"Treina equilíbrio dinâmico multidirecional. Alta transferência para prevenção de quedas.","cuidados":"Apoio disponível. Iniciar com poucas direções.","material":"Cadeira ou parede.","obs":"Nível 1 — Relógio Unipodal.","defaultSeries":"3","defaultReps":"cada direção","defaultDescanso":"30s","tags":"equilíbrio,unipodal,alcance,dinâmico,nível2","foto":""},
{"id":"pr75","nome":"Equilíbrio com Tarefa Dual","grupo":"Equilíbrio","nivel":"Avançado","momento":"Parte Principal","foco":"Atenção Dividida e Controle Postural","descricao":"Equilíbrio simultâneo com tarefa cognitiva. Simula demandas reais da marcha.","execucao":"1. Em pé ou caminhando, apoio disponível.\n2. Simultaneamente: contar de 3 em 3, nomear animais ou responder perguntas.\n3. Progredir em posição mais desafiadora.","beneficios":"Controle postural automático. Reduz quedas em situações de atenção dividida.","cuidados":"Supervisão. Apoio sempre disponível.","material":"Espaço seguro","obs":"Blocos 3 e 4 da periodização.","defaultSeries":"3","defaultReps":"60s","defaultDescanso":"30s","tags":"quedas,equilíbrio,tarefa dual,cognitivo","foto":""},

{"id":"mo01","nome":"Mobilidade de Tornozelo na Parede","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Tornozelo e Tíbia Anterior","descricao":"Melhora a dorsiflexão do tornozelo, fundamental para agachar com qualidade e prevenir tropeços.","execucao":"1. Em pé de frente para a parede, pé a 5–10cm dela.\n2. Dobre o joelho em direção à parede sem tirar o calcanhar do chão.\n3. Toque a parede com o joelho. Retorne.\n4. Afaste o pé gradualmente conforme melhora.\n5. 3 séries de 10 repetições cada pé.","beneficios":"Melhora dorsiflexão. Essencial para agachar e subir escadas. Previne dor no tornozelo.","cuidados":"Manter o calcanhar no chão. Não forçar além do conforto.","material":"Parede.","obs":"Afastar o pé da parede progressivamente como teste e progressão.","defaultSeries":"3","defaultReps":"10 cada","defaultDescanso":"15s","tags":"mobilidade,tornozelo,agachar,funcional","foto":""},
{"id":"mo02","nome":"Mobilidade de Tornozelo Dinâmica","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Tornozelo e Cadeia Posterior","descricao":"Mobilização ativa do tornozelo em movimento. Prepara para exercícios de marcha e equilíbrio.","execucao":"1. Em pé com apoio.\n2. Eleve levemente o pé e faça círculos completos com o tornozelo.\n3. 10 círculos em cada sentido.\n4. Alterne com flexão-extensão do pé (ponta e calcanhar).\n5. Repita com o outro pé.","beneficios":"Aquece e mobiliza o tornozelo. Melhora circulação nos pés. Prepara para marcha.","cuidados":"Movimento suave. Apoio disponível.","material":"Cadeira ou parede.","obs":"Excelente para alunos com edema nos pés ou artrite.","defaultSeries":"2","defaultReps":"10 cada sentido","defaultDescanso":"10s","tags":"mobilidade,tornozelo,circulação,aquecimento","foto":""},
{"id":"mo03","nome":"Mobilidade de Quadril Sentado","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Quadril e Rotadores Externos","descricao":"Mobilização do quadril em posição sentada. Seguro e eficaz para melhorar a amplitude rotacional.","execucao":"1. Sentado na ponta da cadeira.\n2. Eleve o joelho direito e faça círculos com o quadril: 10 para dentro, 10 para fora.\n3. Repita com o joelho esquerdo.\n4. Depois abra e feche o joelho como uma borboleta (abdução e adução).","beneficios":"Melhora mobilidade rotacional do quadril. Reduz rigidez matinal. Seguro para todos os níveis.","cuidados":"Movimento dentro da amplitude de conforto. Para se sentir dor aguda no quadril.","material":"Cadeira firme.","obs":"Ideal para alunos com artrose de quadril — movimentos suaves, sem carga.","defaultSeries":"2","defaultReps":"10 cada sentido","defaultDescanso":"15s","tags":"mobilidade,quadril,rotação,aquecimento","foto":""},
{"id":"mo04","nome":"Mobilidade de Quadril em Pé","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Quadril, Flexores e Rotadores","descricao":"Mobilização ativa do quadril em posição ortostática. Prepara para exercícios funcionais em pé.","execucao":"1. Em pé com apoio.\n2. Eleve o joelho até a altura do quadril e faça pequenos círculos: 10 para fora, 10 para dentro.\n3. Depois abra e feche o joelho (como montar e desmontar um cavalo).\n4. Repita com o outro lado.","beneficios":"Mobiliza quadril de forma ativa. Ativa os flexores e rotadores do quadril.","cuidados":"Apoio disponível. Amplitude confortável.","material":"Cadeira ou parede.","obs":"","defaultSeries":"2","defaultReps":"10 cada sentido cada perna","defaultDescanso":"15s","tags":"mobilidade,quadril,rotação,funcional,aquecimento","foto":""},
{"id":"mo05","nome":"Mobilidade Torácica Sentada","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Coluna Torácica e Rotação","descricao":"Melhora a mobilidade rotacional da coluna torácica. Essencial para postura e para reduzir a cifose do envelhecimento.","execucao":"1. Sentado na ponta da cadeira, pés no chão.\n2. Cruze os braços sobre o peito ou coloque as mãos atrás da cabeça.\n3. Gire o tronco lentamente para a direita o máximo possível.\n4. Retorne ao centro e repita para a esquerda.\n5. 3 séries de 10 repetições para cada lado.","beneficios":"Melhora rotação torácica. Reduz cifose. Essencial para dirigir e realizar atividades rotacionais.","cuidados":"A rotação vem da coluna torácica, não do pescoço. Movimento lento.","material":"Cadeira firme.","obs":"Pode usar um bastão sobre os ombros para visualizar a amplitude.","defaultSeries":"3","defaultReps":"10 cada lado","defaultDescanso":"15s","tags":"mobilidade,torácica,rotação,postura,cifose","foto":""},
{"id":"mo06","nome":"Mobilidade Torácica Quadrúpede","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Coluna Torácica e Rotação","descricao":"Rotação torácica na posição de quatro apoios. Alta especificidade para mobilidade torácica.","execucao":"1. Posição de quatro apoios (mãos e joelhos).\n2. Coloque uma mão atrás da cabeça.\n3. Gire o cotovelo em direção ao teto, rotacionando a coluna torácica.\n4. Retorne. Repita do outro lado.\n5. 3 séries de 8–10 repetições cada lado.","beneficios":"Máxima especificidade para mobilidade torácica. Melhora rotação e postura.","cuidados":"O movimento é da coluna torácica, não do pescoço. Quadris fixos.","material":"Tapete.","obs":"Exercício chave para combater a rigidez torácica.","defaultSeries":"3","defaultReps":"8–10 cada","defaultDescanso":"15s","tags":"mobilidade,torácica,rotação,quadrúpede,postura","foto":""},
{"id":"mo07","nome":"Cat-Camel","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Coluna Vertebral Completa","descricao":"Mobilização rítmica de toda a coluna em posição de quatro apoios. Reduz rigidez e melhora a consciência corporal da coluna.","execucao":"1. Posição de quatro apoios, mãos sob os ombros, joelhos sob os quadris.\n2. CAT: expire e arqueie as costas para cima (como um gato assustado), omoplatas abertas.\n3. CAMEL: inspire e afunde as costas para baixo, peito para frente.\n4. Alterne suavemente entre os dois movimentos.\n5. 10–15 repetições lentas.","beneficios":"Mobiliza toda a coluna vertebral. Reduz dor lombar. Ativa os músculos paravertebrais.","cuidados":"Movimento suave e rítmico. Não forçar a amplitude máxima inicialmente.","material":"Tapete.","obs":"Excelente para início de sessão ou para alunos com dor lombar crônica.","defaultSeries":"2","defaultReps":"10–15","defaultDescanso":"15s","tags":"mobilidade,coluna,lombar,torácica,cat-camel","foto":""},
{"id":"mo08","nome":"Thread the Needle","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Coluna Torácica e Ombro","descricao":"Rotação torácica com alcance do braço sob o tronco. Excelente para ombros e torácica.","execucao":"1. Posição de quatro apoios.\n2. Deslize o braço direito pelo chão sob o corpo ('enfiar a agulha'), rotacionando o tronco.\n3. O ombro direito toca ou aproxima-se do chão.\n4. Retorne e repita. Troque de lado.\n5. 3 séries de 8 repetições cada lado.","beneficios":"Melhora mobilidade torácica e do ombro. Combate a rotação interna excessiva do ombro.","cuidados":"Cabeça acompanha o movimento. Quadris permanecem nivelados.","material":"Tapete.","obs":"Um dos melhores exercícios para saúde do ombro no 50+.","defaultSeries":"3","defaultReps":"8 cada","defaultDescanso":"15s","tags":"mobilidade,torácica,ombro,rotação,thread the needle","foto":""},
{"id":"mo09","nome":"Mobilidade de Ombro com Bastão","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Ombro — Amplitude de Movimento","descricao":"Mobilização ativa do ombro usando um bastão como alavanca. Melhora a amplitude sem forçar a articulação.","execucao":"1. Segure um bastão com as duas mãos, afastadas.\n2. Leve os braços de frente para cima e para trás (windmill), passando sobre a cabeça.\n3. Retorne. Amplitude conforme conforto.\n4. 3 séries de 10 repetições.","beneficios":"Melhora amplitude do ombro. Previne lesões por rigidez. Ajuda em tarefas de alcance.","cuidados":"Ampliar a pegada no bastão se necessário. Parar se sentir dor.","material":"Bastão, cabo de vassoura ou toalha comprida.","obs":"Iniciar com pegada larga e estreitar progressivamente conforme mobilidade melhora.","defaultSeries":"3","defaultReps":"10","defaultDescanso":"15s","tags":"mobilidade,ombro,amplitude,bastão","foto":""},
{"id":"mo10","nome":"Mobilidade de Ombro Ativa","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Ombro — Mobilidade Ativa e Manguito","descricao":"Movimentos ativos do ombro sem carga. Ativa o manguito rotador e prepara para exercícios de força.","execucao":"1. Em pé ou sentado.\n2. Círculos com os braços: 10 para frente, 10 para trás.\n3. Elevação frontal e lateral alternada.\n4. Rotação interna e externa com cotovelo a 90°.\n5. 2 séries de cada movimento.","beneficios":"Aquece o manguito rotador. Prepara o ombro para exercícios de força. Melhora propriocepção.","cuidados":"Amplitude dentro do conforto. Sem dor.","material":"Sem equipamento.","obs":"","defaultSeries":"2","defaultReps":"10 cada movimento","defaultDescanso":"15s","tags":"mobilidade,ombro,manguito,aquecimento,ativo","foto":""},
{"id":"mo11","nome":"Mobilidade Escapular","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Escápulas e Postura","descricao":"Mobilização ativa das escápulas. Essencial para saúde do ombro e melhora da postura.","execucao":"1. Sentado ou em pé.\n2. Protração (escápulas para frente): empurre os ombros para frente.\n3. Retração (escápulas para trás): junte as omoplatas.\n4. Elevação (ombros para cima): como um encolher de ombros.\n5. Depressão (ombros para baixo): afaste os ombros das orelhas.\n6. Círculos completos. 10 repetições de cada.","beneficios":"Melhora controle escapular. Fundamental para saúde do ombro e postura ereta.","cuidados":"Movimento suave. Sem compensações do pescoço.","material":"Cadeira ou espaço livre.","obs":"Incluir como aquecimento em todos os treinos de MMSS.","defaultSeries":"2","defaultReps":"10 cada","defaultDescanso":"10s","tags":"mobilidade,escapular,ombro,postura,aquecimento","foto":""},
{"id":"mo12","nome":"Mobilidade Cervical","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Coluna Cervical e Pescoço","descricao":"Mobilização ativa e passiva da coluna cervical. Alivia tensão e melhora amplitude de movimento do pescoço.","execucao":"1. Sentado, ombros relaxados.\n2. Flexão/Extensão: olhe para baixo e para cima (dentro do conforto).\n3. Rotação: gire a cabeça para cada lado lentamente.\n4. Inclinação lateral: leve a orelha ao ombro.\n5. 10 repetições de cada movimento.","beneficios":"Alivia tensão cervical. Melhora amplitude. Importante para dirigir e atividades do cotidiano.","cuidados":"Sem hiperextensão. Movimentos muito lentos. Parar se sentir tontura.","material":"Cadeira.","obs":"Contraindicado em instabilidade cervical sem avaliação médica.","defaultSeries":"2","defaultReps":"10 cada movimento","defaultDescanso":"10s","tags":"mobilidade,cervical,pescoço,rigidez,aquecimento","foto":""},
{"id":"mo13","nome":"World's Greatest Stretch","grupo":"Mobilidade","nivel":"Intermediário","momento":"Parte Inicial","foco":"Mobilidade Integrada — Quadril, Torácica e Posterior","descricao":"Exercício de mobilidade completo que integra quadril, coluna torácica e membros inferiores em um único movimento.","execucao":"1. Posição de afundo (perna direita à frente).\n2. Coloque a mão direita ao lado do pé direito.\n3. Gire o tronco abrindo o braço esquerdo para o teto.\n4. Retorne e estenda a perna da frente (alongamento de isquiotibial).\n5. Repita do outro lado. 5 repetições cada lado.","beneficios":"Mobiliza quadril, torácica, ombros e isquiotibiais em um único movimento. Alta transferência funcional.","cuidados":"Progredir gradualmente. Pode ser feito com apoio da mão no chão ou em banco.","material":"Tapete. Apoio opcional.","obs":"Um dos exercícios de mobilidade mais completos para adultos ativos.","defaultSeries":"2","defaultReps":"5 cada lado","defaultDescanso":"15s","tags":"mobilidade,integrada,quadril,torácica,funcional","foto":""},
{"id":"mo14","nome":"Rotação Torácica Ajoelhada","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Coluna Torácica — Rotação","descricao":"Rotação torácica na posição semiajoelhada, estabilizando a lombar enquanto mobiliza a torácica.","execucao":"1. Posição semiajoelhada (um joelho no chão).\n2. Mãos atrás da cabeça ou uma mão na nuca.\n3. Gire o cotovelo para cima em direção ao teto.\n4. Retorne. 10 repetições de cada lado.","beneficios":"Isola a mobilidade torácica protegendo a lombar. Alta especificidade.","cuidados":"Quadris fixos. Rotação vem da torácica.","material":"Tapete.","obs":"Variação do thread the needle, mais desafiadora.","defaultSeries":"3","defaultReps":"10 cada","defaultDescanso":"15s","tags":"mobilidade,torácica,rotação,ajoelhado","foto":""},
{"id":"mo15","nome":"Mobilidade Integrada Funcional","grupo":"Mobilidade","nivel":"Intermediário","momento":"Parte Inicial","foco":"Mobilidade Global e Padrões Funcionais","descricao":"Sequência de movimentos de mobilidade que percorre os principais padrões funcionais. Aquecimento dinâmico completo.","execucao":"1. Agachamento com braços acima (10 reps).\n2. Afundo com rotação torácica (5 cada lado).\n3. Deadlift com bastão (10 reps).\n4. Mobilidade de tornozelo na parede (10 cada).\n5. Círculos de quadril em pé (10 cada sentido).\n6. Realizar a sequência como circuito.","beneficios":"Prepara o corpo para a sessão de treino completo. Ativa todos os sistemas.","cuidados":"Progressão gradual. Adaptar conforme limitações do aluno.","material":"Bastão. Tapete. Apoio opcional.","obs":"Ideal como aquecimento geral antes da parte principal.","defaultSeries":"1","defaultReps":"circuito completo","defaultDescanso":"—","tags":"mobilidade,integrada,funcional,aquecimento,padrões","foto":""},

{"id":"al01","nome":"Alongamento de Quadríceps","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Quadríceps e Flexores do Quadril","descricao":"Alonga o quadríceps e os flexores do quadril. Melhora a extensão do quadril e previne dor anterior do joelho.","execucao":"1. Em pé com apoio leve.\n2. Dobre o joelho trazendo o calcanhar em direção aos glúteos.\n3. Segure o tornozelo (ou use toalha se necessário).\n4. Mantenha o joelho apontando para baixo, quadris nivelados.\n5. 20–30s cada lado.","beneficios":"Alonga quadríceps e flexores do quadril. Previne dor no joelho. Melhora extensão do quadril.","cuidados":"Apoio disponível. Não puxar o joelho para a frente. Manter o quadril neutro.","material":"Cadeira ou parede para apoio. Toalha opcional.","obs":"Progressão: sem apoio. Regressão: deitado de barriga para baixo.","defaultSeries":"2","defaultReps":"30s cada","defaultDescanso":"10s","tags":"alongamento,quadríceps,joelho,flexores do quadril","foto":""},
{"id":"al02","nome":"Alongamento de Piriforme","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Piriforme e Rotadores Externos do Quadril","descricao":"Alonga o piriforme, músculo associado à síndrome do piriforme e dor ciática. Muito relevante para o 50+.","execucao":"1. Deitado de costas, joelhos dobrados.\n2. Cruze o tornozelo direito sobre o joelho esquerdo (posição de número 4).\n3. Traga ambas as pernas em direção ao peito.\n4. Sinta o alongamento profundo no glúteo e quadril.\n5. 30–45s cada lado.","beneficios":"Alonga piriforme. Alivia compressão do nervo ciático. Reduz dor glútea.","cuidados":"Não puxar pela cabeça da fíbula. Movimento suave.","material":"Tapete.","obs":"Versão sentada: cruz a perna na cadeira (já temos como 'Alongamento de Quadril e Glúteo'). Esta versão deitada permite maior relaxamento.","defaultSeries":"2","defaultReps":"30–45s cada","defaultDescanso":"10s","tags":"alongamento,piriforme,ciática,glúteos,lombar","foto":""},
{"id":"al03","nome":"Alongamento de Adutores","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Adutores e Face Interna da Coxa","descricao":"Alonga a musculatura adutora da coxa. Melhora a abertura do quadril e a base de sustentação.","execucao":"1. Sentado na ponta da cadeira.\n2. Abra os joelhos e pés, como na posição de sumô.\n3. Coloque os cotovelos nas coxas e aplique pressão suave para baixo.\n4. Mantenha a coluna reta.\n5. 20–30s.","beneficios":"Alonga adutores. Melhora abertura do quadril. Facilita higiene íntima e mobilidade funcional.","cuidados":"Pressão suave. Não forçar a abertura além do conforto.","material":"Cadeira firme.","obs":"Versão deitada: deitar com os pés juntos e joelhos abertos (posição borboleta).","defaultSeries":"2","defaultReps":"30s","defaultDescanso":"10s","tags":"alongamento,adutores,quadril,mobilidade","foto":""},
{"id":"al04","nome":"Alongamento de Flexores do Quadril","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Iliopsoas e Flexores do Quadril","descricao":"Alonga o iliopsoas e os flexores do quadril, encurtados pelo tempo excessivo sentado. Melhora a extensão do quadril e a postura.","execucao":"1. Posição semiajoelhada (joelho direito no chão, pé esquerdo à frente).\n2. Empurre o quadril levemente para frente e para baixo.\n3. Mantenha o tronco ereto.\n4. Sinta o alongamento na frente do quadril e da coxa da perna de trás.\n5. 30s cada lado.","beneficios":"Alonga iliopsoas. Corrige anteversão pélvica. Melhora postura e marcha.","cuidados":"Não arquear a lombar. Tapete sob o joelho.","material":"Tapete.","obs":"Crucial para quem passa muito tempo sentado. Incluir sempre na volta à calma.","defaultSeries":"2","defaultReps":"30s cada","defaultDescanso":"10s","tags":"alongamento,flexores do quadril,iliopsoas,postura,marcha","foto":""},
{"id":"al05","nome":"Alongamento Peitoral","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Peitoral Maior e Deltoides Anterior","descricao":"Alonga o peitoral e o deltoides anterior. Combate o encurvamento dos ombros para frente típico do envelhecimento.","execucao":"1. Em pé de lado a uma porta ou canto de parede.\n2. Apoie o antebraço e a mão na parede (cotovelo a 90°).\n3. Gire o tronco para o lado oposto até sentir o alongamento no peito.\n4. Mantenha 20–30s. Repita do outro lado.\n5. Alternativa: interconectar os dedos atrás das costas e abrir o peito.","beneficios":"Alonga peitoral e deltoides anterior. Melhora postura. Abre o tórax.","cuidados":"Não forçar além do conforto. Sem rotação excessiva do ombro.","material":"Parede ou porta.","obs":"Excelente para complementar os exercícios de remada e face pull.","defaultSeries":"2","defaultReps":"30s cada","defaultDescanso":"10s","tags":"alongamento,peitoral,ombros,postura,cifose","foto":""},
{"id":"al06","nome":"Alongamento Dorsal","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Coluna Torácica e Paravertebrais","descricao":"Alonga os músculos paravertebrais e a coluna torácica. Alivia tensão nas costas.","execucao":"1. Sentado, cruze os braços sobre o peito.\n2. Curve as costas arredondando a coluna torácica.\n3. Mantenha por 20–30s sentindo o alongamento entre as omoplatas.\n4. Alternativa: de joelhos, estenda os braços à frente no chão (posição de criança).","beneficios":"Alivia tensão nas costas. Alonga paravertebrais e romboides. Melhora mobilidade torácica.","cuidados":"Movimento suave. Sem dor aguda.","material":"Cadeira ou tapete.","obs":"","defaultSeries":"2","defaultReps":"30s","defaultDescanso":"10s","tags":"alongamento,dorsal,paravertebrais,torácica,coluna","foto":""},
{"id":"al07","nome":"Alongamento Cervical","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Trapézio Superior, Escalenos e Cervical","descricao":"Alonga a musculatura cervical e o trapézio superior. Alivia tensão do pescoço e dores de cabeça tensionais.","execucao":"1. Sentado, incline a orelha direita ao ombro direito.\n2. Com a mão direita aplique pressão leve sobre a têmpora esquerda.\n3. Mantenha 20–30s sentindo o alongamento no lado esquerdo do pescoço.\n4. Repita do outro lado.\n5. Adicionalmente: olhe levemente para o lado contrário para alongar os escalenos.","beneficios":"Alivia tensão cervical. Reduz dores de cabeça tensionais. Melhora postura da cabeça.","cuidados":"Pressão leve — deixar o peso da cabeça agir. Sem rotação excessiva.","material":"Cadeira.","obs":"Incluir sempre que o aluno relatar tensão no pescoço.","defaultSeries":"2","defaultReps":"30s cada","defaultDescanso":"10s","tags":"alongamento,cervical,trapézio,pescoço,cabeça","foto":""},
{"id":"al08","nome":"Alongamento de Trapézio","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Trapézio Superior e Médio","descricao":"Alonga o trapézio superior, frequentemente encurtado em pessoas com postura de cabeça anteriorizada.","execucao":"1. Sentado, coloque a mão direita atrás das costas ou segure o assento da cadeira.\n2. Incline a cabeça para a esquerda e levemente para frente.\n3. Com a mão esquerda, aplique pressão leve sobre a têmpora direita.\n4. 20–30s cada lado.","beneficios":"Alivia dor no trapézio e pescoço. Melhora postura da cabeça.","cuidados":"Pressão muito leve. Não puxar pelo queixo.","material":"Cadeira.","obs":"","defaultSeries":"2","defaultReps":"30s cada","defaultDescanso":"10s","tags":"alongamento,trapézio,pescoço,postura","foto":""},
{"id":"al09","nome":"Alongamento da Cadeia Posterior","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Cadeia Posterior Completa — Isquiotibiais, Glúteos e Lombar","descricao":"Alonga toda a cadeia posterior em um único exercício. Muito eficiente para volta à calma.","execucao":"1. Sentado na ponta da cadeira, pés no chão.\n2. Incline o tronco para frente deixando as mãos penduradas em direção ao chão.\n3. Mantenha a cabeça relaxada.\n4. Respire profundamente e afunde um pouco mais a cada expiração.\n5. Mantenha 30–45s.","beneficios":"Alonga isquiotibiais, glúteos, paravertebrais e lombar em um único movimento. Excelente para desaquecimento.","cuidados":"Movimento muito lento. Deixar o peso do tronco agir. Não forçar.","material":"Cadeira firme.","obs":"Um dos melhores exercícios finais de sessão pelo efeito calmante.","defaultSeries":"2","defaultReps":"30–45s","defaultDescanso":"15s","tags":"alongamento,cadeia posterior,isquiotibiais,lombar,desaquecimento","foto":""},
{"id":"al10","nome":"Alongamento Global","grupo":"Alongamento","nivel":"Básico","momento":"Parte Final","foco":"Corpo Inteiro — Cadeia Anterior e Posterior","descricao":"Posição de alongamento global que integra a cadeia posterior e anterior. Finalização tranquila da sessão.","execucao":"1. Deitado de costas, braços acima da cabeça e pernas estendidas.\n2. Estique o corpo todo, como se tentasse se tornar mais alto.\n3. Mantenha por 30s relaxando progressivamente.\n4. Alternativa em pé: braços acima da cabeça, ponta dos pés, corpo todo estendido por 10s, depois relaxar.","beneficios":"Alonga todo o corpo de forma integrada. Relaxa o sistema nervoso. Finaliza a sessão.","cuidados":"Respiração profunda e relaxada. Sem tensão.","material":"Tapete ou espaço em pé.","obs":"Ideal como exercício final de cada sessão antes da respiração diafragmática.","defaultSeries":"2","defaultReps":"30s","defaultDescanso":"15s","tags":"alongamento,global,cadeia anterior,cadeia posterior,relaxamento","foto":""},
