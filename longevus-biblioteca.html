{"id":"iq05","nome":"Propulsão Unipodal com Resistência Elástica","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Propulsão Unilateral / Preparação para Corrida","descricao":"Trabalha a fase de propulsão unilateral da marcha e corrida sob resistência elástica, exigindo estabilidade pélvica sob carga assimétrica.","execucao":"1. Em pé, elástico fixado atrás, na altura do quadril ou tornozelo.\n2. Apoio unipodal na perna de trabalho, joelho levemente flexionado.\n3. Estenda quadril e joelho empurrando o corpo para frente contra a resistência.\n4. Retorne controlado, sem perder o alinhamento do quadril.\n5. Repita continuamente, tronco estável.","beneficios":"Fortalece extensores de quadril em padrão de propulsão unilateral, melhora estabilidade pélvica sob carga assimétrica, com transferência direta para a corrida.","cuidados":"Não permitir queda do quadril contralateral. Tronco estável. Ajustar tensão do elástico priorizando qualidade de movimento.","material":"Faixa elástica com ponto de fixação","obs":"Reforçar a ideia de 'empurrar o chão para trás', associando ao gesto real de corrida.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"impacto_quadril,funcional,propulsão,corrida,unilateral","foto":"","video":"https://youtu.be/Tc_LaeWqK7U"},
{"id":"iq06","nome":"Propulsão Unipodal + Skipping","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Integração Propulsão + Recuperação da Passada","descricao":"Une propulsão de quadril e skipping em apoio unilateral, reproduzindo o ciclo completo da passada da corrida sob resistência, como preparação final para o retorno esportivo.","execucao":"1. Em pé, elástico fixado atrás, apoio unipodal na perna de trabalho.\n2. Estenda quadril e joelho empurrando o corpo à frente (propulsão).\n3. Sem pausa, traga o joelho da mesma perna rapidamente à frente (skipping).\n4. Retorne controlado e repita o ciclo continuamente.\n5. Tronco estável durante toda a sequência.","beneficios":"Integra potência e coordenação neuromuscular específicas da corrida, consolidando a estabilidade pélvica unilateral em movimento cíclico.","cuidados":"Não permitir queda do quadril contralateral em nenhuma das duas fases. Ritmo cíclico e coordenado, sem pausas abruptas entre as fases.","material":"Faixa elástica com ponto de fixação","obs":"Progressão natural da Propulsão Unipodal com Resistência Elástica.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"impacto_quadril,funcional,propulsão,skipping,corrida","foto":"","video":"https://youtu.be/2Vj87SINC9c"},
{"id":"iq07","nome":"Aceleração no Caixote com Carga Externa","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Aceleração Horizontal / Força Explosiva","descricao":"Reproduz o padrão de aceleração da corrida a partir do caixote, associando o gesto explosivo de saída à sobrecarga externa.","execucao":"1. Posicione-se sobre o caixote em flexão de quadril e joelho.\n2. Carga externa fixada na cintura/tronco, tracionando para trás.\n3. Realize a saída explosiva, empurrando o corpo para frente contra a resistência.\n4. Execute passadas curtas e potentes, tronco inclinado à frente.\n5. Desacelere de forma controlada ao final do percurso.","beneficios":"Desenvolve força explosiva concêntrica em padrão de aceleração, com transferência direta para a velocidade de saída no esporte.","cuidados":"Tronco inclinado à frente na fase de aceleração. Passadas curtas e potentes no início, amplitude progressiva. Progressão de carga só com técnica de saída consistente.","material":"Caixote + carga externa (elástico, colete ou trenó)","obs":"Fase avançada, preparação para o retorno esportivo.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"impacto_quadril,funcional,aceleração,corrida,potência","foto":"","video":"https://youtu.be/AXBkJIcmR2U"},
{"id":"iq08","nome":"Aceleração Unipodal no Caixote com Carga Externa","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Aceleração Unilateral / Força Explosiva Assimétrica","descricao":"Progressão unilateral da aceleração no caixote, exigindo maior estabilidade pélvica e força explosiva assimétrica.","execucao":"1. Posicione-se sobre o caixote apoiado em uma perna, com flexão de quadril e joelho.\n2. Carga externa fixada na cintura/tronco.\n3. Realize a saída explosiva com a perna de apoio, empurrando o corpo à frente.\n4. A perna contralateral acompanha o movimento apenas para equilíbrio.\n5. Execute passadas curtas e potentes, tronco à frente, e desacelere ao final.","beneficios":"Desenvolve força explosiva unilateral e estabilidade pélvica sob carga assimétrica, com transferência para saídas de bloco e mudanças de direção.","cuidados":"Não permitir queda de quadril contralateral na saída. Evitar rotação de tronco/pelve. Progressão de carga só com técnica de saída consistente.","material":"Caixote + carga externa","obs":"Progressão direta da aceleração bipodal.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"impacto_quadril,funcional,aceleração,corrida,unilateral,avançado","foto":"","video":"https://youtu.be/r65JEina9NY"},
{"id":"iq09","nome":"Ativação de Glúteo no Plano Transversal","grupo":"MMII","nivel":"Básico","momento":"Parte Inicial","foco":"Glúteo Médio — Abdução/Rotação Externa","descricao":"Trabalha o glúteo médio como abdutor e rotador externo de quadril durante deslocamento lateral, fundamental para o controle do valgo dinâmico.","execucao":"1. Meio agachamento, elástico acima dos joelhos (ou tornozelos).\n2. Leve flexão de quadris e joelhos, tronco levemente à frente.\n3. Realize passos laterais controlados, afastando uma perna e trazendo a outra, sem perder a tensão do elástico.\n4. Repita o deslocamento por uma distância determinada e retorne na direção oposta.","beneficios":"Ativa o glúteo médio como estabilizador no plano transversal, melhora o controle do valgo dinâmico e a estabilidade pélvica no deslocamento lateral.","cuidados":"Manter o elástico sempre tenso, sem que os joelhos se aproximem entre os passos. Não permitir queda de quadril nem rotação de tronco. Joelhos alinhados sobre os pés.","material":"Faixa elástica","obs":"Progressão: aumentar a tensão do elástico ou reposicionar dos joelhos para os tornozelos.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"impacto_quadril,mmii,glúteo médio,valgo dinâmico","foto":"","video":"https://youtu.be/G4GXjEGFw4g"},
{"id":"et01","nome":"Mobilidade de Tornozelo — Anteriorização de Tíbia + Posteriorização de Tálus","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Dorsiflexão / Deslizamento Tíbio-Társico","descricao":"Mobilização manual assistida que respeita a mecânica articular da tíbio-társica, restaurando o deslizamento posterior do tálus e a dorsiflexão perdida após entorse.","execucao":"1. Paciente em pé, pé apoiado em superfície estável, calcâneo fixo no solo.\n2. Profissional posicionado à frente do paciente.\n3. Com uma mão, aplica força para anteriorizar a tíbia e fíbula.\n4. Com a outra mão, pressiona posteriormente o tálus, favorecendo o deslizamento articular.\n5. Movimento em dorsiflexão, lento e controlado, respeitando o limite do paciente.","beneficios":"Melhora a dorsiflexão em CCF, restaura o deslizamento posterior do tálus e recupera a capacidade de gerar rigidez funcional do tornozelo.","cuidados":"Calcâneo deve permanecer em contato com o solo. Evitar pronação excessiva ou desvio medial do joelho. Ajustar intensidade pela tolerância; reduzir se houver dor.","material":"Nenhum (mobilização manual do profissional)","obs":"Fase inicial — usar como preparação antes de exercícios em carga. Indicado para rigidez pós-imobilização.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"entorse_tornozelo,mobilidade,dorsiflexão,tálus","foto":"","video":"https://youtu.be/sf0j9xTxPFg"},
{"id":"et02","nome":"Mobilidade de Tornozelo (Arqueiro)","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Dorsiflexão Funcional em CCF","descricao":"Trabalha a dorsiflexão de forma funcional e integrada ao movimento, em base de afundo, essencial para recuperar a absorção de carga e a progressão da tíbia sobre o pé.","execucao":"1. Base de afundo (posição de arqueiro), pé da frente apoiado no solo.\n2. Calcâneo em contato com o solo durante toda a execução.\n3. Avance o joelho à frente, promovendo dorsiflexão do tornozelo.\n4. Tronco acompanha o movimento naturalmente, mantendo alinhamento.\n5. Retorne de forma lenta e controlada.","beneficios":"Melhora a dorsiflexão em CCF, restaura a mobilidade funcional e reduz compensações durante a carga.","cuidados":"Calcâneo sempre apoiado. Evitar pronação excessiva ou desvio medial do joelho. Manter alinhamento entre pé, joelho e quadril.","material":"Nenhum","obs":"Fase inicial da reabilitação.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"entorse_tornozelo,mobilidade,dorsiflexão,arqueiro","foto":"","video":"https://youtu.be/fZENiAtttfM"},
{"id":"et03","nome":"Mobilidade de Tornozelo com Elástico Diagonal","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Dorsiflexão Funcional com Tração Articular","descricao":"Associa a posição de arqueiro à tração elástica diagonal, favorecendo o deslizamento posterior do tálus e recuperando a mobilidade de forma funcional e integrada.","execucao":"1. Base de afundo (arqueiro), pé da frente no solo ou em um step.\n2. Elástico na região anterior do tornozelo, tração para trás e levemente na diagonal.\n3. Calcâneo em contato com o solo durante toda a execução.\n4. Avance o joelho à frente, promovendo dorsiflexão.\n5. Retorne de forma lenta e controlada, mantendo alinhamento do membro inferior.","beneficios":"Melhora a dorsiflexão em CCF com qualidade articular, restaura mobilidade funcional e reduz compensações.","cuidados":"Calcâneo sempre apoiado. Evitar pronação excessiva ou desvio medial do joelho. Ajustar tensão do elástico pela limitação do paciente.","material":"Faixa elástica","obs":"Fase inicial — prioriza qualidade do movimento antes de amplitude.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"entorse_tornozelo,mobilidade,dorsiflexão,elástico","foto":"","video":"https://youtu.be/svqxh-V0aaU"},
{"id":"et04","nome":"Agachamento Unilateral com Giro","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Rigidez de Tornozelo em CCF com Rotação","descricao":"Trabalha a rigidez e o controle do tornozelo em apoio unipodal com giro de tronco e alcance contralateral, exigindo estabilidade mesmo com deslocamento do centro de massa.","execucao":"1. Apoio unipodal, outra perna inicialmente à frente do corpo.\n2. Leve a perna livre para trás, flexionando joelho e quadril da perna de apoio.\n3. Simultaneamente, o braço contralateral realiza alcance em direção ao pé de base.\n4. Tronco acompanha com leve rotação.\n5. Retorne de forma controlada, mantendo estabilidade do membro de apoio.","beneficios":"Desenvolve rigidez funcional do tornozelo em CCF, melhora o controle postural rotacional e a estabilidade em apoio unipodal.","cuidados":"Apoio plantar completo no pé de base. Evitar colapso do tornozelo ou valgo dinâmico de joelho. Preferencialmente descalço, favorecendo controle sensório-motor.","material":"Nenhum","obs":"Fases iniciais da reabilitação.","defaultSeries":"4","defaultReps":"10–12","defaultDescanso":"45s","tags":"entorse_tornozelo,mmii,rigidez,rotação,unipodal","foto":"","video":"https://youtu.be/JSy8xPtZYAw"},
{"id":"et05","nome":"Ativação de Fibulares — Isométrico em Posição de Aceleração","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Fibulares / Estabilidade contra Inversão","descricao":"Ativa os fibulares em posição funcional de aceleração, com resistência manual medial-lateral, estabilizando o retropé contra forças de inversão e estimulando o Windlass Mechanism.","execucao":"1. Base assimétrica simulando posição de aceleração, pé da frente apoiado sobre um step.\n2. Pé de trás totalmente apoiado no solo, joelho estendido.\n3. O profissional aplica resistência manual no calcâneo do pé de trás, de medial para lateral.\n4. O paciente resiste à força, mantendo o tornozelo estável e o pé ativo.\n5. Peso predominante na perna de trás durante toda a execução.","beneficios":"Ativa os fibulares em posição funcional, melhora a estabilidade contra forças de inversão e prepara o tornozelo para demandas mais dinâmicas.","cuidados":"Joelho da perna de trás totalmente estendido. Vetor de força de medial para lateral. Evitar rotação de quadril ou descarga no antepé — peso na base do 1º metatarso.","material":"Nenhum (resistência manual do profissional)","obs":"Fases iniciais da reabilitação.","defaultSeries":"4","defaultReps":"30–60s (sustentação)","defaultDescanso":"30–60s","tags":"entorse_tornozelo,mmii,fibulares,isométrico,inversão","foto":"","video":"https://youtu.be/Y8nqdN8_6S8"},
{"id":"et06","nome":"Rigidez de Tornozelo","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Rigidez do Retropé em Apoio Unipodal","descricao":"Trabalha o tornozelo como base de sustentação em apoio no antepé com calcanhar elevado, exigindo rigidez para evitar colapso no plano medial-lateral.","execucao":"1. Em pé sobre um step, apoiando apenas o antepé.\n2. Calcâneo suspenso, leve inclinação anterior do tronco.\n3. Membro contralateral sem apoio, simulando posição funcional.\n4. Sustente a posição isometricamente, mantendo o tornozelo estável.\n5. Evite que o pé ceda para os lados ou que o calcanhar desça.","beneficios":"Desenvolve rigidez funcional do tornozelo em CCF, melhora a estabilidade do retropé e o controle postural em apoio unipodal.","cuidados":"Não permitir que o calcâneo desça. Evitar perda de alinhamento medial-lateral do pé. Quadril e tronco estáveis, sem compensações.","material":"Step","obs":"Progressão: aumentar o tempo, inclinar mais o corpo ou adicionar carga externa.","defaultSeries":"4","defaultReps":"20–40s (sustentação)","defaultDescanso":"30–60s","tags":"entorse_tornozelo,mmii,rigidez,retropé,unipodal","foto":"","video":"https://youtu.be/vH4hXJyPNHM"},
{"id":"et07","nome":"Isométrico em Pé com Troca de Carga","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Rigidez sob Perturbação / Controle Postural","descricao":"Exige manutenção da rigidez do tornozelo diante da troca de peso entre as mãos, aproximando o paciente de situações reais onde o controle não é previsível.","execucao":"1. Base de afundo, ambos os pés na ponta (calcanhares elevados).\n2. Tronco levemente inclinado à frente, alinhamento corporal mantido.\n3. Segure um peso (halter ou kettlebell) em uma das mãos.\n4. Sustente a posição isométrica trocando o peso por baixo da perna da frente.\n5. Alterne o peso entre as mãos de forma controlada e contínua.","beneficios":"Mantém a rigidez funcional do tornozelo em CCF, melhora o controle postural sob perturbação externa e o sinergismo muscular global.","cuidados":"Ambos os calcâneos elevados durante toda a execução. Joelho da frente alinhado, sem valgo dinâmico. Evitar flexão lombar ou inclinação excessiva do tronco.","material":"Halter ou kettlebell","obs":"Fase intermediária da reabilitação.","defaultSeries":"4","defaultReps":"6–10 trocas","defaultDescanso":"45s","tags":"entorse_tornozelo,equilíbrio,perturbação,rigidez","foto":"","video":"https://youtu.be/6I99IuO41_w"},
{"id":"et08","nome":"Ativação de Fibulares — Dinâmico em Posição de Aceleração","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Fibulares Dinâmico / Rigidez em Movimento","descricao":"Evolui o controle estático dos fibulares para a capacidade de responder a forças em movimento, integrando o padrão funcional de aceleração com movimento de membros superiores.","execucao":"1. Base assimétrica simulando aceleração, pé da frente sobre um step.\n2. Pé de trás apoiado no solo, joelho estendido.\n3. O profissional aplica resistência manual no calcâneo do pé de trás, de medial para lateral.\n4. Realize elevação e descida repetida do calcanhar, controlando o tornozelo.\n5. Simultaneamente, troque os braços alternadamente à frente do corpo.","beneficios":"Desenvolve rigidez dinâmica do tornozelo em CCF, melhora o controle contra vetores de entorse e integra tornozelo com membros superiores e tronco.","cuidados":"Controle ativo do tornozelo durante toda a execução. Evitar compensações de quadril e tronco. Enfatizar a ativação dos fibulares na elevação do calcâneo.","material":"Nenhum (resistência manual do profissional)","obs":"Fases intermediárias da reabilitação.","defaultSeries":"4","defaultReps":"10–15","defaultDescanso":"45s","tags":"entorse_tornozelo,mmii,fibulares,dinâmico","foto":"","video":"https://youtu.be/QEkc-_TxcO4"},
{"id":"et09","nome":"Controle Excêntrico de Fibulares","grupo":"MMII","nivel":"Avançado","momento":"Parte Principal","foco":"Controle Excêntrico / Prevenção de Recidiva","descricao":"Simula diretamente o mecanismo de entorse, ensinando o tornozelo a controlar de forma excêntrica o movimento de inversão — essencial para prevenção de recidiva.","execucao":"1. Base assimétrica simulando aceleração, pé da frente sobre um step.\n2. Pé de trás apoiado no solo, joelho estendido.\n3. O profissional aplica resistência manual no calcâneo, direcionando para inversão.\n4. Na descida, controle excentricamente contra a força aplicada.\n5. Na subida, retorne com controle ativo, de forma rítmica.","beneficios":"Desenvolve controle excêntrico dos fibulares em CCF, melhora a capacidade de frear o movimento de inversão e previne recidiva de entorse.","cuidados":"Evitar que o tornozelo 'caia' rapidamente em inversão na descida. Ativação constante dos fibulares. Evitar compensações de quadril ou tronco.","material":"Nenhum (resistência manual do profissional)","obs":"Progressão: aumentar gradualmente a intensidade da força aplicada.","defaultSeries":"4","defaultReps":"10–15","defaultDescanso":"45s","tags":"entorse_tornozelo,mmii,fibulares,excêntrico,prevenção","foto":"","video":"https://youtu.be/MH5fy6pL7u0"},
{"id":"et10","nome":"Isométrico com Perturbação","grupo":"Equilíbrio","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Reativa sob Perturbação Rápida","descricao":"Garante que o tornozelo mantenha rigidez diante de perturbações rápidas e imprevisíveis, aproximando o treino da funcionalidade real e do mecanismo de entorse.","execucao":"1. Base de afundo, ambos os pés na ponta (calcanhares elevados).\n2. Tronco alinhado e levemente inclinado à frente.\n3. Segure um peso (halter ou kettlebell) próximo ao corpo.\n4. Realize projeção rápida e firme do peso à frente, na linha média do corpo.\n5. Retorne o peso de forma controlada e repita ritmicamente.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora o controle postural sob perturbações rápidas e prepara para o retorno funcional seguro.","cuidados":"Calcâneos elevados durante toda a execução. Joelho da frente alinhado, sem valgo dinâmico. Executar a projeção com velocidade, mas controlar o retorno.","material":"Halter ou kettlebell","obs":"Fases intermediárias a avançadas da reabilitação.","defaultSeries":"4","defaultReps":"8–12","defaultDescanso":"45s","tags":"entorse_tornozelo,equilíbrio,perturbação,rigidez reativa","foto":"","video":"https://youtu.be/ZNKlgO21qNU"},
{"id":"et11","nome":"Isométrico com Perturbação da Aquabag","grupo":"Equilíbrio","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez sob Instabilidade Imprevisível","descricao":"A instabilidade constante da aquabag exige manutenção da rigidez do tornozelo em tempo real, com ajustes rápidos do centro de massa e integração entre tornozelo, quadril e tronco.","execucao":"1. Base de afundo, ambos os pés na ponta (calcanhares elevados).\n2. Tronco alinhado e levemente inclinado à frente.\n3. Segure a aquabag à frente do corpo, cotovelos semiflexionados.\n4. O profissional aplica perturbações inesperadas na aquabag.\n5. Mantenha a posição isométrica, controlando tornozelo, quadril e tronco.","beneficios":"Desenvolve rigidez do tornozelo em CCF, melhora o controle neuromuscular sob instabilidade e prepara para o retorno funcional seguro.","cuidados":"Calcâneos elevados durante toda a execução. Olhar à frente e tronco estável. Distribuir a resposta pelo corpo, não apenas pelo tronco.","material":"Aquabag","obs":"Ajustar intensidade e direção das perturbações conforme o nível do paciente.","defaultSeries":"4","defaultReps":"20–40s (sustentação)","defaultDescanso":"30–60s","tags":"entorse_tornozelo,equilíbrio,perturbação,aquabag","foto":"","video":"https://youtu.be/5FHqDaDs9Uk"},
{"id":"et12","nome":"Agachamento Unilateral com Aquabag","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Controle Excêntrico + Potência Unipodal","descricao":"Integra controle excêntrico na descida e produção de força na subida em apoio unipodal, com a instabilidade da aquabag aumentando a exigência de controle do tornozelo.","execucao":"1. Apoio unipodal, segurando a aquabag com os braços estendidos à frente.\n2. Incline o tronco à frente, levando a perna contralateral para trás.\n3. Desça de forma lenta e controlada, mantendo estabilidade do tornozelo.\n4. Na subida, retorne de forma rápida e explosiva, projetando a aquabag na linha do tronco/ombros.\n5. Repita com controle na descida e potência na subida.","beneficios":"Desenvolve controle excêntrico do membro inferior, rigidez do tornozelo em apoio unipodal e integra estabilidade com produção de força.","cuidados":"Coluna neutra durante a inclinação, sem flexão lombar. Apoio plantar firme. Evitar rotação de quadril na descida.","material":"Aquabag","obs":"Fase intermediária da reabilitação.","defaultSeries":"4","defaultReps":"8–10","defaultDescanso":"45s","tags":"entorse_tornozelo,mmii,unipodal,potência,aquabag","foto":"","video":"https://youtu.be/2QyRicydcog"},
{"id":"et13","nome":"Rigidez de Tornozelo — Troca Rápida de Base","grupo":"MMII","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Dinâmica em Troca de Base","descricao":"Exige rigidez rápida e ajuste da base de apoio durante troca ântero-posterior das pernas, com troca cruzada de braços aumentando a complexidade funcional.","execucao":"1. Postura de aceleração, uma perna à frente e outra atrás, ambas na ponta do pé.\n2. Inicie com a base mais fechada, pés próximos.\n3. Realize abertura rápida da base (perna da frente avança, a de trás recua).\n4. Simultaneamente, troque as mãos cruzadas à frente do corpo.\n5. Retorne à posição inicial de forma controlada, alternando ritmicamente.","beneficios":"Desenvolve rigidez dinâmica do tornozelo em CCF, melhora o controle em trocas rápidas de base e prepara para demandas esportivas.","cuidados":"Calcâneos elevados durante toda a execução. Evitar oscilação excessiva de quadril e tronco. Alinhamento do pé e joelho durante o movimento.","material":"Nenhum","obs":"Progressão: aumentar velocidade, amplitude ou inserir comando externo.","defaultSeries":"4","defaultReps":"8–12","defaultDescanso":"45s","tags":"entorse_tornozelo,mmii,rigidez,troca de base","foto":"","video":"https://youtu.be/h_TryCYarw8"},
{"id":"et14","nome":"Mobilidade sobre Estabilidade — Rigidez","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Rigidez sob Instabilidade do Centro de Massa","descricao":"A posição em afundo na ponta do pé associada a movimento circular de carga acima da cabeça cria instabilidade no centro de massa, exigindo rigidez contínua do tornozelo.","execucao":"1. Base de afundo, pé da frente sobre um step, apenas na ponta do pé.\n2. Pé de trás também apenas na ponta do pé.\n3. Segure uma carga (halter ou anilha) com as mãos acima da cabeça.\n4. Tronco estável, levemente inclinado à frente.\n5. Realize movimentos circulares com a carga ao redor da cabeça, sustentando a posição.","beneficios":"Desenvolve rigidez do tornozelo em CCF, melhora o controle sob instabilidade externa e a estabilidade em apoio unilateral.","cuidados":"Calcâneo elevado durante toda a execução. Tornozelo estável, sem colapso. Tronco firme e abdômen ativo, evitando rotação de quadril.","material":"Halter ou anilha","obs":"Progressão: aumentar carga, velocidade ou amplitude do movimento circular.","defaultSeries":"4","defaultReps":"20–30s por série","defaultDescanso":"45s","tags":"entorse_tornozelo,equilíbrio,rigidez,instabilidade","foto":"","video":"https://youtu.be/Q7_9Qs6nY8M"},
{"id":"et15","nome":"Skipping Lateral","grupo":"Funcional","nivel":"Intermediário","momento":"Parte Principal","foco":"Reatividade em Deslocamento Lateral","descricao":"Alterna subida no step (estabilidade com apoio plantar completo) e descida no solo (contato rápido na ponta do pé), exigindo rigidez no contato e controle na transição entre superfícies.","execucao":"1. Posicione-se ao lado de um step ou plataforma baixa.\n2. Faça o movimento lateral, apoiando um pé sobre o step com a planta inteira.\n3. Retorne ao solo com o outro pé, com contato na ponta do pé.\n4. Alterne os pés continuamente, mantendo ritmo e leveza.\n5. Repita o ciclo, controlando subida e descida.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora o controle em deslocamentos laterais e previne recidiva de entorse.","cuidados":"Apoio plantar completo na subida; contato na ponta do pé na descida. Joelhos levemente flexionados, quadril estável.","material":"Step ou plataforma baixa","obs":"Progressão: aumentar velocidade, altura do step ou amplitude lateral.","defaultSeries":"4","defaultReps":"20–30s por série","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,skipping,lateral,reatividade","foto":"","video":"https://youtu.be/HVw3jDDEY58"},
{"id":"et16","nome":"Skipping Duplo no Step","grupo":"Funcional","nivel":"Intermediário","momento":"Parte Principal","foco":"Transição entre Apoio Duplo e Unilateral","descricao":"Alterna apoio duplo no step (maior estabilidade) e apoio unilateral no solo (desafio de equilíbrio), exigindo reorganização rápida entre os apoios.","execucao":"1. Em pé próximo a um step ou plataforma baixa.\n2. Suba com um pé apoiando a planta inteira no step.\n3. Suba o outro pé, também com apoio completo (apoio duplo no step).\n4. Na descida, apenas um pé retorna ao solo com apoio plantar completo.\n5. O outro pé permanece elevado em direção ao peito. Repita o ciclo continuamente.","beneficios":"Melhora o controle do tornozelo em CCF, desenvolve estabilidade em apoio unilateral e aprimora a coordenação neuromuscular.","cuidados":"Apoio plantar completo na subida e na descida. Joelhos levemente flexionados, quadril estável, tronco ereto.","material":"Step ou plataforma baixa","obs":"Progressão: aumentar velocidade ou altura do step.","defaultSeries":"4","defaultReps":"20–30s por série","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,skipping,step,coordenação","foto":"","video":"https://youtu.be/HWgzn1Ne3bI"},
{"id":"et17","nome":"Hop Lateral Reativo + Bound Lateral","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Reativa + Absorção de Impacto Multidirecional","descricao":"Combina hop (salto e aterrissagem na mesma perna, contato curto) e bound (salto com transferência de carga para a outra perna), desenvolvendo rigidez dinâmica completa e resposta neuromuscular.","execucao":"1. Apoio unipodal no primeiro cone.\n2. Realize hops laterais reativos, saltando e aterrissando na mesma perna, contato breve.\n3. Ao alcançar o último cone, execute um bound lateral, aterrissando na perna oposta.\n4. Retorne ao cone inicial com controle na aterrissagem.\n5. Repita ritmicamente: hops → bound.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora o controle em mudanças rápidas de direção e a absorção/produção de força.","cuidados":"Nos hops, contato leve e rápido, sem 'afundar'. No bound, absorver o impacto com controle. Evitar colapso lateral do tornozelo.","material":"Cones","obs":"Progressão: aumentar distância, velocidade ou inserir estímulos externos.","defaultSeries":"4","defaultReps":"4–6 ciclos completos","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,hop,bound,reatividade,avançado","foto":"","video":"https://youtu.be/90C-4Y3LHTQ"},
{"id":"et18","nome":"Aceleração com Resistência Elástica (Ênfase em Fibulares)","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Dinâmica em Padrão de Aceleração","descricao":"O gesto de aceleração contra resistência lateral aproxima o exercício da funcionalidade real, ativando os fibulares contra forças de inversão durante movimento rápido.","execucao":"1. Posição inicial de aceleração, tronco inclinado à frente, joelho semiflexionado.\n2. Pé da frente apoiado sobre um step, servindo como base.\n3. Fixe o elástico no tornozelo da perna de trás, com tração lateral para fora.\n4. Peso predominante na perna de trás.\n5. Realize o gesto de saída (drive do joelho + balanço coordenado dos braços) contra a resistência do elástico.","beneficios":"Desenvolve rigidez dinâmica do tornozelo em CCF, melhora o controle contra vetores de inversão e integra o tornozelo ao padrão de aceleração.","cuidados":"Peso predominante na perna de trás. Tornozelo estável, sem colapso lateral. Controlar o alinhamento do joelho, evitando valgo.","material":"Faixa elástica + step","obs":"Progressão: aumentar resistência do elástico ou velocidade do movimento.","defaultSeries":"4","defaultReps":"8–12","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,fibulares,aceleração,elástico","foto":"","video":"https://youtu.be/ZGwHzr3rHYE"},
{"id":"et19","nome":"Ativação de Fibulares na Parede com Troca Reativa","grupo":"MMII","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Reativa em Troca Explosiva de Apoio","descricao":"O elástico puxando para fora cria vetor semelhante ao mecanismo de entorse, exigindo forte ativação dos fibulares durante troca explosiva de pernas ao comando.","execucao":"1. Em frente à parede, tronco levemente inclinado, mãos apoiadas.\n2. Um pé em apoio na ponta do pé (posição de aceleração), a outra perna elevada.\n3. Aplique um elástico na perna elevada, com tração lateral para fora.\n4. Ao comando, troque explosivamente as pernas: a perna com elástico desce para apoio na ponta do pé, a perna de apoio sobe em direção ao peito.\n5. Repita ritmicamente, mantendo velocidade e controle.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora o controle contra forças laterais e a resposta neuromuscular rápida.","cuidados":"Quadril estável, sem rotação durante a troca. Apoio ativo na ponta do pé no contato. Evitar compensações de tronco.","material":"Faixa elástica","obs":"Progressão: aumentar tensão do elástico ou variar estímulos.","defaultSeries":"4","defaultReps":"10–15","defaultDescanso":"45s","tags":"entorse_tornozelo,mmii,fibulares,reatividade,elástico","foto":"","video":"https://youtu.be/CbvTAZL94Wg"},
{"id":"et20","nome":"Desaceleração com Aterrissagem na Ponta do Pé","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Absorção de Impacto na Aterrissagem","descricao":"A aterrissagem na ponta do pé aumenta a exigência sobre o sistema, treinando a absorção de carga com controle excêntrico no momento em que mais ocorrem entorses — o contato com o solo.","execucao":"1. Posicione-se sobre um step ou plataforma elevada.\n2. Realize uma queda ou projeção à frente.\n3. Aterrisse na ponta do pé, com leve inclinação anterior do tronco.\n4. Mantenha os braços em posição funcional (semelhante ao gesto esportivo).\n5. Absorva o impacto de forma controlada, sustentando o alinhamento do membro inferior.","beneficios":"Desenvolve controle excêntrico na desaceleração, rigidez dinâmica do tornozelo em CCF e estabilidade na aterrissagem.","cuidados":"Aterrissagem suave, sem impacto excessivo. Joelho semiflexionado. Tornozelo não pode ceder em inversão ou desalinhamento.","material":"Step ou plataforma elevada","obs":"Progressão: aumentar altura, velocidade ou complexidade do movimento.","defaultSeries":"4","defaultReps":"6–10","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,aterrissagem,desaceleração,avançado","foto":"","video":"https://youtu.be/2a0TvYFjvD8"},
{"id":"et21","nome":"Bound Lateral sem Contramovimento","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Reativa sem Pré-Impulso","descricao":"Ao retirar o contramovimento, o paciente perde o pré-impulso e precisa produzir força inicial e rigidez rapidamente, sem ajuste prévio — simula mudanças de direção imprevisíveis do esporte.","execucao":"1. Apoio unipodal, corpo estabilizado.\n2. Realize propulsão lateral explosiva, partindo diretamente da posição inicial (sem contramovimento).\n3. Execute o bound lateral, saindo com uma perna e aterrissando com a outra.\n4. Controle a aterrissagem, mantendo estabilidade do tornozelo e alinhamento do membro inferior.\n5. Repita continuamente, alternando os lados.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora o controle em mudanças de direção e a produção/absorção de força lateral.","cuidados":"Aterrissagem suave, com absorção progressiva. Tornozelo estável, sem colapso lateral. Evitar valgo dinâmico de joelho.","material":"Nenhum","obs":"Pode ser usado como critério funcional para retorno ao esporte. Iniciar com menor distância e progredir.","defaultSeries":"4","defaultReps":"6–10 (cada lado)","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,bound,reatividade,retorno esporte","foto":"","video":"https://youtu.be/SdH-f3Co5WU"},
{"id":"et22","nome":"Bound Lateral Reativo","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Reativa em Sequência de Contatos","descricao":"O componente reativo exige absorver e gerar força em sequência, reduzindo o tempo de contato com o solo — simula mudanças de direção reais onde o sistema precisa responder rápido.","execucao":"1. Em pé, entre dois cones ou marcadores laterais.\n2. Realize um salto lateral (bound), saindo de uma perna e aterrissando na outra.\n3. Ao tocar o solo, faça contato breve e retorne imediatamente para o lado oposto.\n4. Finalize o ciclo com controle em apoio unipodal.\n5. Repita ritmicamente: salta → toca → retorna → estabiliza.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, reduz o tempo de contato com o solo e melhora o controle em mudanças rápidas de direção.","cuidados":"Contato breve, sem 'afundar' na aterrissagem. Contato inicial no antepé. Evitar colapso do tornozelo ou perda de alinhamento.","material":"Cones ou marcadores","obs":"Progressão: aumentar distância lateral ou velocidade.","defaultSeries":"4","defaultReps":"6–10 ciclos (cada lado)","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,bound,reatividade","foto":"","video":"https://youtu.be/8OwMZFbcGx0"},
{"id":"et23","nome":"Rigidez de Tornozelo com Carga Externa","grupo":"MMII","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Dinâmica sob Carga + Troca de Base","descricao":"A carga externa elevada acima da cabeça desloca o centro de massa e exige maior coordenação entre membros superiores e inferiores durante a troca rápida de base.","execucao":"1. Postura de aceleração, uma perna à frente e outra atrás, ambas na ponta do pé.\n2. Base fechada inicialmente, pés próximos em linha.\n3. Realize abertura rápida da base no sentido ântero-posterior.\n4. Simultaneamente, eleve a carga acima da cabeça, sincronizando com a troca de base.\n5. Retorne à posição inicial trazendo a carga de volta, ritmicamente.","beneficios":"Desenvolve rigidez dinâmica do tornozelo em CCF, melhora o controle postural sob carga externa e prepara para o retorno ao esporte.","cuidados":"Calcâneos elevados durante toda a execução. Evitar oscilações de quadril e tronco. Coordenar a elevação da carga com a troca de base.","material":"Halter ou anilha","obs":"Progressão: aumentar velocidade, amplitude ou carga externa.","defaultSeries":"4","defaultReps":"8–12","defaultDescanso":"45s","tags":"entorse_tornozelo,mmii,rigidez,carga externa,troca de base","foto":"","video":"https://youtu.be/qHXpLboZses"},
{"id":"et24","nome":"Rigidez de Tornozelo com Aqua Bag","grupo":"MMII","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Dinâmica sob Instabilidade + Troca de Base","descricao":"A instabilidade constante da aqua bag exige respostas rápidas do sistema durante a troca de base ântero-posterior, aproximando o exercício das exigências reais de movimento.","execucao":"1. Postura de aceleração, uma perna à frente e outra atrás, ambas na ponta do pé.\n2. Segure a aqua bag junto ao tronco, cotovelos semiflexionados.\n3. Realize abertura rápida da base no sentido ântero-posterior.\n4. Estabilize a aqua bag simultaneamente, controlando as oscilações da água.\n5. Retorne à posição inicial de forma controlada, alternando ritmicamente.","beneficios":"Desenvolve rigidez dinâmica do tornozelo em CCF, melhora o controle sob perturbações imprevisíveis e prepara para o retorno ao esporte.","cuidados":"Calcâneos elevados durante toda a execução. Controle da aqua bag deve vir do core, não de compensações. Evitar oscilações excessivas de tronco.","material":"Aquabag","obs":"Progressão: aumentar velocidade, volume de água ou inserir estímulos externos.","defaultSeries":"4","defaultReps":"8–12","defaultDescanso":"45s","tags":"entorse_tornozelo,mmii,rigidez,aquabag,troca de base","foto":"","video":"https://youtu.be/wXqBv_qbsxg"},
{"id":"et25","nome":"Bound Lateral + Hop Vertical no Step","grupo":"Funcional","nivel":"Intermediário","momento":"Parte Principal","foco":"Transição entre Absorção Lateral e Produção Vertical","descricao":"Combina bound lateral (troca de apoio) e hop vertical (mesma perna), exigindo que o tornozelo absorva carga no plano lateral e produza força em sequência no plano vertical.","execucao":"1. Em pé sobre um step, leve semiflexão de joelho, tronco inclinado à frente.\n2. Realize um bound lateral em direção ao step oposto, aterrissando com o pé contralateral.\n3. Estabilize rapidamente o apoio na ponta do pé.\n4. Execute um hop vertical sobre o mesmo step, mantendo apoio unipodal.\n5. Controle a descida e repita alternando os lados.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora a transição entre absorção e produção de força e a estabilidade dinâmica unipodal.","cuidados":"Aterrissagem suave, contato inicial no antepé. Tronco estável, abdômen ativo. Evitar valgo dinâmico de joelho e queda pélvica.","material":"Step","obs":"Progressão: aumentar altura do step ou velocidade da execução.","defaultSeries":"3","defaultReps":"6–8 por lado","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,bound,hop,step,transição","foto":"","video":"https://youtu.be/MnUaQ_dzuVI"},
{"id":"et26","nome":"Rigidez Reativa do Tornozelo com Carga Externa","grupo":"Equilíbrio","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Reativa em Toque Rápido + Carga","descricao":"O contato rápido com o solo somado à carga externa em deslocamento aumenta a instabilidade, exigindo que o tornozelo gere rigidez no momento do toque e estabilize rapidamente após a perturbação.","execucao":"1. Base de afundo, perna da frente apoiada apenas no antepé, perna de trás sobre um step.\n2. Tronco alinhado, calcanhar da frente suspenso.\n3. Segure uma anilha próxima ao quadril, na região medial do corpo.\n4. Realize um toque rápido do pé da frente na carga, mantendo equilíbrio na ponta do pé.\n5. Retorne à posição inicial e eleve a carga acima da cabeça, estabilizando o corpo.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora o controle neuromuscular em alta velocidade e a estabilidade sob carga externa.","cuidados":"Calcâneo suspenso durante toda a execução. Toque rápido e controlado. Evitar compensações de tronco ou perda de alinhamento.","material":"Anilha + step","obs":"Progressão: aumentar carga ou velocidade, sem perder controle.","defaultSeries":"4","defaultReps":"8–12","defaultDescanso":"45s","tags":"entorse_tornozelo,equilíbrio,rigidez reativa,carga externa","foto":"","video":"https://youtu.be/D4qkVyAECPA"},
{"id":"et27","nome":"Rigidez Reativa do Tornozelo com Aqua Bag","grupo":"Equilíbrio","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Reativa sob Instabilidade Imprevisível","descricao":"O deslocamento imprevisível da água na aqua bag altera constantemente o centro de massa, exigindo resposta neuromuscular imediata e estabilização rápida durante toques repetidos.","execucao":"1. Base de afundo, perna da frente apoiada apenas no antepé, perna de trás sobre um step.\n2. Calcanhar da frente suspenso, tronco alinhado.\n3. Segure a aqua bag na altura do peito, estabilizando-a durante toda a execução.\n4. Realize toque rápido do pé da frente em um ponto de referência.\n5. Retorne ao neutro mantendo equilíbrio e rigidez do tornozelo, repetindo continuamente.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora o controle neuromuscular sob instabilidade e prepara para o retorno esportivo seguro.","cuidados":"Calcâneo suspenso durante toda a execução. Toque rápido, mínimo tempo de contato. Controlar a aqua bag, evitando oscilações excessivas.","material":"Aquabag + step","obs":"Progressão: aumentar volume de água, velocidade ou inserir comandos externos.","defaultSeries":"4","defaultReps":"8–12","defaultDescanso":"45s","tags":"entorse_tornozelo,equilíbrio,rigidez reativa,aquabag","foto":"","video":"https://youtu.be/0I040F0mGBw"},
{"id":"et28","nome":"Salto Lateral Reativo com Aceleração","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Reatividade + Transição para Aceleração","descricao":"A aceleração imediata após os saltos laterais força o sistema a sair do padrão reativo e entrar em deslocamento, aumentando muito a funcionalidade do exercício.","execucao":"1. Posicione um elástico no solo como referência lateral.\n2. Realize três saltos laterais consecutivos sobre o elástico, na ponta do pé.\n3. Mantenha o tempo de contato com o solo o mais curto possível.\n4. Após o terceiro salto, inicie aceleração imediata à frente.\n5. Execute a transição rápida, mantendo controle do tornozelo.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora a capacidade de absorver e devolver energia e transfere o ganho para aceleração e mudança de direção.","cuidados":"Aterrissagens rápidas e silenciosas. Joelho alinhado, sem valgo dinâmico. Garantir transição rápida entre salto e corrida.","material":"Faixa elástica","obs":"Progressão: aumentar número de saltos, distância ou velocidade.","defaultSeries":"4","defaultReps":"4–6 ciclos completos","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,salto,aceleração,reatividade","foto":"","video":"https://youtu.be/88Q7lG508mU"},
{"id":"et29","nome":"Salto Lateral Reativo com Wall Ball","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Reativa + Controle Postural com Arremesso","descricao":"Integra saltos reativos, arremesso de carga (deslocamento do centro de massa) e estabilização final — exigindo rigidez do tornozelo durante ações simultâneas do corpo.","execucao":"1. Posicione um elástico no solo como referência lateral.\n2. Realize 3 saltos laterais consecutivos, em apoio unipodal e na ponta do pé.\n3. Mantenha tempo de contato mínimo nos dois primeiros saltos.\n4. No terceiro salto, aterrisse na ponta do pé e realize arremesso explosivo da wall ball contra a parede.\n5. Após o arremesso, estabilize a posição por cerca de 3 segundos e reinicie o ciclo.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora a capacidade de absorver/devolver energia e a estabilidade após ações explosivas.","cuidados":"Contato rápido e leve nos saltos. Tornozelo estável, sem colapso lateral. Arremesso explosivo sem perder o controle corporal.","material":"Faixa elástica + wall ball","obs":"Progressão: aumentar distância dos saltos, peso da bola ou reduzir tempo de contato.","defaultSeries":"4","defaultReps":"4–6 ciclos completos","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,salto,wall ball,reatividade","foto":"","video":"https://youtu.be/_CuR7byraaI"},
{"id":"et30","nome":"Reativo com Wall Ball e Salto Unipodal","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Contínua em Sequência Multidirecional","descricao":"Cria uma sequência sem 'reset' entre os movimentos — contato rápido com o solo, resposta em diferentes direções, arremesso e estabilização final em apoio unipodal.","execucao":"1. Inicie com pequenos saltos contínuos na ponta dos pés, calcâneos suspensos.\n2. Realize um salto maior para frente.\n3. Em seguida, execute um salto para trás, ainda na ponta dos pés.\n4. Logo após, realize o arremesso da wall ball contra a parede.\n5. Aterrisse em apoio unipodal, sustentando o equilíbrio por alguns segundos antes de reiniciar.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora o controle em mudanças rápidas de direção e a estabilidade após ações explosivas.","cuidados":"Calcâneos elevados durante toda a execução. Tempo de contato mínimo com o solo. Aterrissagem final estável em apoio unipodal.","material":"Wall ball","obs":"Progressão: aumentar distância, carga ou reduzir tempo de contato.","defaultSeries":"4","defaultReps":"4–6 ciclos completos","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,wall ball,reatividade,multidirecional","foto":"","video":"https://youtu.be/-ZBRFUX8_HQ"},
{"id":"et31","nome":"Escada de Agilidade (Entrada e Saída Lateral)","grupo":"Coordenação","nivel":"Avançado","momento":"Parte Principal","foco":"Reatividade e Alternância Rápida de Apoio","descricao":"Exige redução do tempo de contato com o solo e alternância rápida dos apoios, mantendo estabilidade mesmo com alta frequência de movimento.","execucao":"1. Ao lado da escada de agilidade.\n2. Entrada rápida com um pé dentro do quadrado e saída imediata.\n3. Alterne os pés continuamente, mantendo o padrão dentro/fora.\n4. Avance pela escada com ritmo constante e controlado.\n5. Ao final, retorne ao ponto inicial e reinicie.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora coordenação e agilidade, reduzindo o tempo de contato com o solo.","cuidados":"Executar sempre na ponta dos pés, sem contato do calcâneo. Tronco levemente inclinado à frente. Evitar colapso do tornozelo na troca de apoio.","material":"Escada de agilidade","obs":"Trabalhar progressão de velocidade conforme controle. Priorizar qualidade antes de intensidade.","defaultSeries":"4","defaultReps":"20–30s por série","defaultDescanso":"45s","tags":"entorse_tornozelo,coordenação,escada de agilidade,reatividade","foto":"","video":"https://youtu.be/OXpBZQnPMi0"},
{"id":"et32","nome":"Escada de Agilidade (Um Dentro / Um Fora)","grupo":"Coordenação","nivel":"Avançado","momento":"Parte Principal","foco":"Controle Unilateral em Alta Frequência","descricao":"Um pé em contato com o solo enquanto o outro se reorganiza, com troca constante de base, exigindo estabilização rápida a cada contato.","execucao":"1. Ao lado da escada de agilidade.\n2. Mantenha um pé fora da escada enquanto o outro entra no quadrado.\n3. Execute a sequência alternando: um pé dentro / outro fora.\n4. Avance pela escada mantendo o padrão contínuo e rítmico.\n5. Ao final, retorne ao ponto inicial e reinicie a série.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora o controle em apoio unilateral e a coordenação neuromotora.","cuidados":"Executar na ponta dos pés, sem contato do calcâneo. Tronco levemente inclinado à frente. Evitar colapso do tornozelo durante o apoio.","material":"Escada de agilidade","obs":"Trabalhar progressão de velocidade conforme controle.","defaultSeries":"4","defaultReps":"20–30s por série","defaultDescanso":"45s","tags":"entorse_tornozelo,coordenação,escada de agilidade,unilateral","foto":"","video":"https://youtu.be/DqHz4fGm0Qs"},
{"id":"et33","nome":"Escada de Agilidade (Dentro–Dentro / Fora–Fora)","grupo":"Coordenação","nivel":"Avançado","momento":"Parte Principal","foco":"Alternância entre Rigidez e Estabilização","descricao":"Combina contato rápido na ponta do pé (dentro da escada) com apoio plantar completo (fora da escada), exigindo que o tornozelo gere rigidez e estabilize o corpo alternadamente.","execucao":"1. Um pé fora da escada, apoiado com a planta inteira, o outro elevado em direção ao peito.\n2. O pé elevado entra na ponta do quadrado.\n3. O outro pé também entra, ambos na ponta dos pés dentro da escada.\n4. O primeiro pé sai da escada com apoio plantar completo fora.\n5. Avance para o próximo quadrado repetindo: dentro-dentro (pontas) → fora-fora (apoio + elevação de joelho).","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora o controle em apoio unilateral e integra estabilidade com velocidade.","cuidados":"Dentro da escada: apoio apenas na ponta dos pés. Fora da escada: apoio plantar completo. Manter o joelho elevado ativamente na fase fora.","material":"Escada de agilidade","obs":"Trabalhar fluidez antes de aumentar a velocidade.","defaultSeries":"4","defaultReps":"20–30s por série","defaultDescanso":"45s","tags":"entorse_tornozelo,coordenação,escada de agilidade,rigidez","foto":"","video":"https://youtu.be/4x51EHU8PE4"},
{"id":"et34","nome":"Escada de Agilidade (Deslocamento Lateral nas Pontas)","grupo":"Coordenação","nivel":"Avançado","momento":"Parte Principal","foco":"Reatividade Lateral e Controle no Plano Frontal","descricao":"Trabalha o deslocamento lateral — uma das situações mais críticas na entorse — exigindo contato rápido na ponta do pé e controle no plano frontal durante todo o percurso.","execucao":"1. Escada de agilidade à frente do paciente.\n2. Inicie o deslocamento lateral, entrando nos quadrados da escada.\n3. Passo lateral com um pé, seguido pelo outro, ambos na ponta dos pés.\n4. Avance quadrado a quadrado, com ritmo contínuo e leveza no contato.\n5. Ao final, retorne lateralmente no sentido inverso, repetindo o padrão.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora o controle em deslocamentos laterais e previne recidiva de entorse.","cuidados":"Apoio exclusivo na ponta dos pés. Joelhos levemente flexionados, quadril estável. Evitar colapso do tornozelo durante o deslocamento.","material":"Escada de agilidade","obs":"Progressão: aumentar velocidade, variar padrões ou inserir estímulos externos.","defaultSeries":"4","defaultReps":"20–30s por série","defaultDescanso":"45s","tags":"entorse_tornozelo,coordenação,escada de agilidade,lateral","foto":"","video":"https://youtu.be/u_bfwgTnV28"},
{"id":"et35","nome":"Drill de Reatividade no Solo e no Box","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Reatividade em Transição Step-Solo","descricao":"A alternância rápida entre step e solo, na ponta do pé, exige que o tornozelo absorva e devolva energia rapidamente, simulando aceleração e desaceleração.","execucao":"1. Um pé apoiado sobre o step, na ponta do pé.\n2. Realize toques rápidos com o mesmo pé no solo, retornando imediatamente ao step.\n3. Mantenha o movimento curto, rápido e rítmico.\n4. Tronco levemente inclinado à frente, abdômen ativo.\n5. Repita continuamente, simulando aceleração e desaceleração.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, reduz o tempo de contato com o solo e melhora o controle em transições rápidas.","cuidados":"Contato com o solo o mais breve possível. Movimento leve e ritmo constante. Evitar colapso do tornozelo durante os toques.","material":"Step","obs":"Progressão: aumentar velocidade ou altura do step.","defaultSeries":"4","defaultReps":"12–15","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,reatividade,step","foto":"","video":"https://youtu.be/9gRh-Y2GfKc"},
{"id":"et36","nome":"Treino de Reação com Estímulo Direcional","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Resposta a Estímulo Externo Imprevisível","descricao":"Combina saltos reativos contínuos com resposta a comandos direcionais externos, exigindo reconhecimento rápido do estímulo e reorganização imediata do movimento.","execucao":"1. No centro de quatro cones distribuídos ao redor.\n2. Leve flexão de joelhos, tronco inclinado à frente, realizando saltos reativos na ponta dos pés.\n3. Ao comando do profissional (cor ou direção), realize duas passadas laterais rápidas em direção ao cone indicado.\n4. Retorne imediatamente ao centro, retomando os saltos reativos.\n5. Repita continuamente, respondendo rapidamente aos estímulos.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, melhora o tempo de reação e o controle em mudanças rápidas de direção.","cuidados":"Apoio na ponta dos pés durante toda a execução. Reduzir ao máximo o tempo de contato com o solo. Alinhamento de tornozelo e joelho nos deslocamentos.","material":"4 cones","obs":"Progressão: aumentar velocidade, distância ou complexidade dos comandos.","defaultSeries":"4","defaultReps":"40–60s por série","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,reação,agilidade,cones","foto":"","video":"https://youtu.be/EBVI2nPadGE"},
{"id":"et37","nome":"Mudança de Direção em X","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Controle Multidirecional / Aceleração + Diagonal","descricao":"O padrão em X exige aceleração linear, desaceleração controlada e mudança de direção em diagonal, simulando deslocamentos imprevisíveis e multidirecionais de jogo.","execucao":"1. Quatro cones formando um 'X', com ponto central de cruzamento.\n2. Inicie atrás de um cone, leve semiflexão, tronco inclinado à frente.\n3. Corra frontalmente até o cone central.\n4. A partir do centro, desloque-se diagonalmente até o cone oposto.\n5. Corra novamente à frente até o próximo cone, alternando corrida frontal e deslocamentos diagonais.","beneficios":"Desenvolve rigidez dinâmica do tornozelo em CCF, melhora o controle em mudanças de direção e a absorção/redirecionamento de forças.","cuidados":"Centro de massa baixo nas mudanças de direção. Contato rápido e ativo com o solo. Evitar colapso do tornozelo na desaceleração.","material":"4 cones","obs":"Progressão: aumentar velocidade, distância ou adicionar comandos externos.","defaultSeries":"4","defaultReps":"4–6 repetições do padrão completo","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,mudança de direção,agilidade","foto":"","video":"https://youtu.be/f9DL8boAh2Q"},
{"id":"et38","nome":"Aceleração Lateral","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Deslocamento Linear Lateral em Alta Velocidade","descricao":"Movimento linear lateral com o corpo voltado para frente, sem rotação de tronco, exigindo rigidez e controle a cada contato durante a aceleração.","execucao":"1. Ao lado do primeiro cone, base atlética, tronco levemente inclinado à frente.\n2. Acelere lateralmente até o segundo cone.\n3. Retorne ao ponto inicial mantendo o mesmo padrão.\n4. Avance até o terceiro cone, retornando ao segundo.\n5. Finalize acelerando até o quarto cone, completando o ciclo, corpo sempre voltado para frente.","beneficios":"Desenvolve rigidez dinâmica do tornozelo em CCF, melhora o controle em deslocamentos laterais e a resposta neuromuscular em alta velocidade.","cuidados":"Movimento lateral e linear, sem rotação do tronco. Contato rápido e ativo com o solo. Centro de massa baixo durante a execução.","material":"4 cones","obs":"Progressão: aumentar velocidade, distância ou número de cones.","defaultSeries":"4","defaultReps":"3–5 ciclos completos","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,aceleração,lateral","foto":"","video":"https://youtu.be/eAqprAljSXw"},
{"id":"et39","nome":"Reativo com Mudança de Direção","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Extensão Explosiva + Redirecionamento Rápido","descricao":"Exige o menor tempo de contato possível com o solo, seguido de mudança de direção imediata — alta resposta neuromuscular para reconhecer, organizar e redirecionar o movimento.","execucao":"1. Perna de apoio à frente, perna contralateral sobre um step como apoio leve.\n2. Tronco levemente inclinado à frente, braços em posição de corrida.\n3. Realize flexão rápida de joelho e quadril na perna de apoio.\n4. Execute extensão explosiva, projetando o corpo à frente.\n5. Imediatamente após o impulso, realize mudança de direção rápida, com deslocamento curto e reativo.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, reduz o tempo de contato com o solo e melhora a resposta neuromuscular em mudanças de direção.","cuidados":"Contato com o solo o mais breve possível. Evitar 'afundar' na fase de desaceleração. Priorizar velocidade com controle, não apenas força.","material":"Step","obs":"Progressão: aumentar velocidade ou inserir estímulos externos.","defaultSeries":"4","defaultReps":"6–8 por lado","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,reatividade,mudança de direção","foto":"","video":"https://youtu.be/kn1kDQEMkn8"},
{"id":"et40","nome":"Bound Lateral com Mudança de Direção","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Absorção Lateral + Transição para Nova Direção","descricao":"Une absorção de força em apoio unipodal (bound) à transição imediata para aceleração e mudança de direção, exigindo resposta rápida ao novo vetor de movimento.","execucao":"1. Posição estável, com pequenos saltos reativos na ponta dos pés.\n2. Ao comando, execute um bound lateral, saindo de uma perna e aterrissando na outra.\n3. Absorva o impacto e gere resposta rápida na perna de apoio.\n4. Imediatamente após a aterrissagem, inicie aceleração em linha reta.\n5. Ao alcançar o cone, realize mudança rápida de direção (lateral ou diagonal).","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, reduz o tempo de contato com o solo e melhora a resposta neuromuscular em mudanças de direção.","cuidados":"Contato com o solo o mais breve possível. Evitar 'afundar' na aterrissagem após o bound. Controlar o tronco durante aceleração e mudança de direção.","material":"Cones","obs":"Progressão: aumentar velocidade, distância ou complexidade dos comandos.","defaultSeries":"4","defaultReps":"4–6 por lado","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,bound,mudança de direção","foto":"","video":"https://youtu.be/KAUuub8fVGU"},
{"id":"et41","nome":"Bound Lateral com Aceleração","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Absorção Lateral + Transição para Aceleração Linear","descricao":"Exige absorção de impacto lateral, geração imediata de rigidez e transferência de força eficiente do plano lateral para o linear na transição para a aceleração.","execucao":"1. Pequenos saltos reativos na ponta dos pés.\n2. Ao comando, execute um bound lateral, saindo de uma perna e aterrissando na outra.\n3. Absorva o impacto com controle, mantendo rigidez do tornozelo.\n4. Imediatamente após a aterrissagem, inicie aceleração em linha reta.\n5. Tronco levemente inclinado à frente, braços coordenados, finalizando com controle e estabilidade.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, reduz o tempo de contato com o solo e melhora a resposta neuromuscular em transições.","cuidados":"Contato com o solo o mais breve possível. Evitar 'afundar' na aterrissagem após o bound. Alinhamento de tornozelo, joelho e quadril.","material":"Nenhum","obs":"Progressão: aumentar velocidade, distância ou incluir estímulos externos.","defaultSeries":"4","defaultReps":"6–8 por lado","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,bound,aceleração","foto":"","video":"https://youtu.be/5T9iISlbR1k"},
{"id":"et42","nome":"Drop Jump com Bound Lateral","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Absorção de Queda + Produção de Força Lateral","descricao":"Combina drop jump (absorção de impacto em apoio unipodal) e bound lateral (produção rápida de força), exigindo controle excêntrico imediato seguido de resposta explosiva.","execucao":"1. Em pé sobre um caixote, tronco levemente inclinado à frente.\n2. Realize a queda (drop), aterrissando em apoio unipodal.\n3. Absorva o impacto com controle, mantendo rigidez do tornozelo.\n4. Imediatamente após o contato, execute um bound lateral.\n5. Aterrisse novamente com controle e estabilidade, repetindo o ciclo continuamente.","beneficios":"Desenvolve rigidez reativa do tornozelo em CCF, reduz o tempo de contato com o solo e melhora o controle excêntrico e a produção de força.","cuidados":"Contato com o solo o mais breve possível. Evitar 'afundar' na aterrissagem após o drop. Garantir que o bound seja explosivo, mas com controle.","material":"Caixote","obs":"Progressão: aumentar altura do caixote ou velocidade do movimento.","defaultSeries":"4","defaultReps":"6–8","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,drop jump,bound,avançado","foto":"","video":"https://youtu.be/Q6QVEIY0kL8"},
{"id":"et43","nome":"Drop Jump com Duplo Bound Lateral Reativo","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Rigidez Reativa Sequencial sob Fadiga Momentânea","descricao":"A sequência drop → bound → bound exige múltiplas respostas reativas em sequência, sem tempo de reorganização completa, desafiando o sistema a manter rigidez mesmo sob fadiga momentânea.","execucao":"1. Em pé sobre um caixote, tronco levemente inclinado à frente.\n2. Realize a queda (drop), aterrissando em apoio unipodal.\n3. Absorva o impacto com controle, mantendo rigidez do tornozelo.\n4. Execute imediatamente um bound lateral.\n5. Sem pausa, realize um segundo bound lateral na mesma direção, finalizando estabilizado em apoio unipodal.","beneficios":"Desenvolve rigidez reativa sequencial do tornozelo em CCF, reduz o tempo de contato com o solo e melhora a resposta neuromuscular em sequência.","cuidados":"Contato com o solo o mais breve possível em cada aterrissagem. Evitar 'afundar' no drop e nos bounds. Priorizar qualidade do segundo salto.","material":"Caixote","obs":"Progressão: aumentar altura do caixote ou velocidade da execução.","defaultSeries":"4","defaultReps":"6–8 por lado","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,drop jump,bound,sequencial,avançado","foto":"","video":"https://youtu.be/jXFgR8y0cy8"},
{"id":"et44","nome":"Aceleração com Mudança de Direção","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Aceleração, Frenagem e Deslocamento Posterior","descricao":"Integra aceleração frontal, desaceleração controlada e deslocamento para trás, exigindo rigidez a cada contato e resposta rápida ao novo padrão de movimento.","execucao":"1. Quatro cones em linha reta.\n2. Inicie no primeiro cone e acelere até o segundo.\n3. Toque rápido no cone com o pé e retorne de costas até o ponto inicial.\n4. Avance até o terceiro cone, toque e retorne de costas até o segundo.\n5. Repita o padrão até o quarto cone, alternando deslocamento frontal e posterior continuamente.","beneficios":"Desenvolve rigidez dinâmica do tornozelo em CCF, reduz o tempo de contato com o solo e melhora a resposta neuromuscular em transições rápidas.","cuidados":"Contato rápido e ativo na ponta dos pés. Evitar 'afundar' durante a frenagem. Alinhamento de tornozelo, joelho e quadril.","material":"4 cones","obs":"Progressão: aumentar número de cones, velocidade ou adicionar estímulos externos.","defaultSeries":"4","defaultReps":"4–6 ciclos completos","defaultDescanso":"45s","tags":"entorse_tornozelo,funcional,aceleração,mudança de direção,avançado","foto":"","video":"https://youtu.be/nm9J9GI4yUY"},
{"id":"bs01","nome":"Mobilidade Torácica em Decúbito Lateral","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Rotação Torácica Segmentada","descricao":"Trabalha a rotação torácica de forma segmentada e controlada, reduzindo a sobrecarga compensatória sobre a glenoumeral e a lombar decorrente de rigidez torácica.","execucao":"1. Decúbito lateral, quadril e joelhos flexionados a ~90°.\n2. Braços estendidos à frente, mãos unidas e sobrepostas.\n3. O braço de cima abre em rotação externa, acompanhando com olhar e rosto.\n4. Leve a escápula e o tronco em rotação, sem descolar os joelhos do solo.\n5. Retorne lentamente e controlado.","beneficios":"Restaura a mobilidade rotacional torácica, melhora o posicionamento escapular e promove controle neuromuscular segmentar.","cuidados":"Joelhos firmes no solo o tempo todo — se descolar, é compensação lombar. Não forçar amplitude; movimento livre e indolor. Evitar extensão lombar no retorno.","material":"Colchonete","obs":"Fase inicial da reabilitação do ombro e do raquis torácico.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"bursite_subacromial,ombro,mobilidade,torácica","foto":"","video":"https://youtu.be/yk9KvDTJkoQ"},
{"id":"bs02","nome":"Mobilidade Torácica com Rolo — Quadrupedia","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Rotação e Extensão Torácica Ativa","descricao":"Em quadrupedia com apoio sobre o rolo, o tronco fica estabilizado em ponto fixo, direcionando o movimento para a região torácica e dificultando a compensação lombar.","execucao":"1. Quatro apoios, joelhos sob o quadril, coluna neutra.\n2. Um braço estendido à frente, apoiado sobre o rolo a ~90° de flexão.\n3. O braço livre gira passando por baixo do corpo, deslizando o rolo pelo chão.\n4. O tronco acompanha em rotação, quadris permanecem estáveis.\n5. Retorne lentamente à posição inicial.","beneficios":"Restaura a mobilidade de rotação e extensão torácica, melhora a dissociação tronco superior-pelve e prepara o complexo escapuloumeral.","cuidados":"Quadris alinhados e estáveis — qualquer rotação de pelve é compensação lombar. Evitar protração excessiva de escápula ou elevação de ombro no braço apoiado.","material":"Rolo de mobilidade","obs":"Fase inicial e intermediária da reabilitação do ombro.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"bursite_subacromial,ombro,mobilidade,torácica,rolo","foto":"","video":"https://youtu.be/nvun2epUSyw"},
{"id":"bs03","nome":"Mobilidade de Ombro com Bastão — Rotacional","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Rotação Interna e Externa Ativo-Assistida","descricao":"O bastão funciona como facilitador: o braço mais livre guia o lado limitado, permitindo ganho de amplitude assistido quando o paciente ainda não tem força ou mobilidade suficiente.","execucao":"1. Em pé, postura ereta, segurando o bastão com as duas mãos na largura dos ombros.\n2. Eleve os braços acima da cabeça, cotovelos estendidos, bastão paralelo ao solo.\n3. Realize rotação do ombro levando o bastão para trás, de um lado ao outro, alternadamente.\n4. Movimento lento, controlado, respeitando o limite de dor e mobilidade.","beneficios":"Recupera a mobilidade em rotação interna e externa do ombro, reduz rigidez pós-imobilização e melhora o ritmo escapuloumeral.","cuidados":"O braço mais forte guia o movimento, sem forçar o lado limitado. Tronco não deve inclinar ou rotacionar para ganhar amplitude. Dor intensa indica amplitude além do momento atual.","material":"Bastão","obs":"Fase inicial e intermediária da reabilitação do ombro.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"bursite_subacromial,ombro,mobilidade,rotação,bastão","foto":"","video":"https://youtu.be/ERK2LAmgdUM"},
{"id":"bs04","nome":"Mobilidade de Ombro na Caixa","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Flexão de Ombro Passiva + Extensão Torácica","descricao":"Usa o peso do próprio corpo para promover flexão passiva progressiva do ombro, com ponto fixo distal nas mãos, mobilizando simultaneamente a coluna torácica em extensão.","execucao":"1. Ajoelhado em frente a uma caixa ou banco.\n2. Mãos apoiadas na caixa, cotovelos estendidos, na largura dos ombros.\n3. Projete o tronco lentamente para baixo, levando o peito em direção ao solo.\n4. Mantenha a posição final por alguns segundos.\n5. Retorne de forma lenta e controlada.","beneficios":"Recupera a amplitude de flexão do ombro de forma passiva, mobiliza a torácica em extensão e reduz compensações no complexo glenoumeral.","cuidados":"Lombar não deve hiperextender — abdômen levemente contraído. Movimento lento, não forçar a descida. Evitar elevação excessiva dos ombros.","material":"Caixa ou banco","obs":"Fase inicial da reabilitação do ombro.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"bursite_subacromial,ombro,mobilidade,flexão","foto":"","video":"https://youtu.be/zKnj4X61k6I"},
{"id":"bs05","nome":"Mobilidade de Ombro na Parede — Em Pé","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Flexão de Ombro em CCF (Alternativa em Pé)","descricao":"Variação em pé da mobilização com ponto fixo distal — mais acessível para quem tem dificuldade de se posicionar no solo, trabalhando flexão glenoumeral e extensão torácica simultaneamente.","execucao":"1. Em pé, de frente para a parede, pés na largura dos quadris.\n2. Mãos apoiadas na parede na altura dos ombros, cotovelos estendidos.\n3. Projete o quadril levemente para trás enquanto flexiona o tronco à frente e para baixo.\n4. Mantenha a posição final por alguns segundos.\n5. Retorne de forma lenta e controlada.","beneficios":"Recupera a amplitude de flexão do ombro de forma passiva e progressiva, melhora o ritmo escapuloumeral e oferece alternativa acessível para casa.","cuidados":"Lombar não deve hiperextender — movimento vem da flexão do quadril, não da lombar. Evitar elevação ou protração excessiva dos ombros.","material":"Parede","obs":"Fase inicial e intermediária da reabilitação do ombro.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"bursite_subacromial,ombro,mobilidade,flexão,parede","foto":"","video":"https://youtu.be/XeH-iM7LE08"},
{"id":"bs06","nome":"Mobilidade de Ombro — Rotação Combinada em Pé","grupo":"Mobilidade","nivel":"Básico","momento":"Parte Inicial","foco":"Padrão Combinado de Rotação Interna/Externa, Abdução e Flexão","descricao":"Combina rotação interna, rotação externa, abdução e flexão em um único padrão fluido e alternado, favorecendo a integração neuromuscular entre rotadores do manguito e estabilizadores escapulares.","execucao":"1. Em pé, postura ereta, tronco estável.\n2. Um braço atrás da cabeça (rotação externa + abdução), o outro atrás das costas (rotação interna).\n3. Estenda ambos os braços lateralmente na altura dos ombros.\n4. Troque os lados: o braço que estava atrás da cabeça vai para as costas e vice-versa.\n5. Repita de forma alternada, lenta e controlada.","beneficios":"Recupera amplitude combinada do ombro, promove integração neuromuscular manguito-escápula e serve como aquecimento articular.","cuidados":"Tronco estável — inclinação ou rotação para 'ganhar' amplitude é compensação. Não forçar além do limite confortável. Evitar em fase aguda de dor ou instabilidade glenoumeral.","material":"Nenhum","obs":"Fase inicial e intermediária, também indicado como aquecimento pré-treino.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"bursite_subacromial,ombro,mobilidade,rotação combinada","foto":"","video":"https://youtu.be/xdoCyIfL4EQ"},
{"id":"bs07","nome":"Isometria de Ombro com Super Band","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Estabilidade Glenoumeral Isométrica + Integração Core/MMII","descricao":"Gera ativação muscular sem movimento articular, permitindo trabalhar os estabilizadores do manguito com segurança mesmo com dor ou limitação de amplitude, integrado a uma postura de semi-agachamento.","execucao":"1. Em pé, pés afastados na largura dos ombros, pisando sobre a super band.\n2. Semi-agachamento: quadril para trás, joelhos semiflexionados sem ultrapassar a ponta dos pés.\n3. Tronco levemente inclinado à frente, coluna neutra, abdômen contraído.\n4. Braços estendidos à frente, segurando a super band na altura do peito/ombros.\n5. Sustente isometricamente, resistindo à tração do elástico sem ceder.","beneficios":"Ativa e fortalece os estabilizadores do manguito rotador com segurança, promove estabilidade glenoumeral e integra ombro, core e MMII.","cuidados":"Manter a postura de semi-agachamento durante toda a série. Abdômen contraído. Braços não podem ceder à tração — reduzir tempo ou resistência se ocorrer.","material":"Super band","obs":"Fase inicial de fortalecimento e controle do ombro.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"bursite_subacromial,mmss,isometria,manguito rotador","foto":"","video":"https://youtu.be/I_j9VQFqPM4"},
{"id":"bs08","nome":"Ativação de Serrátil Deitado com Miniband","grupo":"MMSS","nivel":"Básico","momento":"Parte Principal","foco":"Serrátil Anterior + Sinergismo com Manguito Rotador","descricao":"Ativa o serrátil anterior em decúbito ventral, onde a gravidade já impõe demanda natural; a miniband nos punhos com mãos em supino adiciona rotação externa, recrutando o manguito em sinergismo.","execucao":"1. Decúbito ventral sobre o banco, tronco estável, coluna neutra.\n2. Miniband nos punhos, mãos em supino (palmas para cima).\n3. Cotovelos flexionados e próximos ao tronco.\n4. Alterne entre protração (empurrar para frente, afastando escápulas) e retração, de forma lenta.\n5. A gravidade atua sobre o serrátil; a miniband adiciona a co-ativação do manguito.","beneficios":"Ativa e fortalece o serrátil anterior, promove sinergismo com o manguito rotador e restaura o controle escapulotorácico.","cuidados":"Movimento vem da escápula, não do ombro/cotovelo. Se o ombro subir, o trapézio superior está compensando — orientar a 'afundar' o ombro. Reforçar a contração final da protração.","material":"Miniband + banco","obs":"Fase inicial e intermediária. Progressão: aumentar resistência, resistência manual, ou retirar um braço do apoio.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"bursite_subacromial,mmss,serrátil,escápula","foto":"","video":"https://youtu.be/Q1yzKthW60o"},
{"id":"bs09","nome":"Ativação de Serrátil","grupo":"MMSS","nivel":"Intermediário","momento":"Parte Principal","foco":"Serrátil Funcional em Pé + Estabilidade de Tronco","descricao":"Trabalha o serrátil de forma funcional e progressiva em pé, integrando estabilidade escapular, controle de tronco e força do manguito; a supinação da mão favorece rotação externa glenoumeral.","execucao":"1. Em pé, postura ereta, abdômen contraído, tronco estável.\n2. Resistência elástica nos punhos/mãos, cotovelos semi-flexionados próximos ao tronco, mãos em supinação.\n3. Eleve o braço acima da cabeça lentamente, cotovelo próximo ao corpo.\n4. Retorne até o cotovelo na altura do peito e repita.\n5. Tronco estável, sem rotação ou inclinação compensatória.","beneficios":"Fortalece o serrátil anterior funcionalmente, promove sinergismo com o manguito rotador e prepara o ombro para gestos acima da cabeça.","cuidados":"Tronco não pode rotar ou inclinar. Manter a supinação da mão durante todo o movimento. Se o ombro subir na elevação, reduzir resistência. Retorno excêntrico lento e controlado.","material":"Faixa elástica ou miniband","obs":"Exercício versátil, usado desde fases iniciais até finais, ajustando resistência. Progressão: mais resistência, mais reps/séries, ou execução unilateral.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"bursite_subacromial,mmss,serrátil,funcional","foto":"","video":"https://youtu.be/ofP6jejwlCA"},
{"id":"bs10","nome":"Ativação de Serrátil Anterior","grupo":"MMSS","nivel":"Intermediário","momento":"Parte Principal","foco":"Serrátil Funcional em Pé + Estabilidade de Tronco","descricao":"Trabalha o serrátil de forma funcional e progressiva em pé, integrando estabilidade escapular, controle de tronco e força do manguito; a supinação da mão favorece rotação externa glenoumeral.","execucao":"1. Em pé, postura ereta, abdômen contraído, tronco estável.\n2. Resistência elástica nos punhos/mãos, cotovelos semi-flexionados próximos ao tronco, mãos em supinação.\n3. Eleve o braço acima da cabeça lentamente, cotovelo próximo ao corpo.\n4. Retorne até o cotovelo na altura do peito e repita.\n5. Tronco estável, sem rotação ou inclinação compensatória.","beneficios":"Fortalece o serrátil anterior funcionalmente, promove sinergismo com o manguito rotador e prepara o ombro para gestos acima da cabeça.","cuidados":"Tronco não pode rotar ou inclinar. Manter a supinação da mão durante todo o movimento. Se o ombro subir na elevação, reduzir resistência. Retorno excêntrico lento e controlado.","material":"Faixa elástica ou miniband","obs":"Exercício versátil, usado desde fases iniciais até finais, ajustando resistência. Progressão: mais resistência, mais reps/séries, ou execução unilateral.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"bursite_subacromial,mmss,serrátil,funcional","foto":"","video":"https://youtu.be/ypHEmYiUSLY"},
{"id":"bs11","nome":"Ativação de Trapézio Inferior na Polia","grupo":"MMSS","nivel":"Avançado","momento":"Parte Principal","foco":"Depressão e Retração Escapular Resistida","descricao":"Recruta o trapézio inferior em amplitude funcional: puxar de cima para baixo e para trás contra a polia, em posição ajoelhada, exigindo controle de tronco e pelve além da escápula.","execucao":"1. Um joelho no solo, outro pé à frente, 90° de flexão de quadril e joelho.\n2. Tronco ereto, abdômen contraído, coluna neutra.\n3. Segure as alças da polia com braços elevados à frente.\n4. Puxe verticalmente, trazendo as mãos de cima para baixo e para trás, conduzido pela escápula (depressão + retração).\n5. Retorne lentamente e controlado.","beneficios":"Fortalece o trapézio inferior e os estabilizadores escapulares, reduz a dominância do trapézio superior e melhora o equilíbrio muscular do ombro.","cuidados":"Movimento deve começar pela escápula, não pelo braço. Evitar projeção anterior da cabeça. Lombar não deve hiperextender. Retorno excêntrico lento e controlado.","material":"Polia","obs":"Progressão: mais resistência, isometria final de 3-5s, ou execução em pé/unilateral.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"bursite_subacromial,mmss,trapézio inferior,escápula","foto":"","video":"https://youtu.be/EtZt1iuGoYM"},
{"id":"bs12","nome":"Ativação de Trapézio Inferior na Polia (Variação)","grupo":"MMSS","nivel":"Avançado","momento":"Parte Principal","foco":"Depressão e Retração Escapular Resistida","descricao":"Segunda aula do mesmo protocolo de ativação de trapézio inferior na polia em posição ajoelhada, reforçando o padrão de depressão e retração escapular.","execucao":"1. Um joelho no solo, outro pé à frente, 90° de flexão de quadril e joelho.\n2. Tronco ereto, abdômen contraído, coluna neutra.\n3. Segure as alças da polia com braços elevados à frente.\n4. Puxe verticalmente, trazendo as mãos de cima para baixo e para trás, conduzido pela escápula.\n5. Retorne lentamente e controlado.","beneficios":"Fortalece o trapézio inferior e os estabilizadores escapulares, reduz a dominância do trapézio superior.","cuidados":"Movimento deve começar pela escápula, não pelo braço. Evitar projeção anterior da cabeça. Lombar não deve hiperextender.","material":"Polia","obs":"Progressão: mais resistência, isometria final de 3-5s, ou execução em pé/unilateral.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"bursite_subacromial,mmss,trapézio inferior,escápula","foto":"","video":"https://youtu.be/ByqCv0mU8tU"},
