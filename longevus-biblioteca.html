{"id":"lc15","nome":"Caminhada com Peso Numa Mão, Elevando as Pernas","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Estabilidade Unilateral + Elevação de Joelhos com Carga","descricao":"Desenvolve estabilidade unilateral, equilíbrio dinâmico e força funcional durante a marcha, desafiando o controle postural através da elevação dos joelhos combinada com carga unilateral.","execucao":"1. Segure um peso em uma das mãos.\n2. Caminhe elevando o joelho a cada passo até uma amplitude confortável.\n3. Tronco alinhado, abdômen contraído, evitando inclinação para o lado da carga.\n4. Alterne o lado da carga ao final de cada série.","beneficios":"Fortalece o core e a musculatura estabilizadora, melhora o equilíbrio dinâmico e a coordenação motora, aumenta a estabilidade unilateral.","cuidados":"Tronco alinhado, evitar inclinação para o lado da carga. Abdômen contraído durante toda a execução. Elevar o joelho sem perder o equilíbrio. Carga compatível com o nível do praticante.","material":"Peso (halter ou similar)","obs":"Maior capacidade para atividades do dia a dia que exigem transporte de cargas e controle postural.","defaultSeries":"3","defaultReps":"20–30 passos por lado","defaultDescanso":"60s","tags":"locomoção,equilíbrio,marcha,idoso,carga,unilateral,joelhos","foto":"","video":"https://youtu.be/Seh27teg7ag"},
{"id":"eq01","nome":"Fortalecimento da Perna Parado","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Força de MMII + Equilíbrio Estático Unipodal","descricao":"Desenvolve força dos membros inferiores, equilíbrio estático e estabilidade unipodal através da elevação da perna à frente, favorecendo controle postural e autonomia funcional.","execucao":"1. Em pé, apoio unipodal.\n2. Eleve a perna livre à frente até uma amplitude confortável.\n3. Mantenha o tronco ereto, perna de apoio levemente flexionada.\n4. Retorne de forma lenta e controlada. Alterne as pernas.","beneficios":"Fortalece a musculatura do quadril e membros inferiores, melhora o equilíbrio estático, aumenta a estabilidade unipodal.","cuidados":"Tronco ereto durante toda a execução. Apoiar-se em parede ou barra se necessário. Elevar a perna sem compensar com o tronco.","material":"Parede ou barra (apoio)","obs":"Maior facilidade para caminhar, subir escadas e realizar atividades da vida diária.","defaultSeries":"3","defaultReps":"8–12 por perna","defaultDescanso":"45s","tags":"equilíbrio,idoso,unipodal,força mmii","foto":"","video":"https://youtu.be/m49Bpk5JnCs"},
{"id":"eq02","nome":"Trabalho de Equilíbrio Frontal","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Equilíbrio Unipodal com Alcance Frontal","descricao":"Desenvolve equilíbrio unipodal, coordenação motora e controle postural através do alcance do pé a um alvo no solo, simulando movimentos funcionais do dia a dia.","execucao":"1. Em pé, apoio unipodal, cone posicionado à frente.\n2. Toque o cone suavemente com a ponta do pé livre.\n3. Retorne à posição inicial de forma controlada.\n4. Repita, depois alterne a perna de apoio.","beneficios":"Melhora o equilíbrio estático e dinâmico, desenvolve coordenação motora, fortalece estabilizadores de quadril e tornozelo.","cuidados":"Tronco ereto durante toda a execução. Apoiar-se em parede ou barra se necessário. Evitar transferir excessivamente o peso para a perna que alcança.","material":"Cone + parede ou barra (apoio)","obs":"Maior segurança para caminhar, mudar de direção e realizar atividades da vida diária.","defaultSeries":"3","defaultReps":"8–12 por perna","defaultDescanso":"45s","tags":"equilíbrio,idoso,unipodal,alcance frontal","foto":"","video":"https://youtu.be/ImC9Wjfxgzw"},
{"id":"eq03","nome":"Trabalho de Equilíbrio Lateral","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Equilíbrio Unipodal com Alcance Lateral","descricao":"Desenvolve equilíbrio lateral, estabilidade unipodal e controle postural através do alcance lateral com o pé, melhorando a estabilização durante deslocamentos e mudanças de direção.","execucao":"1. Em pé, apoio unipodal, cone posicionado lateralmente.\n2. Toque o cone lateralmente com a ponta do pé livre.\n3. Retorne à posição inicial de forma controlada.\n4. Repita, depois alterne o lado.","beneficios":"Melhora o equilíbrio lateral, aumenta a estabilidade unipodal, fortalece estabilizadores do quadril.","cuidados":"Tronco ereto durante toda a execução. Apoiar-se em parede ou barra se necessário. Evitar inclinar excessivamente o tronco durante o alcance.","material":"Cone + parede ou barra (apoio)","obs":"Maior segurança para mudanças de direção nas atividades da vida diária.","defaultSeries":"3","defaultReps":"8–12 por lado","defaultDescanso":"45s","tags":"equilíbrio,idoso,unipodal,alcance lateral","foto":"","video":"https://youtu.be/AxflFd6mQxY"},
{"id":"eq04","nome":"Caminhada Pé com Pé","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Equilíbrio Dinâmico com Base de Apoio Reduzida (Tandem)","descricao":"Desenvolve equilíbrio dinâmico, coordenação motora e alinhamento da marcha através da caminhada em linha, reduzindo a base de apoio e aumentando o controle postural.","execucao":"1. Posicione um pé diretamente à frente do outro, calcanhar tocando a ponta do pé anterior.\n2. Caminhe dessa forma, olhar direcionado à frente.\n3. Movimento lento e controlado, evitando oscilações do tronco.","beneficios":"Melhora o equilíbrio dinâmico, aumenta a coordenação motora, fortalece estabilizadores dos membros inferiores.","cuidados":"Olhar direcionado à frente. Movimento lento e controlado. Evitar oscilações excessivas do tronco. Usar apoio (barra ou parede) se necessário.","material":"Parede ou barra (apoio)","obs":"Melhora a marcha e a consciência corporal, reduzindo risco de quedas.","defaultSeries":"3","defaultReps":"10–15 passos","defaultDescanso":"45s","tags":"equilíbrio,idoso,tandem,marcha","foto":"","video":"https://youtu.be/TcX7dFdf1CE"},
{"id":"eq05","nome":"Andar de Costas","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Equilíbrio Dinâmico em Marcha Reversa","descricao":"Desenvolve equilíbrio dinâmico, coordenação motora e controle postural através da marcha para trás, aumentando a segurança durante deslocamentos em diferentes direções.","execucao":"1. Em pé, tronco ereto.\n2. Caminhe para trás com passos curtos e controlados.\n3. Apoie completamente o pé no solo antes do próximo passo.\n4. Execute em ambiente livre de obstáculos.","beneficios":"Melhora o equilíbrio dinâmico, aumenta a coordenação motora, aprimora a propriocepção, fortalece estabilizadores dos membros inferiores.","cuidados":"Tronco ereto durante toda a execução. Passos curtos e controlados. Ambiente livre de obstáculos. Supervisão ou apoio quando necessário.","material":"Parede ou barra (apoio, se necessário)","obs":"Maior segurança para deslocamentos e mudanças de direção nas atividades da vida diária.","defaultSeries":"3","defaultReps":"10–15 passos","defaultDescanso":"45s","tags":"equilíbrio,idoso,marcha reversa,propriocepção","foto":"","video":"https://youtu.be/vq8Egqrhod0"},
{"id":"eq07","nome":"Trabalho de Equilíbrio em Várias Direções","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Equilíbrio Unipodal com Alcance Multidirecional","descricao":"Desenvolve equilíbrio unipodal, coordenação motora e controle postural através do alcance do pé em diferentes direções, melhorando a estabilidade e a capacidade funcional.","execucao":"1. Em pé, apoio unipodal, cones posicionados em diferentes direções ao redor.\n2. Toque suavemente cada cone com a ponta do pé livre.\n3. Retorne à posição inicial entre cada alcance.\n4. Complete a sequência, depois alterne a perna de apoio.","beneficios":"Melhora o equilíbrio estático e dinâmico, aumenta a estabilidade unipodal, fortalece estabilizadores de quadril, joelho e tornozelo.","cuidados":"Permanecer apoiado em apenas uma perna durante os alcances. Tronco ereto. Evitar compensações com o tronco ou rotações excessivas do quadril.","material":"Cones + apoio (se necessário)","obs":"Maior segurança para caminhar, mudar de direção e realizar atividades da vida diária.","defaultSeries":"3","defaultReps":"6–10 por direção, por perna","defaultDescanso":"45s","tags":"equilíbrio,idoso,unipodal,multidirecional","foto":"","video":"https://youtu.be/fr65CsoVe68"},
{"id":"eq08","nome":"Trabalho de Equilíbrio em Várias Direções (Variação)","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Equilíbrio Unipodal com Alcance Multidirecional","descricao":"Segunda aula do mesmo protocolo de alcance da ponta do pé em múltiplas direções, aprimorando o controle postural e a mobilidade funcional em apoio unipodal.","execucao":"1. Em pé, apoio unipodal, cones posicionados em diferentes direções ao redor.\n2. Toque suavemente cada cone com a ponta do pé livre.\n3. Retorne à posição inicial entre cada alcance.\n4. Complete a sequência, depois alterne a perna de apoio.","beneficios":"Melhora o equilíbrio estático e dinâmico, aumenta a estabilidade unipodal, desenvolve coordenação motora e mobilidade funcional.","cuidados":"Apoio em apenas uma perna durante toda a execução. Evitar inclinar excessivamente o tronco ou perder o alinhamento do quadril.","material":"Cones + apoio (se necessário)","obs":"Maior segurança para caminhar, mudar de direção e realizar atividades da vida diária.","defaultSeries":"3","defaultReps":"6–10 por direção, por perna","defaultDescanso":"45s","tags":"equilíbrio,idoso,unipodal,multidirecional","foto":"","video":"https://youtu.be/ZO_Xxhm_JRs"},
{"id":"eq09","nome":"Marcha sobre Colchonete","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Equilíbrio Dinâmico em Superfície Instável","descricao":"Desenvolve equilíbrio dinâmico, estabilidade postural e propriocepção através da marcha sobre uma superfície instável, aumentando o controle corporal durante a locomoção.","execucao":"1. Posicione um colchonete no percurso.\n2. Caminhe sobre o colchonete com passos lentos e controlados.\n3. Apoie completamente o pé sobre o colchonete a cada passo.\n4. Postura ereta durante toda a execução.","beneficios":"Melhora a propriocepção, aumenta o equilíbrio dinâmico, fortalece estabilizadores de tornozelos, joelhos e quadris.","cuidados":"Postura ereta durante toda a execução. Passos lentos e controlados. Usar apoio (barra ou parede) quando necessário. Interromper se houver perda de equilíbrio.","material":"Colchonete","obs":"Maior segurança para caminhar em superfícies irregulares.","defaultSeries":"3","defaultReps":"30–45s ou 15–20 passos","defaultDescanso":"45s","tags":"equilíbrio,idoso,propriocepção,superfície instável","foto":"","video":"https://youtu.be/K5D1cNlvHlo"},
{"id":"eq10","nome":"Trabalho de Equilíbrio — Elevação de Joelhos no Colchonete","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Propriocepção + Força de Flexores de Quadril em Superfície Instável","descricao":"Desenvolve equilíbrio dinâmico, propriocepção, estabilidade postural e força dos flexores do quadril através da marcha com elevação dos joelhos sobre superfície instável.","execucao":"1. Posicione um colchonete no percurso.\n2. Caminhe elevando o joelho a cada passo, até uma amplitude confortável.\n3. Apoie completamente o pé sobre o colchonete antes da próxima elevação.\n4. Tronco ereto, movimento lento e controlado.","beneficios":"Melhora a propriocepção, aumenta o equilíbrio dinâmico, fortalece flexores do quadril e musculatura estabilizadora.","cuidados":"Tronco ereto durante toda a execução. Elevar o joelho sem perder o equilíbrio. Usar apoio (barra ou parede) quando necessário.","material":"Colchonete","obs":"Maior segurança para caminhar em superfícies irregulares e realizar atividades da vida diária.","defaultSeries":"3","defaultReps":"10–15 por perna","defaultDescanso":"45s","tags":"equilíbrio,idoso,propriocepção,superfície instável,quadril","foto":"","video":"https://youtu.be/F0pwZDzrlLM"},
{"id":"eq06","nome":"Trabalho de Equilíbrio — Alcance Posterior","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Equilíbrio Unipodal com Alcance Posterior e Mobilidade de Quadril","descricao":"Desenvolve equilíbrio unipodal, mobilidade do quadril e controle postural através do alcance posterior com o pé, melhorando a estabilidade e a capacidade funcional durante movimentos do dia a dia.","execucao":"1. Em pé, apoio unipodal, cone posicionado atrás.\n2. Leve o pé livre para trás até tocar o cone.\n3. Retorne lentamente à posição inicial.\n4. Repita, depois alterne a perna de apoio.","beneficios":"Melhora o equilíbrio unipodal, fortalece estabilizadores do quadril e tornozelo, aumenta a coordenação motora e a mobilidade funcional.","cuidados":"Tronco ereto durante toda a execução. Apoiar-se em parede ou barra se necessário. Evitar compensações com o tronco ou rotação do quadril. Perna de apoio levemente flexionada.","material":"Cone + parede ou barra (apoio)","obs":"Maior segurança para caminhar, virar e realizar atividades da vida diária.","defaultSeries":"3","defaultReps":"8–12 por perna","defaultDescanso":"45s","tags":"equilíbrio,idoso,unipodal,alcance posterior,quadril","foto":"","video":"https://youtu.be/x--U4r2bPFc"},
{"id":"eq11","nome":"Equilíbrio Estático — Elevação de Joelho em Superfície Instável","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Propriocepção + Equilíbrio Estático sobre Superfície Instável","descricao":"Desenvolve equilíbrio estático, propriocepção e estabilidade postural através da sustentação unipodal sobre superfície instável com elevação do joelho.","execucao":"1. Em pé sobre colchonete, apoio unipodal.\n2. Eleve o joelho da perna livre até uma amplitude confortável.\n3. Sustente a posição pelo tempo determinado.\n4. Retorne e alterne as pernas.","beneficios":"Melhora a propriocepção, aumenta o equilíbrio estático, fortalece estabilizadores de tornozelo, joelho, quadril e core.","cuidados":"Tronco ereto durante toda a execução. Apoiar completamente o pé sobre o colchonete. Evitar oscilações excessivas do tronco e dos membros superiores.","material":"Colchonete","obs":"Maior estabilidade para as atividades da vida diária.","defaultSeries":"3","defaultReps":"8–12 por perna ou 20–30s","defaultDescanso":"45s","tags":"equilíbrio,idoso,propriocepção,superfície instável,estático","foto":"","video":"https://youtu.be/RAokGBybEl4"},
{"id":"eq12","nome":"Trabalho de Equilíbrio Dobrando a Perna","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Equilíbrio Estático Unipodal sobre Superfície Instável","descricao":"Desenvolve equilíbrio estático, propriocepção e estabilidade unipodal através da permanência sobre superfície instável, fortalecendo o controle postural.","execucao":"1. Em pé sobre colchonete, apoio unipodal com a perna livre dobrada.\n2. Sustente a posição pelo tempo determinado, olhar fixo à frente.\n3. Retorne e alterne as pernas.","beneficios":"Melhora a propriocepção, aumenta o equilíbrio estático, fortalece estabilizadores de tornozelo, joelho, quadril e core.","cuidados":"Tronco ereto durante toda a execução. Apoio em apenas uma perna sobre o colchonete. Evitar oscilações excessivas do corpo.","material":"Colchonete","obs":"Maior estabilidade para caminhar e realizar atividades da vida diária.","defaultSeries":"3","defaultReps":"20–30s por perna","defaultDescanso":"45s","tags":"equilíbrio,idoso,propriocepção,superfície instável,estático","foto":"","video":"https://youtu.be/0zGyQHNZ-60"},
{"id":"eq13","nome":"Trabalho de Equilíbrio Encostando no Objeto","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Equilíbrio Unipodal com Alcance Dinâmico Lateral","descricao":"Desenvolve equilíbrio unipodal, estabilidade dinâmica e controle postural através do alcance de um objeto em direção ao cone e retorno, simulando movimentos funcionais do dia a dia.","execucao":"1. Em pé, apoio unipodal, segurando um objeto.\n2. Incline o tronco de forma controlada, mantendo a coluna neutra.\n3. Toque o cone com o objeto e retorne lentamente.\n4. Repita, depois alterne o lado.","beneficios":"Melhora o equilíbrio estático e dinâmico, fortalece estabilizadores do quadril, joelho e tornozelo, aumenta a propriocepção.","cuidados":"Apoio em apenas uma perna durante a execução. Coluna neutra durante a inclinação. Evitar compensações com o quadril ou perda do equilíbrio.","material":"Objeto (bola ou similar) + cone","obs":"Maior capacidade para pegar e alcançar objetos com segurança nas atividades da vida diária.","defaultSeries":"3","defaultReps":"8–12 por lado","defaultDescanso":"45s","tags":"equilíbrio,idoso,unipodal,alcance dinâmico","foto":"","video":"https://youtu.be/L7Q1Kpsi4sE"},
{"id":"eq14","nome":"Trabalho de Equilíbrio — Alcance Anterior com Objeto","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Equilíbrio Unipodal com Alcance Anterior Funcional","descricao":"Desenvolve equilíbrio unipodal, estabilidade postural e coordenação motora através do alcance anterior com um objeto, simulando movimentos funcionais de empurrar ou alcançar à frente.","execucao":"1. Em pé, apoio unipodal, segurando uma bola ou objeto.\n2. Toque a parede à frente com o objeto.\n3. Retorne lentamente à posição inicial.\n4. Repita, depois alterne a perna de apoio.","beneficios":"Melhora o equilíbrio estático, aumenta a estabilidade unipodal, fortalece estabilizadores de tornozelo, joelho, quadril e core.","cuidados":"Apoio em apenas uma perna durante toda a execução. Tronco ereto e abdômen contraído. Evitar compensações ou perda do equilíbrio.","material":"Bola ou objeto","obs":"Maior capacidade funcional para alcançar objetos com segurança nas atividades da vida diária.","defaultSeries":"3","defaultReps":"8–12 por perna","defaultDescanso":"45s","tags":"equilíbrio,idoso,unipodal,alcance anterior","foto":"","video":"https://youtu.be/CwJVyjptXWs"},
{"id":"eq15","nome":"Trabalho de Equilíbrio — Alcance Posterior com Objeto","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Equilíbrio Unipodal com Extensão de Quadril Funcional","descricao":"Desenvolve equilíbrio unipodal, estabilidade postural e coordenação motora através do alcance posterior com um objeto, simulando movimentos que exigem controle corporal e extensão do quadril.","execucao":"1. Em pé, apoio unipodal, segurando uma bola.\n2. Estenda a perna livre para trás enquanto toca a parede com a bola.\n3. Retorne à posição inicial de forma controlada.\n4. Repita, depois alterne a perna de apoio.","beneficios":"Melhora o equilíbrio estático, aumenta a estabilidade unipodal e da cadeia posterior, fortalece estabilizadores do quadril, joelho e tornozelo.","cuidados":"Apoio em apenas uma perna durante toda a execução. Estender a perna sem inclinar excessivamente o tronco. Abdômen contraído, coluna neutra.","material":"Bola ou objeto","obs":"Maior segurança para atividades da vida diária que exigem apoio em uma única perna.","defaultSeries":"3","defaultReps":"8–12 por perna","defaultDescanso":"45s","tags":"equilíbrio,idoso,unipodal,alcance posterior,cadeia posterior","foto":"","video":"https://youtu.be/u4twOIhdK4k"},
{"id":"eq16","nome":"Transferência de Peso Lateral","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Controle do Peso Corporal entre os Membros","descricao":"Desenvolve equilíbrio, estabilidade e controle do peso corporal através da transferência do peso de uma perna para a outra.","execucao":"1. Em pé, pés afastados na largura dos ombros.\n2. Transfira o peso lentamente para uma perna, joelho de apoio levemente flexionado.\n3. Retorne ao centro e transfira para o outro lado.\n4. Repita de forma contínua e controlada.","beneficios":"Melhora o equilíbrio dinâmico, aumenta a estabilidade durante a marcha, fortalece estabilizadores do quadril e tornozelo.","cuidados":"Coluna alinhada durante toda a execução. Transferência lenta do peso. Joelho de apoio levemente flexionado. Evitar movimentos bruscos.","material":"Nenhum","obs":"Facilita mudanças de direção e deslocamentos no dia a dia.","defaultSeries":"3","defaultReps":"10–15 por lado","defaultDescanso":"45s","tags":"equilíbrio,idoso,transferência de peso,lateral","foto":"","video":"https://youtu.be/_q2dDUv8Fa4"},
{"id":"eq17","nome":"Transferência de Peso com Uma Perna Elevada","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Equilíbrio Unipodal com Transferência Completa de Peso","descricao":"Desenvolve equilíbrio unipodal, estabilidade dos membros inferiores e controle do peso corporal durante a sustentação em uma única perna.","execucao":"1. Em pé, coluna ereta.\n2. Eleve uma perna, transferindo o peso completamente para a perna de apoio.\n3. Sustente a posição, joelho de apoio levemente flexionado.\n4. Retorne e alterne as pernas.","beneficios":"Melhora o equilíbrio unipodal, fortalece estabilizadores do quadril, joelho e tornozelo, aumenta a estabilidade durante a marcha.","cuidados":"Coluna ereta durante toda a execução. Movimento lento e controlado. Respeitar o limite de equilíbrio individual.","material":"Nenhum","obs":"Facilita atividades como subir degraus, vestir-se e transpor obstáculos.","defaultSeries":"3","defaultReps":"8–12 por lado","defaultDescanso":"45s","tags":"equilíbrio,idoso,unipodal,transferência de peso","foto":"","video":"https://youtu.be/EOuqQMcE--k"},
{"id":"eq18","nome":"Transferência de Peso por Baixo das Pernas","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Mobilidade de Tronco + Transferência de Peso Lateral","descricao":"Desenvolve equilíbrio, mobilidade do tronco e controle do peso corporal através da transferência de peso associada ao alcance das mãos entre as pernas.","execucao":"1. Em pé, pés afastados na largura dos ombros, joelhos levemente flexionados.\n2. Transfira o peso para um lado, levando as mãos entre as pernas.\n3. Retorne ao centro e repita para o outro lado.\n4. Movimento contínuo e controlado.","beneficios":"Melhora o equilíbrio dinâmico, desenvolve coordenação motora, aumenta a mobilidade do tronco e do quadril.","cuidados":"Pés na largura dos ombros. Evitar arredondar excessivamente a coluna. Abdômen contraído, movimento lento. Respeitar a amplitude sem provocar dor.","material":"Nenhum","obs":"Melhora a capacidade de alcançar objetos próximos ao chão.","defaultSeries":"3","defaultReps":"10–12 (alternando os lados)","defaultDescanso":"45s","tags":"equilíbrio,idoso,transferência de peso,mobilidade de tronco","foto":"","video":"https://youtu.be/0ZY7wLAGt5Y"},
{"id":"eq19","nome":"Transferência de Peso com Carga","grupo":"Equilíbrio","nivel":"Intermediário","momento":"Parte Principal","foco":"Transferência de Peso Corporal Sob Carga Externa","descricao":"Desenvolve equilíbrio, estabilidade e coordenação motora através da transferência controlada do peso corporal utilizando uma carga leve.","execucao":"1. Em pé, coluna ereta, segurando a carga próxima ao corpo com as duas mãos.\n2. Transfira o peso lentamente de uma perna para a outra.\n3. Joelhos levemente flexionados, sem inclinar excessivamente o tronco.\n4. Repita de forma contínua e controlada.","beneficios":"Melhora o equilíbrio dinâmico, fortalece estabilizadores do quadril e do tronco, aumenta a estabilidade durante a marcha.","cuidados":"Coluna ereta durante toda a execução. Carga compatível com a capacidade do praticante. Evitar inclinar excessivamente o tronco.","material":"Carga leve (halter ou similar)","obs":"Maior segurança e independência nas atividades da vida diária.","defaultSeries":"3","defaultReps":"10–15 por lado","defaultDescanso":"45s","tags":"equilíbrio,idoso,transferência de peso,carga","foto":"","video":"https://youtu.be/1e-4yzGdW8w"},
{"id":"eq20","nome":"Equilíbrio em Uma Perna","grupo":"Equilíbrio","nivel":"Avançado","momento":"Parte Principal","foco":"Equilíbrio Estático Unipodal Isométrico Avançado","descricao":"Desenvolve equilíbrio unipodal, estabilidade do quadril e do tornozelo e fortalece a musculatura estabilizadora através da sustentação isométrica em apoio unipodal.","execucao":"1. Em pé, apoio unipodal, a outra perna estendida para trás.\n2. Incline levemente o tronco à frente, coluna alinhada.\n3. Quadril nivelado, sem rotações. Braços abertos para auxiliar o equilíbrio, se necessário.\n4. Sustente a posição pelo tempo determinado, olhar fixo à frente.","beneficios":"Melhora o equilíbrio estático, fortalece glúteos, tornozelos e estabilizadores, aumenta a estabilidade do quadril e joelho.","cuidados":"Quadril nivelado, evitando rotações. Coluna alinhada durante toda a execução. Olhar fixo em um ponto à frente. Usar apoio próximo se necessário.","material":"Nenhum","obs":"Maior segurança nas atividades da vida diária.","defaultSeries":"3","defaultReps":"15–30s por perna","defaultDescanso":"45s","tags":"equilíbrio,idoso,unipodal,isométrico,avançado","foto":"","video":"https://youtu.be/lNT6L2ZBufg"},

{"id":"ep19","nome":"Elevação de Perna — Marcha Apenas Uma Perna","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Equilíbrio Unipodal + Marcha Estacionária","descricao":"Desenvolve o equilíbrio unipodal, fortalece os flexores do quadril e melhora a coordenação motora através da marcha estacionária utilizando apenas uma perna de apoio.","execucao":"1. Em pé, apoio unipodal.\n2. Eleve o joelho da perna livre até aproximadamente a altura do quadril, simulando marcha.\n3. Retorne à posição inicial de forma controlada.\n4. Repita, depois alterne a perna de apoio.","beneficios":"Melhora o equilíbrio unipodal, fortalece flexores do quadril e estabilizadores, desenvolve coordenação motora e estabilidade na marcha.","cuidados":"Tronco ereto durante toda a execução. Perna de apoio levemente flexionada. Usar apoio próximo se necessário.","material":"Nenhum (ou apoio, se necessário)","obs":"Facilita atividades como caminhar, subir escadas e transpor obstáculos.","defaultSeries":"3","defaultReps":"10–15 por perna","defaultDescanso":"45s","tags":"em pé,idoso,mmii,unipodal,marcha","foto":"","video":"https://youtu.be/430zWO5FWfE"},
{"id":"ep20","nome":"Subida no Degrau com Elevação de Joelho","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Força Funcional + Equilíbrio em Subida com Elevação de Joelho","descricao":"Desenvolve força dos membros inferiores, equilíbrio e coordenação motora através da subida no degrau seguida da elevação do joelho.","execucao":"1. Em frente a um degrau firme e antiderrapante.\n2. Suba apoiando todo o pé sobre o degrau.\n3. Eleve o joelho da perna livre até aproximadamente a altura do quadril.\n4. Desça de forma lenta e controlada.","beneficios":"Fortalece quadríceps, glúteos e panturrilhas, melhora o equilíbrio e a coordenação motora, facilita a subida de escadas.","cuidados":"Degrau firme e antiderrapante. Apoiar todo o pé sobre o degrau. Tronco ereto durante toda a execução.","material":"Step ou degrau","obs":"Promove maior independência nas atividades da vida diária.","defaultSeries":"3","defaultReps":"8–12 por perna","defaultDescanso":"75s","tags":"em pé,idoso,mmii,step,elevação de joelho","foto":"","video":"https://youtu.be/Ug7CYWqkxuk"},
{"id":"ep21","nome":"Subida Alternada no Degrau","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Força Funcional Simulando Subida de Escadas","descricao":"Desenvolve força dos membros inferiores, equilíbrio e coordenação motora através da subida alternada no degrau, simulando movimentos funcionais como subir escadas.","execucao":"1. Em frente a um degrau firme e antiderrapante.\n2. Suba apoiando todo o pé sobre o degrau.\n3. Desça de forma lenta e controlada.\n4. Alterne a perna que inicia o movimento a cada repetição.","beneficios":"Fortalece quadríceps, glúteos e panturrilhas, melhora a coordenação motora, aumenta o equilíbrio dinâmico e a resistência dos membros inferiores.","cuidados":"Degrau firme e antiderrapante. Tronco ereto e abdômen contraído. Descer de forma lenta e controlada.","material":"Step ou degrau","obs":"Maior independência nas atividades da vida diária.","defaultSeries":"3","defaultReps":"10–15 por perna","defaultDescanso":"75s","tags":"em pé,idoso,mmii,step,alternado","foto":"","video":"https://youtu.be/tPC1iB4NeGk"},
{"id":"nc01","nome":"Fortalecimento do Quadril (Sentado)","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Flexores de Quadril na Posição Sentada","descricao":"Desenvolve força dos flexores do quadril e melhora a mobilidade dos membros inferiores através da elevação controlada do joelho na posição sentada.","execucao":"1. Sentado, coluna ereta e apoiada.\n2. Eleve o joelho de uma perna até uma amplitude confortável.\n3. Retorne lentamente à posição inicial.\n4. Repita, depois alterne a perna.","beneficios":"Fortalece os flexores do quadril, melhora a mobilidade dos membros inferiores e a estabilidade da pelve, facilita levantar da cadeira.","cuidados":"Coluna ereta e apoiada durante a execução. Evitar inclinar o tronco para auxiliar o movimento. Movimento lento e controlado.","material":"Cadeira","obs":"Auxilia na manutenção da independência funcional e reduz risco de quedas.","defaultSeries":"3","defaultReps":"10–15 por perna","defaultDescanso":"45s","tags":"cadeira,idoso,mmii,quadril,sentado","foto":"","video":"https://youtu.be/UvvfFl8OQzI"},

{"id":"nc03","nome":"Alongamento de Tronco — Inclinação Lateral (Sentado)","grupo":"Alongamento","nivel":"Básico","momento":"Parte Inicial","foco":"Mobilidade de Coluna e Flexibilidade Lateral do Tronco","descricao":"Desenvolve a mobilidade da coluna, melhora a flexibilidade da musculatura lateral do tronco e aumenta a amplitude de movimento durante a inclinação lateral.","execucao":"1. Sentado, quadris apoiados na cadeira.\n2. Incline o tronco lateralmente até uma amplitude confortável, sem dor.\n3. Retorne lentamente à posição inicial.\n4. Repita, depois alterne o lado.","beneficios":"Melhora a mobilidade da coluna, alonga a musculatura lateral do tronco, aumenta a flexibilidade e melhora a postura.","cuidados":"Quadris apoiados na cadeira durante toda a execução. Evitar girar o tronco durante o movimento. Movimento lento e controlado.","material":"Cadeira","obs":"Facilita movimentos de alcance lateral nas atividades da vida diária.","defaultSeries":"3","defaultReps":"8–12 por lado","defaultDescanso":"45s","tags":"cadeira,idoso,alongamento,tronco,lateral","foto":"","video":"https://youtu.be/RJpAXTnmbKM"},
{"id":"nc04","nome":"Alongamento de Tronco — Rotação (Sentado)","grupo":"Alongamento","nivel":"Básico","momento":"Parte Inicial","foco":"Mobilidade Rotacional de Coluna Torácica","descricao":"Desenvolve a mobilidade da coluna torácica e aumenta a amplitude de rotação do tronco através de movimento rotacional na posição sentada.","execucao":"1. Sentado, pés apoiados no chão, coluna ereta.\n2. Braços estendidos na altura dos ombros.\n3. Realize a rotação do tronco até uma amplitude confortável, sem dor.\n4. Retorne lentamente à posição inicial, alterne o lado.","beneficios":"Melhora a mobilidade da coluna torácica, aumenta a amplitude de rotação do tronco, melhora a postura e a coordenação motora.","cuidados":"Pés apoiados no chão durante toda a execução. Evitar compensações com a pelve. Movimento lento e controlado.","material":"Cadeira","obs":"Facilita movimentos de alcance e rotação nas atividades da vida diária.","defaultSeries":"3","defaultReps":"8–12 por lado","defaultDescanso":"45s","tags":"cadeira,idoso,alongamento,tronco,rotação","foto":"","video":"https://youtu.be/qRyvV20Yueg"},
{"id":"nc05","nome":"Alongamento Lateral de Tronco com Elevação de Braço","grupo":"Alongamento","nivel":"Básico","momento":"Parte Inicial","foco":"Flexibilidade Lateral com Alongamento de Braço","descricao":"Desenvolve a mobilidade da coluna, aumenta a flexibilidade da musculatura lateral do tronco e melhora a amplitude de movimento durante inclinações laterais, com elevação de braço.","execucao":"1. Sentado, quadris apoiados na cadeira.\n2. Eleve um braço acima da cabeça.\n3. Incline o tronco lateralmente até uma amplitude confortável.\n4. Retorne lentamente à posição inicial, alterne o lado.","beneficios":"Melhora a mobilidade da coluna, alonga a musculatura lateral do tronco, aumenta a flexibilidade e melhora a postura.","cuidados":"Quadris apoiados na cadeira durante toda a execução. Evitar inclinar o tronco para frente ou girar durante o movimento.","material":"Cadeira","obs":"Facilita movimentos de alcance lateral nas atividades da vida diária.","defaultSeries":"3","defaultReps":"8–12 por lado","defaultDescanso":"45s","tags":"cadeira,idoso,alongamento,tronco,lateral,braço","foto":"","video":"https://youtu.be/L4slU8eeN1c"},
{"id":"nc06","nome":"Alongamento de Tronco e Coxa (Sentado)","grupo":"Alongamento","nivel":"Básico","momento":"Parte Inicial","foco":"Mobilidade de Coluna/Quadril + Cadeia Posterior","descricao":"Desenvolve a mobilidade da coluna e do quadril, aumenta a flexibilidade da cadeia posterior e melhora a capacidade funcional para alcançar objetos próximos aos pés.","execucao":"1. Sentado, pés apoiados no chão.\n2. Incline o tronco lentamente em direção às pontas dos pés.\n3. Respeite a amplitude individual, sem dor.\n4. Retorne lentamente à posição inicial.","beneficios":"Melhora a mobilidade da coluna e do quadril, alonga a cadeia posterior, aumenta a flexibilidade dos isquiotibiais e melhora a postura.","cuidados":"Pés apoiados no chão durante toda a execução. Evitar movimentos bruscos ou compensações com a coluna. Sem dor.","material":"Cadeira","obs":"Facilita movimentos de abaixar-se e alcançar objetos, reduzindo a rigidez muscular.","defaultSeries":"3","defaultReps":"8–12","defaultDescanso":"45s","tags":"cadeira,idoso,alongamento,tronco,cadeia posterior","foto":"","video":"https://youtu.be/cxe0AYjNfSw"},
{"id":"nc07","nome":"Alongamento de Glúteo e Coxa (Sentado)","grupo":"Alongamento","nivel":"Básico","momento":"Parte Inicial","foco":"Alongamento de Glúteo e Rotadores Externos de Quadril","descricao":"Promove o alongamento da musculatura do glúteo, dos rotadores externos do quadril e da região posterior da coxa, melhorando a mobilidade do quadril e a flexibilidade.","execucao":"1. Sentado, coluna ereta.\n2. Apoie o tornozelo sobre o joelho da perna oposta.\n3. Incline levemente o tronco à frente até sentir o alongamento, sem dor.\n4. Sustente e respire de forma lenta e contínua.","beneficios":"Alonga glúteos e rotadores externos do quadril, melhora a mobilidade do quadril, alivia tensão lombar e melhora a postura.","cuidados":"Coluna ereta durante toda a execução. Evitar arredondar excessivamente a coluna. Respiração lenta e contínua.","material":"Cadeira","obs":"Facilita movimentos como sentar, levantar e caminhar.","defaultSeries":"3","defaultReps":"20–30s por lado","defaultDescanso":"30s","tags":"cadeira,idoso,alongamento,glúteo,quadril","foto":"","video":"https://youtu.be/oYXVdG38Ed0"},
{"id":"nc08","nome":"Fortalecimento de Tornozelo (Sentado)","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Força e Mobilidade de Tornozelo","descricao":"Desenvolve a força e a mobilidade da articulação do tornozelo, melhorando o controle dos pés durante a marcha e as atividades da vida diária.","execucao":"1. Sentado, coluna ereta, joelhos estendidos conforme a capacidade.\n2. Movimente os tornozelos, levando a ponta dos pés para cima (dorsiflexão).\n3. Depois para baixo (flexão plantar).\n4. Movimento lento e controlado, apenas nos tornozelos.","beneficios":"Fortalece a musculatura do tornozelo, melhora a mobilidade articular, aumenta a circulação e a estabilidade durante a marcha.","cuidados":"Coluna ereta durante toda a execução. Movimentar apenas os tornozelos, evitando compensações com joelhos ou quadris.","material":"Cadeira","obs":"Reduz risco de tropeços e quedas, facilita a caminhada e subida de degraus.","defaultSeries":"3","defaultReps":"10–15","defaultDescanso":"45s","tags":"cadeira,idoso,mmii,tornozelo,circulação","foto":"","video":"https://youtu.be/JSncRO8y0y8"},
{"id":"nc09","nome":"Alongamento de Braço — Posterior de Ombro (Sentado)","grupo":"Alongamento","nivel":"Básico","momento":"Parte Inicial","foco":"Alongamento de Ombro Posterior e Costas Superiores","descricao":"Promove o alongamento da musculatura posterior do ombro e da região superior das costas, melhorando a mobilidade do complexo do ombro e a amplitude de movimento.","execucao":"1. Sentado, coluna ereta.\n2. Puxe um braço em direção ao peito com a mão oposta, até sentir um alongamento confortável.\n3. Sustente pelo tempo determinado, respirando de forma lenta.\n4. Retorne e alterne o braço.","beneficios":"Alonga a musculatura posterior do ombro, melhora a mobilidade dos ombros, reduz tensão muscular e melhora a postura.","cuidados":"Coluna ereta durante toda a execução. Evitar elevar os ombros durante o movimento. Sem dor.","material":"Cadeira","obs":"Facilita movimentos de alcance e elevação dos braços nas atividades da vida diária.","defaultSeries":"3","defaultReps":"20–30s por braço","defaultDescanso":"30s","tags":"cadeira,idoso,alongamento,ombro,braço","foto":"","video":"https://youtu.be/yf8oni1Frjc"},
