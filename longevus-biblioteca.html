{"id":"bs13","nome":"Ativação de Trapézio Inferior em Pé com Super Band","grupo":"MMSS","nivel":"Avançado","momento":"Parte Principal","foco":"Extensão de Ombro com Depressão/Retração Escapular","descricao":"Levar os braços estendidos para trás contra a super band recruta o trapézio inferior diretamente, associando extensão de ombro à depressão e retração escapular.","execucao":"1. Em pé, postura ereta, abdômen contraído, tronco estável.\n2. Segure a super band com os braços estendidos à frente, posição neutra.\n3. Estenda os ombros, levando os braços para trás com cotovelos estendidos.\n4. Continue até os braços passarem levemente atrás da linha do quadril.\n5. Retorne lentamente e controlado, sem deixar o elástico puxar sem resistência.","beneficios":"Fortalece o trapézio inferior e os estabilizadores escapulares, reduz a dominância do trapézio superior e promove depressão/retração escapular ativa.","cuidados":"Ombros não devem elevar durante o movimento. Tronco não deve inclinar ou hiperextender. Cotovelos permanecem estendidos durante todo o movimento.","material":"Super band","obs":"Progressão: mais resistência, isometria final de 3-5s, ou execução unilateral.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"bursite_subacromial,mmss,trapézio inferior,escápula,super band","foto":"","video":"https://youtu.be/oLNnpLW6NYo"},
{"id":"bs14","nome":"Estabilidade de Ombro em Anti-Flexão Lateral — Isometria Unilateral Ajoelhado","grupo":"MMSS","nivel":"Avançado","momento":"Parte Principal","foco":"Estabilidade Glenoumeral em Plano Lateral","descricao":"A super band puxando lateralmente exige coaptação do manguito, depressão escapular pelo trapézio inferior e resistência do core à inclinação lateral do tronco — tudo simultaneamente.","execucao":"1. Ajoelhado sobre colchonete, tronco ereto, quadris alinhados, abdômen contraído.\n2. Super band fixada lateralmente, tracionando para o lado e para baixo.\n3. Eleve o braço do lado do elástico acima da cabeça, cotovelo totalmente estendido.\n4. Mantenha o braço firme, resistindo à tração lateral.\n5. Sustente isometricamente pelo tempo determinado, tronco vertical o tempo todo.","beneficios":"Desenvolve estabilidade glenoumeral unilateral contra forças laterais, fortalece manguito rotador e trapézio inferior de forma integrada com anti-flexão lateral do tronco.","cuidados":"Tronco não pode inclinar para o lado da tração. Quadris alinhados e nivelados. Cotovelo totalmente estendido. Evitar elevação do ombro.","material":"Super band","obs":"Progressão: mais tempo de sustentação, mais resistência, ou execução em pé.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"bursite_subacromial,mmss,estabilidade,anti-flexão lateral","foto":"","video":"https://youtu.be/-quVcJ33HsY"},
{"id":"bs15","nome":"Estabilidade de Ombro — Toque no Ombro em Prancha Alta","grupo":"MMSS","nivel":"Avançado","momento":"Parte Principal","foco":"Estabilidade Glenoumeral em CCF + Anti-Rotação","descricao":"Ao retirar uma mão do solo para tocar o ombro oposto, o braço de apoio sustenta todo o peso do corpo, exigindo forte coativação do manguito, estabilizadores escapulares e core em anti-rotação.","execucao":"1. Prancha alta: mãos no solo, braços estendidos, corpo alinhado da cabeça aos pés.\n2. Pés afastados na largura dos ombros.\n3. Retire uma mão do solo e toque o ombro oposto, tronco estável e quadris alinhados.\n4. Recoloque a mão e repita com a outra mão, alternando.\n5. Evite balanço lateral do quadril ou rotação do tronco.","beneficios":"Desenvolve estabilidade glenoumeral em CCF com carga unilateral, fortalece manguito rotador sob carga funcional e treina anti-rotação de tronco.","cuidados":"Quadris não podem rotacionar ou elevar durante o toque. Abdômen contraído o tempo todo. Ombros alinhados com as mãos, sem colapso.","material":"Colchonete","obs":"Progressão: reduzir a base de suporte, ou usar superfície instável sob as mãos.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"bursite_subacromial,mmss,estabilidade,prancha,anti-rotação","foto":"","video":"https://youtu.be/NxpUw02E0hs"},
{"id":"bs16","nome":"Estabilidade de Ombro Unilateral — Prancha Alta","grupo":"MMSS","nivel":"Avançado","momento":"Parte Principal","foco":"Coaptação Glenoumeral em Apoio Unilateral Total","descricao":"Progressão da prancha bilateral: sustentar o corpo com um único braço concentra toda a demanda de coaptação no ombro de apoio, com o core impedindo rotação ou colapso do tronco.","execucao":"1. Prancha alta: mãos no solo, braços estendidos, corpo alinhado.\n2. Pés afastados na largura dos ombros.\n3. Retire uma mão do solo, mantendo apoio apenas com o braço contralateral.\n4. Sustente isometricamente, sem rotação ou desvio lateral.\n5. Após o tempo determinado, alterne o braço de apoio.","beneficios":"Desenvolve estabilidade glenoumeral unilateral em CCF com carga total, fortalece o manguito rotador sob distribuição máxima de carga e treina anti-rotação.","cuidados":"Quadris não podem rotacionar ou elevar. Ombro de apoio estável e alinhado com a mão. Iniciar com tempos curtos (5-10s) e progredir.","material":"Colchonete","obs":"Progressão: mais tempo de sustentação, pés mais próximos, ou superfície instável.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"bursite_subacromial,mmss,estabilidade,prancha,unilateral","foto":"","video":"https://youtu.be/gPPIQtivGMM"},
{"id":"bs17","nome":"Estabilidade de Ombro — Arrastando o Peso em Prancha Alta","grupo":"MMSS","nivel":"Avançado","momento":"Parte Principal","foco":"Estabilidade Dinâmica + Anti-Rotação sob Perturbação","descricao":"Combina sustentação unilateral em CCF com um movimento dinâmico de arrasto no braço livre, exigindo que o core e o ombro de apoio resistam à rotação gerada pela força assimétrica.","execucao":"1. Prancha alta, pés afastados na largura dos ombros.\n2. Um kettlebell ou halter ao lado de uma das mãos, no solo.\n3. Use a mão contralateral para arrastar o peso por baixo do corpo até o outro lado.\n4. Recoloque a mão no solo e repita com o braço oposto, alternando.\n5. Tronco estável, quadris alinhados durante todo o arrasto.","beneficios":"Desenvolve estabilidade dinâmica do ombro em CCF com perturbação de carga, treina anti-rotação com componente de força funcional.","cuidados":"Quadris não podem rotacionar. Arrasto lento e controlado — velocidade determina a intensidade da perturbação. Ombro de apoio estável, sem colapso.","material":"Kettlebell ou halter","obs":"Iniciar com cargas leves, priorizando controle. Progressão: mais carga, pés mais próximos, ou mais velocidade.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"bursite_subacromial,mmss,estabilidade,prancha,dinâmico","foto":"","video":"https://youtu.be/HTwHPNwQ_mk"},
{"id":"bs18","nome":"Estabilidade de Ombro com Elástico","grupo":"MMSS","nivel":"Avançado","momento":"Parte Principal","foco":"Estabilidade Glenoumeral Dinâmica em Cadeia Aberta","descricao":"O elástico permite treinar o manguito rotador e os fixadores escapulares em múltiplos ângulos e padrões (rotação interna/externa, abdução, flexão), com demanda tanto concêntrica quanto excêntrica.","execucao":"1. Em pé, postura ereta, abdômen contraído, tronco estável.\n2. Elástico fixado em ponto externo na altura do ombro ou abaixo.\n3. Realize o movimento proposto (rotação externa, interna, abdução ou flexão) de forma lenta.\n4. Fase concêntrica e excêntrica com a mesma velocidade.\n5. Tronco estável, sem compensações para 'ajudar' o braço.","beneficios":"Fortalece o manguito rotador e estabilizadores escapulares em padrões funcionais, desenvolve controle excêntrico e estabilidade glenoumeral dinâmica.","cuidados":"Tronco não deve rotacionar ou inclinar. Retorno excêntrico lento e controlado. Evitar elevação do ombro. Escápula deve permanecer estável durante o movimento.","material":"Faixa elástica","obs":"Progressão: mais resistência, variar o ângulo de fixação, ou execução unilateral em posições desafiadoras.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"bursite_subacromial,mmss,estabilidade,manguito rotador,elástico","foto":"","video":"https://youtu.be/WPm9NKfs7n8"},
{"id":"bs19","nome":"Rotação Externa de Ombro com Resistência Elástica","grupo":"MMSS","nivel":"Intermediário","momento":"Parte Principal","foco":"Infraespinhal e Redondo Menor","descricao":"Fortalece os rotadores externos (infraespinhal e redondo menor), músculos do manguito frequentemente fracos em lesões e tendinopatias, promovendo coaptação da cabeça do úmero na glenoide.","execucao":"1. Em pé, postura ereta, abdômen contraído, tronco estável.\n2. Elástico fixado lateralmente na altura do cotovelo ou abaixo.\n3. Cotovelo a 90°, junto ao tronco, toalha dobrada entre cotovelo e corpo.\n4. A partir da posição neutra, realize rotação externa levando o antebraço para fora.\n5. Retorne lentamente, sem deixar o elástico puxar sem resistência.","beneficios":"Fortalece os rotadores externos, promove coaptação articular e melhora o equilíbrio muscular entre rotadores internos e externos.","cuidados":"Cotovelo permanece junto ao tronco (toalha ajuda). Tronco não deve rotacionar. Retorno lento, contando 3-4 segundos. Evitar elevação ou protração do ombro.","material":"Faixa elástica + toalha","obs":"Progressão: mais resistência, rotação com braço em abdução de 45°/90°, ou isometria final de 3-5s.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"45s","tags":"bursite_subacromial,mmss,rotação externa,manguito rotador","foto":"","video":"https://youtu.be/rp5USLK8GiA"},
{"id":"bs20","nome":"Potência de MMSS — Apoio de Flexão no Step","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Potência Reativa / Ciclo Alongamento-Encurtamento","descricao":"Exercício reativo em CCF que utiliza o ciclo alongamento-encurtamento do membro superior — descida rápida seguida de empurrão explosivo — simulando arremessos, bloqueios e quedas amortecidas.","execucao":"1. Prancha alta, mãos apoiadas no step, corpo alinhado.\n2. Desça rapidamente retirando as mãos do step, aterrissando no solo com absorção controlada.\n3. Empurre o corpo de volta para cima imediatamente, recolocando as mãos no step de forma explosiva.\n4. Aterrissagem rápida e silenciosa, minimizando o tempo de contato.\n5. Tronco alinhado e estável, sem rotação ou colapso do quadril.","beneficios":"Desenvolve potência e força reativa do MMSS em CCF, treina o ciclo alongamento-encurtamento e melhora o controle excêntrico na absorção de carga.","cuidados":"Aterrissagem suave e silenciosa — barulho indica absorção insuficiente. Tempo de contato mínimo. Cotovelos em leve flexão na aterrissagem, nunca travados. Contraindicado com dor ativa ou instabilidade residual.","material":"Step","obs":"Só introduzir quando o paciente já tem estabilidade e força adequadas em prancha alta. Progressão: mais altura do step, ou variações unilaterais.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"bursite_subacromial,funcional,potência,reatividade,step","foto":"","video":"https://youtu.be/uRYDwDBBUh8"},
{"id":"bs21","nome":"Potência de MMSS — Apoio das Mãos no Step Duplo","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Potência Reativa Bilateral / Coordenação Interlateral","descricao":"Progressão do apoio de flexão no step simples: dois steps exigem controle independente da aterrissagem e impulso em cada braço, aumentando a demanda de coordenação interlateral.","execucao":"1. Prancha alta, cada mão apoiada em um step separado, corpo alinhado.\n2. Desça rapidamente retirando as mãos dos steps, aterrissando entre eles com absorção controlada.\n3. Empurre o corpo de volta explosivamente, recolocando as mãos nos steps simultaneamente.\n4. Aterrissagem rápida e silenciosa nos dois lados.\n5. Tronco alinhado, sem rotação ou colapso do quadril.","beneficios":"Desenvolve potência e força reativa bilateral do MMSS, treina o ciclo alongamento-encurtamento com coordenação interlateral.","cuidados":"Aterrissagem simétrica nos dois lados — assimetria indica desequilíbrio de controle. Cotovelos em leve flexão, nunca travados. Contraindicado com dor ativa ou instabilidade residual.","material":"2 steps","obs":"Introduzir só quando o paciente domina o step simples sem dor. Progressão: mais altura, alturas diferentes entre steps, ou deslocamento lateral.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"bursite_subacromial,funcional,potência,reatividade,bilateral","foto":"","video":"https://youtu.be/0sgYV8oHJhY"},
{"id":"bs22","nome":"Potência de MMSS — Semi-Ajoelhado","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Potência Rotacional Integrada ao Controle de Tronco","descricao":"A posição semi-ajoelhada elimina o apoio simétrico dos MMII e transfere a demanda de estabilidade para a cadeia superior, treinando potência do braço com o core resistindo à rotação gerada.","execucao":"1. Semi-ajoelhado: um joelho no solo, outro pé à frente, 90° de flexão de quadril e joelho.\n2. Tronco ereto, abdômen contraído, pelve neutra.\n3. Com elástico lateral ou medicine ball, realize o gesto de potência (arremesso, rotação com aceleração ou padrão diagonal).\n4. Movimento explosivo na fase concêntrica.\n5. Tronco resiste à rotação gerada pelo braço, mantendo alinhamento.","beneficios":"Desenvolve potência do MMSS integrada ao controle de tronco e pelve, treina padrões diagonais/rotacionais transferíveis a gestos esportivos.","cuidados":"Pelve não pode rotacionar ou inclinar. Joelho de apoio alinhado ao quadril. Explosivo na concêntrica, controlado na excêntrica. Contraindicado com dor ativa, instabilidade residual ou controle de tronco insuficiente.","material":"Faixa elástica ou medicine ball","obs":"Introduzir só quando o paciente já tem estabilidade e potência adequadas em posições bilaterais. Progressão: mais resistência/velocidade, ou execução em pé.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"bursite_subacromial,funcional,potência,rotacional,semi-ajoelhado","foto":"","video":"https://youtu.be/fDUUTOsSf_U"},
{"id":"bs23","nome":"Ativação de Manguito Rotador com Elástico","grupo":"MMSS","nivel":"Avançado","momento":"Parte Principal","foco":"Manguito Rotador em Amplitude Elevada (Acima da Cabeça)","descricao":"Treina o manguito rotador em amplitudes elevadas e funcionais (braço acima da cabeça), essenciais para arremessar, nadar, sacar ou alcançar prateleiras altas — algo que exercícios com braço junto ao corpo não cobrem.","execucao":"1. Em pé, postura ereta, abdômen contraído, tronco estável.\n2. Elástico fixado abaixo ou na altura do ombro, na mão do lado a trabalhar.\n3. Cotovelo flexionado a 90°, na linha do ombro ou levemente acima.\n4. Estenda o braço progressivamente acima da cabeça, vencendo a resistência.\n5. Breve contração na posição final e retorno lento e controlado.","beneficios":"Fortalece o manguito rotador em amplitudes elevadas, desenvolve estabilidade glenoumeral dinâmica acima da linha do ombro e melhora o ritmo escapuloumeral.","cuidados":"Tronco não deve inclinar ou hiperextender para 'ajudar'. Escápula deve acompanhar o movimento coordenadamente. Retorno lento (3-4s). Monitorar o arco entre 60°-120° em histórico de conflito subacromial.","material":"Faixa elástica","obs":"Progressão: mais resistência, isometria final de 3-5s, ou execução semi-ajoelhada/unilateral.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"bursite_subacromial,mmss,manguito rotador,amplitude elevada","foto":"","video":"https://youtu.be/ZlKH1Y5c-8A"},
{"id":"tp01","nome":"Agachamento Isométrico com Elástico Bilateral","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Analgesia + Ativação Isométrica de Quadríceps","descricao":"Promove analgesia imediata e ativação sustentada do quadríceps através de contração isométrica, com elástico na fossa poplítea aumentando a demanda e o controle do joelho.","execucao":"1. Em pé, elástico preso bilateralmente na região da fossa poplítea.\n2. Desça até a posição de agachamento.\n3. Tronco levemente inclinado à frente, abdômen ativo.\n4. Sustente a posição isométrica por 45 segundos.\n5. Retorne e repita.","beneficios":"Reduz dor anterior no joelho, promove analgesia via contração isométrica e estimula ativação do quadríceps em CCF.","cuidados":"Joelho alinhado com o pé. Evitar dor intensa durante a sustentação. Priorizar qualidade da contração, não profundidade.","material":"Faixa elástica","obs":"Pode ser usado no início da sessão para redução da dor.","defaultSeries":"5","defaultReps":"45s (isometria)","defaultDescanso":"60s","tags":"tendinopatia_patelar,mmii,isometria,analgesia","foto":"","video":"https://youtu.be/VrnTQCbFl4g"},
{"id":"tp02","nome":"Agachamento Isométrico Unilateral com Elástico","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Analgesia + Ativação Isométrica Unilateral","descricao":"Progressão natural do isométrico bilateral, aumentando a exigência sobre o membro afetado com maior especificidade, mantendo o efeito analgésico.","execucao":"1. Apoio unipodal, elástico preso na região da fossa poplítea.\n2. Desça até a posição de agachamento unilateral.\n3. Tronco levemente inclinado à frente, abdômen ativo.\n4. Sustente a posição isométrica por 45 segundos.\n5. Retorne e repita.","beneficios":"Reduz dor anterior no joelho, promove analgesia e melhora o controle em apoio unilateral.","cuidados":"Alinhamento do joelho com o pé. Evitar colapso medial do joelho. Ajustar profundidade conforme tolerância à dor.","material":"Faixa elástica","obs":"Estratégia analgésica antes de exercícios mais intensos.","defaultSeries":"5","defaultReps":"45s (isometria)","defaultDescanso":"60s","tags":"tendinopatia_patelar,mmii,isometria,unilateral","foto":"","video":"https://youtu.be/LGj5tDP5mgs"},
{"id":"tp03","nome":"Agachamento","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Controle de Carga e Amplitude Tolerada","descricao":"Permite controle direto da carga, amplitude e dor. O foco não é profundidade ou peso, mas a amplitude tolerada e a resposta de dor durante e após o exercício.","execucao":"1. Em pé, pés afastados na largura dos ombros.\n2. Inicie o agachamento com leve inclinação do tronco à frente.\n3. Flexione quadril e joelhos de forma controlada, respeitando a amplitude tolerada.\n4. Retorne de forma controlada.","beneficios":"Desenvolve força do quadríceps, melhora o controle do movimento e aumenta a capacidade de carga do tendão patelar.","cuidados":"Dor até EVA 3/10 durante o exercício é aceitável; aumento de dor após 24h indica excesso de carga. Manter alinhamento do joelho com o pé.","material":"Nenhum","obs":"Progressão: aumentar carga, amplitude ou volume conforme adaptação.","defaultSeries":"3–4","defaultReps":"8–12","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,agachamento,carga","foto":"","video":"https://youtu.be/lWEPMFNr0_E"},
{"id":"tp04","nome":"Afundo","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Simetria de Carga entre os Membros","descricao":"Trabalha a distribuição de carga entre os membros — crítico na tendinopatia, já que pacientes tendem a tirar carga da perna com dor e compensar no lado saudável.","execucao":"1. Base de afundo, um pé à frente e outro atrás.\n2. Tronco levemente inclinado à frente, abdômen ativo.\n3. Desça de forma controlada, flexionando joelho e quadril.\n4. Distribua o peso equilibradamente entre as pernas.\n5. Retorne de forma controlada.","beneficios":"Melhora a distribuição de carga entre os membros, desenvolve força do quadríceps e reduz compensações.","cuidados":"Observar se o paciente não joga o peso para a perna sem dor. Alinhamento do joelho com o pé. Controlar a fase excêntrica.","material":"Nenhum","obs":"Dor até EVA 3/10 aceitável. Progressão: aumentar carga ou evoluir para variações unilaterais.","defaultSeries":"3–4","defaultReps":"8–12 por lado","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,afundo,simetria","foto":"","video":"https://youtu.be/gjNyGpe5gWs"},
{"id":"tp05","nome":"Afundo Búlgaro","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Progressão de Carga Unilateral Específica","descricao":"Evolução do afundo tradicional, aumentando a demanda sobre a perna da frente — exige controle de base para garantir que o membro acometido realmente receba o estímulo.","execucao":"1. Base de afundo, pé de trás apoiado em step ou banco.\n2. Pé da frente totalmente apoiado no solo.\n3. Desça de forma controlada, flexionando joelho e quadril da perna da frente.\n4. Tronco levemente inclinado à frente, abdômen ativo.\n5. Retorne de forma controlada.","beneficios":"Aumenta a capacidade de carga do tendão patelar, desenvolve força do quadríceps e melhora o controle em apoio unilateral.","cuidados":"Carga concentrada na perna da frente, evitar jogar o peso para trás. Alinhamento do joelho com o pé. Controlar a fase excêntrica.","material":"Step ou banco","obs":"Dor até EVA 3/10 aceitável. Progressão: adicionar carga externa.","defaultSeries":"3–4","defaultReps":"8–12 por lado","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,afundo búlgaro,unilateral","foto":"","video":"https://youtu.be/7OAjHIahHGk"},
{"id":"tp06","nome":"Passada","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Controle Excêntrico com Base Fixa","descricao":"Passada à frente e atrás mantendo a mesma perna como base fixa, aumentando a carga no membro acometido e evitando compensação para o lado sem dor.","execucao":"1. Em pé, pés paralelos, largura do quadril.\n2. Realize uma passada à frente com a perna a ser trabalhada.\n3. Tronco levemente inclinado à frente, abdômen ativo. Retorne à posição inicial.\n4. Realize uma passada para trás com a perna contralateral, mantendo a perna da frente fixa como base.\n5. Execute de forma contínua e controlada.","beneficios":"Desenvolve força do quadríceps, melhora o controle excêntrico e trabalha a simetria de carga entre os membros.","cuidados":"Carga concentrada na perna da frente. Alinhamento do joelho com o pé. Controlar a fase excêntrica.","material":"Nenhum","obs":"Dor até EVA 3/10 aceitável. Progressão: adicionar carga externa ou aumentar amplitude.","defaultSeries":"3–4","defaultReps":"10–15 por lado","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,passada,excêntrico","foto":"","video":"https://youtu.be/Tw4Bf9B2W8I"},
{"id":"tp07","nome":"Passada Alternada","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Transferência de Carga entre Membros em Movimento","descricao":"Trabalha transferência de carga entre os membros, controle excêntrico e estabilidade em movimento, com atenção ao controle do tronco para evitar valgo dinâmico.","execucao":"1. Em pé, pés afastados na largura do quadril.\n2. Realize uma passada à frente com uma das pernas.\n3. Flexione o joelho da frente de forma controlada, tronco levemente inclinado.\n4. O joelho de trás desce em direção ao solo, sem tocar completamente.\n5. Retorne e alterne com a outra perna, de forma contínua.","beneficios":"Desenvolve força de quadríceps e glúteos, melhora controle excêntrico/concêntrico e promove simetria na distribuição de carga.","cuidados":"Tronco estável, sem queda lateral. Alinhamento do joelho com o pé. Projetar o peso para a perna da frente.","material":"Nenhum","obs":"Dor até EVA 3/10 aceitável; se aumentar após 24h, reduzir carga. Progressão: mais amplitude, carga ou volume.","defaultSeries":"3–4","defaultReps":"10–15 por lado","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,passada alternada,transferência de carga","foto":"","video":"https://youtu.be/CDlzu8JQZ0s"},
{"id":"tp08","nome":"Toque Lateral com Mini Band","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Estabilidade de Quadril / Glúteo Médio","descricao":"Melhora o controle do quadril na fase inicial, reduzindo a sobrecarga no tendão patelar — o glúteo médio estabiliza a pelve e evita o colapso medial do joelho.","execucao":"1. Mini band nos joelhos ou tornozelos.\n2. Leve agachamento, quadril para trás, tronco levemente inclinado.\n3. Transfira o peso para a perna de apoio.\n4. Toque lateral com o pé oposto.\n5. Retorne e alterne os lados mantendo a base do agachamento.","beneficios":"Desenvolve ativação do glúteo médio, melhora estabilidade do quadril e controla o alinhamento do joelho.","cuidados":"Foco na perna de apoio, que sustenta a carga. Evitar valgo de joelho. Tronco estável durante o movimento.","material":"Mini band","obs":"Fundamental no início para corrigir padrões antes de aumentar carga no tendão. Progressão: mais tensão ou amplitude.","defaultSeries":"3","defaultReps":"15–20 por lado","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,glúteo médio,estabilidade","foto":"","video":"https://youtu.be/VCPwQ2Ldp6A"},
{"id":"tp09","nome":"Ativação de Glúteo Médio (Aviãozinho com Resistência Elástica)","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Estabilidade Pélvica + Organização do Movimento","descricao":"O elástico em diagonal cria tendência de desorganização do movimento, exigindo ativação do glúteo médio, controle excêntrico na inclinação e estabilidade em apoio unilateral.","execucao":"1. Em pé, elástico fixado lateralmente e para baixo, em diagonal.\n2. Incline o tronco à frente, elevando a perna de trás junto com o braço do mesmo lado.\n3. Mantenha alinhamento entre tronco, quadril e perna, sem rotação.\n4. Retorne à posição neutra de forma controlada.\n5. Eleve o joelho à frente, simulando padrão de corrida, ritmicamente.","beneficios":"Desenvolve ativação do glúteo médio, melhora estabilidade pélvica e reduz sobrecarga no tendão patelar.","cuidados":"Foco na perna de apoio. Evitar abertura do quadril. Tronco estável e alinhado. Usar baixa resistência no início.","material":"Faixa elástica","obs":"Importante desde o início para corrigir padrões antes de aumentar carga no tendão.","defaultSeries":"3–4","defaultReps":"8–10","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,glúteo médio,estabilidade pélvica","foto":"","video":"https://youtu.be/cvxs8qDaxz4"},
{"id":"tp10","nome":"Ativação Excêntrica de Glúteo Médio em Afundo com Rotação","grupo":"MMII","nivel":"Básico","momento":"Parte Principal","foco":"Controle Excêntrico Pélvico em Base Alternada","descricao":"O elástico em diagonal cria tendência de rotação e queda da pelve, exigindo ativação excêntrica do glúteo médio e controle em apoio com base alternada.","execucao":"1. Base de afundo, pé de trás apoiado em um step.\n2. Elástico fixado na pelve, tração em diagonal para frente e para baixo.\n3. Realize rotação controlada do quadril a partir da posição inicial.\n4. Permita que o elástico conduza o movimento (fase excêntrica).\n5. Retorne de forma ativa e controlada, ritmicamente.","beneficios":"Desenvolve controle excêntrico do glúteo médio, melhora estabilidade pélvica e reduz sobrecarga no tendão patelar.","cuidados":"Foco no controle do movimento, especialmente na fase excêntrica. Evitar queda da pelve. Alinhamento do joelho com o pé.","material":"Faixa elástica + step","obs":"Melhora o padrão de movimento antes de aumentar a carga no tendão. Progressão: mais resistência ou amplitude.","defaultSeries":"3–4","defaultReps":"8–12","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,glúteo médio,excêntrico","foto":"","video":"https://youtu.be/DV9ZeznSvxY"},
{"id":"tp12","nome":"Agachamento Unipodal (Pistol) com Elástico","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Progressão Unilateral com Assistência Elástica","descricao":"O elástico na fossa poplítea facilita a organização do movimento no agachamento unipodal, permitindo maior ativação do quadríceps com controle mais eficiente na descida — marca a transição para padrões mais funcionais.","execucao":"1. Apoio unipodal, elástico na região da fossa poplítea.\n2. Realize o agachamento unilateral (pistol), controlando a descida.\n3. Tronco levemente inclinado à frente, abdômen ativo.\n4. Garanta alinhamento do joelho durante todo o movimento.\n5. Retorne de forma controlada.","beneficios":"Aumenta a capacidade de carga do tendão patelar, desenvolve controle excêntrico do quadríceps e melhora a estabilidade unilateral.","cuidados":"Priorizar controle na fase excêntrica. Evitar colapso medial do joelho. Dor leve e tolerável (até EVA 3) é aceitável.","material":"Faixa elástica","obs":"Progressão: aumentar amplitude ou reduzir assistência do elástico.","defaultSeries":"3","defaultReps":"10","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,pistol,unilateral,elástico","foto":"","video":"https://youtu.be/NOuTAIQPgLU"},
{"id":"tp13","nome":"Resposta à Carga em Afundo com Resistência Elástica","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Absorção de Carga em Vetor Horizontal","descricao":"Trabalha o vetor horizontal (diferente do agachamento vertical), exigindo controle excêntrico na projeção à frente e capacidade de frear o corpo — reproduz a resposta à carga da marcha e da corrida.","execucao":"1. Base de afundo, pé de trás apoiado em step ou caixa.\n2. Elástico fixado posteriormente na pelve, puxando o corpo para frente.\n3. Realize a projeção à frente, controlando a descida.\n4. Retorne à posição inicial de forma ativa e controlada.\n5. Mantenha o movimento contínuo, simulando a resposta à carga da marcha.","beneficios":"Melhora a capacidade de absorção de carga do tendão patelar, desenvolve controle excêntrico do quadríceps e prepara para padrões funcionais.","cuidados":"Iniciar sem elástico e progredir conforme tolerância. Controlar a fase excêntrica. Joelho alinhado com o pé, sem inclinação excessiva do tronco.","material":"Faixa elástica + step","obs":"Progressão: aumentar resistência ou velocidade do movimento.","defaultSeries":"3–4","defaultReps":"12–15","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,resposta à carga,afundo","foto":"","video":"https://youtu.be/TvjMGfxA3xI"},
{"id":"tp14","nome":"Desaceleração com Rotação de Quadril","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Desaceleração Tridimensional com Componente Rotacional","descricao":"Adiciona rotação ao movimento de desaceleração, exigindo controle excêntrico do quadríceps, ativação do glúteo para controle pélvico e estabilidade do joelho durante mudança de vetor.","execucao":"1. Base de afundo, pé de trás apoiado em um step.\n2. Elástico fixado na pelve, tração diagonal para frente e para baixo.\n3. Realize rotação de tronco e pelve em direção à perna de apoio.\n4. Controle o movimento, mantendo estabilidade do joelho e do quadril.\n5. Retorne de forma controlada e repita.","beneficios":"Desenvolve controle excêntrico do quadríceps, melhora ativação do glúteo na desaceleração e prepara para demandas rotacionais.","cuidados":"Controle excêntrico durante a rotação. Alinhamento do joelho com o pé, evitando colapso medial. Vetor do elástico em diagonal.","material":"Faixa elástica + step","obs":"Progressão: aumentar resistência ou velocidade do movimento.","defaultSeries":"3–4","defaultReps":"8–12","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,desaceleração,rotação","foto":"","video":"https://youtu.be/IVyztaFFQuU"},
{"id":"tp15","nome":"Excêntrico de Quadríceps — Pistol na Rampa","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Sobrecarga Excêntrica em Declive","descricao":"A rampa aumenta a exigência (não facilita): permite maior avanço do joelho, aumenta o momento de força sobre o quadríceps e exige maior controle excêntrico na descida — estímulo importante de adaptação do tendão.","execucao":"1. Apoio unipodal sobre uma rampa, com inclinação para frente.\n2. Realize o agachamento unilateral (pistol), controlando a descida.\n3. Permita avanço do joelho à frente, mantendo o calcâneo apoiado.\n4. Tronco levemente inclinado à frente, abdômen ativo.\n5. Retorne de forma controlada.","beneficios":"Aumenta a capacidade de carga do tendão patelar na fase excêntrica, desenvolve controle excêntrico do quadríceps e prepara para demandas mais avançadas.","cuidados":"Priorizar controle na fase excêntrica. Permitir avanço do joelho sem perder alinhamento. Evitar valgo dinâmico. Garantir execução sem dor.","material":"Rampa/decline board","obs":"Progressão: aumentar amplitude ou velocidade controlada.","defaultSeries":"3–4","defaultReps":"6–10","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,excêntrico,rampa,pistol","foto":"","video":"https://youtu.be/9V7Ffv0o9yY"},
{"id":"tp16","nome":"Step Down","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Controle Excêntrico + Absorção de Carga Unipodal","descricao":"Exige controle na descida, absorção de carga no membro de apoio e estabilidade do joelho — ensina o paciente a frear o movimento com controle, essencial para a evolução da reabilitação.","execucao":"1. Em pé sobre um step ou caixa baixa, apoio unipodal.\n2. Realize a descida controlada do pé contralateral em direção ao solo.\n3. Leve inclinação do tronco à frente.\n4. Encoste levemente o pé no chão.\n5. Retorne à posição inicial.","beneficios":"Desenvolve controle excêntrico do quadríceps, melhora a estabilidade unilateral e ajusta progressivamente a carga no tendão.","cuidados":"Priorizar controle na descida, evitar valgo dinâmico. Não 'cair' no movimento. Monitorar dor 24h depois — se EVA > 4, reduzir carga.","material":"Step ou caixa baixa","obs":"Se sem piora, progredir volume ou intensidade.","defaultSeries":"3–4","defaultReps":"8–12","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,step down,excêntrico","foto":"","video":"https://youtu.be/J2b3pEVyEb0"},
{"id":"tp17","nome":"Step Down com Resistência Elástica","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Controle Excêntrico + Resistência ao Valgo","descricao":"O elástico na altura do joelho cria um vetor que tende ao valgo, aumentando a demanda de ativação do quadríceps e do glúteo médio para manter a estabilidade do joelho durante a descida.","execucao":"1. Em pé sobre um step ou caixa baixa, apoio unipodal.\n2. Elástico fixado na altura do joelho da perna de apoio.\n3. Realize a descida controlada do pé contralateral em direção ao solo.\n4. Leve inclinação do tronco à frente.\n5. Retorne à posição inicial de forma controlada.","beneficios":"Desenvolve controle excêntrico do quadríceps, melhora estabilidade unilateral e aumenta progressivamente a carga no tendão patelar.","cuidados":"Resistir à tendência de valgo gerada pelo elástico. Tronco estável. Evitar descida rápida. Monitorar dor 24h depois — se EVA > 4, reduzir carga.","material":"Faixa elástica + step","obs":"Progressão direta do step down simples.","defaultSeries":"3–4","defaultReps":"8–12","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,step down,elástico,valgo","foto":"","video":"https://youtu.be/ljFx1HpQ8ZY"},
{"id":"tp18","nome":"Step Down com Kettlebell","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Controle Excêntrico + Carga Contralateral","descricao":"A carga contralateral em kettlebell desafia a estabilidade e exige maior controle de tronco, aproximando o movimento de demandas mais funcionais.","execucao":"1. Em pé sobre um step ou caixa firme, apoio unipodal.\n2. Segure um kettlebell na mão contrária à perna de apoio.\n3. Realize a descida controlada do pé contralateral em direção ao solo.\n4. Leve inclinação do tronco à frente.\n5. Retorne à posição inicial usando a perna de apoio.","beneficios":"Desenvolve controle excêntrico do quadríceps, aumenta a capacidade de carga do tendão patelar e melhora estabilidade do joelho.","cuidados":"Priorizar controle na descida, evitar valgo dinâmico. A perna que toca o solo não deve auxiliar na subida. Controlar a carga contralateral.","material":"Kettlebell + step","obs":"Progressão: aumentar carga.","defaultSeries":"3–4","defaultReps":"8–12","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,step down,kettlebell,carga","foto":"","video":"https://youtu.be/bUGbWuJqDM4"},
{"id":"tp19","nome":"Sentar e Levantar da Caixa (Unilateral)","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Força Funcional Unilateral","descricao":"Exige alta demanda do quadríceps, controle excêntrico na descida, produção de força na subida e estabilidade unilateral — aproxima o paciente de tarefas do dia a dia e do esporte.","execucao":"1. Em frente a uma caixa ou banco firme, apoio unipodal.\n2. Realize o movimento de sentar de forma controlada.\n3. Encoste na caixa e retorne à posição em pé usando a mesma perna.\n4. Mantenha a outra perna em suspensão durante todo o movimento.","beneficios":"Desenvolve força do quadríceps, melhora controle excêntrico/concêntrico e aumenta a capacidade de carga do tendão patelar.","cuidados":"Priorizar controle na descida, evitar valgo dinâmico. Ajustar altura da caixa conforme o nível do paciente. Reduzir instabilidade excessiva pra focar em força.","material":"Caixa ou banco firme","obs":"Progressão: aumentar carga ou reduzir altura do apoio.","defaultSeries":"3–4","defaultReps":"6–10","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,sentar e levantar,unilateral,funcional","foto":"","video":"https://youtu.be/GbRc-p7V6MA"},
{"id":"tp20","nome":"Sentar e Levantar da Caixa com Carga (Unilateral)","grupo":"MMII","nivel":"Intermediário","momento":"Parte Principal","foco":"Força Funcional Unilateral com Sobrecarga Progressiva","descricao":"A adição de carga externa exige maior produção de força do quadríceps e controle excêntrico, contribuindo para melhor organização do tronco e sobrecarga progressiva do tendão.","execucao":"1. Em frente a uma caixa ou banco firme.\n2. Segure uma carga próxima ao tronco (posição anterior).\n3. Apoio unipodal, realize o movimento de sentar de forma controlada.\n4. Encoste na caixa e retorne à posição em pé usando a mesma perna.\n5. Mantenha a outra perna em suspensão durante todo o movimento.","beneficios":"Desenvolve força do quadríceps, aumenta a capacidade de carga do tendão patelar e melhora o controle excêntrico/concêntrico.","cuidados":"Priorizar controle na descida, evitar valgo dinâmico. Ajustar altura da caixa conforme o nível do paciente. Reduzir instabilidade excessiva pra focar em força.","material":"Caixa ou banco firme + carga externa","obs":"Progressão: aumentar carga ou reduzir altura do banco.","defaultSeries":"3–4","defaultReps":"6–10","defaultDescanso":"45s","tags":"tendinopatia_patelar,mmii,sentar e levantar,unilateral,carga","foto":"","video":"https://youtu.be/0eyUtyZRZ3Y"},
{"id":"tp21","nome":"Squat Jump (SJ) no Caixote","grupo":"Funcional","nivel":"Intermediário","momento":"Parte Principal","foco":"Força Concêntrica Explosiva Isolada (sem CAE)","descricao":"Salto vertical sem contramovimento, partindo de posição estática de agachamento — isola a força concêntrica inicial, sem uso do ciclo alongamento-encurtamento. O caixote reduz a altura da queda, diminuindo a sobrecarga na aterrissagem.","execucao":"1. Em pé, de frente para o caixote.\n2. Realize um agachamento, mantendo flexão de quadris e joelhos.\n3. Sem contramovimento, execute um salto vertical explosivo.\n4. Aterrisse sobre o caixote, em flexão controlada dos joelhos para absorver o impacto.","beneficios":"Desenvolve força concêntrica explosiva isolada, reduz a sobrecarga de impacto na aterrissagem e melhora o controle neuromuscular na saída estática.","cuidados":"Partida estática, sem contramovimento. Alinhamento de quadris, joelhos e tornozelos. Aterrissagem suave e silenciosa — usar o barulho como parâmetro de controle.","material":"Caixote","obs":"Ajustar altura do caixote conforme nível de dor e controle motor. Fundamental para pacientes com dor residual.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"tendinopatia_patelar,funcional,salto,squat jump,caixote","foto":"","video":"https://youtu.be/HP68y5aSMWI"},
{"id":"tp22","nome":"Countermovement Jump (CMJ) no Caixote","grupo":"Funcional","nivel":"Intermediário","momento":"Parte Principal","foco":"Potência Reativa com Ciclo Alongamento-Encurtamento","descricao":"Salto vertical com contramovimento rápido antes da propulsão, ativando o CAE e aproveitando a energia elástica acumulada. O caixote reduz a altura da queda, diminuindo a sobrecarga na aterrissagem.","execucao":"1. Em pé, de frente para o caixote.\n2. Realize um contramovimento rápido, descendo em flexão de quadris e joelhos.\n3. Imediatamente após a descida, execute extensão explosiva para saltar sobre o caixote.\n4. Aterrisse suavemente em flexão, absorvendo o impacto de forma controlada.","beneficios":"Desenvolve potência reativa utilizando o CAE, treina a transição rápida entre fase excêntrica e concêntrica.","cuidados":"Contramovimento rápido e contínuo, sem pausas. Alinhamento de quadris, joelhos e tornozelos, evitando valgo dinâmico. Aterrissagem suave e silenciosa.","material":"Caixote","obs":"Ajustar altura do caixote conforme nível de dor e controle motor.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"tendinopatia_patelar,funcional,salto,cmj,caixote","foto":"","video":"https://youtu.be/YSQxgKSqBQI"},
{"id":"tp23","nome":"Salto Vertical com Duplo Contato no Caixote","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Força Reativa em Contato Preparatório + CAE","descricao":"Combina um primeiro contato curto (saltinho preparatório) com o salto principal, aproveitando o CAE. O contato preparatório exige tempo mínimo no solo e resposta neuromuscular rápida antes da propulsão principal.","execucao":"1. Em pé no chão, de frente para o caixote.\n2. Realize um salto curto inicial, rápido e de baixa amplitude, com tempo de contato mínimo.\n3. Imediatamente, execute o salto principal, projetando-se verticalmente sobre o caixote.\n4. Finalize com aterrissagem controlada em cima do caixote.","beneficios":"Desenvolve força reativa no contato preparatório e treina o aproveitamento do CAE na transição entre os dois saltos.","cuidados":"Saltinho inicial curto, sem perder a técnica. Alinhamento de quadris, joelhos e tornozelos, evitando valgo. Aterrissagem suave e silenciosa.","material":"Caixote","obs":"Ajustar altura do caixote conforme nível de dor e controle motor.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"tendinopatia_patelar,funcional,salto,duplo contato,caixote","foto":"","video":"https://youtu.be/2hkEXj0MiyM"},
{"id":"tp24","nome":"Drop Jump com Carga Externa","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Força Reativa sob Sobrecarga Externa","descricao":"Queda de altura pré-determinada seguida de salto explosivo imediato, com carga externa junto ao tronco aumentando a exigência de absorção de impacto e resposta rápida.","execucao":"1. Em pé sobre um caixote/step, segurando a carga junto ao corpo.\n2. Realize a descida em queda livre, deixando o corpo cair naturalmente até o solo.\n3. Ao tocar o chão, faça contato curto e reativo, executando de imediato um salto vertical explosivo.\n4. Aterrisse de forma controlada, com flexão de quadril e joelhos.","beneficios":"Desenvolve força reativa sob sobrecarga externa, melhora a resposta rápida após impacto e aumenta a tolerância excêntrica de quadríceps e glúteos.","cuidados":"Tronco alinhado, sem projeção excessiva à frente. Tempo de contato o mais curto possível. Alinhamento quadril-joelho-tornozelo, prevenindo colapso medial.","material":"Caixote + carga externa","obs":"Ajustar altura do caixote e carga progressivamente conforme evolução do paciente.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"tendinopatia_patelar,funcional,salto,drop jump,carga,avançado","foto":"","video":"https://youtu.be/INWiS0kRTvw"},
{"id":"tp25","nome":"Squat Jump (SJ) Vertical","grupo":"Funcional","nivel":"Intermediário","momento":"Parte Principal","foco":"Força Explosiva sem Contramovimento (no solo)","descricao":"Salto vertical partindo da posição de agachamento sem contramovimento, isolando a força concêntrica pura — funciona como parâmetro clínico de recrutamento muscular rápido, base antes de progredir para CMJ ou drop jump.","execucao":"1. Em pé, no chão.\n2. Realize um agachamento até a posição adequada, tronco levemente inclinado.\n3. A partir da posição estática, execute um salto vertical explosivo, sem saltinho ou balanço prévio.\n4. Retorne ao solo com aterrissagem controlada.","beneficios":"Desenvolve força concêntrica inicial isolada, treina o recrutamento muscular rápido e serve como parâmetro de avaliação da força explosiva pura.","cuidados":"Saída estática, sem impulso inicial. Abdômen ativo, tronco estável. Alinhamento de quadris, joelhos e tornozelos. Aterrissagem suave e silenciosa.","material":"Nenhum","obs":"Progredir para CMJ ou drop jump só com boa técnica de saída e aterrissagem consolidada.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"tendinopatia_patelar,funcional,salto,squat jump,vertical","foto":"","video":"https://youtu.be/zZ-ZqmM3M-Q"},
{"id":"tp26","nome":"Countermovement Jump (CMJ) Vertical","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Potência e Força Reativa via CAE (Bipodal)","descricao":"Utiliza o ciclo alongamento-encurtamento: um contramovimento rápido antes do salto gera acúmulo de energia elástica, permitindo salto mais alto e potente — também funciona como teste de força reativa.","execucao":"1. Em pé, inicie com flexão rápida de quadril e joelhos (descida).\n2. Realize extensão explosiva de quadril, joelhos e tornozelos, projetando o corpo verticalmente.\n3. Movimento contínuo, sem pausas, aproveitando o CAE.\n4. Aterrisse de forma controlada, flexionando quadril e joelhos.","beneficios":"Desenvolve potência muscular via CAE, treina a transição rápida entre fases excêntrica e concêntrica, com transferência para saltos e gestos esportivos.","cuidados":"Contramovimento rápido e curto. Tronco estável, sem inclinação excessiva. Aterrissar com ambos os pés simultaneamente, evitando sobrecarga unilateral.","material":"Nenhum","obs":"Base para progressão a variações unipodais ou com carga.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"tendinopatia_patelar,funcional,salto,cmj,vertical","foto":"","video":"https://youtu.be/vGb9f0lUU8I"},
{"id":"tp27","nome":"Salto Vertical com Duplo Contato","grupo":"Funcional","nivel":"Intermediário","momento":"Parte Principal","foco":"Força Reativa em Saltos Consecutivos","descricao":"Combina dois saltos verticais consecutivos com mínimo tempo de contato entre eles, aproveitando a energia elástica acumulada no primeiro salto para potencializar o segundo — treina rigidez reativa de tornozelo e joelho.","execucao":"1. Em pé, realize um primeiro salto vertical.\n2. Ao tocar o solo, mantenha contato curto e rápido.\n3. Execute imediatamente o segundo salto.\n4. Retorne ao solo absorvendo o impacto de forma controlada.","beneficios":"Desenvolve força reativa através de saltos consecutivos, reduz o tempo de contato com o solo e melhora a rigidez reativa de tornozelo e joelho.","cuidados":"Contato com o solo o mais curto possível entre os saltos. Evitar valgo de joelho na aterrissagem. Reforçar controle do core.","material":"Nenhum","obs":"Boa transferência para gestos esportivos de saltos repetidos e mudanças de direção.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"tendinopatia_patelar,funcional,salto,duplo contato,vertical","foto":"","video":"https://youtu.be/eU-iErxYlCk"},
{"id":"tp28","nome":"Drop Jump","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Força Reativa a partir de Queda Controlada","descricao":"Salto pliométrico em que o paciente cai naturalmente de uma plataforma e, ao tocar o solo, executa imediatamente um salto explosivo — a queda gerada pela altura aumenta a demanda de controle excêntrico em relação ao CMJ.","execucao":"1. Em pé sobre uma caixa/plataforma.\n2. Deixe o corpo cair, sem salto inicial, apenas permitindo a queda natural até o solo.\n3. Ao tocar o chão, execute imediatamente o salto vertical explosivo.\n4. Aterrissagem final controlada, com flexão de quadris e joelhos.","beneficios":"Desenvolve força reativa a partir de queda controlada, otimiza o uso do CAE e melhora a resposta rápida de tornozelos e joelhos.","cuidados":"Quadris, joelhos e tornozelos alinhados durante aterrissagem e salto. Evitar contato prolongado com o solo. Tronco neutro e estável.","material":"Caixa/plataforma","obs":"Ajustar altura da plataforma conforme nível de controle motor.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"tendinopatia_patelar,funcional,salto,drop jump,avançado","foto":"","video":"https://youtu.be/CnQvkDQowLo"},
{"id":"tp29","nome":"Squat Jump (SJ) Vertical com Carga Externa","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Força Concêntrica sob Sobrecarga (sem CAE)","descricao":"Progressão do SJ sem carga: parte de semiagachamento estático com sobrecarga externa junto ao tronco, exigindo maior produção de força concêntrica inicial sem o auxílio do CAE.","execucao":"1. Semiagachamento estático (joelhos e quadris flexionados), segurando a carga externa junto ao tronco.\n2. A partir dessa posição parada, realize extensão rápida e explosiva de quadris, joelhos e tornozelos.\n3. Aterrisse de forma controlada, retornando ao semiagachamento.\n4. Repita o ciclo.","beneficios":"Desenvolve força concêntrica inicial sob sobrecarga, treina a potência de saída sem auxílio do CAE e melhora o controle neuromuscular sob carga.","cuidados":"Evitar inclinação excessiva do tronco e compensações lombares. Abdômen ativo, joelhos alinhados. Progredir carga só com técnica consistente.","material":"Carga externa (halteres, colete)","obs":"Indicado apenas quando o paciente já tem boa técnica no SJ sem carga.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"tendinopatia_patelar,funcional,salto,squat jump,carga,avançado","foto":"","video":"https://youtu.be/npBdJfQWRGk"},
{"id":"tp30","nome":"Countermovement Jump (CMJ) Vertical com Carga Externa","grupo":"Funcional","nivel":"Avançado","momento":"Parte Principal","foco":"Potência Reativa sob Sobrecarga (Bipodal)","descricao":"Progressão do CMJ sem carga: a sobrecarga junto ao tronco aumenta a exigência muscular e neuromuscular, potencializando o treino de potência reativa sob maior demanda.","execucao":"1. Em posição ereta, segurando a carga externa junto ao tronco.\n2. Realize uma descida rápida (flexão de quadris e joelhos) seguida imediatamente de salto vertical explosivo.\n3. Aproveite o contramovimento.\n4. Aterrisse de forma controlada, flexionando quadris e joelhos.","beneficios":"Desenvolve força reativa sob sobrecarga externa, otimiza o aproveitamento do CAE com carga adicional e melhora a eficiência mecânica.","cuidados":"Descida curta e rápida para otimizar o aproveitamento elástico. Tempo de contato mínimo no retorno. Monitorar alinhamento do joelho, evitando valgo.","material":"Carga externa (halteres, colete)","obs":"Progressão de carga só com técnica consistente de contramovimento e aterrissagem.","defaultSeries":"3","defaultReps":"12–15","defaultDescanso":"60s","tags":"tendinopatia_patelar,funcional,salto,cmj,carga,avançado","foto":"","video":"https://youtu.be/HBvoN7mvyvs"},
{"id":"lc01","nome":"Caminhada Passando por Cima do Obstáculo","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Coordenação Motora e Equilíbrio Dinâmico na Marcha","descricao":"Desenvolve coordenação motora, equilíbrio dinâmico e controle da marcha através da transposição de obstáculos baixos.","execucao":"1. Posicione obstáculos baixos (ex: barras, cones deitados) em linha.\n2. Caminhe elevando os pés o suficiente para ultrapassar cada obstáculo.\n3. Mantenha postura ereta, movimento lento e controlado.\n4. Continue pela sequência completa de obstáculos.","beneficios":"Melhora a coordenação motora, aumenta o equilíbrio dinâmico, reduz o risco de quedas e melhora a marcha.","cuidados":"Postura ereta durante toda a caminhada. Elevar os pés o suficiente para não arrastar. Usar apoio quando houver risco de desequilíbrio. Interromper se houver dor ou tontura.","material":"Obstáculos baixos (barras, cones)","obs":"Melhora a autonomia para subir calçadas e transpor pequenos obstáculos no dia a dia.","defaultSeries":"3","defaultReps":"8–12 passagens","defaultDescanso":"45s","tags":"locomoção,equilíbrio,marcha,idoso,obstáculo","foto":"","video":"https://youtu.be/tuIVU3n11dY"},
{"id":"lc02","nome":"Caminhada Lateral com os Calcanhares","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Equilíbrio Lateral e Fortalecimento de Tibial Anterior","descricao":"Desenvolve equilíbrio lateral, fortalece a musculatura da perna e do tornozelo e melhora a estabilidade durante deslocamentos.","execucao":"1. Em pé, eleve as pontas dos pés, apoiando-se apenas nos calcanhares.\n2. Realize passos laterais lentos, mantendo o apoio nos calcanhares.\n3. Joelhos levemente flexionados, tronco estável, sem compensações.\n4. Repita o percurso lateral e retorne.","beneficios":"Fortalece a musculatura anterior da perna, melhora o equilíbrio lateral e a estabilidade do tornozelo, reduz risco de tropeços.","cuidados":"Manter a caminhada sobre os calcanhares o percurso todo. Evitar compensações com o tronco. Passos laterais lentos e controlados. Usar apoio se necessário.","material":"Nenhum","obs":"Melhora a segurança durante deslocamentos e atividades da vida diária.","defaultSeries":"3","defaultReps":"20–30 passos por lado","defaultDescanso":"45s","tags":"locomoção,equilíbrio,marcha,idoso,tibial anterior","foto":"","video":"https://youtu.be/faJoTiG6l9s"},
{"id":"lc03","nome":"Caminhada Lateral Passando por Cima do Obstáculo","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Coordenação e Equilíbrio Lateral em Deslocamento","descricao":"Desenvolve coordenação motora, equilíbrio lateral e estabilidade durante deslocamentos, melhorando o controle corporal em movimentos do dia a dia.","execucao":"1. Posicione obstáculos baixos em linha.\n2. Desloque-se lateralmente, elevando os pés para ultrapassar cada obstáculo, sem cruzar as pernas.\n3. Tronco alinhado, movimento lento e controlado.\n4. Repita a sequência para ambos os lados.","beneficios":"Melhora a coordenação motora lateral, aumenta o equilíbrio dinâmico e fortalece estabilizadores dos membros inferiores.","cuidados":"Tronco alinhado durante todo o exercício. Passadas laterais lentas e controladas. Elevar os pés sem arrastar. Evitar cruzar as pernas. Usar apoio se necessário.","material":"Obstáculos baixos","obs":"Reduz risco de quedas em deslocamentos laterais e melhora a mobilidade funcional.","defaultSeries":"3","defaultReps":"8–12 passagens por lado","defaultDescanso":"45s","tags":"locomoção,equilíbrio,marcha,idoso,obstáculo,lateral","foto":"","video":"https://youtu.be/dX5wc8ECreg"},
{"id":"lc04","nome":"Caminhada com a Ponta do Pé","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Força de Panturrilha e Equilíbrio Dinâmico","descricao":"Desenvolve força da panturrilha, equilíbrio dinâmico e estabilidade da marcha através da caminhada na ponta dos pés.","execucao":"1. Em pé, eleve-se na ponta dos pés.\n2. Caminhe para frente mantendo-se na ponta dos pés, com passos curtos.\n3. Postura ereta, sem oscilações excessivas do tronco.\n4. Percorra a distância determinada.","beneficios":"Fortalece a musculatura da panturrilha, melhora o equilíbrio dinâmico e a estabilidade do tornozelo, aumenta a eficiência da marcha.","cuidados":"Postura ereta durante toda a execução. Permanecer na ponta dos pés o percurso todo. Passos curtos e controlados. Usar apoio se necessário.","material":"Nenhum","obs":"Contribui para uma locomoção mais eficiente e segura, reduzindo risco de quedas.","defaultSeries":"3","defaultReps":"20–30 passos","defaultDescanso":"45s","tags":"locomoção,equilíbrio,marcha,idoso,panturrilha","foto":"","video":"https://youtu.be/ErXBaC7sMDM"},
{"id":"lc05","nome":"Locomoção Frente e Costas","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Equilíbrio Dinâmico e Controle de Mudança de Direção","descricao":"Desenvolve equilíbrio dinâmico, coordenação motora e controle da marcha através de deslocamentos para frente e para trás.","execucao":"1. Caminhe para frente com passos curtos e controlados, postura ereta.\n2. Ao final do percurso, caminhe de costas com o mesmo controle.\n3. Olhar direcionado à frente, evitando inclinar o tronco.\n4. Repita o ciclo ida e volta.","beneficios":"Melhora o equilíbrio dinâmico, a coordenação motora e o controle postural, aumenta a segurança em mudanças de direção.","cuidados":"Postura ereta durante toda a execução. Passos curtos e controlados. Na caminhada para trás, usar apoio ou supervisão. Interromper se houver perda de equilíbrio ou tontura.","material":"Nenhum","obs":"Aumenta a autonomia funcional para mudanças de direção nas atividades da vida diária.","defaultSeries":"3","defaultReps":"8–10 passagens","defaultDescanso":"45s","tags":"locomoção,equilíbrio,marcha,idoso,frente e costas","foto":"","video":"https://youtu.be/27kP1-XQQ14"},
{"id":"lc06","nome":"Locomoção Lateral Vai e Volta","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Equilíbrio Dinâmico e Coordenação Lateral com Mudança de Direção","descricao":"Desenvolve equilíbrio dinâmico, coordenação motora lateral e agilidade através de deslocamentos laterais com mudança de direção.","execucao":"1. Desloque-se lateralmente com passos curtos e controlados, sem cruzar os pés.\n2. Ao alcançar o ponto final, retorne lateralmente na direção oposta.\n3. Tronco alinhado, olhar direcionado à frente.\n4. Repita o ciclo de ida e volta.","beneficios":"Melhora o equilíbrio dinâmico e a coordenação lateral, desenvolve agilidade funcional e fortalece estabilizadores do quadril.","cuidados":"Tronco alinhado durante toda a execução. Passos laterais curtos e controlados. Evitar cruzar os pés. Usar apoio ou supervisão se necessário.","material":"Nenhum","obs":"Melhora a capacidade de mudar de direção com segurança nas atividades do dia a dia.","defaultSeries":"3","defaultReps":"8–10 passagens","defaultDescanso":"45s","tags":"locomoção,equilíbrio,marcha,idoso,lateral","foto":"","video":"https://youtu.be/cgJHVNBStj8"},
{"id":"lc07","nome":"Fortalecimento do Quadril Caminhando","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Força de Flexores de Quadril + Equilíbrio na Marcha","descricao":"Desenvolve força dos flexores do quadril, equilíbrio dinâmico e coordenação motora durante a marcha.","execucao":"1. Caminhe elevando o joelho a cada passo até uma amplitude confortável.\n2. Apoie completamente o pé no solo antes da próxima passada.\n3. Tronco ereto, movimento lento e controlado.\n4. Alterne as pernas ao longo do percurso.","beneficios":"Fortalece os flexores do quadril, melhora a coordenação motora e o equilíbrio dinâmico, aumenta a estabilidade durante a marcha.","cuidados":"Tronco ereto durante toda a execução. Elevar o joelho sem compensações. Apoiar completamente o pé antes da próxima passada. Usar apoio se necessário.","material":"Nenhum","obs":"Aumenta a autonomia para subir degraus e vencer obstáculos no dia a dia.","defaultSeries":"3","defaultReps":"10–12 passagens por perna","defaultDescanso":"45s","tags":"locomoção,equilíbrio,marcha,idoso,quadril","foto":"","video":"https://youtu.be/wfLSJvD70aI"},
{"id":"lc08","nome":"Caminhando de 3 Metros (TUG Funcional)","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Transição Sentar-Caminhar-Sentar (Padrão TUG)","descricao":"Desenvolve força funcional dos membros inferiores, equilíbrio dinâmico e capacidade de transição entre sentar, caminhar e sentar, simulando atividades comuns do dia a dia.","execucao":"1. Sentado em um banco, levante-se de forma controlada.\n2. Caminhe 3 metros em velocidade confortável.\n3. Retorne ao banco e sente-se de forma controlada.\n4. Repita o ciclo completo.","beneficios":"Fortalece membros inferiores, melhora a capacidade de levantar e sentar, aumenta o equilíbrio dinâmico e a autonomia funcional.","cuidados":"Levantar sem impulsionar excessivamente com os braços, quando possível. Postura ereta na caminhada. Sentar de forma controlada, evitando 'despencar'. Usar apoio se necessário.","material":"Banco ou cadeira","obs":"Baseado no padrão funcional do Timed Up and Go (TUG), usado para avaliar mobilidade funcional, equilíbrio e risco de quedas em idosos.","defaultSeries":"3","defaultReps":"6–10 repetições","defaultDescanso":"45–60s","tags":"locomoção,equilíbrio,marcha,idoso,tug,funcional","foto":"","video":"https://youtu.be/WSImmwXFQcY"},
{"id":"lc09","nome":"Deslocamento Lateral","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Coordenação e Equilíbrio Dinâmico Lateral","descricao":"Desenvolve coordenação motora, equilíbrio dinâmico e estabilidade durante deslocamentos laterais, melhorando a capacidade funcional e a segurança na marcha.","execucao":"1. Em pé, desloque-se lateralmente com passos curtos, sem cruzar os pés.\n2. Joelhos levemente flexionados, tronco ereto, olhar à frente.\n3. Percorra a distância determinada em um lado, depois no outro.","beneficios":"Melhora o equilíbrio dinâmico, fortalece estabilizadores do quadril, desenvolve coordenação motora e facilita mudanças de direção no dia a dia.","cuidados":"Tronco ereto durante toda a execução. Passos laterais curtos e controlados. Evitar cruzar os pés. Usar apoio próximo se necessário.","material":"Nenhum","obs":"Promove maior independência funcional e reduz o risco de quedas.","defaultSeries":"3","defaultReps":"10–20 passos por lado","defaultDescanso":"45s","tags":"locomoção,equilíbrio,marcha,idoso,lateral","foto":"","video":"https://youtu.be/keXx0EgpqEc"},
{"id":"lc10","nome":"Caminhada em Linha","grupo":"Equilíbrio","nivel":"Básico","momento":"Parte Principal","foco":"Equilíbrio Dinâmico e Controle Postural na Marcha","descricao":"Desenvolve equilíbrio dinâmico, coordenação motora e estabilidade durante a marcha através da caminhada sobre uma linha reta.","execucao":"1. Marque uma linha reta no chão (fita ou marcação).\n2. Caminhe sobre a linha, apoiando completamente um pé antes de dar o próximo passo.\n3. Olhar direcionado à frente, tronco ereto.\n4. Percorra a distância determinada.","beneficios":"Melhora o equilíbrio dinâmico, desenvolve coordenação motora, aumenta a estabilidade da marcha e o controle postural.","cuidados":"Caminhar sobre a linha ou marcação. Olhar à frente. Apoiar completamente um pé antes do próximo passo. Movimento lento e controlado. Usar apoio se necessário.","material":"Fita adesiva ou marcação no chão","obs":"Facilita a caminhada em diferentes ambientes e promove maior independência nas atividades da vida diária.","defaultSeries":"3","defaultReps":"10–20 passos","defaultDescanso":"45s","tags":"locomoção,equilíbrio,marcha,idoso,linha reta","foto":"","video":"https://youtu.be/E0Js5stYWFE"},
