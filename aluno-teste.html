// ── Pix — geração do payload "Copia e Cola" (BR Code / EMV) ────────────────
const pixAscii = (str, max) => {
  const semAcento = String(str||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const limpo = semAcento.replace(/[^A-Za-z0-9 ]/g,"").trim();
  return max ? limpo.slice(0,max) : limpo;
};
const pixCRC16 = (payload) => {
  let crc = 0xFFFF;
  for(let i=0;i<payload.length;i++){
    crc ^= (payload.charCodeAt(i) << 8);
    for(let j=0;j<8;j++){
      crc = (crc & 0x8000) ? ((crc<<1) ^ 0x1021) & 0xFFFF : (crc<<1) & 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,"0");
};
const pixTLV = (id, value) => id + String(value).length.toString().padStart(2,"0") + value;
const buildPixPayload = ({pixKey, merchantName, merchantCity, amount, txid}) => {
  if(!pixKey) return null;
  const gui = pixTLV("00","br.gov.bcb.pix");
  const key = pixTLV("01", pixKey);
  const merchantAccountInfo = pixTLV("26", gui+key);
  const mcc = pixTLV("52","0000");
  const currency = pixTLV("53","986");
  const amountField = amount ? pixTLV("54", Number(amount).toFixed(2)) : "";
  const country = pixTLV("58","BR");
  const name = pixTLV("59", pixAscii(merchantName,25) || "LONGEVUS");
  const city = pixTLV("60", pixAscii(merchantCity,15) || "BRASIL");
  const txidClean = pixAscii(txid,25).replace(/\s/g,"") || "***";
  const addData = pixTLV("62", pixTLV("05", txidClean));
  const semCRC = pixTLV("00","01") + merchantAccountInfo + mcc + currency + amountField + country + name + city + addData + "6304";
  return semCRC + pixCRC16(semCRC);
};

};

const classifyRCQ = (waist, hip, sex) => {
  const w = parseFloat(waist), h = parseFloat(hip);
  if (!w || !h) return null;
  const rcq = (w/h).toFixed(2);
  const isMale = sex === "M";
  let label, desc, color, bg;
  if (isMale) {
    if (w/h < 0.90) { label="Baixo Risco"; desc="RCQ "+rcq+" — distribuição de gordura sem risco cardiovascular aumentado."; color="#16a34a"; bg="#dcfce7"; }
    else if (w/h < 1.00) { label="Risco Moderado"; desc="RCQ "+rcq+" — risco cardiovascular moderado."; color="#d97706"; bg="#fef9c3"; }
    else { label="Risco Alto"; desc="RCQ "+rcq+" — distribuição androide de gordura com risco cardiovascular elevado."; color="#dc2626"; bg="#fee2e2"; }
  } else {
    if (w/h < 0.80) { label="Baixo Risco"; desc="RCQ "+rcq+" — distribuição de gordura sem risco cardiovascular aumentado."; color="#16a34a"; bg="#dcfce7"; }
    else if (w/h < 0.85) { label="Risco Moderado"; desc="RCQ "+rcq+" — risco cardiovascular moderado."; color="#d97706"; bg="#fef9c3"; }
    else { label="Risco Alto"; desc="RCQ "+rcq+" — distribuição androide de gordura com risco cardiovascular elevado."; color="#dc2626"; bg="#fee2e2"; }
  }
  return { label, desc, color, bg, rcq };
};

const classifyDualTask = (single, dual) => {

  const cost = Math.round(((d-s)/s)*100);
  if (cost < 0) return { cost: Math.abs(cost), label:"Sem custo (melhora)", desc:"Desempenho igual ou superior com dupla tarefa. Excelente controle cognitivo-motor.", impact:"Consegue realizar tarefas simultâneas no dia a dia (como caminhar e conversar) sem perda de equilíbrio ou atenção.", color:"#16a34a", bg:"#dcfce7" };

  if (cost < 20) return { cost, label:"Custo Moderado (10–20%)", desc:"Atenção dividida comprometida.", impact:"Pode ter dificuldade em situações que exigem atenção dividida, como caminhar enquanto conversa ou carrega objetos.", color:"#d97706", bg:"#fef9c3" };

};

const getYtId = (url) => {
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|v\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);
  return m ? m[1] : null;
};

const toISODate = (d) => {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
};
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
const addMonths = (d, n) => { const r = new Date(d); r.setMonth(r.getMonth()+n); return r; };
const getWeekDates = (d) => { // semana começando na segunda-feira
  const dow = d.getDay(); // 0=domingo..6=sábado
  const diffToMonday = (dow===0 ? -6 : 1-dow);
  const monday = addDays(d, diffToMonday);
  return Array.from({length:7}, (_,i)=>addDays(monday,i));
};
const getMonthDates = (year, month) => {
  const lastDay = new Date(year, month+1, 0).getDate();
  return Array.from({length:lastDay}, (_,i)=>new Date(year, month, i+1));
};

const Login = () => {
  const [mode,setMode]=useState("signin"); // signin | signup | forgot | magic
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [confirm,setConfirm]=useState("");
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const [info,setInfo]=useState("");

  const clearMsgs = () => { setErr(""); setInfo(""); };

  const submit = async (e) => {
    e.preventDefault();
    clearMsgs(); setLoading(true);
    try{
      if(mode==="signin"){
        const { error } = await supa.auth.signInWithPassword({ email, password });
        if(error) throw error;
      } else if(mode==="signup"){
        if(password.length<6){ setErr("A senha deve ter pelo menos 6 caracteres."); setLoading(false); return; }
        if(password!==confirm){ setErr("As senhas não coincidem."); setLoading(false); return; }
        const { error } = await supa.auth.signUp({ email, password });
        if(error) throw error;
        setInfo("Conta criada! Você já pode entrar com seu e-mail e senha.");
        setMode("signin");
        setLoading(false);
        return;
      } else if(mode==="forgot"){
        const { error } = await supa.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split("?")[0].split("#")[0] });
        if(error) throw error;
        setInfo("Enviamos um link de redefinição para "+email+". Confira seu e-mail.");
        setLoading(false);
        return;
      } else if(mode==="magic"){
        const { error } = await supa.auth.signInWithOtp({ email, options:{ emailRedirectTo: window.location.href.split("?")[0].split("#")[0] } });
        if(error) throw error;
        setInfo("Link enviado! Confira seu e-mail ("+email+") e toque no link para entrar.");
        setLoading(false);
        return;
      }
    } catch(err){
      setErr(err.message==="Invalid login credentials" ? "E-mail ou senha incorretos." : (err.message || "Erro ao autenticar."));
    } finally {
      setLoading(false);
    }
  };

  const titles = { signin:"Entrar", signup:"Criar minha senha", forgot:"Esqueci minha senha", magic:"Entrar por link no e-mail" };
  const buttonLabels = { signin:"Entrar", signup:"Criar conta", forgot:"Enviar link de redefinição", magic:"Enviar link" };

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"#f8fafc"}}>
      <form onSubmit={submit} style={{width:"100%",maxWidth:380}}>
        <Card style={{padding:"32px 26px",textAlign:"center"}}>
          <img src={__LOGO_ALUNO__} alt="Wellington Brito" style={{width:150,height:"auto",objectFit:"contain",marginBottom:10}}/>
          <div style={{fontSize:19,fontWeight:800,marginBottom:6}}>{titles[mode]}</div>
          <div style={{fontSize:13,color:"#64748b",marginBottom:20,lineHeight:1.5,textAlign:"left"}}>
            {mode==="signin" && "Use o mesmo e-mail que seu personal cadastrou pra você."}
            {mode==="signup" && "Primeira vez aqui? Crie sua senha usando o e-mail que seu personal cadastrou."}
            {mode==="forgot" && "Digite seu e-mail e enviaremos um link pra você criar uma nova senha."}
            {mode==="magic" && "Prefere não usar senha? Digite seu e-mail e enviaremos um link de acesso direto."}
          </div>

          <div style={{textAlign:"left",marginBottom:12}}>
            <label style={{fontSize:11,fontWeight:700,color:"#475569",display:"block",marginBottom:5}}>E-mail</label>
            <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder="seuemail@exemplo.com" style={{width:"100%",padding:"11px 13px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:14,fontFamily:"inherit",boxSizing:"border-box"}}/>
          </div>

          {(mode==="signin"||mode==="signup") && (
            <div style={{textAlign:"left",marginBottom:mode==="signup"?12:6}}>
              <label style={{fontSize:11,fontWeight:700,color:"#475569",display:"block",marginBottom:5}}>Senha</label>
              <input type="password" required value={password} onChange={e=>setPassword(e.target.value)} style={{width:"100%",padding:"11px 13px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:14,fontFamily:"inherit",boxSizing:"border-box"}}/>
            </div>
          )}
          {mode==="signup" && (
            <div style={{textAlign:"left",marginBottom:16}}>
              <label style={{fontSize:11,fontWeight:700,color:"#475569",display:"block",marginBottom:5}}>Confirmar senha</label>
              <input type="password" required value={confirm} onChange={e=>setConfirm(e.target.value)} style={{width:"100%",padding:"11px 13px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:14,fontFamily:"inherit",boxSizing:"border-box"}}/>
            </div>
          )}
          {mode==="signin" && (
            <div style={{textAlign:"right",marginBottom:16}}>
              <a href="#" onClick={e=>{e.preventDefault();setMode("forgot");clearMsgs();}} style={{fontSize:12,color:"#94a3b8"}}>Esqueci minha senha</a>
            </div>
          )}

          {err && <div style={{color:"#dc2626",fontSize:12,marginBottom:12,textAlign:"left"}}>{err}</div>}
          {info && <div style={{background:"#f0fdf4",border:"1.5px solid #bbf7d0",borderRadius:10,padding:"10px 12px",fontSize:13,color:"#15803d",lineHeight:1.5,marginBottom:12,textAlign:"left",display:"flex",alignItems:"flex-start",gap:8}}><Icon name="check" size={16} style={{marginTop:2,flexShrink:0}}/><span>{info}</span></div>}

          <Btn full type="submit" disabled={loading}>{loading?"Aguarde...":buttonLabels[mode]}</Btn>

          <div style={{marginTop:16,fontSize:12,color:"#94a3b8",lineHeight:2}}>
            {mode==="signin" && (<>Primeiro acesso? <a href="#" onClick={e=>{e.preventDefault();setMode("signup");clearMsgs();}} style={{color:"#FF5603",fontWeight:700}}>Criar minha senha</a></>)}
            {mode!=="signin" && (<>Já tem senha? <a href="#" onClick={e=>{e.preventDefault();setMode("signin");clearMsgs();}} style={{color:"#FF5603",fontWeight:700}}>Entrar</a></>)}
          </div>
        </Card>
      </form>
    </div>
  );
};

const ResetPassword = ({onDone}) => {
  const [password,setPassword]=useState("");
  const [confirm,setConfirm]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setErr("");
    if(password.length<6){ setErr("A senha deve ter pelo menos 6 caracteres."); return; }
    if(password!==confirm){ setErr("As senhas não coincidem."); return; }
    setLoading(true);
    try{
      const { error } = await supa.auth.updateUser({ password });
      if(error) throw error;
      onDone();
    } catch(err){
      setErr(err.message || "Erro ao redefinir senha.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"#f8fafc"}}>
      <form onSubmit={submit} style={{width:"100%",maxWidth:380}}>
        <Card style={{padding:"32px 26px",textAlign:"center"}}>
          <img src={__LOGO_ALUNO__} alt="Wellington Brito" style={{width:70,height:"auto",objectFit:"contain",marginBottom:8}}/>
          <div style={{fontSize:19,fontWeight:800,marginBottom:20}}>Definir nova senha</div>
          <div style={{textAlign:"left",marginBottom:12}}>
            <label style={{fontSize:11,fontWeight:700,color:"#475569",display:"block",marginBottom:5}}>Nova senha</label>
            <input type="password" required value={password} onChange={e=>setPassword(e.target.value)} style={{width:"100%",padding:"11px 13px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:14,fontFamily:"inherit",boxSizing:"border-box"}}/>
          </div>
          <div style={{textAlign:"left",marginBottom:16}}>
            <label style={{fontSize:11,fontWeight:700,color:"#475569",display:"block",marginBottom:5}}>Confirmar nova senha</label>
            <input type="password" required value={confirm} onChange={e=>setConfirm(e.target.value)} style={{width:"100%",padding:"11px 13px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:14,fontFamily:"inherit",boxSizing:"border-box"}}/>
          </div>
          {err && <div style={{color:"#dc2626",fontSize:12,marginBottom:12,textAlign:"left"}}>{err}</div>}
          <Btn full type="submit" disabled={loading}>{loading?"Salvando...":"Salvar nova senha"}</Btn>
        </Card>
      </form>
    </div>
  );
};

// ── Exercício individual (com check-off) ─────────────────────────────────────
const ExercicioItem = ({item, bibCustom, checked, onToggle}) => {
  const [showDetail,setShowDetail]=useState(false);
  const isCog = item.isCognitivo || item.exId==="cognitivo";
  const cogEx = isCog ? COGNITIVOS.find(c=>c.id===item.cogId) : null;
  const ex = !isCog ? (bibCustom.find(e=>e.id===item.exId) || EXERCISES.find(e=>e.id===item.exId)) : null;
  const nome = isCog ? (cogEx?.nome||"Exercício Cognitivo") : (ex?.nome||"Exercício");
  const iconeCustom = !isCog ? ex?.icone : null; // ícone específico cadastrado na biblioteca (mantido)
  const cor = isCog ? (cogEx?.cor||"#FF5603") : "#0f172a";
  const ytId = ex && getYtId(ex.video);
  const hasDetail = !isCog && ex && (ex.descricao || ex.execucao || ex.video || ex.beneficios || ex.cuidados);
  const capaImg = !isCog ? (ytId ? ("https://img.youtube.com/vi/"+ytId+"/hqdefault.jpg") : (ex?.foto || null)) : null;

              <Icon name="note" size={16} color="#475569"/>

        <div style={{padding:"14px 16px"}}>
          <div style={{fontWeight:800,fontSize:16,lineHeight:1.3,color:cor,textDecoration:checked?"line-through":"none",opacity:checked?0.7:1,marginBottom:8}}>{nome}</div>
          <div style={{display:"flex",gap:14,fontSize:12,color:"#94a3b8"}}>

            <span>Reps: <b style={{color:"#475569"}}>{item.reps}</b></span>
            <span>Descanso: <b style={{color:"#475569"}}>{item.descanso}</b></span>

          {item.obs && <div style={{marginTop:10,fontSize:12,color:"#64748b",fontStyle:"italic",padding:"8px 10px",background:"#f8fafc",borderRadius:8,display:"flex",alignItems:"flex-start",gap:6}}><Icon name="note" size={13} style={{marginTop:1,flexShrink:0}}/><span>{item.obs}</span></div>}

      {hasDetail && (
        <button onClick={()=>setShowDetail(true)} style={{marginTop:8,fontSize:11,fontWeight:700,color:"#FF5603",background:"transparent",border:"1.5px solid #FF5603",borderRadius:7,padding:"5px 12px",cursor:"pointer",display:"inline-flex",alignItems:"center",gap:5}}>

      )}
      {showDetail && <ExDetalheModal ex={ex} onClose={()=>setShowDetail(false)}/>}

    <div style={{marginBottom:12,padding:"0 2px"}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:11,fontWeight:700,color:"#c2410c",marginBottom:5,textTransform:"uppercase",letterSpacing:0.3}}>

      <div style={{height:8,background:"#ffe8d5",borderRadius:6,overflow:"hidden"}}>

    <>
      <Card style={{padding:"12px 14px",marginBottom:8,background:concluida?"#f0fdf4":(destaque?"#fff7ed":"#fff"),borderColor:concluida?"#bbf7d0":(destaque?"#fed7aa":"#e2e8f0")}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={()=>onToggle && onToggle(atividade)} style={{width:30,height:30,borderRadius:9,border:concluida?"none":"1.5px solid #cbd5e1",background:concluida?"#16a34a":"#fff",color:"#fff",cursor:onToggle?"pointer":"default",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{concluida && <Icon name="check" size={16}/>}</button>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:700,color:concluida?"#15803d":(destaque?"#9a3412":"#0f172a"),textDecoration:concluida?"line-through":"none",opacity:concluida?0.75:1}}>{atividade.titulo}</div>
            {atividade.obs && <div style={{fontSize:11.5,color:concluida?"#16a34a":(destaque?"#c2410c":"#64748b"),marginTop:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{atividade.obs}</div>}
          </div>
          {atividade.obs && (
            <button onClick={()=>setShowDetail(true)} style={{flexShrink:0,border:"1.5px solid "+(destaque?"#fed7aa":"#e2e8f0"),background:"#fff",borderRadius:8,padding:"6px 10px",fontSize:11,fontWeight:700,color:"#FF5603",cursor:"pointer",whiteSpace:"nowrap"}}>Ver detalhes</button>
          )}

        <Modal title={atividade.titulo} onClose={()=>setShowDetail(false)}>

const NavHeader = ({label, onPrev, onNext}) => (
  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
    <button onClick={onPrev} style={{border:"1.5px solid #e2e8f0",background:"#fff",borderRadius:9,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#475569"}}><Icon name="chevronLeft" size={17}/></button>
    <div style={{fontSize:14,fontWeight:800,color:"#0f172a",textAlign:"center",flex:1,padding:"0 8px"}}>{label}</div>
    <button onClick={onNext} style={{border:"1.5px solid #e2e8f0",background:"#fff",borderRadius:9,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#475569"}}><Icon name="chevronRight" size={17}/></button>
  </div>
);

const EmptyAtividade = ({texto}) => (
  <div style={{textAlign:"center",padding:"28px 10px",color:"#94a3b8",fontSize:13}}>{texto}</div>
);

const DiaView = ({refDate, onPrev, onNext, mapPorData, hojeISO, concluidasMap, onToggleAtividade}) => {
  const iso = toISODate(refDate);
  const lista = mapPorData[iso] || [];
  const isHoje = iso===hojeISO;
  const concluidasCount = lista.filter(a=>!!concluidasMap[a._id]).length;
  const label = (isHoje ? "Hoje · " : "")+DIAS_SEMANA_LONGO[refDate.getDay()]+", "+refDate.getDate()+" de "+MESES_NOME[refDate.getMonth()];
  return (
    <div>
      <NavHeader label={label} onPrev={onPrev} onNext={onNext}/>
      {lista.length>0 && <ProgressoAtividades concluidas={concluidasCount} total={lista.length}/>}
      {lista.length>0 ? lista.map((atv,i)=><AtividadeCard key={atv._id||i} atividade={atv} destaque={isHoje} concluida={!!concluidasMap[atv._id]} onToggle={onToggleAtividade}/>) : <EmptyAtividade texto="Nenhuma atividade extra prevista para este dia."/>}
    </div>
  );
};

const SemanaView = ({refDate, onPrev, onNext, mapPorData, hojeISO, concluidasMap, onToggleAtividade}) => {
  const dias = getWeekDates(refDate);
  const label = dias[0].getDate()+" de "+MESES_NOME[dias[0].getMonth()]+" — "+dias[6].getDate()+" de "+MESES_NOME[dias[6].getMonth()];
  return (
    <div>
      <NavHeader label={label} onPrev={onPrev} onNext={onNext}/>
      {dias.map(d=>{
        const iso = toISODate(d);
        const lista = mapPorData[iso] || [];
        const isHoje = iso===hojeISO;
        return (
          <div key={iso} style={{marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:700,color:isHoje?"#FF5603":"#94a3b8",textTransform:"uppercase",letterSpacing:0.3,marginBottom:4}}>
              {DIAS_SEMANA_CURTO[d.getDay()]} · {d.getDate()}/{d.getMonth()+1}{isHoje?" · hoje":""}
            </div>
            {lista.length>0 ? lista.map((atv,i)=><AtividadeCard key={atv._id||i} atividade={atv} destaque={isHoje} concluida={!!concluidasMap[atv._id]} onToggle={onToggleAtividade}/>) : (
              <div style={{fontSize:12,color:"#cbd5e1",padding:"6px 2px"}}>—</div>
            )}
          </div>
        );
      })}
    </div>
  );
};

const MesView = ({refDate, onPrev, onNext, mapPorData, hojeISO, concluidasMap, onToggleAtividade}) => {
  const dias = getMonthDates(refDate.getFullYear(), refDate.getMonth());
  const diasComAtividade = dias.filter(d=>(mapPorData[toISODate(d)]||[]).length>0);
  const label = MESES_NOME[refDate.getMonth()]+" de "+refDate.getFullYear();
  return (
    <div>
      <NavHeader label={label} onPrev={onPrev} onNext={onNext}/>
      {diasComAtividade.length===0 ? (
        <EmptyAtividade texto="Nenhuma atividade extra prevista neste mês."/>
      ) : diasComAtividade.map(d=>{
        const iso = toISODate(d);
        const lista = mapPorData[iso] || [];
        const isHoje = iso===hojeISO;
        return (
          <div key={iso} style={{marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:700,color:isHoje?"#FF5603":"#94a3b8",textTransform:"uppercase",letterSpacing:0.3,marginBottom:4}}>
              {DIAS_SEMANA_CURTO[d.getDay()]} · {d.getDate()}/{d.getMonth()+1}{isHoje?" · hoje":""}
            </div>
            {lista.map((atv,i)=><AtividadeCard key={atv._id||i} atividade={atv} destaque={isHoje} concluida={!!concluidasMap[atv._id]} onToggle={onToggleAtividade}/>)}
          </div>
        );
      })}
    </div>
  );
};

const TelaProgramacao = ({atividades, concluidasMap, onToggleAtividade}) => {
  const [modo,setModo]=useState("semana"); // dia | semana | mes
  const [refDate,setRefDate]=useState(new Date());

  const mapPorData = {};
  atividades.forEach(a=>{ if(a && a.date){ (mapPorData[a.date] = mapPorData[a.date]||[]).push(a); } });
  const hojeISO = toISODate(new Date());

  return (
    <div style={{padding:"16px 16px 24px"}}>
      <div style={{display:"flex",gap:0,marginBottom:16,background:"#f1f5f9",borderRadius:10,padding:3}}>
        {[["dia","Dia"],["semana","Semana"],["mes","Mês"]].map(([k,label])=>(
          <button key={k} onClick={()=>setModo(k)} style={{flex:1,border:"none",borderRadius:8,padding:"8px 4px",fontSize:12,fontWeight:700,cursor:"pointer",background:modo===k?"#fff":"transparent",color:modo===k?"#FF5603":"#94a3b8",boxShadow:modo===k?"0 1px 3px rgba(15,23,42,0.08)":"none",transition:"box-shadow 0.15s"}}>{label}</button>
        ))}
      </div>

      {modo==="dia" && <DiaView refDate={refDate} onPrev={()=>setRefDate(addDays(refDate,-1))} onNext={()=>setRefDate(addDays(refDate,1))} mapPorData={mapPorData} hojeISO={hojeISO} concluidasMap={concluidasMap} onToggleAtividade={onToggleAtividade}/>}
      {modo==="semana" && <SemanaView refDate={refDate} onPrev={()=>setRefDate(addDays(refDate,-7))} onNext={()=>setRefDate(addDays(refDate,7))} mapPorData={mapPorData} hojeISO={hojeISO} concluidasMap={concluidasMap} onToggleAtividade={onToggleAtividade}/>}
      {modo==="mes" && <MesView refDate={refDate} onPrev={()=>setRefDate(addMonths(refDate,-1))} onNext={()=>setRefDate(addMonths(refDate,1))} mapPorData={mapPorData} hojeISO={hojeISO} concluidasMap={concluidasMap} onToggleAtividade={onToggleAtividade}/>}
    </div>
  );
};

const RelatorioAvaliacao = ({assessment: a, studentData: st}) => {
  if (!a || !st) return null;
  const sex = st.sex || "";
  const modAtivos = a.modAtivos || {questionarios:true,fisico:true,cognitivo:true};

            {[["Equilíbrio (SPPB)", a.physical?.sppbBalanceScore!==undefined?String(a.physical.sppbBalanceScore):null, classifySPPBBalanceScore, "pts"],

          {a.cognitiveData.mmse?.total && <div><div style={{fontSize:12,fontWeight:700,color:"#475569",marginBottom:3}}>MMSE — Triagem Cognitiva ({a.cognitiveData.mmse.total}/30):</div><TestResult cl={classifyMMSE(a.cognitiveData.mmse.total)}/></div>}
          {a.cognitiveData.dualTask?.single && a.cognitiveData.dualTask?.dual && <div><div style={{fontSize:12,fontWeight:700,color:"#475569",marginBottom:3}}>Dual Task (atenção dividida):</div><TestResult cl={classifyDualTask(a.cognitiveData.dualTask.single,a.cognitiveData.dualTask.dual)}/></div>}
          {a.cognitiveData.verbalFluency?.score && <div><div style={{fontSize:12,fontWeight:700,color:"#475569",marginBottom:3}}>Fluência Verbal ({a.cognitiveData.verbalFluency.score} palavras):</div><TestResult cl={classifyVerbalFluency(a.cognitiveData.verbalFluency.score)}/></div>}
          {a.cognitiveData.digitSpan?.direct && <div><div style={{fontSize:12,fontWeight:700,color:"#475569",marginBottom:3}}>Span de Dígitos:</div><TestResult cl={classifyDigitSpan(a.cognitiveData.digitSpan.direct,a.cognitiveData.digitSpan.inverse)}/></div>}
        </>
      )}

      <NarrativaIA text={a.aiTexts?.clinical} title="Observações e Recomendações — Prof. Wellington Brito · CREF 089836-G/SP"/>

      <div style={{borderTop:"1.5px solid #e2e8f0",marginTop:26,paddingTop:14,fontSize:11,color:"#94a3b8",textAlign:"center"}}>

const TelaAvaliacao = ({studentId, studentData}) => {
  const [loading,setLoading]=useState(true);
  const [lista,setLista]=useState([]);
  const [selIdx,setSelIdx]=useState(0);

  useEffect(()=>{
    (async()=>{
      setLoading(true);
      try{
        const { data: sess } = await supa.auth.getSession();
        const token = sess?.session?.access_token || SUPA_KEY;
        const headers = { "apikey": SUPA_KEY, "Authorization": "Bearer "+token };
        const r = await fetch(SUPA_URL+"/rest/v1/assessments?select=data,updated_at&student_id=eq."+encodeURIComponent(studentId)+"&order=updated_at.desc&limit=50", { headers });
        if(r.ok){
          const rows = await r.json();
          const arr = (rows||[]).map(row=>row.data).filter(Boolean).sort((x,y)=>(y.date||"").localeCompare(x.date||""));
          setLista(arr);
        } else { setLista([]); }
      } catch(e){ setLista([]); }
      setSelIdx(0);
      setLoading(false);
    })();
  },[studentId]);

  if(loading){
    return <div style={{padding:"60px 20px",textAlign:"center",color:"#94a3b8",fontSize:14}}>Carregando sua avaliação...</div>;
  }

  if(lista.length===0){
    return (
      <div style={{padding:"20px 16px"}}>
        <Card style={{padding:"32px 20px",textAlign:"center"}}>
          <div style={{width:52,height:52,borderRadius:14,background:"#fff4ee",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px"}}><Icon name="clipboard" size={24} color="#FF5603"/></div>
          <div style={{fontWeight:700,fontSize:15,marginBottom:6}}>Nenhuma avaliação disponível ainda</div>
          <div style={{fontSize:13,color:"#64748b",lineHeight:1.5}}>Assim que seu personal registrar sua avaliação, ela vai aparecer aqui.</div>
        </Card>
      </div>
    );
  }

  return (
    <div style={{padding:"16px 16px 100px"}}>
      <div style={{fontWeight:800,fontSize:20,marginBottom:14}}>Avaliação</div>
      {lista.length>1 && (
        <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:10,marginBottom:6}}>
          {lista.map((a,i)=>(
            <button key={i} onClick={()=>setSelIdx(i)} style={{flexShrink:0,border:"1.5px solid "+(i===selIdx?"#FF5603":"#e2e8f0"),background:i===selIdx?"#fff4ee":"#fff",color:i===selIdx?"#FF5603":"#475569",borderRadius:10,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
              {fmt(a.date)}{i===0?" · mais recente":""}
            </button>
          ))}
        </div>
      )}
      <RelatorioAvaliacao assessment={lista[selIdx]} studentData={studentData}/>
    </div>
  );
};

const MeuTreino = ({studentId, ownerId, studentName, studentData, bibCustom, onLogout}) => {
  const [loading,setLoading]=useState(true);
  const [prog,setProg]=useState(null);
  const [notFound,setNotFound]=useState(false);
  const [blocoIdx,setBlocoIdx]=useState(0);
  const [treinoIdx,setTreinoIdx]=useState(0);
  const [showCheckin,setShowCheckin]=useState(false);
  const [checkin,setCheckin]=useState({esforco:null,energia:null,dor:"nenhuma",obs:""});
  const [checkinSaving,setCheckinSaving]=useState(false);
  const [checkinError,setCheckinError]=useState("");
  // ── Check-in configurável por aluno (professor define no painel: students.data.checkinConfig) ──
  const ccfg = studentData?.checkinConfig || {pre:{},post:{esforco:true,energia:true,dor:true,obs:true}};
  const preFieldsEnabled = ["disposicao","hidratacao","alimentacao","sono","dor","pa","glicemia"].some(k=>ccfg.pre?.[k]);
  const postFieldsEnabled = ["esforco","energia","dor","obs"].some(k=>ccfg.post?.[k]);
  const [preCheckin,setPreCheckin]=useState({disposicao:null,hidratacao:null,alimentacao:null,sono:null,dor:"nenhuma",pas:"",pad:"",fc:"",glicemia:""});
  const [preCheckinChecking,setPreCheckinChecking]=useState(true);
  const [preCheckinDone,setPreCheckinDone]=useState(false);
  const [preCheckinSaving,setPreCheckinSaving]=useState(false);
  const [preCheckinError,setPreCheckinError]=useState("");
  const [autoSet,setAutoSet]=useState(false);
  const [done,setDone]=useState(()=>new Set());
  const [saving,setSaving]=useState(false);
  const [savedToday,setSavedToday]=useState(false);
  const [lastSessions,setLastSessions]=useState([]);
  const [showCelebration,setShowCelebration]=useState(false);
  const [saveError,setSaveError]=useState("");
  const [tab,setTab]=useState("inicio"); // inicio | treino | programacao | avaliacao
  const [atividades,setAtividades]=useState([]);
  const [concluidasMap,setConcluidasMap]=useState({});

  const authedHeaders = async () => {
    const { data: sess } = await supa.auth.getSession();
    const token = sess?.session?.access_token || SUPA_KEY;
    return { "apikey": SUPA_KEY, "Authorization": "Bearer "+token, "Content-Type": "application/json" };
  };

  useEffect(()=>{
    (async()=>{
      try{
        const headers = await authedHeaders();
        const r = await fetch(SUPA_URL+"/rest/v1/programs?select=*&student_id=eq."+encodeURIComponent(studentId)+"&order=updated_at.desc&limit=1", { headers });
        if(r.ok){
          const rows = await r.json();
          if(rows && rows.length>0){
            const p = rows[0].data;
            setProg(p);
          } else {
            setNotFound(true);
          }
        } else {
          setNotFound(true);
        }
        const r2 = await fetch(SUPA_URL+"/rest/v1/sessions?select=data&student_id=eq."+encodeURIComponent(studentId)+"&limit=500", { headers });
        if(r2.ok){
          const rows2 = await r2.json();
          const sessList = (rows2||[]).map(x=>x.data).filter(Boolean);
          sessList.sort((a,b)=>new Date(b.createdAt||b.date||0)-new Date(a.createdAt||a.date||0));
          setLastSessions(sessList);
        }
      } catch(e){ setNotFound(true); }
      setLoading(false);
    })();
  },[studentId]);

  // Busca as atividades extras (Programação da Semana) atribuídas pelo personal
  useEffect(()=>{
    (async()=>{
      let lista = [];
      try{
        const headers = await authedHeaders();
        const r = await fetch(SUPA_URL+"/rest/v1/atividades_extras?select=id,data&student_id=eq."+encodeURIComponent(studentId)+"&limit=500", { headers });
        if(r.ok){
          const rows = await r.json();
          lista = (rows||[]).filter(x=>x && x.data).map(x=>({...x.data, _id: x.id}));
        }
      } catch(e){ /* tabela ainda não existe, RLS bloqueando, ou sem internet — cai no fallback abaixo */ }

      if(lista.length>0){
        setAtividades(lista);
      } else {
        // ⚠️ DEMO — exemplos temporários só pra visualização do layout.
        // Assim que a tabela "atividades_extras" tiver dados reais no Supabase
        // (e a busca acima funcionar), este bloco deixa de ser usado
        // automaticamente. Remover antes de promover este arquivo pra versão final.
        const hojeDemo = toISODate(new Date());
        setAtividades([
          {date: hojeDemo, titulo: "Aula de Spinning", obs: "09h no estúdio", _id: "demo-1"},
          {date: hojeDemo, titulo: "Aula de Natação", obs: "16h na piscina", _id: "demo-2"},
          {date: hojeDemo, titulo: "Alongamento em grupo", obs: "18h no salão", _id: "demo-3"},
        ]);
      }
    })();
  },[studentId]);

  // Busca quais atividades extras já foram marcadas como concluídas pelo aluno
  useEffect(()=>{
    (async()=>{
      try{
        const headers = await authedHeaders();
        const r = await fetch(SUPA_URL+"/rest/v1/atividades_extras_conclusoes?select=id,data&student_id=eq."+encodeURIComponent(studentId)+"&limit=1000", { headers });
        if(r.ok){
          const rows = await r.json();
          const map = {};
          (rows||[]).forEach(x=>{ if(x?.data?.atividadeId) map[x.data.atividadeId] = x.id; });
          setConcluidasMap(map);
        }
      } catch(e){ /* tabela ainda não existe — atividades extras simplesmente aparecem como não concluídas */ }
    })();
  },[studentId]);

  const toggleConcluidaAtividade = async (atividade) => {
    const key = atividade._id;
    if(!key) return;
    const isDemo = typeof key === "string" && key.startsWith("demo-");
    const jaConcluida = !!concluidasMap[key];

    if(isDemo){
      setConcluidasMap(prev=>{
        const next = {...prev};
        if(jaConcluida) delete next[key]; else next[key] = "demo";
        return next;
      });
      return;
    }

    if(jaConcluida){
      const rowId = concluidasMap[key];
      setConcluidasMap(prev=>{ const next={...prev}; delete next[key]; return next; });
      try{
        const headers = await authedHeaders();
        await fetch(SUPA_URL+"/rest/v1/atividades_extras_conclusoes?id=eq."+encodeURIComponent(rowId), { method:"DELETE", headers });
      } catch(e){ /* silencioso */ }
    } else {
      const rowId = uid2();
      setConcluidasMap(prev=>({...prev, [key]: rowId}));
      try{
        const headers = await authedHeaders();
        const body = { id: rowId, data: { atividadeId: key, date: atividade.date }, owner_id: ownerId, student_id: studentId };
        await fetch(SUPA_URL+"/rest/v1/atividades_extras_conclusoes", { method:"POST", headers, body: JSON.stringify(body) });
      } catch(e){ /* silencioso */ }
    }
  };

  // Rotação automática: assim que soubermos o programa E o histórico, escolhe o próximo treino da sequência
  useEffect(()=>{
    if(autoSet || loading || !prog) return;
    const treinosUnicos = [...new Set(prog.divisao?.sequencia || ["A"])];
    if(lastSessions.length>0){
      const ultimo = lastSessions[0];
      const idxUltimo = treinosUnicos.indexOf(ultimo.treinoKey);
      if(idxUltimo !== -1){
        setTreinoIdx((idxUltimo+1) % treinosUnicos.length);
      }
    }
    setAutoSet(true);
  },[prog, lastSessions, autoSet, loading]);

  // Progresso por bloco: quantas sessões concluídas em cada bloco, e quantas são necessárias pra destravar o próximo
  const requiredPerBlock = 6 * (prog?.freq || 3); // 6 semanas por bloco × frequência semanal
  const sessionsPerBlock = (key) => lastSessions.filter(s=>s.blocoKey===key).length;
  let maxUnlockedIdx = 0;
  for(let i=1;i<BLOCOS.length;i++){
    if(sessionsPerBlock(BLOCOS[i-1].key) >= requiredPerBlock) maxUnlockedIdx = i; else break;
  }

  // Assim que soubermos o progresso, abre no bloco atual (o mais avançado já destravado)
  const [blocoAutoSet,setBlocoAutoSet]=useState(false);
  useEffect(()=>{
    if(blocoAutoSet || loading || !prog) return;
    setBlocoIdx(maxUnlockedIdx);
    setBlocoAutoSet(true);
  },[prog, lastSessions, blocoAutoSet, loading]);

  // Qual treino é "o de hoje" segundo a rotação (independente da aba que o aluno está olhando agora)
  const treinosSequencia = prog ? [...new Set(prog.divisao?.sequencia || ["A"])] : [];
  let treinoDeHoje = treinosSequencia[0];
  if(lastSessions.length>0 && treinosSequencia.length>0){
    const idxUltimoGlobal = treinosSequencia.indexOf(lastSessions[0].treinoKey);
    if(idxUltimoGlobal !== -1) treinoDeHoje = treinosSequencia[(idxUltimoGlobal+1)%treinosSequencia.length];
  }

  useEffect(()=>{
    if(!preFieldsEnabled){ setPreCheckinChecking(false); return; }
    (async()=>{
      try{
        const headers = await authedHeaders();
        const today = new Date().toISOString().slice(0,10);
        const r = await fetch(SUPA_URL+"/rest/v1/checkins?select=id&student_id=eq."+encodeURIComponent(studentId)+"&type=eq.pre_treino&data->>date=eq."+today, { headers });
        if(r.ok){ const rows = await r.json(); setPreCheckinDone(rows.length>0); }
      } catch(e){}
      setPreCheckinChecking(false);
    })();
  },[studentId, preFieldsEnabled]);

  if(loading){
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#94a3b8",fontSize:14}}>Carregando seu treino...</div>;
  }

  if(notFound || !prog){
    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"#f8fafc"}}>
        <Card style={{maxWidth:380,width:"100%",padding:"32px 26px",textAlign:"center"}}>
          <div style={{width:56,height:56,borderRadius:16,background:"#fff4ee",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px"}}><Icon name="note" size={26} color="#FF5603"/></div>
          <div style={{fontWeight:700,fontSize:15,marginBottom:8}}>Nenhum treino disponível ainda</div>
          <div style={{fontSize:13,color:"#64748b",marginBottom:20,lineHeight:1.5}}>Seu personal ainda não montou seu programa, ou ele ainda não foi sincronizado. Fale com ele se achar que isso é um engano.</div>
          <Btn variant="secondary" full onClick={onLogout}>Sair</Btn>
        </Card>
      </div>
    );
  }

  const hojeISO = toISODate(new Date());
  const atividadesHoje = atividades.filter(a=>a && a.date===hojeISO);

  const treinosUnicos = [...new Set(prog.divisao?.sequencia || ["A"])];
  const blocoAtivo = BLOCOS[blocoIdx];
  const treinoAtivo = treinosUnicos[treinoIdx] || treinosUnicos[0];
  const td = TREINO_DEFS[treinoAtivo];
  const sessao = ((prog.prescricao||{})[blocoAtivo.key]||{})[treinoAtivo] || {inicial:[],principal:[],final:[]};

  const allKeys = [];
  MOMENTOS.forEach(([mk])=>{ (sessao[mk]||[]).forEach((_,idx)=>allKeys.push(mk+"-"+idx)); });
  const totalCount = allKeys.length;
  const doneCount = allKeys.filter(k=>done.has(k)).length;
  const allDone = totalCount>0 && doneCount===totalCount;

  const toggle = (key) => {
    setDone(prev=>{
      const n = new Set(prev);
      if(n.has(key)) n.delete(key); else n.add(key);
      return n;
    });
    setSavedToday(false);
  };

  // Reseta o check-off ao trocar de bloco ou treino manualmente
  const changeTreino = (i) => { setTreinoIdx(i); setDone(new Set()); setSavedToday(false); };
  const changeBloco = (i) => { if(i>maxUnlockedIdx) return; setBlocoIdx(i); setTreinoIdx(0); setDone(new Set()); setSavedToday(false); };

  const concluirTreino = async () => {
    setSaving(true);
    setSaveError("");
    try{
      const headers = await authedHeaders();
      const today = new Date().toISOString().slice(0,10);
      const data = {
        studentId, programId: prog.id, blocoKey: blocoAtivo.key, treinoKey: treinoAtivo,
        date: today, totalEx: totalCount, completedEx: doneCount,
        source: "aluno_checkin", createdAt: new Date().toISOString()
      };
      const body = { id: uid2(), data, owner_id: ownerId, student_id: studentId };
      const r = await fetch(SUPA_URL+"/rest/v1/sessions", { method:"POST", headers, body: JSON.stringify(body) });
      if(r.ok){
        setSavedToday(true);
        setLastSessions(prev=>[data, ...prev]);
        if(postFieldsEnabled){
          setCheckin({esforco:null,energia:null,dor:"nenhuma",obs:""});
          setCheckinError("");
          setShowCheckin(true);
        } else {
          setShowCelebration(true);
        }
      } else {
        const errText = await r.text();
        setSaveError("Erro ao salvar (HTTP "+r.status+"): "+errText.slice(0,300));
      }
    } catch(e){
      setSaveError("Erro de conexão: "+(e?.message||String(e)));
    }
    setSaving(false);
  };

  const salvarCheckin = async () => {
    setCheckinSaving(true);
    setCheckinError("");
    try{
      const headers = await authedHeaders();
      const today = new Date().toISOString().slice(0,10);
      const data = {
        esforco: checkin.esforco, energia: checkin.energia, dor: checkin.dor, obs: checkin.obs,
        treinoKey: treinoAtivo, blocoKey: blocoAtivo.key, date: today,
        source: "aluno_checkin", createdAt: new Date().toISOString()
      };
      const body = { id: uid2(), owner_id: ownerId, student_id: studentId, type: "pos_treino", data };
      const r = await fetch(SUPA_URL+"/rest/v1/checkins", { method:"POST", headers, body: JSON.stringify(body) });
      if(r.ok){
        setShowCheckin(false);
        setShowCelebration(true);
      } else {
        const errText = await r.text();
        setCheckinError("Erro ao salvar (HTTP "+r.status+"): "+errText.slice(0,300));
      }
    } catch(e){
      setCheckinError("Erro de conexão: "+(e?.message||String(e)));
    }
    setCheckinSaving(false);
  };

  const salvarPreCheckin = async () => {
    setPreCheckinSaving(true);
    setPreCheckinError("");
    try{
      const headers = await authedHeaders();
      const today = new Date().toISOString().slice(0,10);
      const data = { ...preCheckin, date: today, source:"aluno_checkin", createdAt: new Date().toISOString() };
      const body = { id: uid2(), owner_id: ownerId, student_id: studentId, type:"pre_treino", data };
      const r = await fetch(SUPA_URL+"/rest/v1/checkins", { method:"POST", headers, body: JSON.stringify(body) });
      if(r.ok){ setPreCheckinDone(true); }
      else { const errText = await r.text(); setPreCheckinError("Erro ao salvar (HTTP "+r.status+"): "+errText.slice(0,300)); }
    } catch(e){ setPreCheckinError("Erro de conexão: "+(e?.message||String(e))); }
    setPreCheckinSaving(false);
  };

  const showPreCheckinGate = preFieldsEnabled && !preCheckinChecking && !preCheckinDone;

  const firstName = (studentName||"").trim().split(" ")[0] || "";

  return (
    <div style={{minHeight:"100vh",background:"#f8fafc",paddingBottom:88}}>
      <div style={{background:"#fff",borderBottom:"1.5px solid #e2e8f0",padding:"12px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 8px rgba(15,23,42,0.04)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <img src={__LOGO_ALUNO__} alt="Wellington Brito" style={{width:36,height:36,objectFit:"contain",flexShrink:0}}/>
          <span style={{fontSize:14,fontWeight:800,color:"#FF5603",letterSpacing:0.3}}>WELLINGTON BRITO</span>
        </div>
        <button onClick={onLogout} style={{border:"none",background:"transparent",color:"#94a3b8",fontSize:12,cursor:"pointer",textDecoration:"underline"}}>Sair</button>
      </div>

      {tab==="inicio" && (
        <TelaInicio
          firstName={firstName}
          treinoHojeLabel={treinoDeHoje && TREINO_DEFS[treinoDeHoje]?.label}
          atividadesHoje={atividadesHoje}
          concluidasMap={concluidasMap}
          onToggleAtividade={toggleConcluidaAtividade}
          onIrTreino={()=>setTab("treino")}
        />
      )}

      {tab==="programacao" && <TelaProgramacao atividades={atividades} concluidasMap={concluidasMap} onToggleAtividade={toggleConcluidaAtividade}/>}
      {tab==="avaliacao" && <TelaAvaliacao studentId={studentId} studentData={studentData}/>}

      {tab==="treino" && showPreCheckinGate && (
        <div style={{padding:"16px 18px"}}>
          <Card style={{padding:0,overflow:"hidden"}}>
            <div style={{background:"linear-gradient(135deg,#FF5603,#ff8c42)",padding:"18px 16px",display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:40,height:40,borderRadius:10,background:"rgba(255,255,255,0.22)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <Icon name="clipboard" size={20} color="#fff"/>
              </div>
              <div>
                <div style={{fontWeight:800,fontSize:17,color:"#fff"}}>Antes de começar</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,0.9)"}}>Responda rapidinho pra liberar o treino de hoje</div>
              </div>
            </div>
            <div style={{padding:"18px 16px"}}>
            {ccfg.pre?.disposicao && (
            <div style={{marginBottom:20}}>
              <div style={{fontWeight:700,fontSize:13,color:"#475569",marginBottom:10}}>Como você está disposto?</div>
              <div style={{display:"flex",gap:8}}>
                {[{v:1,e:"😣",l:"Exausto"},{v:2,e:"😴",l:"Cansado"},{v:3,e:"😐",l:"Neutro"},{v:4,e:"🙂",l:"Disposto"},{v:5,e:"😁",l:"Animado"}].map(o=>(
                  <button key={o.v} onClick={()=>setPreCheckin(c=>({...c,disposicao:o.v}))} style={{flex:1,padding:"10px 2px",borderRadius:10,border:preCheckin.disposicao===o.v?"1.5px solid #FF5603":"1.5px solid #e2e8f0",background:preCheckin.disposicao===o.v?"#fff4ee":"#fff",cursor:"pointer",textAlign:"center",fontFamily:"inherit"}}>
                    <div style={{fontSize:20}}>{o.e}</div>
                    <div style={{fontSize:8,fontWeight:700,color:preCheckin.disposicao===o.v?"#FF5603":"#94a3b8",marginTop:2}}>{o.l}</div>
                  </button>
                ))}
              </div>
            </div>
            )}
            {ccfg.pre?.hidratacao && (
            <div style={{marginBottom:20}}>
              <div style={{fontWeight:700,fontSize:13,color:"#475569",marginBottom:10}}>Como foi seu consumo de água ontem?</div>
              <div style={{display:"flex",gap:8}}>
                {[{v:1,e:"💧",l:"Muito pouco"},{v:2,e:"💧💧",l:"Pouco"},{v:3,e:"💧💧💧",l:"Regular"},{v:4,e:"💧💧💧💧",l:"Bom"},{v:5,e:"💧💧💧💧💧",l:"Ótimo"}].map(o=>(
                  <button key={o.v} onClick={()=>setPreCheckin(c=>({...c,hidratacao:o.v}))} style={{flex:1,padding:"10px 2px",borderRadius:10,border:preCheckin.hidratacao===o.v?"1.5px solid #3b82f6":"1.5px solid #e2e8f0",background:preCheckin.hidratacao===o.v?"#eff6ff":"#fff",cursor:"pointer",textAlign:"center",fontFamily:"inherit"}}>
                    <div style={{fontSize:9,lineHeight:1}}>{o.e}</div>
                    <div style={{fontSize:9,fontWeight:700,color:preCheckin.hidratacao===o.v?"#3b82f6":"#94a3b8",marginTop:3}}>{o.l}</div>
                  </button>
                ))}
              </div>
            </div>
            )}
            {ccfg.pre?.alimentacao && (
            <div style={{marginBottom:20}}>
              <div style={{fontWeight:700,fontSize:13,color:"#475569",marginBottom:10}}>Como foi sua alimentação hoje?</div>
              <div style={{display:"flex",gap:8}}>
                {[{v:1,e:"🍔",l:"Ruim"},{v:2,e:"🥪",l:"Regular"},{v:3,e:"🥗",l:"Boa"},{v:4,e:"🥦",l:"Ótima"}].map(o=>(
                  <button key={o.v} onClick={()=>setPreCheckin(c=>({...c,alimentacao:o.v}))} style={{flex:1,padding:"10px 2px",borderRadius:10,border:preCheckin.alimentacao===o.v?"1.5px solid #16a34a":"1.5px solid #e2e8f0",background:preCheckin.alimentacao===o.v?"#f0fdf4":"#fff",cursor:"pointer",textAlign:"center",fontFamily:"inherit"}}>
                    <div style={{fontSize:19}}>{o.e}</div>
                    <div style={{fontSize:10,fontWeight:700,color:preCheckin.alimentacao===o.v?"#16a34a":"#94a3b8",marginTop:2}}>{o.l}</div>
                  </button>
                ))}
              </div>
            </div>
            )}
            {ccfg.pre?.sono && (
            <div style={{marginBottom:20}}>
              <div style={{fontWeight:700,fontSize:13,color:"#475569",marginBottom:10}}>Como foi seu sono essa noite?</div>
              <div style={{display:"flex",gap:8}}>
                {[{v:1,e:"🌑",l:"Ruim"},{v:2,e:"🌗",l:"Regular"},{v:3,e:"🌖",l:"Boa"},{v:4,e:"🌕",l:"Ótima"}].map(o=>(
                  <button key={o.v} onClick={()=>setPreCheckin(c=>({...c,sono:o.v}))} style={{flex:1,padding:"10px 2px",borderRadius:10,border:preCheckin.sono===o.v?"1.5px solid #7e22ce":"1.5px solid #e2e8f0",background:preCheckin.sono===o.v?"#fdf4ff":"#fff",cursor:"pointer",textAlign:"center",fontFamily:"inherit"}}>
                    <div style={{fontSize:19}}>{o.e}</div>
                    <div style={{fontSize:10,fontWeight:700,color:preCheckin.sono===o.v?"#7e22ce":"#94a3b8",marginTop:2}}>{o.l}</div>
                  </button>
                ))}
              </div>
            </div>
            )}
            {ccfg.pre?.dor && (
            <div style={{marginBottom:20}}>
              <div style={{fontWeight:700,fontSize:13,color:"#475569",marginBottom:10}}>Dor ou desconforto agora</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {[{v:"nenhuma",e:"😊",l:"Nenhuma"},{v:"leve",e:"😕",l:"Leve"},{v:"moderada",e:"😣",l:"Moderada"},{v:"alta",e:"😖",l:"Alta"}].map(o=>(
                  <button key={o.v} onClick={()=>setPreCheckin(c=>({...c,dor:o.v}))} style={{padding:"8px 12px",borderRadius:9,border:preCheckin.dor===o.v?"none":"1.5px solid #e2e8f0",background:preCheckin.dor===o.v?"#FF5603":"#fff",color:preCheckin.dor===o.v?"#fff":"#475569",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:5}}><span style={{fontSize:15}}>{o.e}</span>{o.l}</button>
                ))}
              </div>
            </div>
            )}
            {ccfg.pre?.pa && (
            <div style={{marginBottom:20}}>
              <div style={{fontWeight:700,fontSize:13,color:"#475569",marginBottom:10}}>❤️ Pressão arterial / FC</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                <input value={preCheckin.pas} onChange={e=>setPreCheckin(c=>({...c,pas:e.target.value}))} placeholder="PAS" inputMode="numeric" style={{padding:"9px 10px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,fontFamily:"inherit",boxSizing:"border-box"}}/>
                <input value={preCheckin.pad} onChange={e=>setPreCheckin(c=>({...c,pad:e.target.value}))} placeholder="PAD" inputMode="numeric" style={{padding:"9px 10px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,fontFamily:"inherit",boxSizing:"border-box"}}/>
                <input value={preCheckin.fc} onChange={e=>setPreCheckin(c=>({...c,fc:e.target.value}))} placeholder="FC" inputMode="numeric" style={{padding:"9px 10px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,fontFamily:"inherit",boxSizing:"border-box"}}/>
              </div>
            </div>
            )}
            {ccfg.pre?.glicemia && (
            <div style={{marginBottom:20}}>
              <div style={{fontWeight:700,fontSize:13,color:"#475569",marginBottom:10}}>🩸 Glicemia (mg/dL)</div>
              <input value={preCheckin.glicemia} onChange={e=>setPreCheckin(c=>({...c,glicemia:e.target.value}))} placeholder="100" inputMode="numeric" style={{width:"100%",padding:"9px 10px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,fontFamily:"inherit",boxSizing:"border-box"}}/>
            </div>
            )}
            {preCheckinError && (
              <div style={{marginBottom:14,background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:10,padding:"10px 12px",fontSize:12,color:"#dc2626",display:"flex",alignItems:"flex-start",gap:6}}>
                <Icon name="alert" size={14} style={{marginTop:1,flexShrink:0}}/><span>{preCheckinError}</span>
              </div>
            )}
            <Btn full onClick={salvarPreCheckin} disabled={(ccfg.pre?.disposicao&&preCheckin.disposicao===null)||(ccfg.pre?.hidratacao&&preCheckin.hidratacao===null)||(ccfg.pre?.alimentacao&&preCheckin.alimentacao===null)||(ccfg.pre?.sono&&preCheckin.sono===null)||preCheckinSaving}>
              {preCheckinSaving ? "Salvando..." : "Começar treino"}
            </Btn>
            </div>
          </Card>
        </div>
      )}

      {tab==="treino" && !showPreCheckinGate && (
      <div style={{padding:"16px 16px 0"}}>
        {atividadesHoje.length>0 && (
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:700,color:"#c2410c",textTransform:"uppercase",letterSpacing:0.3,margin:"2px 2px 6px"}}>Hoje você também tem</div>
            {atividadesHoje.map((atv,i)=>(
              <AtividadeCard key={atv._id||i} atividade={atv} destaque concluida={!!concluidasMap[atv._id]} onToggle={toggleConcluidaAtividade}/>
            ))}
          </div>
        )}
        <div style={{display:"flex",gap:0,marginBottom:10,background:"#f1f5f9",borderRadius:10,padding:3}}>
          {BLOCOS.map((b,i)=>{
            const locked = i>maxUnlockedIdx;
            return (
              <button key={b.key} onClick={()=>changeBloco(i)} disabled={locked} style={{flex:1,border:"none",borderRadius:8,padding:"6px 3px",fontSize:10,fontWeight:700,cursor:locked?"default":"pointer",background:blocoIdx===i?b.cor.bg:"transparent",color:locked?"#cbd5e1":(blocoIdx===i?b.cor.texto:"#94a3b8"),lineHeight:1.3}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"center"}}>{locked?<Icon name="lock" size={12}/>:"B"+(i+1)}</div>
                <div style={{fontSize:8,marginTop:1}}>{b.semanas}</div>
              </button>
            );
          })}
        </div>

        {treinoDeHoje && TREINO_DEFS[treinoDeHoje] && (
          <div style={{background:TREINO_DEFS[treinoDeHoje].bg,border:`2px solid ${TREINO_DEFS[treinoDeHoje].cor}`,borderRadius:10,padding:"10px 12px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:5,fontSize:10,fontWeight:700,color:TREINO_DEFS[treinoDeHoje].cor,textTransform:"uppercase",letterSpacing:0.3}}><Icon name="calendar" size={12}/> Treino de hoje</div>
              <div style={{fontSize:15,fontWeight:800,color:TREINO_DEFS[treinoDeHoje].cor}}>{TREINO_DEFS[treinoDeHoje].label}</div>
            </div>
            {treinoAtivo!==treinoDeHoje && (
              <Btn sm onClick={()=>{const idx=treinosUnicos.indexOf(treinoDeHoje);if(idx!==-1)changeTreino(idx);}}>Ir para hoje</Btn>
            )}
          </div>
        )}

        <div style={{background:blocoAtivo.cor.bg,border:`1.5px solid ${blocoAtivo.cor.border}`,borderRadius:9,padding:"10px 12px",marginBottom:10}}>
          <div style={{fontWeight:700,fontSize:12,color:blocoAtivo.cor.texto}}>{blocoAtivo.label} · sem. {blocoAtivo.semanas}</div>
          <div style={{fontSize:11,color:blocoAtivo.cor.texto,opacity:0.85,marginTop:2,marginBottom:blocoIdx<BLOCOS.length-1?8:0}}>{blocoAtivo.desc}</div>
          {blocoIdx<BLOCOS.length-1 && (
            <div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:blocoAtivo.cor.texto,marginBottom:4,fontWeight:700}}>
                <span style={{display:"flex",alignItems:"center",gap:5}}><Icon name="lock" size={11}/> Progresso do bloco (libera o próximo)</span>
                <span>{sessionsPerBlock(blocoAtivo.key)}/{requiredPerBlock}</span>
              </div>
              <div style={{height:8,background:"rgba(255,255,255,0.6)",borderRadius:99,overflow:"hidden"}}>
                <div style={{height:"100%",width:Math.min(100,Math.round(sessionsPerBlock(blocoAtivo.key)/requiredPerBlock*100))+"%",background:blocoAtivo.cor.dot,borderRadius:99,transition:"width 0.3s"}}/>
              </div>
            </div>
          )}
        </div>

        <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
          {treinosUnicos.map((t,i)=>{
            const d = TREINO_DEFS[t];
            return (
              <button key={t+i} onClick={()=>changeTreino(i)} style={{flex:1,minWidth:70,border:`1.5px solid ${treinoIdx===i?d.cor:d.border}`,borderRadius:9,padding:"8px 6px",fontSize:11,fontWeight:700,cursor:"pointer",background:treinoIdx===i?d.bg:"#fff",color:treinoIdx===i?d.cor:"#64748b",textAlign:"center",boxShadow:treinoIdx===i?"0 2px 6px rgba(15,23,42,0.08)":"none",transition:"box-shadow 0.15s"}}>
                {d.label}
              </button>
            );
          })}
        </div>

        <div style={{background:td?.bg,border:`1.5px solid ${td?.border}`,borderRadius:9,padding:"8px 12px",marginBottom:10}}>
          <div style={{fontWeight:700,fontSize:12,color:td?.cor}}>{td?.desc}</div>
        </div>

        {totalCount>0 && (
          <div style={{marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#64748b",marginBottom:5,fontWeight:700}}>
              <span>Progresso</span>
              <span>{doneCount}/{totalCount}</span>
            </div>
            <div style={{height:8,background:"#f1f5f9",borderRadius:99,overflow:"hidden"}}>
              <div style={{height:"100%",width:(totalCount?Math.round(doneCount/totalCount*100):0)+"%",background:"#FF5603",borderRadius:99,transition:"width 0.2s"}}/>
            </div>
          </div>
        )}

        {MOMENTOS.map(([key,label,color])=>{
          const items = sessao[key] || [];
          if(items.length===0) return null;
          return (
            <div key={key} style={{marginBottom:18}}>
              <div style={{display:"flex",alignItems:"center",gap:7,fontSize:12,fontWeight:800,color:"#64748b",marginBottom:8,textTransform:"uppercase",letterSpacing:0.3}}>
                <span style={{width:8,height:8,borderRadius:99,background:color,flexShrink:0}}/>{label}
              </div>
              {items.map((item,idx)=>{
                const k = key+"-"+idx;
                return <ExercicioItem key={k} item={item} bibCustom={bibCustom} checked={done.has(k)} onToggle={()=>toggle(k)}/>;
              })}
            </div>
          );
        })}

        {totalCount>0 && (
          <div style={{marginTop:8,marginBottom:20}}>
            {savedToday ? (
              <div style={{background:"#f0fdf4",border:"1.5px solid #bbf7d0",borderRadius:10,padding:"12px 14px",textAlign:"center",fontSize:13,fontWeight:700,color:"#15803d",display:"flex",alignItems:"flex-start",gap:8}}>
                <Icon name="check" size={16} style={{marginTop:2,flexShrink:0}}/>
                <span>Treino concluído! Na próxima vez, seu treino {(()=>{const nx=treinosUnicos[(treinoIdx+1)%treinosUnicos.length];return TREINO_DEFS[nx]?.label;})()} vai abrir direto.</span>
              </div>
            ) : (
              <>
                <Btn full onClick={concluirTreino} disabled={saving || doneCount===0}>
                  {saving ? "Salvando..." : allDone ? (<span style={{display:"inline-flex",alignItems:"center",gap:6}}><Icon name="check" size={15}/> Concluir treino</span>) : `Concluir treino (${doneCount}/${totalCount} marcados)`}
                </Btn>
                {saveError && (
                  <div style={{marginTop:8,background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:10,padding:"10px 12px",fontSize:12,color:"#dc2626",lineHeight:1.5,display:"flex",alignItems:"flex-start",gap:6}}>
                    <Icon name="alert" size={14} style={{marginTop:1,flexShrink:0}}/><span>{saveError}</span>
                  </div>
                )}
              </>
            )}
          </div>
        )}

        {prog.obs && (
          <Card style={{background:"#f8fafc",padding:"10px 14px",marginTop:6}}>
            <div style={{fontSize:12,color:"#64748b",fontStyle:"italic",display:"flex",alignItems:"flex-start",gap:6}}><Icon name="note" size={13} style={{marginTop:1,flexShrink:0}}/><span>{prog.obs}</span></div>
          </Card>
        )}
      </div>
      )}

      <BottomNav tab={tab} setTab={setTab}/>

      {showCheckin && (
        <Modal title="Como foi seu treino?" onClose={()=>{}}>
          <div style={{display:"flex",alignItems:"center",gap:10,background:"#fff4ee",border:"1.5px solid #ffd9c2",borderRadius:10,padding:"10px 12px",marginBottom:20}}>
            <Icon name="trophy" size={18} color="#FF5603"/>
            <div style={{fontSize:12,color:"#c2410c",fontWeight:600,lineHeight:1.4}}>Seu professor usa isso pra ajustar seu treino. Responda com atenção!</div>
          </div>
          {ccfg.post?.esforco && (
          <div style={{marginBottom:22}}>
            <div style={{fontWeight:700,fontSize:13,color:"#475569",marginBottom:10}}>Esforço do treino</div>
            <div style={{display:"flex",gap:6}}>
              {[{v:1,e:"😌",l:"Tranquilo"},{v:2,e:"🙂",l:"Moderado"},{v:3,e:"😅",l:"Puxado"},{v:4,e:"😓",l:"Muito puxado"},{v:5,e:"🥵",l:"No limite"}].map(o=>(
                <button key={o.v} onClick={()=>setCheckin(c=>({...c,esforco:o.v}))} style={{flex:1,padding:"10px 2px",borderRadius:10,border:checkin.esforco===o.v?"1.5px solid #FF5603":"1.5px solid #e2e8f0",background:checkin.esforco===o.v?"#fff4ee":"#fff",cursor:"pointer",textAlign:"center",fontFamily:"inherit"}}>
                  <div style={{fontSize:20}}>{o.e}</div>
                  <div style={{fontSize:8,fontWeight:700,color:checkin.esforco===o.v?"#FF5603":"#94a3b8",marginTop:2}}>{o.l}</div>
                </button>
              ))}
            </div>
          </div>
          )}
          {ccfg.post?.energia && (
          <div style={{marginBottom:22}}>
            <div style={{fontWeight:700,fontSize:13,color:"#475569",marginBottom:10}}>Energia</div>
            <div style={{display:"flex",gap:8}}>
              {[{v:1,e:"😴",l:"Cansado"},{v:2,e:"😐",l:"Neutro"},{v:3,e:"🙂",l:"Bem"},{v:4,e:"😃",l:"Disposto"},{v:5,e:"🔥",l:"Cheio"}].map(o=>(
                <button key={o.v} onClick={()=>setCheckin(c=>({...c,energia:o.v}))} style={{flex:1,padding:"10px 2px",borderRadius:10,border:checkin.energia===o.v?"1.5px solid #FF5603":"1.5px solid #e2e8f0",background:checkin.energia===o.v?"#fff4ee":"#fff",cursor:"pointer",textAlign:"center",fontFamily:"inherit"}}>
                  <div style={{fontSize:22}}>{o.e}</div>
                  <div style={{fontSize:9,fontWeight:700,color:checkin.energia===o.v?"#FF5603":"#94a3b8",marginTop:2}}>{o.l}</div>
                </button>
              ))}
            </div>
          </div>
          )}
          {ccfg.post?.dor && (
          <div style={{marginBottom:22}}>
            <div style={{fontWeight:700,fontSize:13,color:"#475569",marginBottom:10}}>Dor ou desconforto</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {[{v:"nenhuma",e:"😊",l:"Nenhuma"},{v:"leve",e:"😕",l:"Leve"},{v:"moderada",e:"😣",l:"Moderada"},{v:"alta",e:"😖",l:"Alta"}].map(o=>(
                <button key={o.v} onClick={()=>setCheckin(c=>({...c,dor:o.v}))} style={{padding:"8px 12px",borderRadius:9,border:checkin.dor===o.v?"none":"1.5px solid #e2e8f0",background:checkin.dor===o.v?"#FF5603":"#fff",color:checkin.dor===o.v?"#fff":"#475569",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:5}}><span style={{fontSize:15}}>{o.e}</span>{o.l}</button>
              ))}
            </div>
          </div>
          )}
          {ccfg.post?.obs && (
          <div style={{marginBottom:20}}>
            <div style={{fontWeight:700,fontSize:13,color:"#475569",marginBottom:4}}>Observação</div>
            <div style={{fontSize:11,color:"#94a3b8",marginBottom:8}}>Conte rapidinho como foi — pode ser uma frase curta</div>
            <textarea value={checkin.obs} onChange={e=>setCheckin(c=>({...c,obs:e.target.value}))} placeholder="Ex: senti dificuldade no agachamento..." style={{width:"100%",minHeight:70,padding:"10px 12px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,fontFamily:"inherit",boxSizing:"border-box",resize:"vertical"}}/>
          </div>
          )}
          {checkinError && (
            <div style={{marginBottom:14,background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:10,padding:"10px 12px",fontSize:12,color:"#dc2626",display:"flex",alignItems:"flex-start",gap:6}}>
              <Icon name="alert" size={14} style={{marginTop:1,flexShrink:0}}/><span>{checkinError}</span>
            </div>
          )}
          <Btn full onClick={salvarCheckin} disabled={(ccfg.post?.esforco&&checkin.esforco===null)||(ccfg.post?.energia&&checkin.energia===null)||(ccfg.post?.obs&&!checkin.obs.trim())||checkinSaving}>
            {checkinSaving ? "Salvando..." : "Concluir e ver resultado"}
          </Btn>
        </Modal>
      )}

      {showCelebration && (()=>{
        const proximoTreino = treinosUnicos[(treinoIdx+1)%treinosUnicos.length];
        const proximoLabel = TREINO_DEFS[proximoTreino]?.label;
        const feitas = sessionsPerBlock(blocoAtivo.key);
        const desbloqueouBloco = feitas>=requiredPerBlock && blocoIdx<BLOCOS.length-1;
        return (
          <Modal title="" onClose={()=>setShowCelebration(false)}>
            <div style={{textAlign:"center",padding:"10px 0 4px"}}>
              <div style={{width:76,height:76,borderRadius:"50%",background:"linear-gradient(135deg,#FF5603,#ff8c42)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px",boxShadow:"0 8px 20px rgba(255,86,3,0.3)"}}>
                <Icon name="trophy" size={36} color="#fff"/>
              </div>
              <div style={{fontWeight:800,fontSize:20,marginBottom:6}}>Parabéns!</div>
              <div style={{fontSize:14,color:"#64748b",marginBottom:18,lineHeight:1.6}}>
                Você concluiu o {td?.label} de hoje.{proximoLabel && <> Na próxima vez, seu <b>{proximoLabel}</b> vai abrir direto.</>}
              </div>
              {!desbloqueouBloco ? (
                <div style={{marginBottom:18}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#64748b",marginBottom:5,fontWeight:700}}>
                    <span>Progresso do {blocoAtivo.label}</span>
                    <span>{feitas}/{requiredPerBlock}</span>
                  </div>
                  <div style={{height:10,background:"#f1f5f9",borderRadius:99,overflow:"hidden"}}>
                    <div style={{height:"100%",width:Math.min(100,Math.round(feitas/requiredPerBlock*100))+"%",background:blocoAtivo.cor.dot,borderRadius:99,transition:"width 0.3s"}}/>
                  </div>
                </div>
              ) : (
                <div style={{background:"#f0fdf4",border:"1.5px solid #bbf7d0",borderRadius:10,padding:"10px 12px",fontSize:13,fontWeight:700,color:"#15803d",marginBottom:18,display:"flex",alignItems:"center",gap:8,textAlign:"left"}}>
                  <Icon name="unlock" size={16} style={{flexShrink:0}}/><span>Você completou o {blocoAtivo.label}! O próximo bloco já está liberado.</span>
                </div>
              )}
              <Btn full onClick={()=>setShowCelebration(false)}>Continuar</Btn>
            </div>
          </Modal>
        );
      })()}
    </div>
  );
};

// ── App raiz ─────────────────────────────────────────────────────────────────
const PixPagamentoCard = ({billing, profPix, studentName}) => {
  const qrRef = useRef(null);
  const [copiado,setCopiado]=useState(false);
  const pixKey = profPix?.pix_key;
  const payload = pixKey ? buildPixPayload({
    pixKey,
    merchantName: profPix?.pix_merchant_name || profPix?.nome,
    merchantCity: profPix?.pix_merchant_city,
    amount: billing?.valor,
    txid: "LONGEVUS"+(studentName||"").replace(/\s/g,"").slice(0,10),
  }) : null;

  useEffect(()=>{
    if(payload && qrRef.current && window.QRCode){
      qrRef.current.innerHTML="";
      new window.QRCode(qrRef.current, { text: payload, width: 200, height: 200, colorDark:"#0f172a", colorLight:"#ffffff" });
    }
  },[payload]);

  const copiar = () => {
    if(!payload) return;
    navigator.clipboard?.writeText(payload).then(()=>{ setCopiado(true); setTimeout(()=>setCopiado(false),2500); });
  };

  const whatsappUrl = profPix?.whatsapp ? "https://wa.me/55"+profPix.whatsapp.replace(/\D/g,"")+"?text="+encodeURIComponent("Oi! Acabei de fazer o pagamento da mensalidade, pode liberar meu acesso? 😊") : null;

  return (
    <Card style={{width:"100%",maxWidth:360,padding:20,textAlign:"center"}}>
      {billing.plano && <div style={{fontSize:13,color:"#64748b",marginBottom:2}}>{billing.plano}</div>}
      {billing.valor && <div style={{fontWeight:900,fontSize:28,color:"#0f172a",marginBottom:16}}>R$ {Number(billing.valor).toFixed(2).replace(".",",")}</div>}

      {payload ? (
        <>
          <div ref={qrRef} style={{display:"flex",justifyContent:"center",marginBottom:14}}/>
          <div style={{fontSize:11,color:"#94a3b8",marginBottom:10}}>Escaneie com o app do seu banco, ou copie o código Pix abaixo</div>
          <button onClick={copiar} style={{width:"100%",padding:"12px",borderRadius:10,border:"1.5px solid #e2e8f0",background:copiado?"#f0fdf4":"#f8fafc",color:copiado?"#16a34a":"#334155",fontWeight:700,fontSize:13,cursor:"pointer",marginBottom:12}}>
            {copiado?"✓ Código copiado!":"📋 Copiar código Pix"}
          </button>
        </>
      ) : (
        <div style={{background:"#fef9c3",border:"1.5px solid #fde68a",borderRadius:9,padding:"12px 14px",fontSize:12,color:"#92400e",marginBottom:12,lineHeight:1.5}}>
          Seu personal ainda não configurou a chave Pix. Entre em contato diretamente para regularizar o pagamento.
        </div>
      )}

      {whatsappUrl && (
        <a href={whatsappUrl} target="_blank" rel="noopener noreferrer" style={{display:"block",width:"100%",padding:"12px",borderRadius:10,background:"#16a34a",color:"#fff",fontWeight:700,fontSize:13,textDecoration:"none",boxSizing:"border-box"}}>
          💬 Avisar que já paguei
        </a>
      )}
    </Card>
  );
};

const AvisoVencimentoModal = ({billing, profPix, studentName, diasParaVencer, onClose}) => {
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.6)",zIndex:998,display:"flex",alignItems:"flex-end",justifyContent:"center",padding:0}}>
      <div style={{background:"#fff",borderRadius:"20px 20px 0 0",width:"100%",maxWidth:420,maxHeight:"88vh",overflowY:"auto",padding:"22px 18px 26px",display:"flex",flexDirection:"column",alignItems:"center"}}>
        <div style={{width:44,height:44,borderRadius:12,background:"#fff7ed",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:12}}>
          <Icon name="bell" size={20} color="#FF5603"/>
        </div>
        <div style={{fontWeight:800,fontSize:17,textAlign:"center",marginBottom:4}}>
          {diasParaVencer<=0?"Sua mensalidade vence hoje":"Sua mensalidade vence em "+diasParaVencer+" dia"+(diasParaVencer>1?"s":"")}
        </div>
        <div style={{fontSize:12,color:"#64748b",textAlign:"center",marginBottom:18,maxWidth:320,lineHeight:1.5}}>
          Vencimento: {fmt(billing.vencimento)}. Quer adiantar o pagamento agora? Pode escanear o Pix abaixo.
        </div>
        <PixPagamentoCard billing={billing} profPix={profPix} studentName={studentName}/>
        <button onClick={onClose} style={{marginTop:16,width:"100%",maxWidth:360,padding:"12px",borderRadius:10,background:"#f1f5f9",color:"#475569",fontWeight:700,fontSize:13,border:"none",cursor:"pointer"}}>Continuar para o app</button>
      </div>
    </div>
  );
};

const TelaBloqueada = ({billing, profPix, studentName, onLogout}) => {
  return (
    <div style={{minHeight:"100vh",background:"#f8fafc",padding:"24px 18px",display:"flex",flexDirection:"column",alignItems:"center"}}>
      <div style={{width:52,height:52,borderRadius:14,background:"#fee2e2",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:14}}>
        <Icon name="lock" size={24} color="#dc2626"/>
      </div>
      <div style={{fontWeight:800,fontSize:19,textAlign:"center",marginBottom:4}}>Pagamento pendente</div>
      <div style={{fontSize:13,color:"#64748b",textAlign:"center",marginBottom:20,maxWidth:340,lineHeight:1.5}}>
        Sua mensalidade venceu em {fmt(billing.vencimento)}. Realize o pagamento para continuar acessando seus treinos.
      </div>

      <PixPagamentoCard billing={billing} profPix={profPix} studentName={studentName}/>


      <div style={{fontSize:11,color:"#94a3b8",marginTop:20,textAlign:"center",maxWidth:320,lineHeight:1.5}}>
        Após confirmar o pagamento com seu personal, o acesso é liberado manualmente por ele.
      </div>
      <button onClick={onLogout} style={{marginTop:16,background:"none",border:"none",color:"#94a3b8",fontSize:12,textDecoration:"underline",cursor:"pointer"}}>Sair</button>
    </div>
  );
};

function App(){
  const [session,setSession]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [recoveryMode,setRecoveryMode]=useState(false);
  const [studentId,setStudentId]=useState(null);
  const [ownerId,setOwnerId]=useState(null);
  const [studentName,setStudentName]=useState("");
  const [studentData,setStudentData]=useState(null);
  const [linkChecked,setLinkChecked]=useState(false);
  const [bibCustom,setBibCustom]=useState([]);
  const [profPix,setProfPix]=useState(null);
  const [avisoFechado,setAvisoFechado]=useState(false);

  useEffect(()=>{
    supa.auth.getSession().then(({data})=>{ setSession(data?.session||null); setAuthLoading(false); });
    const { data: listener } = supa.auth.onAuthStateChange((event, sess)=>{
      setSession(sess);
      if(event==="PASSWORD_RECOVERY") setRecoveryMode(true);
    });
    return ()=>listener?.subscription?.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!session){ setLinkChecked(false); setStudentId(null); return; }
    (async()=>{
      try{
        const token = session.access_token || SUPA_KEY;
        const headers = { "apikey": SUPA_KEY, "Authorization": "Bearer "+token };
        const r = await fetch(SUPA_URL+"/rest/v1/students?select=id,owner_id,data&limit=1", { headers });
        if(r.ok){
          const rows = await r.json();
          setStudentId(rows && rows.length>0 ? rows[0].id : null);
          setOwnerId(rows && rows.length>0 ? rows[0].owner_id : null);
          setStudentName(rows && rows.length>0 ? (rows[0].data?.name||"") : "");
          setStudentData(rows && rows.length>0 ? (rows[0].data||null) : null);
        } else {
          setStudentId(null);
        }
      } catch(e){ setStudentId(null); }
      setLinkChecked(true);
    })();
  },[session]);

  useEffect(()=>{
    if(!session) return;
    (async()=>{
      try{
        const token = session.access_token || SUPA_KEY;
        const headers = { "apikey": SUPA_KEY, "Authorization": "Bearer "+token };
        const r = await fetch(SUPA_URL+"/rest/v1/exercises?select=*", { headers });
        if(r.ok){
          const rows = await r.json();
          setBibCustom((rows||[]).map(e=>({
            id:e.id,nome:e.nome,grupo:e.grupo,nivel:e.nivel,momento:e.momento,
            foco:e.foco,icone:e.icone||null,descricao:e.descricao,execucao:e.execucao,
            beneficios:e.beneficios,cuidados:e.cuidados,material:e.material,
            obs:e.obs,foto:e.foto||"",video:e.video||""
          })));
        }
      } catch(e){}
    })();
  },[session]);

  useEffect(()=>{
    if(!session || !ownerId) return;
    (async()=>{
      try{
        const token = session.access_token || SUPA_KEY;
        const headers = { "apikey": SUPA_KEY, "Authorization": "Bearer "+token, "Content-Type": "application/json" };
        // Usa a função RPC (get_professional_pix_config) em vez de consultar a tabela
        // "professionals" direto — o RLS só deixa cada profissional ler a própria linha,
        // então o aluno precisa dessa função pra conseguir ver a chave Pix do personal dele.
        const r = await fetch(SUPA_URL+"/rest/v1/rpc/get_professional_pix_config", {
          method: "POST",
          headers,
          body: JSON.stringify({ prof_id: ownerId }),
        });
        if(r.ok){
          const rows = await r.json();
          setProfPix(rows && rows.length>0 ? rows[0] : null);
        }
      } catch(e){}
    })();
  },[session,ownerId]);

  const onLogout = () => { supa.auth.signOut(); };

  if(authLoading){
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#94a3b8",fontSize:14}}>Carregando...</div>;
  }

  if(recoveryMode){
    return <ResetPassword onDone={()=>{setRecoveryMode(false);}}/>;
  }

  if(!session){
    return <Login/>;
  }

  if(!linkChecked){
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#94a3b8",fontSize:14}}>Carregando...</div>;
  }

  if(!studentId){
    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"#f8fafc"}}>
        <Card style={{maxWidth:380,width:"100%",padding:"32px 26px",textAlign:"center"}}>
          <div style={{width:56,height:56,borderRadius:16,background:"#fff4ee",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px"}}><Icon name="lock" size={26} color="#FF5603"/></div>
          <div style={{fontWeight:700,fontSize:15,marginBottom:8}}>Acesso ainda não liberado</div>
          <div style={{fontSize:13,color:"#64748b",marginBottom:20,lineHeight:1.5}}>Seu e-mail entrou, mas seu personal ainda não vinculou sua conta ao seu cadastro. Fale com ele para liberar o acesso.</div>
          <Btn variant="secondary" full onClick={onLogout}>Sair</Btn>
        </Card>
      </div>
    );
  }

  const hoje = new Date().toISOString().slice(0,10);
  const billing = studentData?.billing;
  const billingBloqueado = !!(billing?.ativo && billing?.vencimento && billing.vencimento < hoje);

  const diasParaVencer = billing?.vencimento ? Math.round((new Date(billing.vencimento)-new Date(hoje))/86400000) : null;
  const avisoDias = profPix?.aviso_vencimento_dias ?? 7;
  const dentroDoAviso = !!(billing?.ativo && !billingBloqueado && diasParaVencer!==null && diasParaVencer<=avisoDias);

  if(billingBloqueado){
    return <TelaBloqueada billing={billing} profPix={profPix} studentName={studentName} onLogout={onLogout}/>;
  }

  return (
    <>
      {dentroDoAviso && !avisoFechado && (
        <AvisoVencimentoModal billing={billing} profPix={profPix} studentName={studentName} diasParaVencer={diasParaVencer} onClose={()=>setAvisoFechado(true)}/>
      )}
      <MeuTreino studentId={studentId} ownerId={ownerId} studentName={studentName} studentData={studentData} bibCustom={bibCustom} onLogout={onLogout}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

      navigator.serviceWorker.register("sw-aluno.js").catch(function (err) {
        console.warn("Falha ao registrar o service worker:", err);
      });
    });
  }
</script>
